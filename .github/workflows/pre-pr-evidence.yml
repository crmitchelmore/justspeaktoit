name: Pre-PR evidence

# Checks that the PR body records a passing `scripts/pre-pr` run (AGENTS.md).
# Advisory by default; set the repository variable JSTI_REQUIRE_PRE_PR=true to
# fail when the record is missing or failing. Only Dependabot is exempt.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Pre-PR evidence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-pre-pr-evidence.py
          sparse-checkout-cone-mode: false
      - name: Check the PR body for a passing scripts/pre-pr record
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          JSTI_REQUIRE_PRE_PR: ${{ vars.JSTI_REQUIRE_PRE_PR }}
        run: python3 scripts/check-pre-pr-evidence.py
