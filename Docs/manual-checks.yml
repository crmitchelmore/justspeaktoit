          - "Start another dictation and, as you tap Stop, switch to the home screen; return after a few seconds."
          - "Tap Stop without speaking, then try Edit on a selection in the keyboard."
        expected: "Gemini Nano is listed only under On this phone, with download progress then Ready. Offline, the transcript is cleaned up and says \"Cleaned up on this phone\"; the custom prompt is honoured and Show original restores the words spoken. Leaving the app keeps the original transcript with a red reason (open on screen), never a cloud cleanup. An empty recording stays empty. Keyboard Edit names the default cloud cleanup provider rather than Gemini Nano."
