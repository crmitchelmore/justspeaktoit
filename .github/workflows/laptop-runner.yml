name: Laptop runner native CI
on:
  push:
    branches: [codex/laptop-runner]
    paths: [.github/workflows/laptop-runner.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: laptop-native-ci
  cancel-in-progress: false
jobs:
  native:
    name: Reviewed Alpha Intel build and tests
    runs-on: [macbook-intel-local, macOS, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 00b17f96648335d880eb832260d1ea5cfcae0c7c
          persist-credentials: false
      - name: Verify native toolchain and reviewed source
        run: |
          test "$(git rev-parse HEAD)" = 00b17f96648335d880eb832260d1ea5cfcae0c7c
          test "$(uname -m)" = x86_64
          xcodebuild -checkFirstLaunchStatus
          swift --version
          node --version
      - name: Resolve pinned dependencies
        run: swift package resolve --force-resolved-versions
      - name: Build Intel app
        run: swift build --disable-automatic-resolution
      - name: Verify brand assets
        run: node --test scripts/tests/brand-assets.test.mjs
      - name: Test with disposable Keychain
        run: python3 scripts/with-test-keychain.py swift test --disable-automatic-resolution
      - name: Verify lockfile unchanged
        if: always()
        run: git diff --exit-code Package.resolved
