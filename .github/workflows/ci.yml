name: CI

# Note: macOS runners require either:
# - Public repository (free)
# - GitHub Team/Enterprise plan (paid)
# - Self-hosted runners

# Merge first, verify on main. A same-repository, non-Dependabot pull
# request must carry a passing `scripts/pre-pr` record for its exact head;
# pre-pr already ran Lint, the portable Linux graph, the affected macOS tests
# and the API check on that tree, so CI checks only the record (seconds, no
# build). Dependabot and fork pull requests, which carry no trusted record,
# run Lint, the Workers package, the portable SwiftPM graph and ONE macOS job.
# `ci:full` pull requests, `merge-batch/*` pull requests and main run every
# gate. A red main is fixed forward, then auto-reverted (auto-revert.yml).
# A batch is tested once, through its pull request; pushing its branch does
# not start a second run.
on:
  push:
    branches: [main]
  pull_request:
  # The auto-revert bot (auto-revert.yml) merges with the workflow token,
  # which starts no push run, so it dispatches the full main run itself.
  # A dispatch is treated exactly like a main push.
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. On a pull request a newer push cancels the superseded
# run. On main and merge batches an in-progress run always finishes: with
# steady merges, cancelling meant no main run ever completed. GitHub keeps at
# most one waiting run per group, so a newer push replaces an older waiting
# one and main verifies the newest commit next. Only a successful main run
# starts an Alpha. CI never runs for tags or releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Change detection for the cheap pull-request gate.
  #
  # Hosted macOS runs five jobs at once for the whole account, so a pull
  # request gets exactly one macOS job (build-macos: incremental build plus
  # the unit tests its changes can affect). Lint, tooling tests and the
  # portable SwiftPM graph run on Ubuntu. Outputs:
  # - apple: Lint + tooling tests (anything outside docs, site, Android, Workers)
  # - swift: portable Linux graph and the macOS fast job (Swift package inputs)
  # - full:  every macOS gate (full Debug tests, Release build, test
  #          products, simulator tests, keyboard and watch, core journeys,
  #          public API). True on merge-batch/* and main pushes, where a failure
  #          opens an issue (report-ci-failure), and for a `ci:full` label.
  release-paths:
    name: Detect Release-Relevant Changes
    # Skipped for a trusted pull request (see the gate): every job that needs
    # it is then skipped at once, so CI Gate starts without queueing behind
    # other jobs on the shared hosted runner limit.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.user.login, 'dependabot') && !contains(github.event.pull_request.labels.*.name, 'ci:full') && !startsWith(github.head_ref, 'merge-batch/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apple: ${{ steps.select.outputs.apple }}
      swift: ${{ steps.select.outputs.swift }}
      ios: ${{ steps.select.outputs.ios }}
      api: ${{ steps.select.outputs.api }}
      full: ${{ steps.select.outputs.full }}
      workers: ${{ steps.select.outputs.workers }}
    steps:
      - name: Filter changed paths
        # No checkout needed: on pull_request events the action lists changed
        # files via the GitHub API. It has no changed-file list to work from on
        # a push, so it only runs for pull requests.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # These lists are the swift, api and ios routes in
          # scripts/ci/routing.json; edit them there and run
          # `python3 scripts/ci/routing.py --write`.
          filters: |
            # CI-only edits do not select the macOS job; add `ci:full` to
            # exercise a workflow change on its pull request.
            swift:
              - 'Package.swift'
              - 'Package.resolved'
              - 'Makefile'
              - 'Sources/**'
              - 'Tests/**'
              - 'Config/**'
              - 'Resources/**'
              - 'scripts/ci/affected-swift-tests.py'
              - 'scripts/ci/retry-network.sh'
              - 'scripts/ci/retry-xctest-crash.py'
              - 'scripts/with-test-keychain.py'
              - 'scripts/private-test-keychain.py'
              - 'scripts/ci/verify-portable-core-boundary.py'
              - 'scripts/ci/collect-macos-*.py'
              - 'scripts/prepare-mac-cli-symbols.sh'
              - 'scripts/tests/brand-assets.test.mjs'
            # Sources of the API-checked library products (scripts/ci/check-api-compatibility.sh).
            api:
              - 'Package.swift'
              - 'Package.resolved'
              - 'Sources/SpeakCore/**'
              - 'Sources/SpeakSync/**'
              - 'Sources/SpeakiOS/**'
              - 'Sources/SpeakHotKeys/**'
              - 'Sources/SpeakAutomationKit/**'
              - 'Sources/SpeakWatchCore/**'
              - 'scripts/ci/check-api-compatibility.sh'
              - 'scripts/ci/api-breakage-allowlist.txt'
            ios:
              - 'Package.swift'
              - 'Package.resolved'
              - 'Sources/SpeakCore/**'
              - 'Sources/SpeakSync/**'
              - 'Sources/SpeakiOS/**'

      # True when any changed file lies outside docs, the website, the native
      # Android app (android.yml) and the Workers package (paid-access-worker
      # below). A file matches only if it matches every pattern, hence the
      # separate step. The list is the apple route in scripts/ci/routing.json.
      - name: Filter Apple-relevant paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: apple
        with:
          predicate-quantifier: every
          filters: |
            apple:
              - '**'
              - '!android/**'
              - '!.github/workflows/android.yml'
              - '!Docs/**'
              - '!**/*.md'
              - '!landing-page/**'
              - '!.github/workflows/deploy-landing-page.yml'
              - '!workers/**'

      - name: Select gate outputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') || startsWith(github.head_ref, 'merge-batch/') }}
          APPLE: ${{ steps.apple.outputs.apple }}
          SWIFT: ${{ steps.filter.outputs.swift }}
          IOS: ${{ steps.filter.outputs.ios }}
          API: ${{ steps.filter.outputs.api }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$FULL" != "true" ]; then
            if [ "$API" = "true" ]; then SWIFT=true; fi
            if [ "$SWIFT" = "true" ]; then APPLE=true; fi
            # Only untrusted pull requests (Dependabot, forks) get here: a
            # trusted one skips this job and merges on its pre-pr record.
            WORKERS=true
            { echo "apple=$APPLE"; echo "swift=$SWIFT"; echo "ios=$IOS"; echo "api=$API"; echo "full=false"; echo "workers=$WORKERS"; } >> "$GITHUB_OUTPUT"
          else
            # main push, merge-batch/* or ci:full pull request: no
            # changed-file filtering, run every gate.
            { echo "apple=true"; echo "swift=true"; echo "ios=true"; echo "api=true"; echo "full=true"; echo "workers=true"; } >> "$GITHUB_OUTPUT"
          fi

  # Full runs (merge batches and main) ask for at most four hosted macOS
  # slots at once, leaving one for other workflows, by chaining jobs into
  # lanes: Debug -> journey; Release build -> API; iOS products ->
  # simulator -> keyboard and watch; the two UI shards one after the other.
  # Other later jobs in a lane still run when an earlier one fails.
  # Each lane is a reusable workflow; a lane fails when any of its jobs does.
  macos-debug:
    name: macOS Debug
    # Fail fast: no hosted macOS slot is taken until the cheap Ubuntu gates
    # (Lint, Portable Swift (Linux), pre-PR evidence) pass.
    needs: [release-paths, lint, portable-linux, pre-pr-evidence]
    if: needs.release-paths.outputs.swift == 'true'
    uses: ./.github/workflows/ci-macos-debug.yml
    with:
      full: ${{ needs.release-paths.outputs.full }}
      ios: ${{ needs.release-paths.outputs.ios }}

  macos-release:
    name: macOS Release
    needs: [release-paths, lint, portable-linux, pre-pr-evidence]
    if: needs.release-paths.outputs.full == 'true'
    uses: ./.github/workflows/ci-macos-release.yml

  ios:
    name: iOS
    needs: [release-paths, lint, portable-linux, pre-pr-evidence]
    if: needs.release-paths.outputs.full == 'true'
    uses: ./.github/workflows/ci-ios.yml

  journey-ui:
    name: Core Journey UI
    needs: [release-paths, lint, portable-linux, pre-pr-evidence]
    if: needs.release-paths.outputs.full == 'true'
    uses: ./.github/workflows/ci-journey-ui.yml

  # Pull requests must carry a passing `scripts/pre-pr` record for the exact
  # head (or its tree) in the current PR body, so a failure that pre-pr would
  # have caught never reaches a macOS slot. Only Dependabot is exempt; a
  # merge-batch PR carries a combined record for its head. Pushes pass
  # straight through. The
  # body is re-read for up to three minutes because it is usually updated
  # just after the push that started this run.
  pre-pr-evidence:
    name: Pre-PR evidence (blocking)
    # A trusted pull request's record is checked inside CI Gate instead.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.user.login, 'dependabot') && !contains(github.event.pull_request.labels.*.name, 'ci:full') && !startsWith(github.head_ref, 'merge-batch/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: scripts/check-pre-pr-evidence.py
          sparse-checkout-cone-mode: false
      - name: Require a passing scripts/pre-pr record for this head
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          JSTI_PRE_PR_STRICT: "true"
        run: |
          PR_HEAD_TREE="$(git rev-parse 'HEAD^{tree}')"
          export PR_HEAD_TREE
          for attempt in 1 2 3 4 5 6 7; do
            PR_BODY="$(gh api "$PR_URL" --jq '.body // ""')" || PR_BODY=''
            export PR_BODY
            if python3 scripts/check-pre-pr-evidence.py; then exit 0; fi
            [ "$attempt" -lt 7 ] && sleep 30
          done
          echo "::error::Run scripts/pre-pr on this commit (or its exact tree) and paste its --markdown output into the PR body."
          exit 1

  lint:
    name: Lint
    needs: release-paths
    # Docs, website, Android and Workers-only pull requests skip it; a skipped
    # job still satisfies a required check. SwiftLint, the accessibility
    # checker and the Node/Ruby/Python tooling tests are platform-neutral, so
    # this runs on Ubuntu and never takes a hosted macOS slot. Tests that need
    # Apple tools skip here and run in build-macos on batches and main.
    if: needs.release-paths.outputs.apple == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache lint tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Tooling/.build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-tooling-${{ hashFiles('Tooling/Package.resolved') }}

      # The same target scripts/pre-pr runs, so a local pass means this passes:
      # strict SwiftLint (isolated Tooling/ graph, issue #677), accessibility,
      # tooling Package.resolved drift and the tooling tests.
      - name: Lint and tooling tests (make ci-lint)
        run: make ci-lint

  # The portable SwiftPM graph (SpeakCore portable kernel, SpeakSync,
  # SpeakDesktop*, SpeakAutomationKit, CLI and Linux adapters) builds and
  # tests on Ubuntu, so most shared-source coverage never waits for macOS.
  portable-linux:
    name: Portable Swift (Linux)
    needs: release-paths
    if: needs.release-paths.outputs.swift == 'true'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.3-jammy@sha256:33c73fc133767cdaafde26f0f9967c96ab25ff77618b7df1eabf46140bf2b6e6
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize container workspace ownership
        # The owned capture-writer tests verify the ownership+mode chain up to
        # the checkout root; align the host bind mount with the container user.
        run: |
          owner="$(id -u):$(id -g)"
          chown "$owner" /__w "$(dirname "$GITHUB_WORKSPACE")"
          chmod 0755 /__w "$(dirname "$GITHUB_WORKSPACE")"
          chown -R "$owner" "$GITHUB_WORKSPACE"
          chmod 0755 "$GITHUB_WORKSPACE"
      # Shared with scripts/pre-pr and precheck.yml, so they cannot drift.
      - name: Verify the boundary, then build and test the portable graph
        run: scripts/ci-portable-linux.sh

  paid-access-worker:
    name: Paid Access Worker
    needs: release-paths
    if: needs.release-paths.outputs.workers == 'true'
    runs-on: ${{ fromJSON(((github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.JSTI_NATIVE_APPROVED_SHA == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.JSTI_NATIVE_APPROVED_SHA == github.event.pull_request.head.sha)) && (vars.JSTI_LINUX_RUNNER_LABELS || '["self-hosted","Linux","X64","omarchy-local"]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/paid-access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/paid-access/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Opens (or comments on) a tracking issue when CI fails on main or on a
  # merge-batch head, where the gates that pull requests skip first run.
  # Push-only, hosted, and it never checks out repository code.
  report-ci-failure:
    name: Report merge-batch or main CI failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: failure() && !cancelled() && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'merge-batch/'))
    permissions:
      issues: write
    steps:
      - name: Open or update the main CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            label=ci-main-failure; title="CI failing on main"
          else
            label=ci-batch-failure; title="CI failed on $REF_NAME"
          fi
          body="CI failed on $REF_NAME at $SHA: $RUN_URL"$'\n\n'"Pull requests merge on their pre-pr record; every build and test first runs in CI here. auto-revert.yml posts the suspects for a fix forward, reverts them if main stays red, and closes this issue once main is green."
          number=$(gh issue list --state open --label "$label" --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing at $SHA: $RUN_URL"
          else
            gh label create "$label" --color B60205 --description "CI failed after pull-request checks" 2>/dev/null || true
            gh issue create --title "$title" --label "$label" --body "$body"
          fi

  # The single required check. A gate may skip only on a pull request whose
  # path detection excluded it; batches and main must run every gate.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    # A trusted pull request (same repository, not Dependabot, no ci:full,
    # not a merge batch) merges on its passing scripts/pre-pr record alone,
    # and every build and test runs on main after the merge. Its other jobs
    # are all skipped, so this job is created as soon as the run starts and
    # checks the record itself: one queue wait instead of three.
    env:
      TRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.user.login, 'dependabot') && !contains(github.event.pull_request.labels.*.name, 'ci:full') && !startsWith(github.head_ref, 'merge-batch/') }}
    needs:
      - release-paths
      - macos-debug
      - portable-linux
      - lint
      - paid-access-worker
      - pre-pr-evidence
      - ios
      - macos-release
      - journey-ui
    # Evaluate GitHub's job results directly. This aggregate never checks out
    # or executes a PR-controlled helper: the record checker is read from the
    # base commit. actions: write only lets it cancel its own run (below).
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Require a passing scripts/pre-pr record for this head (trusted pull request)
        if: env.TRUSTED_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          JSTI_PRE_PR_STRICT: "true"
        run: |
          checker="$RUNNER_TEMP/check-pre-pr-evidence.py"
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$REPO/contents/scripts/check-pre-pr-evidence.py?ref=$BASE_SHA" > "$checker"
          PR_HEAD_TREE="$(gh api "repos/$REPO/git/commits/$PR_HEAD_SHA" --jq .tree.sha)"
          export PR_HEAD_TREE
          # The body is usually updated just after the push that started this run.
          for attempt in 1 2 3 4 5 6 7; do
            PR_BODY="$(gh api "$PR_URL" --jq '.body // ""')" || PR_BODY=''
            export PR_BODY
            if python3 "$checker"; then exit 0; fi
            [ "$attempt" -lt 7 ] && sleep 30
          done
          echo "::error::Run scripts/pre-pr on this commit (or its exact tree) and paste its --markdown output into the PR body."
          exit 1
      # A cancelled run is not a failed one: end this check as cancelled so
      # it neither reads as a red main nor counts as passing. If the cancel
      # call fails, the gate still fails closed.
      - name: Report a cancelled run as cancelled
        if: >-
          cancelled() || (contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'failure'))
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/force-cancel
        run: |
          echo '::notice::CI was cancelled before every gate finished; this check reports cancelled.'
          if gh api -X POST "$RUN_URL" >/dev/null; then sleep 120; fi
          echo '::error::Could not cancel this run; failing closed.'
          exit 1
      - name: Reject unsuccessful CI gates
        if: >-
          always() && env.TRUSTED_PR != 'true' && (
            needs.release-paths.result != 'success' ||
            needs.pre-pr-evidence.result != 'success' ||
            (needs.release-paths.outputs.apple != 'true' && needs.release-paths.outputs.apple != 'false') ||
            (needs.release-paths.outputs.swift != 'true' && needs.release-paths.outputs.swift != 'false') ||
            (needs.release-paths.outputs.full != 'true' && needs.release-paths.outputs.full != 'false') ||
            (needs.release-paths.outputs.api != 'true' && needs.release-paths.outputs.api != 'false') ||
            (needs.release-paths.outputs.workers != 'true' && needs.release-paths.outputs.workers != 'false') ||
            (needs.paid-access-worker.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.workers == 'false' &&
              needs.paid-access-worker.result == 'skipped')) ||
            ((github.event_name != 'pull_request' || startsWith(github.head_ref, 'merge-batch/')) &&
              needs.release-paths.outputs.full != 'true') ||
            (needs.macos-debug.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.swift == 'false' &&
              needs.macos-debug.result == 'skipped')) ||
            (needs.portable-linux.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.swift == 'false' &&
              needs.portable-linux.result == 'skipped')) ||
            (needs.lint.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.apple == 'false' &&
              needs.lint.result == 'skipped')) ||
            (needs.ios.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.full == 'false' &&
              needs.ios.result == 'skipped')) ||
            (needs.macos-release.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.full == 'false' &&
              needs.macos-release.result == 'skipped')) ||
            (needs.journey-ui.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.full == 'false' &&
              needs.journey-ui.result == 'skipped'))
          )
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          echo '::error::A required CI gate failed, was cancelled, or did not run as expected.'
          printf '%s\n' "$CI_GATE_NEEDS"
          exit 1
      - name: Confirm successful CI gates
        run: echo 'All required CI gates passed; only explicitly excluded gates may skip.'

  # Legacy required-check name, kept until the ruleset requires only
  # "CI Gate"; then delete this job.
  required-macos:
    name: Build & Test (macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: gate
    permissions: {}
    steps:
      - name: Mirror CI Gate
        if: always() && needs.gate.result != 'success'
        run: exit 1
      - name: Confirm CI Gate
        run: echo 'CI Gate passed.'
