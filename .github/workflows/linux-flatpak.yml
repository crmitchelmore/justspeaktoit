name: Linux Flatpak

on:
  push:
    branches: [main]
    paths: &paths
      - Package.swift
      - LICENSE
      - .gitattributes
      - Sources/SpeakWatchCore/**
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop*/**
      - Sources/SpeakSync/**
      - Sources/SpeakLinux*/**
      - Sources/CLinux*/**
      - Sources/CLlamaCpp/**
      - Sources/CMigrationArchive/**
      - Sources/CRecordingFileSupport/**
      - Sources/SpeakAutomationKit/**
      - Sources/SpeakCLI/**
      - Resources/**
      - packaging/linux/**
      - scripts/linux-flatpak-checks.sh
      - scripts/tests/test_linux_flatpak_sources.py
      - scripts/stage-linux-desktop.py
      - scripts/generate-desktop-icons.py
      - scripts/local-llm-runtime/**
      - scripts/migration/verify-miniz.py
      - scripts/windows-local-runtime/dependencies.json
      - .github/workflows/linux-flatpak.yml
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: 'Optional trusted build run to retest without rebuilding (requires exact source SHA)'
        type: string
        default: ''
      qualification_source_sha:
        description: 'Exact source SHA recorded by that build run'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flatpak:
    name: Flatpak build, bundle and installed runtime
    # Bubblewrap/Flatpak require a privileged disposable hosted container.
    # Only repository-owned branches may execute in that context.
    if: inputs.qualification_run_id == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    timeout-minutes: 90
    env:
      MANIFEST: packaging/linux/com.justspeaktoit.JustSpeakToIt.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check pinned sources, permissions and offline build contract
        run: |
          python3 packaging/linux/generate-swiftpm-sources.py --check
          python3 -B -m unittest discover -s scripts/tests -p test_linux_flatpak_sources.py
          flatpak-builder --show-manifest "$MANIFEST" > "$RUNNER_TEMP/flatpak-manifest.json"
          python3 packaging/linux/verify-flatpak-manifest.py "$RUNNER_TEMP/flatpak-manifest.json"
          flatpak-builder-lint manifest "$MANIFEST"

      - name: Install runtime and Swift SDK extension
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.swift6//25.08
          flatpak info --user org.freedesktop.Sdk.Extension.swift6//25.08

      - name: Fetch pinned sources
        run: >-
          flatpak-builder --download-only --force-clean
          --state-dir "$RUNNER_TEMP/flatpak-state" "$RUNNER_TEMP/flatpak-build" "$MANIFEST"

      - name: Build offline
        run: >-
          flatpak-builder --disable-download --force-clean --disable-rofiles-fuse --jobs=4
          --state-dir "$RUNNER_TEMP/flatpak-state" --repo "$RUNNER_TEMP/flatpak-repo"
          "$RUNNER_TEMP/flatpak-build" "$MANIFEST"

      - name: Bundle
        run: >-
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          "$RUNNER_TEMP/flatpak-repo" "$RUNNER_TEMP/JustSpeakToIt-x86_64.flatpak" com.justspeaktoit.JustSpeakToIt

      - name: Fetch and verify the pinned speech fixture
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          pin = json.loads(pathlib.Path('scripts/windows-local-runtime/dependencies.json').read_text())['whisperCpp']
          fixture = pin['fixture']
          url = 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/' + pin['commit'] + '/' + fixture['path']
          data = urllib.request.urlopen(url, timeout=60).read()
          assert len(data) == fixture['bytes'] and hashlib.sha256(data).hexdigest() == fixture['sha256']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'jfk.wav').write_bytes(data)
          PY

      - name: Install bundle and qualify its real sandbox runtime
        run: |
          [ -s /etc/machine-id ] || dbus-uuidgen > /etc/machine-id
          mkdir -p flatpak-evidence
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > flatpak-evidence/source-revision.txt
          cp "$RUNNER_TEMP/JustSpeakToIt-x86_64.flatpak" flatpak-evidence/
          cp "$RUNNER_TEMP/flatpak-manifest.json" flatpak-evidence/
          sha256sum flatpak-evidence/JustSpeakToIt-x86_64.flatpak > flatpak-evidence/flatpak-bundle.sha256
          bash -o pipefail -c 'scripts/linux-flatpak-checks.sh "$RUNNER_TEMP/JustSpeakToIt-x86_64.flatpak" "$RUNNER_TEMP/jfk.wav" 2>&1 | tee flatpak-evidence/flatpak-installed-checks.log'
          flatpak info --user com.justspeaktoit.JustSpeakToIt >> flatpak-evidence/flatpak-installed-checks.log
          flatpak info --user --show-permissions com.justspeaktoit.JustSpeakToIt >> flatpak-evidence/flatpak-installed-checks.log

      - name: Upload bundle and qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: justspeaktoit-flatpak-x86_64
          path: flatpak-evidence/
          if-no-files-found: error

  retest:
    name: Retest trusted installed Flatpak bundle
    if: github.event_name == 'workflow_dispatch' && inputs.qualification_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify source-run provenance and unchanged package inputs
        env:
          SOURCE_RUN: ${{ inputs.qualification_run_id }}
          SOURCE_SHA: ${{ inputs.qualification_source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p flatpak-evidence
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request
          run_id, sha, repo = os.environ['SOURCE_RUN'], os.environ['SOURCE_SHA'], os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'[0-9]+', run_id) and re.fullmatch(r'[0-9a-f]{40}', sha)
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          run = json.load(urllib.request.urlopen(request, timeout=30))
          assert run['head_sha'] == sha and run['head_repository']['full_name'] == repo
          assert run['path'] == '.github/workflows/linux-flatpak.yml' and run['status'] == 'completed'
          # PR association head.sha follows later pushes; run.head_sha is the immutable source binding.
          pathlib.Path('flatpak-evidence/source-run.json').write_text(json.dumps({
              'runID': run_id, 'sourceSHA': sha, 'repository': repo, 'workflow': run['path'],
              'harnessSHA': os.environ['GITHUB_SHA'], 'event': run['event'],
              'pullRequestParents': [{'baseSHA': pr['base']['sha']} for pr in run.get('pull_requests', [])
                  if pr['head']['repo']['id'] == run['repository']['id']
                  and pr['base']['repo']['id'] == run['repository']['id']]}, indent=2) + '\n')
          PY

      - name: Download that run's authenticated bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: justspeaktoit-flatpak-x86_64
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: downloaded-flatpak

      - name: Prepare runtime, bundle and verified speech fixture
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//50
          [ -s /etc/machine-id ] || dbus-uuidgen > /etc/machine-id
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, runpy, shutil, subprocess, urllib.request
          records = list(pathlib.Path('downloaded-flatpak').rglob('source-revision.txt'))
          assert len(records) == 1 and records[0].is_file() and not records[0].is_symlink(), 'Fresh build required: missing checked-out revision evidence'
          built_sha = records[0].read_text().strip()
          assert re.fullmatch(r'[0-9a-f]{40}', built_sha), 'Invalid checked-out revision'
          git = ['git', '-c', 'safe.directory=' + os.getcwd()]
          subprocess.run([*git, 'fetch', '--no-tags', 'origin', built_sha], check=True)
          evidence = pathlib.Path('flatpak-evidence/source-run.json')
          metadata = json.loads(evidence.read_text())
          parents = subprocess.check_output([*git, 'show', '-s', '--format=%P', built_sha], text=True).split()
          runpy.run_path('packaging/linux/verify_build_revision.py')['verify_revision'](built_sha, parents, metadata)
          inputs = ['Package.swift', 'LICENSE', '.gitattributes', 'packaging/linux', 'Sources', 'Resources',
                    'scripts/stage-linux-desktop.py', 'scripts/local-llm-runtime',
                    'scripts/generate-desktop-icons.py', 'scripts/migration/verify-miniz.py',
                    'scripts/windows-local-runtime/dependencies.json']
          subprocess.run([*git, 'diff', '--exit-code', built_sha, 'HEAD', '--', *inputs], check=True)
          metadata['builtRevision'] = built_sha
          evidence.write_text(json.dumps(metadata, indent=2) + '\n')
          shutil.copyfile(records[0], 'flatpak-evidence/source-revision.txt')
          bundles = list(pathlib.Path('downloaded-flatpak').rglob('JustSpeakToIt-x86_64.flatpak'))
          assert len(bundles) == 1 and bundles[0].is_file() and not bundles[0].is_symlink()
          shutil.copyfile(bundles[0], 'flatpak-evidence/JustSpeakToIt-x86_64.flatpak')
          pin = json.loads(pathlib.Path('scripts/windows-local-runtime/dependencies.json').read_text())['whisperCpp']
          fixture = pin['fixture']
          url = 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/' + pin['commit'] + '/' + fixture['path']
          data = urllib.request.urlopen(url, timeout=60).read()
          assert len(data) == fixture['bytes'] and hashlib.sha256(data).hexdigest() == fixture['sha256']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'jfk.wav').write_bytes(data)
          PY
          sha256sum flatpak-evidence/JustSpeakToIt-x86_64.flatpak > flatpak-evidence/flatpak-bundle.sha256

      - name: Qualify the unchanged bundle in a real session
        run: >-
          bash -o pipefail -c 'scripts/linux-flatpak-checks.sh
          flatpak-evidence/JustSpeakToIt-x86_64.flatpak "$RUNNER_TEMP/jfk.wav"
          2>&1 | tee flatpak-evidence/flatpak-installed-checks.log'

      - name: Upload retest evidence and bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: justspeaktoit-flatpak-retest-x86_64
          path: flatpak-evidence/
          if-no-files-found: error
