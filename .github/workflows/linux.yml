name: Linux Desktop

on:
  push:
    branches: [main]
    paths:
      - .gitattributes
      - Package.swift
      - Resources/AppIcon.iconset/**
      - scripts/generate-desktop-icons.py
      - scripts/stage-linux-desktop.py
      - scripts/tests/test_desktop_icons.py
      - scripts/tests/test_linux_automation_staging.py
      - Sources/CLinuxAutomation/**
      - Sources/SpeakLinuxAutomation/**
      - Sources/SpeakAutomationKit/**
      - Sources/SpeakCLI/**
      - Tests/SpeakLinuxAutomationTests/**
      - Tests/SpeakAutomationKitTests/**
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/CLlamaCpp/**
      - Sources/CMigrationArchive/**
      - Sources/CRecordingFileSupport/**
      - Sources/SpeakDesktopHost/**
      - Sources/SpeakDesktopSync/**
      - Sources/SpeakSync/**
      - Sources/SpeakLinux/**
      - Sources/SpeakLinuxPlatform/**
      - Sources/SpeakLinuxWebSocket/**
      - Sources/CLinuxSupport/**
      - Sources/CLinuxSystem/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Tests/SpeakDesktopHostTests/**
      - Tests/SpeakDesktopSyncTests/**
      - Tests/SpeakSyncTests/**
      - Tests/SpeakTestSupport/**
      - Tests/SpeakLinuxPlatformTests/**
      - Tests/SpeakLinuxWebSocketTests/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakPortableTests/**
      - scripts/linux-*
      - scripts/linux-local-runtime/**
      - scripts/windows-local-runtime/**
      - Sources/CWindowsSupport/whisper-cpp/**
      - scripts/typecheck-windows-swift.sh
      - scripts/verify-portable-core-boundary.py
      - packaging/linux/**
      - .github/workflows/linux.yml
      - .github/workflows/linux-local-runtime.yml
      - Package.resolved
      - .github/desktop-platform-paths.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  desktop-paths:
    name: Detect desktop-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Classify changed files
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # existing CI v4.0.3 pin
        with:
          filters: .github/desktop-platform-paths.yml
      - name: Select an explicit boolean
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED: ${{ steps.filter.outputs.linux-desktop }}
        run: |
          set -eu
          case "$EVENT_NAME" in pull_request|push|workflow_dispatch) ;; *) exit 1 ;; esac
          if [ "$EVENT_NAME" != "pull_request" ]; then SELECTED=true; fi
          case "$SELECTED" in true|false) ;; *) exit 1 ;; esac
          echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"

  local-runtime:
    needs: desktop-paths
    if: needs.desktop-paths.outputs.selected == 'true'
    uses: ./.github/workflows/linux-local-runtime.yml

  linux-desktop:
    name: Linux desktop (GTK 4, Swift 6.2.3)
    needs: local-runtime
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.3-noble@sha256:6dd90eb2359663a2cde8f03e9951f488b23134b3b8fce20e9dcb6cada75dd803
    timeout-minutes: 30
    env:
      SPEAK_LINUX_TARGET: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Normalize container checkout ancestry
        # Native registry/capture fixtures live under the checkout's .build.
        # Match their owner/mode contract, not just container-root writability.
        # Do not touch sibling action/temp mounts or weaken runtime admission.
        run: |
          set -eu
          test "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" = /__w
          owner="$(id -u):$(id -g)"
          for directory in /__w "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE"; do
            test -d "$directory"
            test ! -L "$directory"
            chown "$owner" "$directory"
            chmod go-w "$directory"
          done

      - name: Install GTK 4, libadwaita, PipeWire, keyring and X11 test tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            libgtk-4-dev libadwaita-1-dev libpulse-dev libsecret-1-dev libx11-dev libxtst-dev libssl-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            dbus dbus-x11 gnome-keyring pipewire pipewire-pulse wireplumber pulseaudio-utils \
            xvfb openbox zenity xdotool weston python3 python3-gi gir1.2-glib-2.0 \
            fonts-cantarell adwaita-icon-theme

      - name: Verify portable source boundary
        run: python3 scripts/verify-portable-core-boundary.py

      # The pinned whisper.cpp runtime, its JFK sample and a cached model
      # folder, so the on-device tests run the real runtime instead of skipping.
      - uses: actions/download-artifact@v8
        with:
          name: linux-local-runtime
          path: local-runtime

      # The pinned tiny model is downloaded by the app's own installer on a
      # miss and verified against its SHA-256 on every run.
      - name: Restore pinned local models
        uses: actions/cache@v6
        with:
          path: local-models
          key: local-models-linux-${{ hashFiles('Sources/SpeakCore/WhisperCppModels.swift') }}

      # github.workspace names the host path; inside the container only
      # $GITHUB_WORKSPACE is right.
      - name: Point the on-device checks at the runtime
        run: |
          echo "JSTI_WHISPER_RUNTIME_DIRECTORY=$GITHUB_WORKSPACE/local-runtime/runtime" >> "$GITHUB_ENV"
          echo "JSTI_WHISPER_TEST_AUDIO=$GITHUB_WORKSPACE/local-runtime/fixtures/jfk.wav" >> "$GITHUB_ENV"
          echo "JSTI_LOCAL_MODEL_DIRECTORY=$GITHUB_WORKSPACE/local-models" >> "$GITHUB_ENV"

      # The root Package.resolved pins the Apple graph. The Linux graph (SwiftNIO)
      # is pinned separately, and --force-resolved-versions fails the build
      # rather than float if those pins stop satisfying Package.swift.
      - name: Pin the Linux dependency graph
        run: cp packaging/linux/Package.resolved Package.resolved

      - name: Build the Linux app
        run: |
          swift --version
          swift build --configuration release --product SpeakLinux --jobs 4 --force-resolved-versions
          swift build --configuration release --product speak --jobs 4 --force-resolved-versions
          cmp packaging/linux/Package.resolved Package.resolved

      - name: Test Linux automation staging
        run: python3 -B -m unittest discover -s scripts/tests -p test_linux_automation_staging.py

      - name: Test shared core, desktop host and Linux adapters
        run: swift test --configuration release --jobs 4 --force-resolved-versions

      - name: Self-test, GTK window smoke test and page screenshots
        env:
          JSTI_UI_SNAPSHOT_PATH: ${{ runner.temp }}/linux-window.png
          JSTI_UI_SCREENSHOT_DIR: ${{ runner.temp }}/linux-ui-screenshots
        run: scripts/linux-desktop-checks.sh "$(swift build --configuration release --show-bin-path)/SpeakLinux"

      - name: Transcribe the JFK sample on-device with the pinned tiny model
        timeout-minutes: 8
        run: |
          "$(swift build --configuration release --show-bin-path)/SpeakLinux" --local-transcription-self-test \
            "$JSTI_WHISPER_TEST_AUDIO" --expect 'ask not what your country can do for you'

      - name: GTK window smoke test on headless Wayland (Weston)
        run: scripts/linux-wayland-smoke.sh "$(swift build --configuration release --show-bin-path)/SpeakLinux"

      - name: Keyring, PipeWire capture, portal and X11 paste integration
        run: scripts/linux-integration-checks.sh "$(swift build --configuration release --show-bin-path)/SpeakLinux"

      - name: Type-check the Windows Swift targets against the shared host
        env:
          SPEAK_LINUX_TARGET: ""
        run: scripts/typecheck-windows-swift.sh --jobs 4

      - name: Upload window snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-window-snapshot
          path: ${{ runner.temp }}/linux-window.png
          if-no-files-found: ignore

      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ui-screenshots
          path: ${{ runner.temp }}/linux-ui-screenshots
          if-no-files-found: ignore

  required-desktop:
    name: Linux desktop gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions: {}
    needs: [desktop-paths, local-runtime, linux-desktop]
    steps:
      - name: Reject unsuccessful or missing selected work
        if: >-
          always() && (
            needs.desktop-paths.result != 'success' ||
            (github.event_name != 'pull_request' && needs.desktop-paths.outputs.selected != 'true') ||
            (needs.desktop-paths.outputs.selected != 'true' && needs.desktop-paths.outputs.selected != 'false') ||
            (needs.local-runtime.result != 'success' && !(needs.desktop-paths.outputs.selected == 'false' && needs.local-runtime.result == 'skipped')) ||
            (needs.linux-desktop.result != 'success' && !(needs.desktop-paths.outputs.selected == 'false' && needs.linux-desktop.result == 'skipped'))
          )
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "::error::A desktop gate failed, was cancelled, or skipped unexpectedly."
          printf '%s\n' "$GATE_NEEDS"
          exit 1
      - name: Confirm successful selected work
        run: echo "Selected platform jobs passed; explicit unrelated-path exclusions may skip."
