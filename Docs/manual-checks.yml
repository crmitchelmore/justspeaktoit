        steps:
          - "On a Pixel 9 or later with a locked bootloader, open Settings, turn on Clean up transcripts and tap Cleanup model."
          - "Under On this phone, choose Gemini Nano (On-device); if it says it needs downloading, wait on Wi-Fi until it shows Ready."
