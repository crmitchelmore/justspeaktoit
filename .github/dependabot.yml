version: 2
updates:
  # Swift Package Manager
  - package-ecosystem: "swift"
    directory: "/"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Swift Package Manager (isolated lint tooling graph, issue #677)
  - package-ecosystem: "swift"
    directory: "/Tooling"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tooling)"
    open-pull-requests-limit: 2

  # Gradle (native Android app)
  - package-ecosystem: "gradle"
    directory: "/android"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(android)"
    open-pull-requests-limit: 2

  # GitHub Actions. Every remote action is pinned to a full commit SHA with a
  # version comment; Dependabot bumps the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

  # npm (landing page)
  - package-ecosystem: "npm"
    directory: "/landing-page"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
