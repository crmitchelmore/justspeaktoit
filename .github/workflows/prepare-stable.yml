name: Prepare Stable
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Surfaces to publish; frozen into the approval manifest
        type: choice
        default: all
        options:
          - all
          - ios-only
      alpha:
        description: Tested immutable Alpha tag (alpha-build-N)
        required: true
        type: string
      mac_version:
        description: Required for all scope; ignored for ios-only
        required: false
        type: string
      ios_version:
        description: Intended numeric iOS version, checked against App Store Connect
        required: true
        type: string
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-manifest-allocation
      queue: max
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA: ${{ inputs.alpha }}
          MAC_VERSION: ${{ inputs.mac_version }}
          IOS_VERSION: ${{ inputs.ios_version }}
          PUBLICATION_SCOPE: ${{ inputs.scope || 'all' }}
        run: node scripts/release-train.mjs prepare --alpha "$ALPHA" --mac-version "$MAC_VERSION" --ios-version "$IOS_VERSION" --scope "$PUBLICATION_SCOPE"
  mac-direct:
    needs: prepare
    if: inputs.scope != 'ios-only'
    uses: ./.github/workflows/release-mac.yml
    with:
      manifest: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
  ios:
    needs: prepare
    uses: ./.github/workflows/release-ios.yml
    with:
      manifest: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
  desktop-qualification:
    needs: prepare
    if: needs.prepare.outputs.tag != '' && inputs.scope != 'ios-only'
    uses: ./.github/workflows/qualify-desktop-release.yml
    with:
      manifest: ${{ needs.prepare.outputs.tag }}
