name: Release iOS (TestFlight)

on:
  workflow_call:
    inputs:
      manifest:
        required: true
        type: string

concurrency:
  group: release-ios
  queue: max
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  APP_STORE_CONNECT_KEY_ID: S747NJ9DZY
  # The extension now ships by default, while direct capture remains an
  # independent, default-off rollout. Handoff-only builds never attempt the
  # keyboard-process microphone or Speech permission path.
  TUIST_IOS_KEYBOARD: "1"
  TUIST_IOS_KEYBOARD_DIRECT_CAPTURE: "0"

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.manifest }}

      - name: Load frozen release manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: node scripts/release-train.mjs configure --tag "$MANIFEST" --surface ios

      - name: Stamp immutable app metadata
        run: python3 scripts/stamp-release-train.py ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Install Tuist
        run: brew install tuist

      - name: Install App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ env.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Reuse an already uploaded manifest build
        id: preflight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ruby scripts/release-apple.rb upload-status "$RUNNER_TEMP/release-manifest.json" ios

      - name: Install iOS Signing Certificate & Profiles
        if: steps.preflight.outputs.skip_upload != 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ env.RELEASE_TRAIN == 'alpha' && secrets.ALPHA_IOS_APPSTORE_PROFILE || secrets.IOS_APPSTORE_PROFILE }}
          IOS_WIDGET_APPSTORE_PROFILE: ${{ env.RELEASE_TRAIN == 'alpha' && secrets.ALPHA_IOS_WIDGET_APPSTORE_PROFILE || secrets.IOS_WIDGET_APPSTORE_PROFILE }}
          IOS_KEYBOARD_APPSTORE_PROFILE: ${{ env.RELEASE_TRAIN == 'alpha' && secrets.ALPHA_IOS_KEYBOARD_APPSTORE_PROFILE || secrets.IOS_KEYBOARD_APPSTORE_PROFILE }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/ios-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          if [ -n "$IOS_DISTRIBUTION_P12" ]; then
            CERT_PATH=$RUNNER_TEMP/ios-distribution.p12
            echo -n "$IOS_DISTRIBUTION_P12" | base64 --decode -o "$CERT_PATH"
            CERT_PEM_PATH=$RUNNER_TEMP/ios-distribution.pem
            openssl pkcs12 -in "$CERT_PATH" -clcerts -nokeys \
              -passin "pass:$IOS_DISTRIBUTION_PASSWORD" -out "$CERT_PEM_PATH"
            IOS_DISTRIBUTION_CERT_SERIAL=$(openssl x509 -in "$CERT_PEM_PATH" -noout -serial | cut -d= -f2)
            security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH" "$CERT_PEM_PATH"
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "$IOS_APPSTORE_PROFILE" ]; then
            APP_PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/ios-appstore.provisionprofile
            echo -n "$IOS_APPSTORE_PROFILE" | base64 --decode -o "$APP_PROFILE_PATH"
            APP_PROFILE_UUID=$(security cms -D -i "$APP_PROFILE_PATH" | plutil -extract UUID raw -)
            APP_PROFILE_NAME=$(security cms -D -i "$APP_PROFILE_PATH" | plutil -extract Name raw -)
            echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> "$GITHUB_ENV"
            echo "APP_PROFILE_NAME=$APP_PROFILE_NAME" >> "$GITHUB_ENV"
          fi
          if [ -n "$IOS_WIDGET_APPSTORE_PROFILE" ]; then
            WIDGET_PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/ios-widget-appstore.provisionprofile
            echo -n "$IOS_WIDGET_APPSTORE_PROFILE" | base64 --decode -o "$WIDGET_PROFILE_PATH"
            WIDGET_PROFILE_UUID=$(security cms -D -i "$WIDGET_PROFILE_PATH" | plutil -extract UUID raw -)
            WIDGET_PROFILE_NAME=$(security cms -D -i "$WIDGET_PROFILE_PATH" | plutil -extract Name raw -)
            echo "WIDGET_PROFILE_UUID=$WIDGET_PROFILE_UUID" >> "$GITHUB_ENV"
            echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME" >> "$GITHUB_ENV"
          fi
          if [ "$TUIST_IOS_KEYBOARD" = "1" ]; then
            KEYBOARD_PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/ios-keyboard-appstore.provisionprofile
            if [ -n "$IOS_KEYBOARD_APPSTORE_PROFILE" ]; then
              echo -n "$IOS_KEYBOARD_APPSTORE_PROFILE" | base64 --decode -o "$KEYBOARD_PROFILE_PATH"
            else
              APP_STORE_CONNECT_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${{ env.APP_STORE_CONNECT_KEY_ID }}.p8 \
                ruby scripts/create-ios-app-store-profile.rb \
                  --bundle-id "$BUNDLE_ID.keyboard" \
                  --bundle-name "JustSpeakToIt Keyboard" \
                  --capability APP_GROUPS \
                  --certificate-serial "$IOS_DISTRIBUTION_CERT_SERIAL" \
                  --profile-name "JustSpeakToIt Keyboard App Store" \
                  --output "$KEYBOARD_PROFILE_PATH"
            fi
            KEYBOARD_PROFILE_PLIST=$RUNNER_TEMP/ios-keyboard-appstore.plist
            security cms -D -i "$KEYBOARD_PROFILE_PATH" > "$KEYBOARD_PROFILE_PLIST"
            plutil -extract Entitlements xml1 -o - "$KEYBOARD_PROFILE_PLIST" \
              | grep -Fq "<string>$IOS_APP_GROUP</string>" || {
              echo "::error::Keyboard provisioning profile does not authorize group.com.justspeaktoit.ios. Associate that App Group with com.justspeaktoit.ios.keyboard in the Apple Developer portal, then rerun this workflow."
              exit 1
            }
            KEYBOARD_PROFILE_UUID=$(security cms -D -i "$KEYBOARD_PROFILE_PATH" | plutil -extract UUID raw -)
            KEYBOARD_PROFILE_NAME=$(security cms -D -i "$KEYBOARD_PROFILE_PATH" | plutil -extract Name raw -)
            echo "KEYBOARD_PROFILE_UUID=$KEYBOARD_PROFILE_UUID" >> "$GITHUB_ENV"
            echo "KEYBOARD_PROFILE_NAME=$KEYBOARD_PROFILE_NAME" >> "$GITHUB_ENV"
          fi

      - name: Validate installed profile identities
        if: steps.preflight.outputs.skip_upload != 'true'
        run: python3 scripts/verify-train-profiles.py ios

      - name: Generate Xcode Project
        if: steps.preflight.outputs.skip_upload != 'true'
        run: |
          tuist generate --no-open
          mkdir -p "Just Speak to It.xcworkspace/xcshareddata/swiftpm"
          cp Package.resolved "Just Speak to It.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          {
            echo "### Keyboard rollout policy"
            echo "- Extension included: $TUIST_IOS_KEYBOARD"
            echo "- Direct capture enabled: $TUIST_IOS_KEYBOARD_DIRECT_CAPTURE"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Patch iOS Signing Settings
        if: steps.preflight.outputs.skip_upload != 'true'
        env:
          APP_PROFILE_NAME: ${{ env.APP_PROFILE_NAME }}
          WIDGET_PROFILE_NAME: ${{ env.WIDGET_PROFILE_NAME }}
          KEYBOARD_PROFILE_NAME: ${{ env.KEYBOARD_PROFILE_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          app_profile = os.environ.get("APP_PROFILE_NAME", "")
          widget_profile = os.environ.get("WIDGET_PROFILE_NAME", "")
          keyboard_profile = os.environ.get("KEYBOARD_PROFILE_NAME", "")
          team_id = os.environ.get("APPLE_TEAM_ID", "")
          include_keyboard = os.environ.get("TUIST_IOS_KEYBOARD", "0") == "1"

          if not app_profile or not widget_profile:
              raise SystemExit("Missing app/widget provisioning profile names")
          if include_keyboard and not keyboard_profile:
              raise SystemExit("Keyboard feature enabled without a keyboard provisioning profile name")

          pbx_path = Path("Just Speak to It.xcodeproj/project.pbxproj")
          text = pbx_path.read_text()

          def upsert_setting(lines, key, value):
              for i, line in enumerate(lines):
                  if line.strip().startswith(f"{key} ="):
                      indent = line.split(key, 1)[0]
                      lines[i] = f"{indent}{key} = {value};"
                      return
              for i, line in enumerate(lines):
                  if "PRODUCT_BUNDLE_IDENTIFIER" in line:
                      indent = re.match(r"(\s*)", line).group(1)
                      lines.insert(i + 1, "{}{} = {};".format(indent, key, value))
                      return
              indent = re.match(r"(\s*)", lines[0]).group(1) if lines else "\t\t\t\t"
              lines.append("{}{} = {};".format(indent, key, value))

          def patch_release_block(settings, profile):
              lines = settings.splitlines()
              upsert_setting(lines, "CODE_SIGN_STYLE", "Manual")
              upsert_setting(lines, "CODE_SIGN_IDENTITY", "\"Apple Distribution\"")
              if team_id:
                  upsert_setting(lines, "DEVELOPMENT_TEAM", team_id)
              upsert_setting(lines, "PROVISIONING_PROFILE_SPECIFIER", '"{}"'.format(profile))
              return "\n".join(lines)

          def patch_blocks(text):
              pattern = re.compile(
                  r'(?P<prefix>[A-F0-9]{24} /\* Release \*/ = \{\n\t\t\tisa = XCBuildConfiguration;\n\t\t\tbuildSettings = \{\n)(?P<settings>.*?)(?P<suffix>\n\t\t\t\};\n\t\t\tname = Release;\n\t\t\};)',
                  re.S,
              )
              def repl(match):
                  settings = match.group("settings")
                  if f"PRODUCT_BUNDLE_IDENTIFIER = {os.environ['BUNDLE_ID']}.JustSpeakToItWidgetExtension;" in settings:
                      settings = patch_release_block(settings, widget_profile)
                  elif include_keyboard and f"PRODUCT_BUNDLE_IDENTIFIER = {os.environ['BUNDLE_ID']}.keyboard;" in settings:
                      settings = patch_release_block(settings, keyboard_profile)
                  elif f"PRODUCT_BUNDLE_IDENTIFIER = {os.environ['BUNDLE_ID']};" in settings:
                      settings = patch_release_block(settings, app_profile)
                  return "{}{}{}".format(match.group("prefix"), settings, match.group("suffix"))
              return pattern.sub(repl, text)

          updated = patch_blocks(text)
          pbx_path.write_text(updated)
          PY

      - name: Stamp Git Commit into Info.plist
        if: steps.preflight.outputs.skip_upload != 'true'
        env:
          COMMIT_SHA: ${{ env.RELEASE_SOURCE }}
        run: |
          # Tuist generates the Info.plist from the Project.swift extendingDefault.
          # We inject GitCommitSHA via a build-phase-generated file instead.
          mkdir -p Sources/SpeakiOS/Services
          cat > Sources/SpeakiOS/Services/BuildInfo.swift << EOF
          // Auto-generated at build time — do not edit
          import Foundation
          public enum BuildInfo {
              public static let gitCommitSHA = "$COMMIT_SHA"
              public static let gitCommitShort = "${COMMIT_SHA:0:7}"
          }
          EOF
          echo "Stamped commit: ${COMMIT_SHA:0:7}"
          cat Sources/SpeakiOS/Services/BuildInfo.swift

      - name: Build and Archive
        if: steps.preflight.outputs.skip_upload != 'true'
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -onlyUsePackageVersionsFromResolvedFile \
            -workspace "Just Speak to It.xcworkspace" \
            -scheme SpeakiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SpeakiOS.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Verify archived release notes
        if: steps.preflight.outputs.skip_upload != 'true'
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          APP_PATH="build/SpeakiOS.xcarchive/Products/Applications/$PRODUCT_NAME.app"
          python3 scripts/verify-release-train-archive.py "$APP_PATH" "$RUNNER_TEMP/release-manifest.json" ios
          CATALOGUE_PATH=$(find "$APP_PATH" -name ReleaseNotes.json -print -quit)
          if [ -z "$CATALOGUE_PATH" ]; then
            echo "::error::Archived iOS app does not contain ReleaseNotes.json"
            exit 1
          fi
          node scripts/update-release-notes-catalogue.mjs \
            --verify --platform ios --version "$VERSION" --catalogue "$CATALOGUE_PATH"

      - name: Verify Archived App Metadata
        if: steps.preflight.outputs.skip_upload != 'true'
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          APP_PATH="build/SpeakiOS.xcarchive/Products/Applications/$PRODUCT_NAME.app"
          WIDGET_PATH="$APP_PATH/PlugIns/JustSpeakToItWidgetExtension.appex"
          KEYBOARD_PATH="$APP_PATH/PlugIns/JustSpeakKeyboard.appex"

          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          WIDGET_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WIDGET_PATH/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          WIDGET_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WIDGET_PATH/Info.plist")

          [ "$APP_VERSION" = "$VERSION" ] || { echo "App version mismatch: expected '$VERSION', got '$APP_VERSION'"; exit 1; }
          [ "$WIDGET_VERSION" = "$VERSION" ] || { echo "Widget version mismatch: expected '$VERSION', got '$WIDGET_VERSION'"; exit 1; }
          [ "$APP_BUILD" = "$BUILD_NUMBER" ] || { echo "App build mismatch: expected '$BUILD_NUMBER', got '$APP_BUILD'"; exit 1; }
          [ "$WIDGET_BUILD" = "$BUILD_NUMBER" ] || { echo "Widget build mismatch: expected '$BUILD_NUMBER', got '$WIDGET_BUILD'"; exit 1; }

          if [ "$TUIST_IOS_KEYBOARD" = "1" ]; then
            KEYBOARD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$KEYBOARD_PATH/Info.plist")
            KEYBOARD_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$KEYBOARD_PATH/Info.plist")
            [ "$KEYBOARD_VERSION" = "$VERSION" ] || { echo "Keyboard version mismatch: expected '$VERSION', got '$KEYBOARD_VERSION'"; exit 1; }
            [ "$KEYBOARD_BUILD" = "$BUILD_NUMBER" ] || { echo "Keyboard build mismatch: expected '$BUILD_NUMBER', got '$KEYBOARD_BUILD'"; exit 1; }
            for usage_key in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription; do
              if [ "$TUIST_IOS_KEYBOARD_DIRECT_CAPTURE" = "1" ]; then
                /usr/libexec/PlistBuddy -c "Print :$usage_key" "$KEYBOARD_PATH/Info.plist" >/dev/null 2>&1 || {
                  echo "::error::Direct-capture keyboard is missing $usage_key."
                  exit 1
                }
              elif /usr/libexec/PlistBuddy -c "Print :$usage_key" "$KEYBOARD_PATH/Info.plist" >/dev/null 2>&1; then
                echo "::error::Handoff-only keyboard unexpectedly declares $usage_key."
                exit 1
              fi
            done
          else
            [ ! -e "$KEYBOARD_PATH" ] || {
              echo "::error::Keyboard feature is off, but JustSpeakKeyboard.appex was embedded in the archive."
              exit 1
            }
          fi

          codesign -d --entitlements - --xml "$APP_PATH" > "$RUNNER_TEMP/app-entitlements.plist"
          codesign -d --entitlements - --xml "$WIDGET_PATH" > "$RUNNER_TEMP/widget-entitlements.plist"
          APP_GROUP=$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.application-groups:0' \
            "$RUNNER_TEMP/app-entitlements.plist" 2>/dev/null || true)
          WIDGET_GROUP=$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.application-groups:0' \
            "$RUNNER_TEMP/widget-entitlements.plist" 2>/dev/null || true)
          APP_ICLOUD_CONTAINER=$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.developer.icloud-container-identifiers:0' \
            "$RUNNER_TEMP/app-entitlements.plist" 2>/dev/null || true)

          [ "$APP_GROUP" = "$IOS_APP_GROUP" ] \
            || { echo "App group mismatch: expected 'group.com.justspeaktoit.ios', got '${APP_GROUP:-missing}'"; exit 1; }
          [ "$WIDGET_GROUP" = "$IOS_APP_GROUP" ] \
            || { echo "Widget group mismatch: expected 'group.com.justspeaktoit.ios', got '${WIDGET_GROUP:-missing}'"; exit 1; }
          if [ "$TUIST_IOS_KEYBOARD" = "1" ]; then
            codesign -d --entitlements - --xml "$KEYBOARD_PATH" > "$RUNNER_TEMP/keyboard-entitlements.plist"
            KEYBOARD_GROUP=$(/usr/libexec/PlistBuddy \
              -c 'Print :com.apple.security.application-groups:0' \
              "$RUNNER_TEMP/keyboard-entitlements.plist" 2>/dev/null || true)
            [ "$KEYBOARD_GROUP" = "$IOS_APP_GROUP" ] \
              || { echo "Keyboard group mismatch: expected 'group.com.justspeaktoit.ios', got '${KEYBOARD_GROUP:-missing}'"; exit 1; }
          fi
          [ "$APP_ICLOUD_CONTAINER" = "$IOS_CLOUD_CONTAINER" ] \
            || { echo "iCloud container mismatch: expected 'iCloud.com.justspeaktoit.ios', got '${APP_ICLOUD_CONTAINER:-missing}'"; exit 1; }

      - name: Export IPA
        if: steps.preflight.outputs.skip_upload != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          APP_PROFILE_UUID=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/ios-appstore.provisionprofile" | plutil -extract UUID raw -)
          WIDGET_PROFILE_UUID=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/ios-widget-appstore.provisionprofile" | plutil -extract UUID raw -)
          cat > ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>APPLE_TEAM_ID_PLACEHOLDER</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.justspeaktoit.ios</key>
                  <string>APP_PROFILE_UUID_PLACEHOLDER</string>
                  <key>com.justspeaktoit.ios.JustSpeakToItWidgetExtension</key>
                  <string>WIDGET_PROFILE_UUID_PLACEHOLDER</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          PLIST

          sed -i '' "s/com.justspeaktoit.ios/${BUNDLE_ID}/g" ExportOptions.plist
          sed -i '' "s/APPLE_TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/g" ExportOptions.plist
          sed -i '' "s/APP_PROFILE_UUID_PLACEHOLDER/${APP_PROFILE_UUID}/g" ExportOptions.plist
          sed -i '' "s/WIDGET_PROFILE_UUID_PLACEHOLDER/${WIDGET_PROFILE_UUID}/g" ExportOptions.plist
          if [ "$TUIST_IOS_KEYBOARD" = "1" ]; then
            KEYBOARD_PROFILE_UUID=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/ios-keyboard-appstore.provisionprofile" | plutil -extract UUID raw -)
            /usr/libexec/PlistBuddy \
              -c "Add :provisioningProfiles:$BUNDLE_ID.keyboard string $KEYBOARD_PROFILE_UUID" \
              ExportOptions.plist
          fi
          
          xcodebuild -exportArchive \
            -archivePath build/SpeakiOS.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ env.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ env.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          
          echo "✅ Build exported and uploaded to App Store Connect"
          echo "The build will appear in TestFlight after Apple's processing (5-30 minutes)"

      - name: Record upload and reconcile TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_S747NJ9DZY.p8
        run: |
          ruby scripts/release-apple.rb distribute "$RUNNER_TEMP/release-manifest.json" ios
