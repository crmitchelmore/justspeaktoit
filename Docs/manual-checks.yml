        core: false
        build: "TestFlight Just Speak to It, the first Alpha build that includes the iOS History session details change"
        steps:
          - "Make a short recording from the in-app mic with polish on, then one from the Action Button."
          - "In History tap Session details on each new entry."
          - "Long-press one entry, choose Create Issue with Details\u2026 and read the preview."
