      - id: "iphone-clipboard-expiry-settings"
        issue: 994
        title: "Clipboard notice/settings and 1-minute expiry on iPhone"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        steps:
          - "If the main screen shows the \"Clipboard privacy updated\" card, read it and tap Got it."
          - "Open Settings › Privacy Information › Clipboard: set Transcript expiry to 1 minute; leave Allow Universal Clipboard off."
          - "Press and hold the Action Button to start, say \"expiry check\", stop, and paste into Notes immediately."
          - "Wait 90 seconds and paste again."
