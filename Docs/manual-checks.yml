      - id: "mac-cleanup-model-successor"
        issues:
          - 1578
        title: "A removed cleanup model moves to its successor and cleanup still works"
        minutes: 3
        core: false
        build: "Just Speak to It for Mac, the first Alpha build with the 12 November 2026 cleanup model update"
        steps:
          - "Before updating, note your post-processing model in Settings \u203a Post-processing (for example GPT-5.6 Luna or Claude Haiku 4.5)."
          - "Update to the Alpha build and reopen Settings \u203a Post-processing."
          - "With post-processing on, dictate a made-up sentence and stop."
        expected: "A removed model now shows its successor (GPT-5.6 Luna becomes GPT-6 Luna, Claude Haiku 4.5 becomes Claude Haiku 5.5) with the same provider route, the picker no longer lists GPT-5.x, Claude 4.x or Qwen3.6 models, and the dictation is cleaned up without a key or model error."
        final_gate: true
      - id: "mac-openrouter-discover-configure"
        issues:
          - 1575
        title: "Every Mac picker that can use OpenRouter has a Browse OpenRouter models button, like voice"
        minutes: 6
        core: false
        build: "Just Speak to It for Mac, the first Alpha build that adds Browse OpenRouter models to dictation profiles"
        steps:
          - "Open Settings \u203a Post-processing, choose Remote, click Browse OpenRouter models\u2026 under Remote Post-processing Model, turn on Discover OpenAI cleanup models via OpenRouter, click a model, check its Pricing and Temperature, then click Use for cleanup."
          - "Open Settings \u203a Transcription, choose Remote Streaming and read the Remote Streaming Model help text."
          - "Switch to Remote Batch, click Browse OpenRouter models\u2026 under Remote Batch Model, click any model and click Use for transcription."
          - "Open Settings \u203a Profiles, edit a profile, set Transcription to Remote Batch and Polish to Enabled, and use Browse OpenRouter models\u2026 under Batch Model and under Polish Model."
        expected: "Each Browse OpenRouter models\u2026 button sits directly under its picker, like Browse OpenRouter Speech\u2026 in Voice Output, and opens a searchable list where each model has a pricing page. After choosing, the picker shows OpenRouter \u203a the chosen model. Remote Streaming has no button and its help says OpenRouter models can't stream."
        final_gate: true
      - id: "mac-diagnostics-consent"
        issues:
          - 1468
        title: "Crash reports are asked once, off until agreed, and can be turned off"
        minutes: 3
        core: false
        build: "Just Speak to It for Mac, the first Alpha build that includes diagnostics consent"
        steps:
          - "Open the app after updating; read the Send crash reports and diagnostics prompt and choose Don't Send."
          - "Quit and reopen the app."
          - "Open Settings \u203a About \u203a Privacy, search Settings for crash reports, then turn Send crash reports and diagnostics on and off again."
        expected: "The prompt appears once before the analytics question (if any) and explains what is sent; it does not return after relaunch. Search finds the Privacy card, the switch reflects your choice, and turning it on or off needs no restart."
        final_gate: false
      - id: "mac-raw-configuration-editor"
        issues:
          - 1546
        title: "Raw configuration editor and speak config tools validate and apply settings safely"
        minutes: 6
        core: false
        build: "Just Speak to It for Mac, the first Alpha build that includes #1546, with the speak CLI installed"
        steps:
          - "Open Settings \u203a General \u203a Advanced and click Edit raw configuration\u2026; check that apiKeys shows only true or false for each provider."
          - "Change ttsSpeed to 9 and appearance to \"sepia\", click Apply, and listen with VoiceOver on: both errors are announced with their settings.<key> path and nothing changes."
          - "Set ttsSpeed to 1.2, click Apply, close the sheet and check Voice Output shows speed 1.2. Export\u2026 to a file, Reset to Defaults, Apply, then Import\u2026 the file and Apply: your settings come back."
          - "With automation on and Allow automation to change settings off, run speak config set ttsSpeed=1.1: it is refused. Run it again with --dry-run: it reports the change without applying it."
          - "Turn Allow automation to change settings on, run speak config set ttsSpeed=1.1 showCompactHUD=true, then speak config get --prefix tts."
        expected: "Invalid edits change nothing and every error is announced; valid edits, export/import and reset round-trip. CLI writes are refused until the opt-in is on, dry runs always work, and get shows the new values with no API key material."
        final_gate: false
      - id: "owner-desktop-speak-config"
        issues:
          - 1608
        title: "Windows and Linux: speak config reads and changes preferences safely"
        minutes: 6
        core: false
        build: "Just Speak to It for Windows or Linux, the first Alpha build that includes the #1608 desktop configuration tools, with automation on and the speak CLI set up"
        steps:
          - "Run speak config get --prefix show and check the output lists showHUD and every API key only as set or not set."
          - "With Preferences \u203a General \u203a Allow automation to change settings off, run speak config set showHUD=false: it is refused. Run it again with --dry-run: it reports the change without applying it."
          - "Turn Allow automation to change settings on with a screen reader running (Narrator or Orca) and check it reads the switch name and state."
          - "Run speak config set showHUD=false holdThreshold=9: both are refused and nothing changes. Then run speak config set showHUD=false and open Preferences: Show recording HUD is off."
          - "Export preferences, turn the allow switch off, import the file: the switch stays off."
        expected: "Reads never show key material, writes are refused until the local switch is on and are all-or-nothing, Preferences shows the change at once, and importing a file never turns the switch on."
        final_gate: false
  - id: "iphone"
    device: "iPhone"
    title: "iPhone"
    setup:
      - "Install TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later on an iPhone with an Action Button (iOS 26+)."
      - "In the app: API keys for OpenRouter (polish), OpenAI and Deepgram saved; Settings \u203a Action Button & Shortcuts \u203a When Recording Stops = Copy & Polish (default is Auto)."
      - "Settings \u203a Transcription \u203a Where transcription runs = Local (Apple SpeechTranscriber)."
      - "iOS Settings \u203a Action Button \u203a Controls: choose Transcribe Voice (Just Speak to It Alpha)."
      - "Have Notes open on a scratch note, AirPods in their case, and your Mac (same Apple ID, Handoff on) nearby."
    items:
      - id: "iphone-raw-configuration-editor"
        issues:
          - 1608
          - 1671
        title: "iPhone raw configuration editor validates, applies all or none, imports and exports"
        minutes: 5
        core: false
        build: "TestFlight Just Speak to It Alpha, a build that includes the #1608 iPhone raw configuration editor"
        steps:
          - "Open Settings \u203a General \u203a Edit raw configuration \u203a Raw configuration. Check no API key value appears; \"apiKeys\" lists only true or false."
          - "Change \"autoStopSilenceSeconds\" to 30 and tap Validate, then Apply: an error names settings.autoStopSilenceSeconds and nothing is saved."
          - "Set it to 5 and \"hardwareTriggerDestination\" to \"historyOnly\", tap Apply, go back to Recording & Shortcuts: both show the new values."
          - "Check the document lists the Read aloud settings (\"ttsProvider\", \"ttsModel\", \"ttsVoice\", \"ttsSpeed\", \"ttsLanguageIdentifier\", \"sonioxTTSRegion\"). With \"ttsProvider\" \"deepgram\", set \"ttsSpeed\" to 3 and tap Validate: an error names settings.ttsSpeed. Set it to 1.5 and \"ttsLanguageIdentifier\" to \"en_GB\" and tap Apply: no error."
          - "Tap Export, save to Files, tap Reset to Defaults and confirm, Apply, then Import the saved file and Apply: your values come back, including \"ttsSpeed\" 1.5 and \"ttsLanguageIdentifier\" \"en_GB\"."
          - "With VoiceOver on, tap Validate on an invalid document: VoiceOver reads the result and the first error."
          - "Search Settings for \"raw\" or \"json\": Edit raw configuration is a result and opens General."
        expected: "Errors name each bad key and nothing changes until every value is valid; applied values show on their Settings pages at once; export, reset and import round-trip; results are announced to VoiceOver."
        final_gate: false
      - id: "iphone-ipad-device-copy"
        issues:
          - 1598
        title: "iPad Settings never says \"this iPhone\" or mentions the Dynamic Island"
        minutes: 3
        core: false
        build: "TestFlight Just Speak to It Alpha, a build that includes the #1598 device-copy fix, on an iPad and an iPhone"
        steps:
          - "On an iPad, open Settings and read the Recommended setup card."
          - "Open Transcription, Recording & Shortcuts (with Live Activities on), Sync and Privacy & Diagnostics and read their footnotes."
          - "Start a recording, open Settings \u203a System resources in use and read the Live Activity row."
          - "Repeat the Recommended setup and Live Activity checks on an iPhone."
        expected: "On iPad, copy says \"this iPad\" or \"your iPad\", the setup card suggests Control Center rather than the Action Button, and nothing mentions the Dynamic Island. On iPhone, copy says \"this iPhone\" and the Live Activity text says \"on supported iPhones, in the Dynamic Island\"."
        final_gate: false
      - id: "iphone-clipboard-e2e"
        issues:
          - 934
          - 1117
        title: "Cold Action Button start: raw paste now, your later copy kept"
        minutes: 6
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026 (not device evidence): raw text on the clipboard at Stop and a later copy kept, via deep links and the simulator transcript hook. Still pending on a physical iPhone."
        steps:
          - "Force-quit Just Speak to It in the App Switcher."
          - "From the Home Screen, press and hold the Action Button, say \"raw clipboard, um, test\", then press and hold again to stop."
          - "Within 2 seconds paste into Notes."
          - "In Notes type MARKER, select it and tap Copy."
          - "Wait 20 seconds, paste again, then open History."
        expected: "First paste is the raw words (fillers included), never a placeholder. Second paste is MARKER (polish did not overwrite your copy). History has exactly one item, showing the polished text. Recording started from cold and no Live Activity lingers."
        final_gate: true
      - id: "iphone-clipboard-locked"
        issues:
          - 934
        title: "Stop while locked, then unlock and paste raw text"
        minutes: 3
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "Press and hold the Action Button, say \"locked stop\", then press the side button to lock."
          - "While locked, stop with the Action Button or the Lock Screen Stop button."
          - "Wait 20 seconds, unlock and paste into Notes."
        expected: "Paste is the raw \"locked stop\"; History has one polished item. No placeholder. Add your iOS version and whether Stop needed an unlock to any Fail note."
        final_gate: true
      - id: "iphone-interrupted-recording-prompt"
        issues:
          - 1617
        title: "Recording interrupted prompt: only after a real interruption, and every answer sticks"
        minutes: 6
        core: false
        build: "TestFlight Just Speak to It Alpha that includes the #1617 fix"
        steps:
          - "If \"Recording interrupted\" appears on the first launch after updating, tap Not now once (older recordings may still be listed)."
          - "In the app, record \"normal recording\" and stop. Force-quit the app and reopen it."
          - "In the app, start recording, say \"interrupted test\", and while it is recording force-quit the app. Reopen it and tap Transcribe it."
          - "Repeat the interrupted recording, reopen, tap Not now, then force-quit and reopen again."
          - "Repeat the interrupted recording once more, reopen and tap Discard recording."
          - "Turn on Airplane Mode, repeat the interrupted recording, reopen and tap Transcribe it."
        expected: "No prompt after the normal recording. Transcribe it shows a \"Transcribing interrupted recording\u2026\" banner, then opens the new History item containing \"interrupted test\" and the prompt does not return. After Not now the prompt does not come back on the next launch. Discard recording removes it with no prompt on the next launch. In Airplane Mode a \"Couldn't transcribe recording\" alert offers Try again, Discard recording and Keep for later; nothing is deleted unless you choose Discard."
        final_gate: false
      - id: "iphone-siri-interruption"
        issues:
          - 1117
        title: "Siri interruption keeps the text and the next recording works"
        minutes: 3
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "Tap the mic in the app and say \"before interruption\"."
          - "Hold the side button to invoke Siri, then dismiss Siri."
          - "If still recording, tap Stop; then make and stop a new short recording."
        expected: "The recording continued or stopped with a clear message; History has one item with \"before interruption\" (no duplicate) and the new recording works."
        final_gate: true
      - id: "iphone-focus-filter"
        issues:
          - 1014
        title: "Focus filter forces History Only, and only for runs it started"
        minutes: 6
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026: the Focus Capture Overrides settings text matches. Filter behaviour still pending on a physical iPhone."
        steps:
          - "iOS Settings \u203a Focus \u203a Do Not Disturb \u203a Add Filter \u203a Just Speak to It Alpha \u203a Capture Overrides: Destination = History Only."
          - "Turn Do Not Disturb on, copy MARKER2 in Notes, then press and hold the Action Button and open the app."
          - "Check the line under the status, say \"focus one\", stop, and paste in Notes."
          - "Start another recording with the Action Button, say \"focus two\", turn Do Not Disturb off in Control Center, stop, and paste."
          - "Record \"focus three\" with the Action Button, stop, and paste."
          - "Clean up: delete the filter and tap Reset Stored Override in the app's Settings \u203a Focus Capture Overrides."
        expected: "The app shows \"Save to History Only \u00b7 Focus\". The first two pastes give MARKER2 (no clipboard write; History has \"focus one\" and \"focus two\"). The third paste gives \"focus three\"."
        final_gate: true
      - id: "iphone-bluetooth-local"
        issues:
          - 935
        title: "AirPods route changes: on-device capture and hands-free stay truthful"
        minutes: 5
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "With AirPods in the case, tap the mic and say \"alpha one two three\"; put the AirPods in and, once connected, say \"bravo four five six\", then stop if still recording."
          - "Settings \u203a Behavior: turn Hands-Free Dictation on, tap the mic to arm and wait for Armed."
          - "Say a long sentence starting \"utterance kept\" and, mid-sentence, put the AirPods back in the case."
          - "Read the indicator and any message, disarm, then open History."
        expected: "Each run either carried on or stopped with \"The microphone changed and recording stopped.\" Nothing shows Recording or Armed while deaf. History keeps \"alpha one two three\" and one item with \"utterance kept\". A new recording works afterwards."
        final_gate: true
      - id: "iphone-bluetooth-remote"
        issues:
          - 935
        title: "AirPods route changes: OpenAI Realtime and Deepgram streaming"
        minutes: 5
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "Set Where transcription runs = Remote, Remote Mode = Streaming, model = OpenAI GPT Live Transcribe (Streaming)."
          - "With AirPods connected, tap the mic, say \"charlie one two three\", put the AirPods in the case, say \"delta four\", then stop if still recording."
          - "Switch the Remote Streaming Model to Deepgram Nova-3 (Streaming)."
          - "With AirPods in the case, tap the mic, say \"echo one two three\", put the AirPods in, say \"foxtrot four\", then stop if still recording."
          - "Open History, then set Where transcription runs back to Local."
        expected: "For both providers: recording carried on or stopped with \"The microphone changed and recording stopped.\"; History keeps the first phrase; nothing shows Recording without new text; the next recording works."
        final_gate: true
      - id: "iphone-shortcuts-last-transcript"
        issues:
          - 1016
        title: "Shortcuts: Get Last Transcript works and needs unlock when locked"
        minutes: 5
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "In Shortcuts create \"JS Last\": Just Speak to It Alpha \u203a Get Last Transcript, then Show Result of its Raw Text and Polished Text."
          - "Run it, force-quit Shortcuts, reopen and run it again."
          - "Lock the iPhone and say \"Hey Siri, JS Last\"; unlock when asked."
        expected: "Both runs show the newest recording's raw and polished text, matching History. When locked, nothing is shown or spoken until you authenticate."
        final_gate: true
      - id: "iphone-clipboard-privacy-mac"
        issues:
          - 994
        title: "Clipboard: expires on iPhone, reaches the Mac only when opted in"
        minutes: 7
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026 (not device evidence): 1-minute expiry cleared the clipboard. Universal Clipboard and all device behaviour still pending."
        steps:
          - "App Settings \u203a Privacy Information \u203a Clipboard: Transcript expiry = 1 minute, Allow Universal Clipboard off."
          - "On the Mac copy MACMARK; on the iPhone record \"local only\" with the Action Button and stop."
          - "Within 30 seconds press Cmd+V on the Mac, then paste in iPhone Notes."
          - "Wait 90 seconds and paste on the iPhone again."
          - "Turn Allow Universal Clipboard on, record \"universal check\" and stop; within 30 seconds paste on the Mac."
          - "Set Allow Universal Clipboard off and expiry back to 5 minutes."
        expected: "Mac pastes MACMARK and the iPhone pastes \"local only\"; after 90 seconds the iPhone pastes nothing. With the opt-in, the Mac pastes \"universal check\". The settings text says Mac copies may not expire."
        final_gate: true
      - id: "iphone-controls-and-hints"
        issues:
          - 954
        title: "Control Center, Action Button hints and Lock Screen control"
        minutes: 6
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026: setup screen copy renders, including at the largest text size. Pickers, hints and recording still pending."
        steps:
          - "Read the app's Settings \u203a Action Button & Shortcuts \u203a Set Up Transcribe Voice and follow it to add Transcribe Voice to Control Center."
          - "Tap the control to record \"control test\", tap again to stop, and paste."
          - "Press the Action Button briefly and read the hint; press and hold to start, press briefly and read the hint, press and hold to stop."
          - "Add Transcribe Voice to a Lock Screen bottom slot, then start and stop from the Lock Screen."
        expected: "Written steps match the real pickers. Hints read \"Start dictation\" when idle and \"Stop dictation\" while recording. Each route records once and pastes; note any unlock prompt. Needs iOS 18 and 26 evidence to close #954."
        final_gate: false
      - id: "iphone-transcript-alerts"
        issues:
          - 1017
        title: "Transcript Ready alerts: delivery, privacy and denied state"
        minutes: 6
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026, inconclusive: no banner appeared while a result Live Activity was showing, even with Live Activities off. Still pending on a physical iPhone."
        steps:
          - "Settings \u203a Behavior: Live Activities off; Settings \u203a Saved Results: Transcript Ready Alerts on, Allow."
          - "Start a recording, say \"alert one\", go Home, stop with Transcribe Voice in Control Center, then tap the banner."
          - "Start a recording, say \"alert two\", lock, stop with the Action Button, then use the alert's Open History."
          - "Record once with the app in the foreground."
          - "Turn Live Activities back on."
        expected: "One banner with no transcript text each time; tapping opens the exact History item (unlock first when locked). No alert for the foreground recording."
        final_gate: false
      - id: "iphone-keyboard-v2"
        issues:
          - 661
        title: "Keyboard: setup, insert once in Notes and WhatsApp, cancel"
        minutes: 7
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "iOS Settings \u203a General \u203a Keyboard \u203a Keyboards \u203a Add: Just Speak; turn Allow Full Access on."
          - "In Notes switch to the Just Speak keyboard, tap the mic, say \"keyboard notes\" and stop."
          - "Do the same in a WhatsApp chat with \"keyboard whatsapp\"."
          - "Start once more and tap Cancel."
        expected: "Each dictation inserts exactly once with a leading space where needed; Cancel inserts nothing; no microphone prompt appears inside the keyboard. Still needs an iOS 17 iPhone and iPad to close #661."
        final_gate: false
      - id: "iphone-keyboard-other-apps"
        issues:
          - 1469
        title: "Keyboard: dictation starts in Notes, Messages and Safari, not just in the app"
        minutes: 5
        core: true
        build: "TestFlight Just Speak to It Alpha that includes the #1469 fix"
        steps:
          - "Keyboard enabled with Allow Full Access on. Open Just Speak once so Instant Dictation is ready, then swipe home."
          - "In Notes switch to the Just Speak keyboard, tap the mic, say \"keyboard in notes\" and stop."
          - "Repeat in a Messages chat with \"keyboard in messages\" and in Safari's address bar with \"keyboard in safari\"."
          - "Play music in another app and repeat once in Notes."
          - "If any attempt shows a message, note its exact wording."
        expected: "Each dictation inserts exactly once and music keeps playing. No attempt says to check the microphone permission. If iOS ever refuses, the keyboard says \"iOS paused Just Speak's microphone. Open Just Speak, then return here and tap the mic.\", and doing that makes the next attempt work."
        final_gate: true
      - id: "iphone-keyboard-background-repeat"
        issues:
          - 1469
          - 661
        title: "Keyboard: three dictations in a row from Notes, live and batch, without reopening the app"
        minutes: 5
        core: true
        build: "TestFlight Just Speak to It Alpha that records keyboard dictations on the readiness engine"
        steps:
          - "Keyboard enabled with Allow Full Access on. Open Just Speak once so Instant Dictation is ready, then swipe home."
