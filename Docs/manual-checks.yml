        title: "Measure downloaded cleanup models on a mid-range and a flagship phone"
        minutes: 30
        core: false
        build: "Just Speak to It for Android, the signed APK from the first Alpha that includes Android downloaded cleanup models (#1660), on a mid-range and a flagship arm64 phone, plus an x86_64 emulator"
