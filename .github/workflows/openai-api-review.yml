name: OpenAI API Review
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open PR number to review (one review per head commit)
        required: true
        type: string
permissions: {}
concurrency:
  group: openai-api-review-${{ github.event.pull_request.number || inputs.pr-number }}
  # A new head supersedes an older head's pending review; dispatches finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  review:
    # Manual runs must use the trusted main workflow and script, never a branch copy.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds OPENAI_REVIEW_API_KEY; its deployment branch policy admits only main.
    environment: openai-review
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only trusted base code runs with credentials; PR contents are API data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Review current PR diff with the Responses API
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_REVIEW_API_KEY: ${{ secrets.OPENAI_REVIEW_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: python3 -I .github/scripts/openai-api-review.py
