name: Windows and Portable Swift

on:
  push:
    branches: [main]
    paths:
      - .gitattributes
      - Package.swift
      - Resources/Desktop/**
      - Resources/AppIcon.iconset/**
      - scripts/generate-desktop-icons.py
      - scripts/tests/test_desktop_icons.py
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakDesktopHost/**
      - Sources/SpeakDesktopSync/**
      - Sources/SpeakSync/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Sources/CWindowsSupport/**
      - Sources/CWindowsAutomation/**
      - Sources/SpeakAutomationKit/**
      - Sources/SpeakCLI/**
      - Tests/SpeakPortableTests/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakDesktopHostTests/**
      - Tests/SpeakDesktopSyncTests/**
      - Tests/SpeakSyncTests/**
      - Tests/SpeakWindowsPlatformTests/**
      - Tests/SpeakAutomationKitTests/**
      - Tests/SpeakTestSupport/**
      - scripts/verify-portable-core-boundary.py
      - scripts/windows-cloudkit/**
      - scripts/websocket-loopback-probe.py
      - scripts/windows-local-runtime/**
      - scripts/windows-bundle/runtime-policy.json
      - Docs/windows-development.md
      - .github/workflows/windows.yml
      - .github/workflows/windows-local-runtime.yml
  pull_request:
    branches: [main]
    paths:
      - .gitattributes
      - Package.swift
      - Resources/Desktop/**
      - Resources/AppIcon.iconset/**
      - scripts/generate-desktop-icons.py
      - scripts/tests/test_desktop_icons.py
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakDesktopHost/**
      - Sources/SpeakDesktopSync/**
      - Sources/SpeakSync/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Sources/CWindowsSupport/**
      - Sources/CWindowsAutomation/**
      - Sources/SpeakAutomationKit/**
      - Sources/SpeakCLI/**
      - Tests/SpeakPortableTests/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakDesktopHostTests/**
      - Tests/SpeakDesktopSyncTests/**
      - Tests/SpeakSyncTests/**
      - Tests/SpeakWindowsPlatformTests/**
      - Tests/SpeakAutomationKitTests/**
      - Tests/SpeakTestSupport/**
      - scripts/verify-portable-core-boundary.py
      - scripts/windows-cloudkit/**
      - scripts/websocket-loopback-probe.py
      - scripts/windows-local-runtime/**
      - scripts/windows-bundle/runtime-policy.json
      - Docs/windows-development.md
      - .github/workflows/windows.yml
      - .github/workflows/windows-local-runtime.yml
  workflow_dispatch:
    inputs:
      owned_capture_diagnostics:
        description: >-
          Manual opt-in only: capture isolated DesktopHostOwnedRecordingTests
          direct-executable exit/PID/WER evidence (read-only). Leaving this at
          its default runs the job exactly as an ordinary push/pull_request/
          manual dispatch always has.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  local-runtime:
    uses: ./.github/workflows/windows-local-runtime.yml

  windows:
    name: Native Windows x64 (Swift 6.2.3)
    needs: local-runtime
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # The pinned whisper.cpp runtime, its JFK sample and a cached model
      # folder, so the on-device tests run the real runtime instead of skipping.
      JSTI_WHISPER_RUNTIME_DIRECTORY: ${{ github.workspace }}\local-runtime\runtime
      JSTI_WHISPER_TEST_AUDIO: ${{ github.workspace }}\local-runtime\fixtures\jfk.wav
      JSTI_LOCAL_MODEL_DIRECTORY: ${{ github.workspace }}\local-models
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Swift toolchain
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          source: swift.org
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
          build_arch: amd64
          update-sdk-modules: false

      - name: Verify portable source boundary
        run: python scripts/verify-portable-core-boundary.py

      - uses: actions/download-artifact@v8
        with:
          name: windows-local-runtime
          path: local-runtime

      # The pinned tiny model is downloaded by the app's own installer on a
      # miss and verified against its SHA-256 on every run.
      - name: Restore pinned local models
        uses: actions/cache@v6
        with:
          path: local-models
          key: local-models-${{ hashFiles('Sources/SpeakCore/WhisperCppModels.swift') }}

      - name: Build native Windows executable
        id: native-build
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build --configuration release --product SpeakWindows --jobs 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test shared core, desktop workflow and native adapters
        id: native-tests
        # Runs exactly as before on every push/pull_request/default dispatch,
        # INCLUDING the original implicit `success()` gate (this step must
        # NOT run if an earlier step, e.g. the toolchain install or native
        # build, already failed -- restoring default Actions behavior rather
        # than the previously-introduced `!cancelled()`, which incorrectly
        # let this step run after an earlier failure on every trigger, not
        # just the opt-in one). Narrowly skipped ONLY for the explicit opt-in
        # diagnostics dispatch below, so cold full-suite execution does not
        # precede (and does not consume budget/time ahead of) the isolated
        # single-class capture; every other trigger is completely unaffected.
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.owned_capture_diagnostics == true) }}
        run: |
          swift test --configuration release --jobs 4 --xunit-output windows-tests.xml 2>&1 |
            Tee-Object -FilePath windows-native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build tests for owned-recording diagnostics (opt-in)
        id: owned-capture-build
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.owned_capture_diagnostics == true && steps.native-build.outcome == 'success' }}
        # Separate, more generous budget for cold test compilation, kept out
        # of the fault-observation step below so compile time can never
        # consume the bounded process-execution window.
        timeout-minutes: 15
        run: |
          swift build --build-tests --configuration release --jobs 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture owned-recording crash diagnostics (opt-in, read-only)
        id: owned-capture-diagnostics
        if: ${{ !cancelled() && steps.owned-capture-build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          # Manual opt-in diagnostics only; does not alter the unconditional
          # "Test shared core, desktop workflow and native adapters" step's
          # assertions/budget on any push/pull_request/default-manual run
          # (it only narrowly skips re-running the full suite during this
          # explicit opt-in dispatch -- see that step's own condition).
          # Invokes the already-compiled .xctest binary directly -- bypassing
          # `swift test`, whose own exit code can mask the underlying child
          # process's real exit/signal -- so the actual exit code, PID and
          # raw stdout/stderr are captured unmodified. Every helper below is
          # a pure, parameter-driven function with no hidden global state, so
          # the exact same logic can be (and separately has been) exercised
          # against synthetic/mocked inputs outside this workflow.
          $ErrorActionPreference = 'Stop'

          function Get-OwnedTestSelection {
              param(
                  [Parameter(Mandatory)][string[]]$ListLines,
                  [Parameter(Mandatory)][string]$TargetClass
              )
              # swift-corelibs-xctest's direct --list-tests output format is
              # "<Module>.<Class>/<method>" (confirmed against the pinned
              # swift-6.2.3-RELEASE Sources/XCTest/Private/TestListing.swift
              # and ArgumentParser.swift: there is no --filter flag on the
              # raw binary -- only "--list-tests"/"-l", "--dump-tests-json",
              # "--help"/"-h", or a positional "<Class>" / "<Class>/<method>"
              # selector, per Sources/XCTest/Public/XCTestMain.swift's own
              # usage text and Private/TestFiltering.swift's SelectedTest
              # matching on String(reflecting: testCaseClass), i.e. the fully
              # module-qualified class name).
              $pattern = '^(?<fqcn>[A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+)*\.' + [regex]::Escape($TargetClass) + ')/(?<method>[A-Za-z0-9_]+)$'
              $fqcns = [System.Collections.Generic.HashSet[string]]::new()
              $methods = [System.Collections.Generic.List[string]]::new()
              foreach ($line in $ListLines) {
                  $m = [regex]::Match($line.Trim(), $pattern)
                  if ($m.Success) {
                      [void]$fqcns.Add($m.Groups['fqcn'].Value)
                      $methods.Add($m.Groups['method'].Value)
                  }
              }
              if ($fqcns.Count -eq 0) {
                  throw "Target class '$TargetClass' was not found in the built binary's own --list-tests output; refusing to guess a selector (zero-match)."
              }
              if ($fqcns.Count -gt 1) {
                  throw "Target class '$TargetClass' is ambiguous across modules in --list-tests output ($([string]::Join(', ', $fqcns))); refusing to guess a selector."
              }
              [pscustomobject]@{
                  QualifiedClassName = @($fqcns)[0]
                  ExpectedMethods    = @($methods | Sort-Object -Unique)
              }
          }

          function Invoke-BoundedProcess {
              # Generic, reusable bounded child-process launcher: used for
              # BOTH the --list-tests enumeration and the isolated test-class
              # run below, so neither invocation can block indefinitely.
              # Kill+join after a timeout is itself bounded (KillJoinTimeoutSeconds)
              # rather than an unbounded WaitForExit(). Never throws for a
              # Kill()/join failure -- the PID/start-time ledger captured
              # immediately after a successful Start-Process is always
              # returned, with KillError/unconfirmed-retirement reported
              # alongside it, so a kill exception can never discard the one
              # fact (PID/start time) needed to independently correlate this
              # run against WER/Event Log evidence afterwards.
              param(
                  [Parameter(Mandatory)][string]$FilePath,
                  [string[]]$ArgumentList = @(),
                  [Parameter(Mandatory)][string]$StdOutPath,
                  [Parameter(Mandatory)][string]$StdErrPath,
                  [Parameter(Mandatory)][int]$WaitTimeoutSeconds,
                  [int]$KillJoinTimeoutSeconds = 15
              )
              foreach ($path in @($StdOutPath, $StdErrPath)) {
                  if (Test-Path -LiteralPath $path) {
                      Remove-Item -LiteralPath $path -ErrorAction Stop
                  }
              }
              $process = $null
              $processId = $null
              $exited = $false
              $killed = $false
              $killJoined = $null
              $killError = $null
              $observationError = $null
              $exitCodeSigned = $null
              $startUtc = [DateTime]::UtcNow
              try {
                  $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru -NoNewWindow `
                      -RedirectStandardOutput $StdOutPath -RedirectStandardError $StdErrPath
                  $processId = $process.Id
                  try {
                      $exited = $process.WaitForExit($WaitTimeoutSeconds * 1000)
                  } catch {
                      # The FIRST WaitForExit can itself throw (e.g. a
                      # transient Win32 error reading process state) BEFORE
                      # ever returning. A child may still be alive, and its
                      # PID/start time are the one fact this function must
                      # never lose to that exception -- they are retained in
                      # the ledger returned below regardless, with this
                      # observation failure recorded alongside (never
                      # silently swallowed), and a FINITE best-effort cleanup
                      # kill is still attempted so an unobserved-but-still-
                      # running child is not leaked past this function's own
                      # bounded lifetime.
                      $observationError = $_.Exception.Message
                      $exited = $false
                  }
                  if (-not $exited) {
                      $killed = $true
                      try {
                          $process.Kill($true)
                          $killJoined = $process.WaitForExit($KillJoinTimeoutSeconds * 1000)
                      } catch {
                          $killError = $_.Exception.Message
                          $killJoined = $false
                      }
                  } else {
                      try {
                          $exitCodeSigned = $process.ExitCode
                      } catch {
                          # Exited=$true but reading ExitCode itself threw:
                          # still an observation failure, never promoted to a
                          # confirmed natural exit.
                          $observationError = $_.Exception.Message
                          $exited = $false
                      }
                  }
              } catch {
                  # Start-Process itself failed: no child ever started, so
                  # there is no PID/start time to retain, but the failure
                  # must still be visible to the caller rather than silently
                  # returning an empty success-shaped ledger.
                  $observationError = $_.Exception.Message
              } finally {
                  if ($null -ne $process) { $process.Dispose() }
              }
              [pscustomobject]@{
                  ProcessId        = $processId
                  StartUtc         = $startUtc.ToString('o')
                  EndUtc           = [DateTime]::UtcNow.ToString('o')
                  Exited           = $exited
                  Killed           = $killed
                  KillJoined       = $killJoined
                  KillError        = $killError
                  ObservationError = $observationError
                  ExitCodeSigned   = $exitCodeSigned
                  StdOutPath       = $StdOutPath
                  StdErrPath       = $StdErrPath
              }
          }

          function Format-ProcessRetirement {
              # Pure, testable helper: turns an Invoke-BoundedProcess result
              # into a precise, human-readable retirement statement -- NEVER
              # equates "we never attempted/confirmed a kill" with "it is
              # confirmed to have exited naturally" (that conflation would
              # silently launder a startup/observation failure -- Killed
              # stays $false whenever Start-Process itself failed -- into a
              # false "exited on its own" claim). Only Exited=$true (a
              # genuinely confirmed WaitForExit AND ExitCode read) is ever
              # reported as a natural exit.
              param([Parameter(Mandatory)]$BoundedProcessResult)
              if ($BoundedProcessResult.Exited -eq $true) { return 'not-applicable (process exited on its own)' }
              if (-not $BoundedProcessResult.Killed) {
                  if ($null -ne $BoundedProcessResult.ObservationError) {
                      return "unconfirmed (no kill attempted; observation error: $($BoundedProcessResult.ObservationError))"
                  }
                  return 'unconfirmed (process was never observed to start or exit)'
              }
              if ($BoundedProcessResult.KillJoined -eq $true) { return 'confirmed' }
              if ($null -ne $BoundedProcessResult.KillError) { return "unconfirmed retirement (kill error: $($BoundedProcessResult.KillError))" }
              return 'unconfirmed retirement (kill join timed out)'
          }

          function ConvertTo-ExitCodeHex {
              param([Parameter(Mandatory)][int]$Signed)
              '0x{0:X8}' -f [System.BitConverter]::ToUInt32([System.BitConverter]::GetBytes($Signed), 0)
          }

          function Test-OwnedCaptureIsolation {
              # Proves (not assumes) that the positional selector actually
              # restricted execution to the target class. Tracks STARTED and
              # TERMINAL (passed|failed|skipped) method sets SEPARATELY,
              # because the actual historical crash evidence shows only a
              # "started" line for the method that crashed -- a parser that
              # only recognizes terminal lines would wrongly treat that run
              # as having executed zero observed methods. A crash/non-zero
              # exit may legitimately show a partial started/terminal set
              # (that truncation is itself the evidence of interest) PROVIDED
              # every observed method (started OR terminal) belongs to the
              # target class and to the expected method list -- an unknown
              # method name under the correct class is still rejected, since
              # the selector binds a class, not an arbitrary method set. Only
              # a clean exit code 0 additionally requires the FULL expected
              # method set in BOTH started and terminal, zero non-passed
              # verdicts, and a terminal count that exactly matches the
              # expected method count (a "nonempty subset" is insufficient).
              param(
                  [Parameter(Mandatory)][string[]]$StdOutLines,
                  [Parameter(Mandatory)][string]$TargetClass,
                  [Parameter(Mandatory)][string[]]$ExpectedMethods,
                  [Parameter(Mandatory)][bool]$CleanExit
              )
              if ($StdOutLines.Count -gt 0 -and $StdOutLines[0] -match '^Usage: ') {
                  throw 'Built binary printed CLI usage/help instead of running tests; the positional selector was rejected as an invalid option (invalid-CLI).'
              }
              $startedPattern  = "^Test Case '(?<class>[A-Za-z0-9_]+)\.(?<method>[A-Za-z0-9_]+)' started at "
              $terminalPattern = "^Test Case '(?<class>[A-Za-z0-9_]+)\.(?<method>[A-Za-z0-9_]+)' (?<verb>passed|failed|skipped) "
              $startedMethods = [System.Collections.Generic.HashSet[string]]::new()
              $terminalMethods = [System.Collections.Generic.HashSet[string]]::new()
              $terminalVerbs = [System.Collections.Generic.List[pscustomobject]]::new()
              $foreign = [System.Collections.Generic.List[string]]::new()
              foreach ($line in $StdOutLines) {
                  $sm = [regex]::Match($line, $startedPattern)
                  $tm = [regex]::Match($line, $terminalPattern)
                  foreach ($match in @($sm, $tm)) {
                      if (-not $match.Success) { continue }
                      $class = $match.Groups['class'].Value
                      $method = $match.Groups['method'].Value
                      if ($class -ne $TargetClass) {
                          $foreign.Add("$class.$method (foreign class)")
                          continue
                      }
                      if ($method -notin $ExpectedMethods) {
                          $foreign.Add("$class.$method (unknown method)")
                          continue
                      }
                      if ($match -eq $sm) { [void]$startedMethods.Add($method) }
                      else {
                          [void]$terminalMethods.Add($method)
                          $terminalVerbs.Add([pscustomobject]@{ Method = $method; Verb = $match.Groups['verb'].Value })
                      }
                  }
              }
              if ($foreign.Count -gt 0) {
                  throw "Isolation violated: the run reported test case(s) outside the validated $TargetClass method set ($([string]::Join('; ', ($foreign | Sort-Object -Unique)))); the positional selector did not restrict execution as expected."
              }
              if ($CleanExit) {
                  $missingStarted = @($ExpectedMethods | Where-Object { $_ -notin $startedMethods })
                  $missingTerminal = @($ExpectedMethods | Where-Object { $_ -notin $terminalMethods })
                  if ($missingStarted.Count -gt 0 -or $missingTerminal.Count -gt 0) {
                      throw "Exit code 0 claimed success but expected method(s) did not fully start+complete: started-missing=$($missingStarted -join ', '); terminal-missing=$($missingTerminal -join ', ')."
                  }
                  $nonPassed = @($terminalVerbs | Where-Object { $_.Verb -ne 'passed' })
                  if ($nonPassed.Count -gt 0) {
                      throw "Exit code 0 claimed success but reported non-passed verdict(s): $(($nonPassed | ForEach-Object { "$($_.Method)=$($_.Verb)" }) -join ', ')."
                  }
                  if ($terminalVerbs.Count -ne $ExpectedMethods.Count) {
                      throw "Exit code 0 claimed success but terminal count ($($terminalVerbs.Count)) does not exactly match the expected method count ($($ExpectedMethods.Count))."
                  }
              }
              [pscustomobject]@{
                  StartedMethods  = @($startedMethods | Sort-Object)
                  TerminalMethods = @($terminalMethods | Sort-Object)
              }
          }

          function ConvertFrom-WerHexPid {
              param([Parameter(Mandatory)][string]$Value)
              $clean = $Value.Trim()
              if ($clean -match '^0[xX]') { $clean = $clean.Substring(2) }
              [Convert]::ToInt64($clean, 16)
          }

          function Get-WerEventDataText {
              # PowerShell's [xml] adapter applies a "leaf shortcut": a
              # same-named repeated child element with no attributes and no
              # children (exactly what classic, non-manifest WER <Data>
              # elements are) is surfaced AS the plain InnerText string
              # itself, not as an XmlElement -- so .InnerText on it silently
              # resolves to $null (printed as ''), even though the real text
              # IS present. Live-verified against a constructed classic
              # Application-Error-shaped <EventData> block. This helper
              # tolerates BOTH shapes defensively.
              param($Node)
              if ($null -eq $Node) { return '' }
              if ($Node -is [string]) { return $Node }
              return [string]$Node.InnerText
          }

          function Get-WerEventDataFieldMap {
              # Determines whether THIS event's <EventData><Data> elements
              # carry a Name= attribute (a named/reorderable template) or
              # are the classic, unnamed, strictly-positional layout --
              # live-verified: a named <Data Name="X"> element is surfaced
              # as a real XmlElement whose .GetAttribute('Name') returns the
              # attribute, while the classic no-attribute shape hits the
              # leaf-shortcut (plain string) described above and therefore
              # can NEVER itself carry a Name=. A MIXED layout (some named,
              # some not) or duplicate Name= values makes either binding
              # mode unsound and is rejected outright -- never guessed past.
              param([Parameter(Mandatory)][object[]]$DataNodes)
              $named = 0
              $unnamed = 0
              $map = [ordered]@{}
              $duplicate = $false
              $positional = [System.Collections.Generic.List[string]]::new()
              foreach ($node in $DataNodes) {
                  $positional.Add((Get-WerEventDataText $node))
                  if ($node -is [string]) { $unnamed++; continue }
                  $nameAttr = $node.GetAttribute('Name')
                  if ([string]::IsNullOrEmpty($nameAttr)) {
                      $unnamed++
                  } else {
                      $named++
                      if ($map.Contains($nameAttr)) { $duplicate = $true }
                      $map[$nameAttr] = Get-WerEventDataText $node
                  }
              }
              if ($duplicate) {
                  return [pscustomobject]@{ Mode = 'invalid'; Reason = 'duplicate Name= attribute values among EventData/Data elements' }
              }
              if ($named -gt 0 -and $unnamed -gt 0) {
                  return [pscustomobject]@{ Mode = 'invalid'; Reason = "mixed named ($named) and unnamed ($unnamed) EventData/Data elements" }
              }
              if ($named -gt 0) {
                  return [pscustomobject]@{ Mode = 'named'; Map = $map }
              }
              return [pscustomobject]@{ Mode = 'positional'; Positional = @($positional) }
          }

          function Find-OwnedCaptureWerEvidence {
              # Strictly read-only Application-log (Event ID 1000) query,
              # bounded to the actual process window. Whether this specific
              # event's <EventData><Data> elements carry Name= attributes is
              # NOT assumed from one local classic-provider observation --
              # it is independently re-derived per event via
              # Get-WerEventDataFieldMap. A NAMED layout is bound strictly
              # by field name (ProcessId/AppPath/ModuleName/ExceptionCode/
              # FaultingOffset/IntegratorReportId all required, by name) and
              # only a named+complete match is ever reported as the fully
              # verified "bound-evidence" outcome. A classic UNNAMED/
              # positional layout has genuinely no source-bound authority
              # establishing this hosted runner image's exact field
              # ordering, so even an exact PID+path positional match is
              # reported as an explicitly UNVERIFIED positional candidate --
              # never promoted to "bound-evidence". Reads the raw per-field
              # XML TEXT CONTENT via .ToXml() (the literal string Windows
              # itself rendered) rather than trusting
              # $event.Properties[n].Value (a CLR-boxed value whose type/
              # formatting is provider-metadata-dependent and can silently
              # diverge from that literal text). Provider name and EventID
              # are independently re-validated from the same XML before any
              # field is trusted; a genuinely out-of-window record (time
              # only just outside the padded bound) is silently excluded as
              # expected/normal, never logged as malformed. An event whose
              # field layout cannot be bound at all (invalid named layout,
              # too few positional fields, an unparseable PID) is reported
              # as "unbound-invalid-layout" -- never silently skipped.
              param(
                  [Parameter(Mandatory)][int]$ExpectedProcessId,
                  [Parameter(Mandatory)][string]$ExpectedExecutablePath,
                  [Parameter(Mandatory)][datetime]$WindowStartUtc,
                  [Parameter(Mandatory)][datetime]$WindowEndUtc
              )
              $result = [ordered]@{
                  Outcome                       = 'none-found'
                  QueryError                    = $null
                  QueryErrorId                  = $null
                  BoundEvidence                 = $null
                  UnverifiedPositionalCandidates = @()
                  AmbiguousCandidates           = @()
                  UnknownLayoutEvents           = @()
              }
              $normalizedExpectedPath = $ExpectedExecutablePath.Trim().ToLowerInvariant()
              $paddedStart = $WindowStartUtc.AddSeconds(-5)
              $paddedEnd = $WindowEndUtc.AddSeconds(5)
              try {
                  $events = Get-WinEvent -FilterHashtable @{
                      LogName   = 'Application'
                      Id        = 1000
                      StartTime = $paddedStart
                      EndTime   = $paddedEnd
                  } -ErrorAction Stop
              } catch {
                  $errorId = $_.FullyQualifiedErrorId
                  if ($errorId -like 'NoMatchingEventsFound,*') {
                      return [pscustomobject]$result
                  }
                  # Any other FullyQualifiedErrorId (e.g. NoMatchingLogsFound,
                  # or an access-denied query failure) is a genuine query
                  # problem, not a verified zero-match -- never conflated
                  # with "none-found".
                  $result.Outcome = 'query-error'
                  $result.QueryError = $_.Exception.Message
                  $result.QueryErrorId = $errorId
                  return [pscustomobject]$result
              }
              foreach ($event in $events) {
                  [xml]$xml = $event.ToXml()
                  $providerName = [string]$xml.Event.System.Provider.Name
                  $eventId = [string]$xml.Event.System.EventID.'#text'
                  if ([string]::IsNullOrEmpty($eventId)) { $eventId = [string]$xml.Event.System.EventID }
                  $timeCreated = [string]$xml.Event.System.TimeCreated.SystemTime
                  $inWindow = $false
                  $timeParsed = $false
                  # Must be a typed (not untyped-$null) [datetime] so
                  # [ref]$timeCreatedUtc below binds to DateTime.TryParse's
                  # (string, IFormatProvider, DateTimeStyles, out DateTime)
                  # overload -- an untyped-$null [ref] target fails .NET
                  # overload resolution with a generic "argument count: 4"
                  # MethodException on every real event examined
                  # (live-verified while building this fixture).
                  [datetime]$timeCreatedUtc = [datetime]::MinValue
                  if ([DateTime]::TryParse($timeCreated, [System.Globalization.CultureInfo]::InvariantCulture, [System.Globalization.DateTimeStyles]::AdjustToUniversal -bor [System.Globalization.DateTimeStyles]::AssumeUniversal, [ref]$timeCreatedUtc)) {
                      $timeParsed = $true
                      $inWindow = ($timeCreatedUtc -ge $paddedStart -and $timeCreatedUtc -le $paddedEnd)
                  }
                  if ($providerName -ne 'Application Error' -or $eventId -ne '1000') {
                      $result.UnknownLayoutEvents += [ordered]@{
                          reason      = 'provider/eventId re-validation failed (FilterHashtable match was not reproduced in the parsed XML)'
                          provider    = $providerName
                          eventId     = $eventId
                          timeCreated = $timeCreated
                      }
                      continue
                  }
                  if (-not $timeParsed) {
                      # A TimeCreated/SystemTime value that fails to parse is
                      # itself an invalid/unbindable event shape -- NEVER the
                      # same thing as a genuinely-parsed time that merely
                      # falls outside the padded window. Recording it as
                      # malformed (not silently excluded) is what lets a
                      # caller distinguish "this event was excluded because
                      # it is outside our window" from "this event's time
                      # could not even be evaluated against the window".
                      $result.UnknownLayoutEvents += [ordered]@{
                          reason      = "TimeCreated/SystemTime value could not be parsed: '$timeCreated'"
                          provider    = $providerName
                          eventId     = $eventId
                          timeCreated = $timeCreated
                      }
                      continue
                  }
                  if (-not $inWindow) {
                      # Genuinely parsed but outside the +-5s pad: an
                      # expected/normal exclusion, NOT a malformed/unknown
                      # layout -- never recorded as such.
                      continue
                  }
                  $dataNodes = @($xml.Event.EventData.Data)
                  $fieldMap = Get-WerEventDataFieldMap -DataNodes $dataNodes
                  if ($fieldMap.Mode -eq 'invalid') {
                      $result.UnknownLayoutEvents += [ordered]@{
                          reason      = $fieldMap.Reason
                          timeCreated = $timeCreated
                      }
                      continue
                  }
                  if ($fieldMap.Mode -eq 'named') {
                      $requiredNames = @('ProcessId', 'AppPath', 'ModuleName', 'ExceptionCode', 'FaultingOffset', 'IntegratorReportId')
                      $missingNames = @($requiredNames | Where-Object { -not $fieldMap.Map.Contains($_) })
                      if ($missingNames.Count -gt 0) {
                          $result.UnknownLayoutEvents += [ordered]@{
                              reason      = "named EventData layout is missing expected field(s): $($missingNames -join ', ')"
                              timeCreated = $timeCreated
                          }
                          continue
                      }
                      $faultingPidHexRaw = $fieldMap.Map['ProcessId']
                      $faultingPid = $null
                      try { $faultingPid = ConvertFrom-WerHexPid -Value $faultingPidHexRaw } catch {
                          $result.UnknownLayoutEvents += [ordered]@{
                              reason      = "named ProcessId field '$faultingPidHexRaw' did not parse as hex"
                              timeCreated = $timeCreated
                          }
                          continue
                      }
                      $faultingPath = $fieldMap.Map['AppPath']
                      $pathMatches = $faultingPath.Trim().ToLowerInvariant() -eq $normalizedExpectedPath
                      $pidMatches = $faultingPid -eq $ExpectedProcessId
                      if ($pidMatches -and $pathMatches) {
                          $result.Outcome = 'bound-evidence'
                          $result.BoundEvidence = [ordered]@{
                              timeCreated      = $timeCreatedUtc.ToString('o')
                              faultingModule   = $fieldMap.Map['ModuleName']
                              exceptionCodeHex = $fieldMap.Map['ExceptionCode']
                              faultOffsetHex   = $fieldMap.Map['FaultingOffset']
                              faultingPid      = $faultingPid
                              faultingPath     = $faultingPath
                              reportId         = $fieldMap.Map['IntegratorReportId']
                              fieldBindingMode = 'named'
                          }
                          break
                      } elseif ($pidMatches -or $pathMatches) {
                          $result.AmbiguousCandidates += [ordered]@{
                              timeCreated      = $timeCreatedUtc.ToString('o')
                              faultingPid      = $faultingPid
                              faultingPath     = $faultingPath
                              fieldBindingMode = 'named'
                          }
                      }
                      continue
                  }
                  # $fieldMap.Mode -eq 'positional': classic, unnamed layout.
                  if ($dataNodes.Count -lt 13) {
                      $result.UnknownLayoutEvents += [ordered]@{
                          reason      = "positional EventData field count ($($dataNodes.Count)) does not match the documented 1000-template shape (>=13)"
                          timeCreated = $timeCreated
                      }
                      continue
                  }
                  $positionalFields = $fieldMap.Positional
                  $faultingPidHexRaw = $positionalFields[8]
                  $faultingPid = $null
                  try { $faultingPid = ConvertFrom-WerHexPid -Value $faultingPidHexRaw } catch {
                      $result.UnknownLayoutEvents += [ordered]@{
                          reason      = "positional faulting-PID field (index 8) '$faultingPidHexRaw' did not parse as hex"
                          timeCreated = $timeCreated
                      }
                      continue
                  }
                  $faultingPath = $positionalFields[10]
                  $pathMatches = $faultingPath.Trim().ToLowerInvariant() -eq $normalizedExpectedPath
                  $pidMatches = $faultingPid -eq $ExpectedProcessId
                  if ($pidMatches -and $pathMatches) {
                      # Exact PID+path match, but there is no source-bound
                      # authority establishing this exact runner image's
                      # positional field ordering for this event template --
                      # reported as an explicitly UNVERIFIED candidate, NOT
                      # promoted to "bound-evidence". Scanning continues in
                      # case a later event in the window yields a stronger
                      # (named) binding.
                      $result.UnverifiedPositionalCandidates += [ordered]@{
                          timeCreated      = $timeCreatedUtc.ToString('o')
                          faultingModule   = $positionalFields[3]
                          exceptionCodeHex = $positionalFields[6]
                          faultOffsetHex   = $positionalFields[7]
                          faultingPid      = $faultingPid
                          faultingPath     = $faultingPath
                          reportId         = $positionalFields[12]
                      }
                  } elseif ($pidMatches -or $pathMatches) {
                      $result.AmbiguousCandidates += [ordered]@{
                          timeCreated      = $timeCreatedUtc.ToString('o')
                          faultingPid      = $faultingPid
                          faultingPath     = $faultingPath
                          fieldBindingMode = 'positional'
                      }
                  }
              }
              if ($result.Outcome -eq 'none-found' -and $result.AmbiguousCandidates.Count -gt 0) {
                  $result.Outcome = 'ambiguous-unbound'
              } elseif ($result.Outcome -eq 'none-found' -and $result.UnverifiedPositionalCandidates.Count -gt 0) {
                  $result.Outcome = 'unverified-positional-candidate'
              } elseif ($result.Outcome -eq 'none-found' -and $result.UnknownLayoutEvents.Count -gt 0) {
                  $result.Outcome = 'unbound-invalid-layout'
              }
              [pscustomobject]$result
          }

          # ---- Main flow -------------------------------------------------
          $targetClass = 'DesktopHostOwnedRecordingTests'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'owned-capture-evidence'
          $evidenceDir = Join-Path $evidenceRoot ([Guid]::NewGuid().ToString('n'))
          $report = [ordered]@{
              targetClass          = $targetClass
              evidenceDir          = $evidenceDir
              sourceCommit         = $null
              sourceTree           = $null
              compilerVersion      = $null
              testExecutablePath   = $null
              testExecutableSHA256 = $null
              qualifiedClassName   = $null
              expectedMethods      = @()
              listTests            = $null
              listTestsStdOutSHA256 = $null
              listTestsStdErrSHA256 = $null
              run                  = $null
              isolation            = $null
              wer                  = $null
              failureMessage       = $null
          }
          $failed = $false
          $failureMessage = $null
          try {
              New-Item -ItemType Directory -Path $evidenceDir -Force -ErrorAction Stop | Out-Null
              if (-not (Test-Path -LiteralPath $evidenceDir)) { throw "Failed to create unique evidence directory: $evidenceDir" }

              $sourceCommit = (git rev-parse HEAD 2>&1 | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceCommit)) { throw "git rev-parse HEAD failed or returned empty output (exit $LASTEXITCODE)." }
              $sourceTree = (git rev-parse 'HEAD^{tree}' 2>&1 | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceTree)) { throw "git rev-parse HEAD^{tree} failed or returned empty output (exit $LASTEXITCODE)." }
              $compilerVersion = (swift --version 2>&1 | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($compilerVersion)) { throw "swift --version failed or returned empty output (exit $LASTEXITCODE)." }
              $bin = (swift build --configuration release --show-bin-path 2>&1 | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($bin)) { throw "swift build --show-bin-path failed or returned empty output (exit $LASTEXITCODE)." }
              $testExe = Join-Path $bin 'SpeakAppPackageTests.xctest'
              if (-not (Test-Path -LiteralPath $testExe)) { throw "Built test binary not found at expected SwiftPM bin path: $testExe" }
              $report.sourceCommit = $sourceCommit
              $report.sourceTree = $sourceTree
              $report.compilerVersion = $compilerVersion
              $report.testExecutablePath = $testExe
              $report.testExecutableSHA256 = (Get-FileHash -LiteralPath $testExe -Algorithm SHA256).Hash.ToLowerInvariant()

              # SwiftPM normally supplies these for `swift test`. Direct binary
              # invocation bypasses that, so restore the already-installed
              # pinned XCTest/Testing runtime DLL paths the same way the
              # existing windows-cross-proof.yml execute job does; no new
              # software/install.
              $developer = Split-Path (Split-Path $env:SDKROOT -Parent) -Parent
              foreach ($library in @('XCTest', 'Testing')) {
                  $directory = Join-Path $developer "Library/$library-6.2.3/usr/bin64"
                  if (-not (Test-Path -LiteralPath $directory)) { throw "Missing installed test runtime: $library" }
                  $env:Path = "$directory;$env:Path"
              }

              $listStdOut = Join-Path $evidenceDir 'owned-capture-list-tests.log'
              $listStdErr = Join-Path $evidenceDir 'owned-capture-list-tests-errors.log'
              $listResult = Invoke-BoundedProcess -FilePath $testExe -ArgumentList @('--list-tests') `
                  -StdOutPath $listStdOut -StdErrPath $listStdErr -WaitTimeoutSeconds 60 -KillJoinTimeoutSeconds 15
              $report.listTests = $listResult
              if ($null -ne $listResult.ObservationError) { throw "Built test binary --list-tests process could not be reliably observed: $($listResult.ObservationError); retirement: $(Format-ProcessRetirement $listResult)." }
              if ($listResult.Killed) { throw "Built test binary --list-tests exceeded its 60-second bound (killed, retirement: $(Format-ProcessRetirement $listResult)); cannot bind a validated selector." }
              if ($null -eq $listResult.ExitCodeSigned -or $listResult.ExitCodeSigned -ne 0) { throw "Built test binary --list-tests exited $($listResult.ExitCodeSigned); cannot bind a validated selector." }

              if (-not (Test-Path -LiteralPath $listStdOut)) { throw "Expected --list-tests stdout log is missing: $listStdOut" }
              if (-not (Test-Path -LiteralPath $listStdErr)) { throw "Expected --list-tests stderr log is missing: $listStdErr" }
              $report.listTestsStdOutSHA256 = (Get-FileHash -LiteralPath $listStdOut -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
              $report.listTestsStdErrSHA256 = (Get-FileHash -LiteralPath $listStdErr -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
              $listLines = @(Get-Content -LiteralPath $listStdOut -ErrorAction Stop)
              # Listing stderr too (even though the selector is parsed from
              # stdout) proves the required stream is actually readable, not
              # merely present as a zero-byte/locked file -- the same
              # required-both-streams discipline the isolated run below
              # applies, now also enforced here before class selection.
              $null = Get-Content -LiteralPath $listStdErr -ErrorAction Stop
              $selection = Get-OwnedTestSelection -ListLines $listLines -TargetClass $targetClass
              $report.qualifiedClassName = $selection.QualifiedClassName
              $report.expectedMethods = $selection.ExpectedMethods

              $stdoutPath = Join-Path $evidenceDir 'owned-capture-stdout.log'
              $stderrPath = Join-Path $evidenceDir 'owned-capture-stderr.log'
              $budgetSeconds = 180
              # Positional qualified-class selector (NOT "--filter", which the
              # raw XCTest CLI does not implement -- see Get-OwnedTestSelection
              # above). Running the whole class (not a single method) keeps
              # every one of its existing test methods as evidence surface.
              $runResult = Invoke-BoundedProcess -FilePath $testExe -ArgumentList @($selection.QualifiedClassName) `
                  -StdOutPath $stdoutPath -StdErrPath $stderrPath -WaitTimeoutSeconds $budgetSeconds -KillJoinTimeoutSeconds 15
              $report.run = [ordered]@{
                  argv              = @($testExe, $selection.QualifiedClassName)
                  pid               = $runResult.ProcessId
                  startUtc          = $runResult.StartUtc
                  endUtc            = $runResult.EndUtc
                  budgetSeconds     = $budgetSeconds
                  killed            = $runResult.Killed
                  killJoined        = $runResult.KillJoined
                  killError         = $runResult.KillError
                  observationError  = $runResult.ObservationError
                  retirement        = Format-ProcessRetirement $runResult
                  exitCodeSigned    = $runResult.ExitCodeSigned
                  exitCodeHex       = if ($null -ne $runResult.ExitCodeSigned) { ConvertTo-ExitCodeHex -Signed $runResult.ExitCodeSigned } else { $null }
                  stdoutPath        = $stdoutPath
                  stdoutSHA256      = $null
                  stdoutHashError   = $null
                  stderrPath        = $stderrPath
                  stderrSHA256      = $null
                  stderrHashError   = $null
              }
              # The object literal above is DELIBERATELY free of any
              # file-system operation (Test-Path/Get-FileHash/Get-Content):
              # if a hash/read on either stream threw from inside that one
              # expression, the WHOLE assignment would never complete and
              # $report.run would silently remain $null, discarding the
              # PID/exit ledger that WER correlation below depends on. Every
              # field above is a pure in-memory read of $runResult. Stream
              # existence/hash/read happen afterwards as individually-
              # guarded property SETS on the already-assigned $report.run,
              # so a failure in one of them can never retroactively lose
              # this metadata.

              # Post-run VALIDATION (a missing required stream, an isolation
              # violation, or a zero-tests result) is deliberately isolated
              # into its OWN try/catch so that a loader/selector/output-
              # format validation failure can NEVER discard WER fault
              # correlation for an actually-started child: WER is gathered
              # immediately below regardless of whether this validation
              # threw, as long as the child process actually started
              # (ProcessId is non-null). BOTH stdout AND stderr are
              # explicit required artifacts here -- not merely "the upload
              # glob matched something" -- because a missing/deleted stream
              # on an otherwise-clean exit must be an explicit validation
              # failure, never silent success.
              $validationError = $null
              $isolation = $null
              try {
                  if (-not (Test-Path -LiteralPath $stdoutPath)) { throw "Expected isolated-run stdout log is missing: $stdoutPath" }
                  if (-not (Test-Path -LiteralPath $stderrPath)) { throw "Expected isolated-run stderr log is missing: $stderrPath" }
                  # Each hash below is its OWN guarded property SET on the
                  # already-assigned $report.run (never a reconstruction of
                  # the whole object): a hashing failure on one stream
                  # records its own error and fails validation honestly,
                  # but can never retroactively erase the PID/exit ledger
                  # set above, and WER collection below still proceeds
                  # regardless of this try block's outcome.
                  try {
                      $report.run.stdoutSHA256 = (Get-FileHash -LiteralPath $stdoutPath -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
                  } catch {
                      $report.run.stdoutHashError = $_.Exception.Message
                      throw "Failed to hash isolated-run stdout log ${stdoutPath}: $($_.Exception.Message)"
                  }
                  try {
                      $report.run.stderrSHA256 = (Get-FileHash -LiteralPath $stderrPath -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
                  } catch {
                      $report.run.stderrHashError = $_.Exception.Message
                      throw "Failed to hash isolated-run stderr log ${stderrPath}: $($_.Exception.Message)"
                  }
                  $stdoutLines = @(Get-Content -LiteralPath $stdoutPath -ErrorAction Stop)
                  # Listing stderr too (even though isolation is parsed from
                  # stdout) proves the required stream is actually readable,
                  # not merely present as a zero-byte/locked file.
                  $null = Get-Content -LiteralPath $stderrPath -ErrorAction Stop
                  # Not killed AND claims exit 0 is the only case entitled to
                  # the strict "fully started+completed, zero non-passed,
                  # exact count" clean-run check; a killed run or a claimed-
                  # nonzero exit is still isolation-checked (foreign/unknown
                  # methods still reject) but is allowed a partial started/
                  # terminal set.
                  $cleanExit = (-not $runResult.Killed) -and ($null -eq $runResult.ObservationError) -and ($null -ne $runResult.ExitCodeSigned) -and ($runResult.ExitCodeSigned -eq 0)
                  $isolation = Test-OwnedCaptureIsolation -StdOutLines $stdoutLines -TargetClass $targetClass `
                      -ExpectedMethods $selection.ExpectedMethods -CleanExit $cleanExit
                  $report.isolation = $isolation
                  if ($isolation.StartedMethods.Count -eq 0 -and $isolation.TerminalMethods.Count -eq 0) {
                      throw 'Zero tests were started or completed by the built binary for the selected class (zero-tests); the selection produced an empty run.'
                  }
              } catch {
                  $validationError = $_.Exception.Message
                  $report.isolation = $isolation
              }

              # WER evidence is gathered for every code path where a child
              # process actually started (killed-by-timeout, an
              # observation error, a genuine nonzero exit, OR the post-run
              # validation above failing, alike) -- capturing the fault is
              # the point of this diagnostic, and a validation problem
              # UNRELATED to the target binary's own exit must never be
              # allowed to discard fault correlation for a child that did
              # start.
              $wer = $null
              if ($null -ne $runResult.ProcessId) {
                  $wer = Find-OwnedCaptureWerEvidence -ExpectedProcessId $runResult.ProcessId -ExpectedExecutablePath $testExe `
                      -WindowStartUtc ([DateTime]::Parse($runResult.StartUtc)) -WindowEndUtc ([DateTime]::Parse($runResult.EndUtc))
              }
              $report.wer = $wer
              $werOutcomeText = if ($null -ne $wer) { $wer.Outcome } else { 'not-collected (process never started)' }

              if ($null -ne $validationError) {
                  throw "$validationError WER outcome: $werOutcomeText."
              }
              if ($null -ne $runResult.ObservationError) {
                  throw "DesktopHostOwnedRecordingTests process could not be reliably observed: $($runResult.ObservationError); retirement: $($report.run.retirement). WER outcome: $werOutcomeText."
              }
              if ($runResult.Killed) {
                  throw "DesktopHostOwnedRecordingTests exceeded the existing $budgetSeconds-second cross-proof budget (no retry); PID $($runResult.ProcessId), retirement: $($report.run.retirement). WER outcome: $werOutcomeText."
              }
              if ($null -eq $runResult.ExitCodeSigned) {
                  throw "Process was not killed but reported no exit code (unexpected); treated as an infra failure, not a clean pass. WER outcome: $werOutcomeText."
              }
              if ($runResult.ExitCodeSigned -ne 0) {
                  throw "DesktopHostOwnedRecordingTests exited $($runResult.ExitCodeSigned) ($($report.run.exitCodeHex)); WER outcome: $werOutcomeText. A crash/nonzero exit is the evidence this diagnostic exists to capture, but it is reported as a FAILED diagnostic (full evidence above/uploaded as an artifact), never as green qualification."
              }
          } catch {
              $failed = $true
              $failureMessage = $_.Exception.Message
              $report.failureMessage = $failureMessage
          } finally {
              $reportPath = Join-Path $evidenceDir 'owned-capture-report.json'
              if (Test-Path -LiteralPath $evidenceDir) {
                  $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding utf8
                  Get-Content -LiteralPath $reportPath
              } else {
                  Write-Warning "Evidence directory '$evidenceDir' is unavailable; report could not be persisted to it."
                  $report | ConvertTo-Json -Depth 6
              }
          }
          # Every failure mode above -- infra/validation problems (missing
          # binary, invalid/ambiguous selector, isolation violated,
          # zero-tests, claimed-success-but-incomplete) AND a genuine
          # crash/timeout/nonzero exit from the TARGET binary itself -- is
          # raised as a step failure: evidence is always fully captured
          # FIRST (stdout/stderr/report/WER lookup), but a captured fault is
          # never reported as a passing diagnostic. The unconditional "Test
          # shared core, desktop workflow and native adapters" step remains
          # the separate, sole pass/fail gate for every ordinary
          # push/pull_request/default-manual run (its own success()-gated
          # condition is untouched by this opt-in step's outcome either way).
          if ($failed) { throw $failureMessage }

      - name: Upload owned-recording crash diagnostics
        # Runs whenever the diagnostics step actually executed (opted in),
        # regardless of whether it ultimately succeeded or failed, so partial
        # logs/reports are never lost to a validation failure; "skipped"
        # (the ordinary, non-opted-in case) is excluded. Required evidence
        # missing errors the upload (rather than warning) because this
        # artifact is the mandatory record of an opt-in diagnostic run.
        if: ${{ !cancelled() && steps.owned-capture-diagnostics.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-owned-capture-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/owned-capture-evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Verify native WinHTTP WebSocket transport against loopback peer
        id: websocket-probe
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $readyPath = Join-Path $env:RUNNER_TEMP 'jsti-websocket-ready.json'
          Remove-Item $readyPath -ErrorAction SilentlyContinue
          $server = $null
          $probe = $null
          try {
            $server = Start-Process -FilePath (Get-Command python).Source -PassThru -NoNewWindow `
              -ArgumentList @('-u', 'scripts/websocket-loopback-probe.py', '--ready-file', $readyPath, '--max-seconds', '120') `
              -RedirectStandardOutput windows-websocket-server.log -RedirectStandardError windows-websocket-server-errors.log
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            while (-not (Test-Path $readyPath)) {
              if ($server.HasExited) { throw 'Loopback WebSocket server exited before readiness.' }
              if ([DateTime]::UtcNow -gt $deadline) { throw 'Loopback WebSocket server readiness timed out.' }
              Start-Sleep -Milliseconds 100
            }
            $ready = Get-Content $readyPath -Raw | ConvertFrom-Json
            if ($ready.host -ne '127.0.0.1' -or $ready.port -lt 1 -or $ready.port -gt 65535) {
              throw 'Unexpected loopback peer address.'
            }
            $env:JSTI_WEBSOCKET_PROBE_PORT = [string]$ready.port
            $probe = Start-Process -FilePath (Get-Command swift).Source -PassThru -NoNewWindow `
              -ArgumentList @('test', '--configuration', 'release', '--skip-build', '--filter', 'WinHTTPRuntimeProbeTests', `
                '--filter', 'GladiaWinHTTPRuntimeTests', '--filter', 'CartesiaWinHTTPRuntimeTests', `
                '--filter', 'RevAIWinHTTPRuntimeTests', '--filter', 'AzureWinHTTPRuntimeTests', `
                '--xunit-output', 'windows-websocket-tests.xml') `
              -RedirectStandardOutput windows-websocket-probe.log -RedirectStandardError windows-websocket-probe-errors.log
            if (-not $probe.WaitForExit(90000)) {
              $probe.Kill($true)
              throw 'WebSocket runtime probe exceeded its 90-second process deadline.'
            }
            if ($probe.ExitCode -ne 0) { throw "WebSocket runtime probe failed: $($probe.ExitCode)" }
          } finally {
            Remove-Item Env:JSTI_WEBSOCKET_PROBE_PORT -ErrorAction SilentlyContinue
            if ($probe -and -not $probe.HasExited) { $probe.Kill($true) }
            if ($server -and -not $server.HasExited) { $server.Kill($true) }
            Get-ChildItem windows-websocket-*.log | ForEach-Object { Get-Content $_.FullName }
          }

      - name: Run executable self-test and native window smoke test
        id: native-smoke
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $bin.Trim() 'SpeakWindows.exe'
          $native = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -NoNewWindow `
            -RedirectStandardOutput windows-self-test.log -RedirectStandardError windows-self-test-errors.log
          $nativeFailure = $null
          if (-not $native.WaitForExit(90000)) {
            $native.Kill()
            $nativeFailure = 'Native adapter self-test exceeded 90 seconds.'
          } elseif ($native.ExitCode -ne 0) {
            $nativeFailure = "Native adapter self-test failed: $($native.ExitCode)"
          }
          Get-Content windows-self-test.log
          Get-Content windows-self-test-errors.log
          # Window checks are independent of adapter assertions. Run both while
          # retaining a failing job if either result fails.
          $env:JSTI_UI_SNAPSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE 'windows-ui-smoke.bmp'
          $process = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -PassThru -NoNewWindow `
            -RedirectStandardOutput windows-ui-smoke.log -RedirectStandardError windows-ui-smoke-errors.log
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Native window did not create and shut down within 30 seconds.'
          }
          Get-Content windows-ui-smoke.log
          Get-Content windows-ui-smoke-errors.log
          if ($process.ExitCode -ne 0) { throw "Native window smoke test failed: $($process.ExitCode); $nativeFailure" }
          if ($nativeFailure) { throw $nativeFailure }

      - name: Save every window page with sample History
        id: page-screenshots
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = Join-Path $env:GITHUB_WORKSPACE 'windows-ui-screenshots'
          $process = Start-Process -FilePath (Join-Path $bin.Trim() 'SpeakWindows.exe') `
            -ArgumentList '--ui-screenshots', $folder -PassThru -NoNewWindow `
            -RedirectStandardOutput windows-ui-screenshots.log -RedirectStandardError windows-ui-screenshots-errors.log
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw 'The screenshot tour did not finish within 90 seconds.'
          }
          Get-Content windows-ui-screenshots.log
          Get-Content windows-ui-screenshots-errors.log
          if ($process.ExitCode -ne 0) { throw "The screenshot tour failed: $($process.ExitCode)" }
          $expected = 'dashboard', 'history', 'voice-output', 'general', 'transcription', 'post-processing',
            'corrections', 'pronunciation', 'profiles', 'keyboard', 'icloud-sync', 'about', 'dashboard-dark',
            'history-dark', 'dashboard-recording', 'hud-recording', 'hud-completed', 'history-filters',
            'history-filters-dark', 'hud-expanded-recording', 'hud-compact-recording', 'hud-compact-completed'
          for ($index = 0; $index -lt $expected.Count; $index++) {
            $file = Join-Path $folder ('{0:D2}-{1}.bmp' -f ($index + 1), $expected[$index])
            if (-not (Test-Path $file)) { throw "Missing screenshot $file" }
          }
          foreach ($name in @('comparison-blind-light', 'comparison-revealed-dark')) {
            $file = Join-Path $folder ($name + '.bmp')
            if (-not (Test-Path $file)) { throw "Missing screenshot $file" }
          }

      - name: Upload page screenshots
        if: ${{ !cancelled() && steps.page-screenshots.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-ui-screenshots-${{ github.sha }}
          path: windows-ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Transcribe the JFK sample on-device with the pinned tiny model
        id: local-transcription
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bin.Trim() 'SpeakWindows.exe') --local-transcription-self-test $env:JSTI_WHISPER_TEST_AUDIO `
            --expect 'ask not what your country can do for you' 2>&1 | Tee-Object -FilePath windows-local-transcription.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage developer executable with provenance
        id: developer-stage
        if: ${{ !cancelled() && steps.native-tests.outcome == 'success' && steps.websocket-probe.outcome == 'success' && steps.native-smoke.outcome == 'success' }}
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $destination = New-Item -ItemType Directory -Path windows-developer-build
          Copy-Item (Join-Path $bin.Trim() 'SpeakWindows.exe') $destination
          Get-ChildItem -Path $bin.Trim() -Directory -Filter '*.resources' |
            Copy-Item -Destination $destination -Recurse
          [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            architecture = 'x86_64'
            compiler = (swift --version) -join "`n"
            distribution = 'developer executable; not an installer'
            runtime = 'Requires the Swift 6.2.3 Windows runtime and Visual C++ runtime'
            webSocketRuntimeProbe = '${{ steps.websocket-probe.outcome }}'
          } | ConvertTo-Json | Set-Content (Join-Path $destination 'build-metadata.json') -Encoding utf8
          @"
          Just Speak to It — Windows developer build

          This is an unsigned developer executable, not an installer or a feature-complete release.
          Install the Swift 6.2.3 Windows toolchain/runtime and its Windows prerequisites:
          https://www.swift.org/install/windows/

          Development instructions and current parity limitations:
          https://github.com/crmitchelmore/justspeaktoit/blob/${env:GITHUB_SHA}/Docs/windows-development.md

          Run SpeakWindows.exe normally, or pass --self-test / --ui-smoke-test.
          The smoke tests do not use a microphone or a real provider API key.
          See build-metadata.json for the exact source revision and compiler.
          "@ | Set-Content (Join-Path $destination 'README.txt') -Encoding utf8
          Get-FileHash (Join-Path $destination 'SpeakWindows.exe') -Algorithm SHA256 |
            Format-List | Out-String | Set-Content (Join-Path $destination 'SHA256.txt') -Encoding utf8

      - name: Upload developer executable
        if: ${{ !cancelled() && steps.developer-stage.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: justspeaktoit-windows-x64-developer-${{ github.sha }}
          path: windows-developer-build/
          if-no-files-found: error
          retention-days: 14

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-test-evidence-${{ github.sha }}
          path: |
            windows-tests.xml
            windows-native-tests.log
            windows-self-test*.log
            windows-ui-smoke*.log
            windows-ui-smoke.bmp
            windows-ui-smoke.bmp.voice-sources.bmp
            windows-ui-smoke.bmp.file-source.bmp
            windows-ui-smoke.bmp.voice-controls.bmp
            windows-ui-smoke.bmp.voice-usage.bmp
            windows-ui-smoke.bmp.voice-discovery.bmp
            windows-websocket-tests.xml
            windows-websocket-*.log
            windows-local-transcription.log
          if-no-files-found: ignore
          retention-days: 14

  portable-macos:
    name: Portable Swift on macOS
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SPEAK_PORTABLE_CORE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify portable source boundary
        run: python3 scripts/verify-portable-core-boundary.py
      - name: Verify additional provider loopback peer contracts
        run: python3 -B -m unittest discover -s scripts/tests -p test_additional_provider_loopback.py
      - name: Test portable graph with Xcode Apple Swift
        run: |
          xcrun swift --version
          xcrun swift test --configuration release --jobs 4
      - name: Probe additional shared providers over native Apple WebSockets
        shell: bash
        run: |
          set -euo pipefail
          ready="$RUNNER_TEMP/additional-provider-peer.json"
          python3 scripts/websocket-loopback-probe.py --ready-file "$ready" --max-seconds 60 \
            > "$RUNNER_TEMP/additional-provider-peer.log" 2>&1 &
          peer=$!
          trap 'kill "$peer" 2>/dev/null || true; cat "$RUNNER_TEMP/additional-provider-peer.log"' EXIT
          for attempt in $(seq 1 100); do
            if [ -s "$ready" ]; then break; fi
            kill -0 "$peer"
            sleep 0.05
          done
          export JSTI_WEBSOCKET_PROBE_PORT
          JSTI_WEBSOCKET_PROBE_PORT=$(python3 -c \
            'import json,sys; p=json.load(open(sys.argv[1])); assert p["host"]=="127.0.0.1"; print(p["port"])' "$ready")
          xcrun swift test --configuration release --skip-build --filter AdditionalProviderLoopbackTests
      - name: Preserve Apple dependency lockfile
        if: always()
        # The dependency-free graph removes pins it does not need. It must not
        # change the Apple graph's checked-in dependencies.
        run: git restore --source=HEAD -- Package.resolved

  portable-linux:
    name: Portable Swift on Linux (Swift 6.2.3)
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.3-jammy@sha256:33c73fc133767cdaafde26f0f9967c96ab25ff77618b7df1eabf46140bf2b6e6
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify portable source boundary
        run: python3 scripts/verify-portable-core-boundary.py
      - name: Test portable graph with native Linux Swift
        run: |
          swift --version
          swift test --configuration release --jobs 4
