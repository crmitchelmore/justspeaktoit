# Owner manual QA catalogue: the single source for https://justspeaktoit.com/qa
# and the Manual QA results workflow. See Docs/manual-qa.md for the format.
# Strict YAML subset: 2-space indents, double-quoted strings, integers, booleans.
version: 1
updated: "2026-11-13"
sessions:
  - id: "mac"
    device: "Mac"
    title: "Mac"
    setup:
      - "Unlocked Mac with Just Speak to It (mac-v3.2.0 or Alpha build 45 or later) and Accessibility granted."
      - "Settings \u203a General: Accessibility Insertion = Insert at Cursor; Stream text while dictating (experimental) = on; post-processing off."
      - "A Streaming model with a working key is selected. Use made-up sentences only."
    items:
      - id: "mac-model-chooser-empty-results"
        issues:
          - 1581
        title: "Model chooser: empty results have no stale selection or stray lines"
        minutes: 2
        core: false
        build: "Just Speak to It for Mac, an Alpha build that includes the #1581 model chooser fix"
        steps:
          - "Open Settings, Transcription, Remote, Streaming and open the model chooser."
          - "Choose a tag filter that excludes every model, or search for a made-up model name."
          - "Clear filters, then search for the full name of the currently selected model."
          - "Clear filters again and inspect the bottom of the model list above Custom."
        expected: "No matches shows only the empty-results message and available footer actions, with no Current selection section. Searching for the selected model shows it once without an empty-results message. There are no empty rows or stacked separator lines above Custom, and filtering never changes the selected model."
        final_gate: true
      - id: "mac-page-header-text"
        issues:
          - 1616
        title: "Page headers: white text, matching fonts and tidy truncation on every page"
        minutes: 3
        core: false
        build: "Just Speak to It for Mac, an Alpha build that includes the #1616 page header fix"
        steps:
          - "With the system in Light appearance and Settings \u203a Appearance density on Regular, open Dashboard, History, Voice Output, Corrections, Troubleshooting and Settings in turn."
          - "Narrow the window to its minimum width and look at each header again."
          - "Switch density to Compact and repeat, then switch the system to Dark appearance and repeat once more."
        expected: "Every header title, subtitle, chip, badge, search field and toggle is white or soft white on its coloured header, never black or grey. Titles share one size and weight, and long titles or chip values shrink slightly then end in an ellipsis with the full text on hover, without overlapping."
        final_gate: true
      - id: "mac-notes-streaming"
        issues:
          - 664
        title: "Notes: live text, corrections and selection replacement are exact"
        minutes: 5
        core: true
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        steps:
          - "In a new Notes note type: caf\u00e9 \u2615 the quick fox, the quick fox \u2014 then on the next line: REPLACE_ME and REPLACE_ME"
          - "Put the cursor on a new third line, dictate slowly \"Testing Notes, one two three, actually four\" and stop."
          - "Double-click the first REPLACE_ME, dictate \"Selection works\" and stop."
          - "Open History in Just Speak to It and compare the two newest entries with the note."
        expected: "Words appear while you speak and revised words are replaced, not duplicated. Line 3 matches History exactly; only the first REPLACE_ME became \"Selection works\"; caf\u00e9 \u2615 and both \"the quick fox\" are unchanged."
        final_gate: true
      - id: "mac-notes-safety"
        issues:
          - 664
        title: "Notes: typing elsewhere or switching notes mid-dictation is safe"
        minutes: 4
        core: true
        build: "Just Speak to It for Mac, an Alpha build that includes the #664 note-switch fix"
        steps:
          - "At the end of the same note start dictating a long sentence."
          - "After the first words appear, click the first line, type XX, keep talking, then stop."
          - "Start dictating again at the end of the note; after the first words appear, click into a different, empty note, keep talking, then stop."
          - "Check both notes."
        expected: "XX is kept and nothing outside the dictated text changed or duplicated (streaming may pause). After the switch, streaming pauses: the second note stays empty, the first note keeps only the words dictated before you switched, and a notice says the full transcript is on the clipboard. This holds for every \u201cIf you switch apps\u201d setting, because both notes are in the same app."
        final_gate: true
      - id: "mac-escape-removes-streamed-text"
        issues:
          - 1561
        title: "TextEdit: Escape removes streamed text, but never your edits"
        minutes: 3
        core: true
        build: "Just Speak to It for Mac, an Alpha build that includes the #1561 cancel rollback"
        steps:
          - "Settings \u203a Keyboard: check Keep audio when a recording is cancelled is on (otherwise cancelled recordings leave no History entry) and Cancel recording with Escape is on. In TextEdit, create a plain-text document, save it (rollback only acts on a saved document it can identify), and type: Start here "
          - "With the caret after \"Start here \", dictate \"This cancelled recording should not be inserted\" and press Escape after the words appear."
          - "Dictate again; after the first words appear, type XX at the very end of the document, keep talking, then press Escape."
          - "Check the document and the two newest History entries."
        expected: "After the first Escape the document reads exactly \"Start here \" with the caret after it. After the second, the streamed words and XX are both left in place, and that History entry has an output note saying the streamed text was left because the document changed."
        final_gate: true
      - id: "mac-one-shot-baselines"
        issues:
          - 664
        title: "Setting off and a non-allowlisted app both get one paste at the end"
        minutes: 4
        core: true
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        steps:
          - "Settings \u203a General: turn Stream text while dictating (experimental) off; in Notes dictate \"Baseline off\" and stop."
          - "Turn the setting back on."
          - "Open Stickies, click into a new sticky, dictate \"Stickies one paste\" and stop."
          - "Compare both with History."
        expected: "In both cases nothing appears while you speak and the text arrives exactly once after Stop, matching History."
        final_gate: true
      - id: "mac-notes-history-upgrade"
        issues:
          - 1118
        title: "Mac: existing History intact after updating"
        minutes: 3
        core: false
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        steps:
          - "Before updating the Mac app, note the text of your newest two History items."
          - "Update to the build under test and open History."
          - "Make one short recording, quit and reopen the app, then open History."
        expected: "Older items are unchanged and the new recording survives the relaunch."
        final_gate: false
      - id: "owner-flatpak-repo-key"
        issues:
          - 1219
        title: "Linux: add the Flatpak signing key so updates publish"
        minutes: 10
        core: false
        build: "GitHub settings and a trusted terminal; current main with the signed Flatpak repository workflow"
        prerequisites:
          - "Replaces the Flathub submission: Flathub bars agent-written submissions, so Linux now updates from the project's own signed repository"
          - "Steps and exact commands: https://github.com/crmitchelmore/justspeaktoit/blob/main/Docs/linux-packaging.md (Owner setup)"
        steps:
          - "On a trusted machine, create the ed25519 signing key with the commands in the guide and keep an offline backup."
          - "Create the flatpak-repo environment limited to main and save the private key there as FLATPAK_GPG_PRIVATE_KEY."
          - "Run the Linux Flatpak repository workflow on main with the newest alpha-build tag that has a Linux bundle."
          - "Open https://justspeaktoit.com/linux/flatpak in a browser."
        expected: "The workflow run is green and deploys, and the link downloads a .flatpakref file (not the .flatpak bundle). An agent then confirms an install and a flatpak update on a hosted Linux runner and closes #1219."
        final_gate: false
      - id: "mac-issue-report-preview"
        issues:
          - 1284
        title: "History: Review Issue Report shows only safe details"
        minutes: 4
        core: false
        build: "Just Speak to It for Mac, Alpha build 64 or later"
        steps:
          - "Open History and choose Review Issue Report\u2026 on any recording (a failed one if you have it)."
          - "Read the draft and the JSON attachment, then turn Include diagnostics off and on again."
          - "Click Save JSON\u2026 and save to the Desktop, then click Copy Draft and paste into a new TextEdit document."
          - "Click Open GitHub, check the issue page is prefilled with the draft, and close the tab without submitting."
          - "Delete the saved file and the TextEdit document."
          - "Start a recording and press Escape to cancel it. In History, open that cancelled recording and click Review Issue Report\u2026, then press Escape."
          - "On the same cancelled recording click Review Before Copying\u2026, check the draft is shown, then click Cancel."
        expected: "The draft and JSON name the model, mode and settings of that recording but contain no transcript text, prompt, file path, API key, device or app name. With Include diagnostics off, the JSON keeps only its version and removal notes, with no model or settings. The saved file, copied draft and GitHub page match the preview, and nothing was posted. For the cancelled recording, both buttons open a full review window (never an empty white box), Escape and Cancel close it, and the app stays responsive without a force quit."
        final_gate: true
      - id: "mac-speechanalyzer-latency"
        issues:
          - 614
        title: "SpeechTranscriber shows first words no later than Apple Dictation"
        minutes: 5
        core: false
        build: "Just Speak to It for Mac, an Alpha build that includes PR #1507 (SpeechTranscriber starts alongside the microphone), macOS 26 or later"
        steps:
          - "Settings \u203a Transcription \u203a Local \u203a Streaming: choose Apple SpeechTranscriber (On-device)."
          - "In TextEdit, read the same short paragraph three times, one recording each. About 6 seconds per recording is enough."
          - "Choose Apple Dictation and read the same paragraph three more times."
          - "Mark this Pass. An agent then compares first-words latency for the two models using only the numeric latency fields in History."
        expected: "Six recordings exist, three per model. The agent posts both first-words p50 values on #614 and closes it if SpeechTranscriber\u2019s is the same or lower and iphone-hands-free has passed."
        final_gate: false
      - id: "mac-hands-free"
        issues:
          - 1553
          - 614
        title: "Mac hands-free: arms, starts on speech, nothing captured in silence"
        minutes: 4
        core: false
        build: "Just Speak to It for Mac, an Alpha build that includes the #1553 voice-activity gate, macOS 26 or later (ideally macOS 27)"
        steps:
          - "Settings \u203a Transcription \u203a Local \u203a Streaming: choose Apple SpeechTranscriber (On-device). Turn Hands-Free Dictation on."
          - "Click into a new TextEdit document and arm with the hotkey; wait for the armed HUD."
          - "Stay silent for 30 seconds, tap the desk once, then say \"Hands free works on this Mac\" and stay silent until it finishes."
          - "Disarm and open History."
        expected: "Arming shows armed (never \u201ccouldn\u2019t access the microphone\u201d). Silence and the tap start nothing; speech starts recording within about a second, the sentence lands in TextEdit, and it returns to armed after silence. History has exactly one new item."
        final_gate: false
      - id: "mac-start-latency-sample"
        issues:
          - 611
        title: "Enough everyday recordings to re-measure start latency"
        minutes: 1
        core: false
        build: "Just Speak to It for Mac, an Alpha build that includes the #611 key-down permission check"
        steps:
          - "Keep the Alpha app updated and dictate with the hotkey as usual."
          - "Once the Alpha has about 50 hotkey recordings made on such a build, mark this Pass."
          - "An agent then reads only the numeric latency fields in History and posts the result on #611."
        expected: "About 50 or more recent hotkey recordings exist. The agent reports hotkey-to-capture p50 and p95; #611 closes if p50 is under 100 ms and the #664 streaming checks have passed."
        final_gate: false
      - id: "mac-double-tap-start-latency"
        issues:
          - 611
        title: "Double-tap start is quick, including after a pause"
        minutes: 10
        core: false
        build: "Just Speak to It for Mac, Alpha build 108 or later (includes #1567, the first-tap input warm-up)"
        steps:
          - "Settings \u203a Keyboard: allow double tap. Leave Warm microphone on key press at its default."
          - "In TextEdit, make 20 double-tap recordings of a short made-up sentence, back to back."
          - "Make 6 more double-tap recordings, waiting about 30 seconds before each one."
          - "Tap the hotkey once (no second tap) three times, and check the menu-bar microphone indicator does not stay on."
          - "Mark this Pass. An agent then reads only the numeric latency fields and the Start timeline in History and posts p50 and p95 on #611."
        expected: "No recording, sound or History entry comes from a single tap. The agent reports double-tap hotkey-to-capture p50 and p95, back to back and after a pause, and whether each start shows \"live input prepared from key-down\". #611 closes if back-to-back p50 is under 100 ms."
        final_gate: false
      - id: "mac-paid-new-providers"
        issues:
          - 1210
          - 1051
        title: "New providers and Azure with newly opened accounts"
        minutes: 20
        core: false
        build: "Just Speak to It for Mac, Alpha build 61 or later"
        prerequisites:
          - "Spend cap (owner decision, #1386): up to $40 total, at most $10 per provider, no auto top-ups; new accounts allowed"
          - "An Azure Speech resource in a region that serves MAI models"
          - "Steps and route list: Docs/azure-speech.md and #1210"
        steps:
          - "Save keys for Pulse, Reson8, StepAudio, Alibaba (international workspace), AssemblyAI and Azure Speech."
          - "For each batch model of those providers, dictate \u201cnew provider batch\u201d into TextEdit and stop."
          - "For each streaming model (Reson8, Alibaba Fun-ASR realtime, AssemblyAI Universal-3.6 Pro, Azure Speech, Azure MAI), dictate \u201cnew provider live\u201d and stop."
          - "For Pulse, choose a non-English language and try once."
          - "Open History."
        expected: "Every route transcribes the phrase once, streaming routes show words while you speak (Azure MAI Transcribe (Turn-based) shows each turn when you pause), and History names the model with its cost. Pulse refuses the non-English run before sending audio. Note any route that is unavailable to your account."
        final_gate: true
      - id: "owner-stepfun-international-region"
        issues:
          - 1210
        title: "StepFun International key region"
        minutes: 5
        core: false
        build: "Just Speak to It for Mac, first Alpha with the StepFun region setting"
        prerequisites:
          - "A StepFun API key from platform.stepfun.ai (International)"
        steps:
          - "Settings \u203a API Keys: set StepFun region for new keys to International, then save the StepFun key."
          - "Choose StepFun StepAudio 3 ASR Max, dictate \u201cstep fun international\u201d into TextEdit and stop."
          - "Set the region to China, save the same key again, and dictate once more."
        expected: "The International run transcribes the phrase. The China run fails with a message that StepFun rejected the key for the China region; it does not silently succeed through the International endpoint."
        final_gate: false
      - id: "owner-cloudkit-shared-container"
        issues:
          - 1119
        title: "Check the shared iCloud container on the iPhone App IDs and its schema"
        minutes: 10
        core: false
        build: "Apple Developer portal and CloudKit Console; current main with the #1119 container PR"
        prerequisites:
          - "Steps: https://github.com/crmitchelmore/justspeaktoit/blob/main/Docs/cloudkit-shared-container.md"
        steps:
          - "Identifiers \u203a com.justspeaktoit.ios \u203a iCloud \u203a Configure: iCloud.com.justspeaktoit and iCloud.com.justspeaktoit.ios are both ticked; com.justspeaktoit.ios.alpha has iCloud.com.justspeaktoit.alpha and iCloud.com.justspeaktoit.ios.alpha."
