        build: "The signed iOS candidate containing the Apple submission safeguards"
        prerequisites:
          - "Use backed-up test devices or spare iPhone and iPad installations; do not erase personal History."
          - "Use fictional speech and dedicated review credentials, never personal recordings or production keys."
        steps:
          - "On a fresh test installation on each device, open the app and confirm the record control is visible; rotate the iPad between portrait and landscape."
          - "Read the microphone and speech permission prompts, allow access, choose an on-device model and record a fictional sentence."
          - "Choose the review cloud provider, read its audio/text sharing disclosures, and record another fictional sentence."
          - "Start recording, lock the device briefly, unlock and stop; check the recording indicator and History."
          - "Deny microphone access on a test installation and confirm the app explains how to recover without claiming it is recording."
        expected: "Both devices expose the recording control, complete local and review-provider transcription, show recording state, stop cleanly and save one item per completed recording. Denied access is recoverable. This supplies device evidence for the historical July review findings, not App Store approval."
        final_gate: false
      - id: "ipad-transcribe-control-first-run"
        issues:
          - 1598
        title: "iPad: Transcribe is visible in every layout and works with no API key"
