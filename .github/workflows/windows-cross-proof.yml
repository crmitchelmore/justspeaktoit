name: macOS to Windows Swift Proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Package.swift
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakDesktopHost/**
      - Sources/SpeakDesktopSync/**
      - Sources/SpeakSync/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Sources/CWindowsSupport/**
      - Sources/CWindowsAutomation/**
      - Sources/SpeakAutomationKit/**
      - Sources/SpeakCLI/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakDesktopHostTests/**
      - Tests/SpeakDesktopSyncTests/**
      - Tests/SpeakSyncTests/**
      - Tests/SpeakPortableTests/**
      - Tests/SpeakWindowsPlatformTests/**
      - Tests/SpeakAutomationKitTests/**
      - Tests/SpeakTestSupport/**
      - scripts/windows-cross/**
      - scripts/windows-cloudkit/**
      - scripts/windows-bundle/**
      - scripts/windows-package/**
      - scripts/windows-local-runtime/**
      - Resources/AppIcon.iconset/**
      - .github/workflows/windows-cross-proof.yml
      - .github/workflows/windows-local-runtime.yml
  push:
    # The consolidation branch runs here until its PR exists; drop it before merging.
    branches: [main, claude/windows-linux-migration-tyshm0]
    paths:
      - Package.swift
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakDesktopHost/**
      - Sources/SpeakDesktopSync/**
      - Sources/SpeakSync/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Sources/CWindowsSupport/**
      - Sources/CWindowsAutomation/**
      - Sources/SpeakAutomationKit/**
      - Sources/SpeakCLI/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakDesktopHostTests/**
      - Tests/SpeakDesktopSyncTests/**
      - Tests/SpeakSyncTests/**
      - Tests/SpeakPortableTests/**
      - Tests/SpeakWindowsPlatformTests/**
      - Tests/SpeakAutomationKitTests/**
      - Tests/SpeakTestSupport/**
      - scripts/windows-cross/**
      - scripts/windows-cloudkit/**
      - scripts/windows-bundle/**
      - scripts/windows-package/**
      - scripts/windows-local-runtime/**
      - Resources/AppIcon.iconset/**
      - .github/workflows/windows-cross-proof.yml
      - .github/workflows/windows-local-runtime.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The pinned whisper.cpp DLLs are built with MSVC on Windows (or restored
  # from cache) and bundled beside the Mac-built executable.
  local-runtime:
    uses: ./.github/workflows/windows-local-runtime.yml

  compile:
    name: Cross-compile Swift app and tests on macOS
    needs: local-runtime
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: windows-local-runtime
          path: ${{ runner.temp }}/windows-local-runtime
      - name: Build Windows PE with private pinned prerequisites
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/foundation-proof"
          python3 scripts/windows-cross/build-foundation-proof.py \
            --cache "$RUNNER_TEMP/private-windows-cross-sdk" \
            --output "$RUNNER_TEMP/foundation-proof" 2>&1 |
            tee "$RUNNER_TEMP/foundation-proof/bootstrap.log"
      - name: Check the CloudKit Web Services build-setting writer
        shell: bash
        run: python3 -B -m unittest discover -s scripts/windows-cloudkit -p 'test_*.py'
      # The container's API token (CloudKit Console) is a build setting. Pull
      # request builds never receive it and report iCloud sync as unavailable.
      - name: Configure CloudKit Web Services for this build
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          CLOUDKIT_WEB_API_TOKEN: ${{ secrets.CLOUDKIT_WEB_API_TOKEN }}
        run: python3 -B scripts/windows-cloudkit/configure-cloudkit-web.py
      - name: Cross-build the Windows app and test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/windows-app-cross"
          python3 -B -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts/windows-cross -p test_build_windows_app.py
          python3 scripts/windows-cross/build-windows-app.py \
            --configuration release \
            --cache "$RUNNER_TEMP/private-windows-cross-sdk" \
            --output "$RUNNER_TEMP/windows-app-cross" 2>&1 |
            tee "$RUNNER_TEMP/windows-app-cross/bootstrap.log"
      - name: Assemble the self-contained runtime bundle
        shell: bash
        run: |
          set -o pipefail
          python3 -B -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts/windows-bundle -p 'test_*.py'
          mkdir -p "$RUNNER_TEMP/windows-runtime-bundle"
          python3 scripts/windows-bundle/build-windows-bundle.py \
            --app "$RUNNER_TEMP/windows-app-cross" \
            --cache "$RUNNER_TEMP/private-windows-cross-sdk" \
            --downloads "$RUNNER_TEMP/private-windows-cross-sdk/bundle-downloads" \
            --output "$RUNNER_TEMP/windows-runtime-bundle" \
            --local-runtime "$RUNNER_TEMP/windows-local-runtime" \
            --llvm-readobj "$RUNNER_TEMP/private-windows-cross-sdk/llvm-20/LLVM-20.1.8-macOS-ARM64/bin/llvm-readobj" 2>&1 |
            tee "$RUNNER_TEMP/windows-runtime-bundle/bootstrap.log"
      - name: Upload self-contained runtime bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-runtime-bundle
          path: ${{ runner.temp }}/windows-runtime-bundle/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Mac-built Windows app and tests
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-built-windows-app
          path: ${{ runner.temp }}/windows-app-cross/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload proof and build evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: foundation-windows-cross-proof
          path: ${{ runner.temp }}/foundation-proof/
          if-no-files-found: error
          retention-days: 14

  execute:
    name: Execute Mac-built app and tests on Windows
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Install pinned Windows Swift runtime
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          source: swift.org
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
          build_arch: amd64
          update-sdk-modules: false
      - uses: actions/download-artifact@v5
        with:
          name: foundation-windows-cross-proof
          path: proof
      - uses: actions/download-artifact@v5
        with:
          name: macos-built-windows-app
          path: app
      - name: Verify artifact identity and run Foundation assertions
        shell: pwsh
        run: |
          $metadata = Get-Content proof/build-metadata.json -Raw | ConvertFrom-Json
          if ($metadata.host -ne 'Darwin' -or $metadata.target -ne 'x86_64-unknown-windows-msvc') {
            throw 'Unexpected build provenance.'
          }
          if ($metadata.sourceCommit -ne $env:GITHUB_SHA) { throw 'Foundation source commit mismatch.' }
          $actual = (Get-FileHash proof/FoundationWindowsProof.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $metadata.executableSHA256) { throw 'Mac-built artifact hash mismatch.' }
          swift --version | Set-Content proof/windows-runtime.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath (Resolve-Path proof/FoundationWindowsProof.exe).Path `
            -PassThru -NoNewWindow -RedirectStandardOutput proof/windows-proof.log `
            -RedirectStandardError proof/windows-proof-errors.log
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Foundation runtime proof exceeded 30 seconds.'
          }
          Get-Content proof/windows-proof.log
          Get-Content proof/windows-proof-errors.log
          if ($process.ExitCode -ne 0) { throw "Foundation proof failed: $($process.ExitCode)" }
          if (-not (Select-String -Path proof/windows-proof.log `
            -Pattern '^JSTI_FOUNDATION_WINDOWS_CROSS_PROOF_OK:' -Quiet)) {
            throw 'Foundation assertion success marker missing.'
          }
      - name: Verify Mac-built app, portable tests and native UI
        shell: pwsh
        run: |
          $metadata = Get-Content app/app-build-metadata.json -Raw | ConvertFrom-Json
          if ($metadata.host -ne 'Darwin' -or $metadata.target -ne 'x86_64-unknown-windows-msvc') {
            throw 'Unexpected app build provenance.'
          }
          if ($metadata.sourceCommit -ne $env:GITHUB_SHA) { throw 'App source commit mismatch.' }
          if ($metadata.configuration -ne 'release' -or $metadata.appBuiltForTesting -ne $false) {
            throw 'Expected an optimised production app and separate test executable.'
          }
          foreach ($entry in $metadata.executables.PSObject.Properties) {
            $actual = (Get-FileHash (Join-Path app $entry.Name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "Mac-built artifact hash mismatch: $($entry.Name)" }
          }
          # SwiftPM normally supplies these when launching tests. These tests
          # were built on the Mac, so add the installed Windows test DLL paths.
          $developer = Split-Path (Split-Path $env:SDKROOT -Parent) -Parent
          foreach ($library in @('XCTest', 'Testing')) {
            $directory = Join-Path $developer "Library/$library-6.2.3/usr/bin64"
            if (-not (Test-Path $directory)) { throw "Missing installed test runtime: $library" }
            $env:Path = "$directory;$env:Path"
          }
          function Invoke-CrossBuilt([string] $name, [string] $arguments, [string] $label, [int] $seconds) {
            $parameters = @{
              FilePath = (Resolve-Path "app/$name").Path
              PassThru = $true
              NoNewWindow = $true
              RedirectStandardOutput = "app/windows-$label.log"
              RedirectStandardError = "app/windows-$label-errors.log"
            }
            if ($arguments) { $parameters.ArgumentList = $arguments }
            $process = Start-Process @parameters
            if (-not $process.WaitForExit($seconds * 1000)) {
              $process.Kill()
              throw "$label exceeded $seconds seconds."
            }
            Get-Content "app/windows-$label.log"
            Get-Content "app/windows-$label-errors.log"
            if ($process.ExitCode -ne 0) { throw "$label failed: $($process.ExitCode)" }
          }
          # Independent checks all produce evidence; any failure still fails
          # this gate, after source/hash validation above has succeeded.
          $failures = [System.Collections.Generic.List[string]]::new()
          try {
            Invoke-CrossBuilt 'SpeakAppPackageTests.exe' '' 'tests' 180
            if (-not (Select-String -Path app/windows-tests.log -Pattern 'Executed [1-9][0-9]* tests' -Quiet)) {
              throw 'No XCTest execution evidence found.'
            }
          } catch { $failures.Add($_.Exception.Message) }
          try {
            Invoke-CrossBuilt 'SpeakWindows.exe' '--self-test' 'native' 90
            if (-not (Select-String -Path app/windows-native.log -Pattern 'self-test passed' -Quiet)) {
              throw 'Native self-test success marker missing.'
            }
          } catch { $failures.Add($_.Exception.Message) }
          try {
            $env:JSTI_UI_SNAPSHOT_PATH = Join-Path (Resolve-Path app).Path 'windows-ui-smoke.bmp'
            Invoke-CrossBuilt 'SpeakWindows.exe' '--ui-smoke-test' 'ui' 30
            if (-not (Select-String -Path app/windows-ui.log -Pattern 'Native window creation and shutdown passed' -Quiet)) {
              throw 'Native UI success marker missing.'
            }
            if (-not (Test-Path $env:JSTI_UI_SNAPSHOT_PATH)) { throw 'Native client snapshot missing.' }
          } catch { $failures.Add($_.Exception.Message) }
          if ($failures.Count) { throw ($failures -join '; ') }
      - name: Upload Mac-built app execution evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-built-windows-runtime-evidence
          path: |
            app/windows-*.log
            app/windows-ui-smoke.bmp
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows execution evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: foundation-windows-runtime-evidence
          path: proof/windows-*.log
          if-no-files-found: warn
          retention-days: 14

  bundle-execute:
    name: Run the self-contained bundle on Windows without Swift
    needs: [local-runtime, compile]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: windows-runtime-bundle
          path: bundle
      # Only the JFK sample is used from the runtime artifact: the DLLs under
      # test are the bundled copies.
      - uses: actions/download-artifact@v5
        with:
          name: windows-local-runtime
          path: local-runtime
      - name: Restore pinned local models
        uses: actions/cache@v6
        with:
          path: local-models
          key: local-models-${{ hashFiles('Sources/SpeakCore/WhisperCppModels.swift') }}
      # No Swift setup action runs in this job. The script additionally isolates
      # PATH to the Windows system directories, proves the executable cannot
      # start without the bundled DLLs, and records sampled loaded modules's path.
      - name: Verify hashes, isolate PATH and run the bundled production app
        shell: pwsh
        run: |
          ./scripts/windows-bundle/test-bundle-environment.ps1
          $pins = Get-Content scripts/windows-local-runtime/dependencies.json -Raw | ConvertFrom-Json
          ./scripts/windows-bundle/verify-windows-bundle.ps1 -BundleDirectory bundle `
            -Workspace (Join-Path $env:RUNNER_TEMP 'bundle-run') -ExpectedCommit $env:GITHUB_SHA `
            -LocalTranscriptionAudio local-runtime/fixtures/jfk.wav `
            -LocalTranscriptionPhrase $pins.whisperCpp.fixture.expectedPhrase `
            -LocalModelDirectory (Join-Path $env:GITHUB_WORKSPACE 'local-models')
      - name: Upload bundle execution evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-runtime-bundle-execution-evidence
          path: ${{ runner.temp }}/bundle-run/evidence/
          if-no-files-found: warn
          retention-days: 14

  package-lifecycle:
    name: Pack, install, upgrade and uninstall the developer MSIX on Windows
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      # Developer package versions for this run only. Windows has no Alpha or
      # Stable surface in the release-train manifest, so no release version exists.
      BASE_VERSION: 0.0.${{ github.run_number }}.1
      UPGRADE_VERSION: 0.0.${{ github.run_number }}.2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: windows-runtime-bundle
          path: bundle
      - name: Test the packaging tools and build both verified layouts
        shell: pwsh
        run: |
          python --version
          python -B -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts/windows-package -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-package/test-lifecycle-ownership.ps1
          foreach ($kind in 'base', 'upgrade') {
            $version = if ($kind -eq 'base') { $env:BASE_VERSION } else { $env:UPGRADE_VERSION }
            python -B scripts/windows-package/build-windows-package-layout.py --bundle bundle `
              --expected-commit $env:GITHUB_SHA --version $version --output (Join-Path $env:RUNNER_TEMP "package-$kind")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Pack both layouts with the pinned Windows SDK MakeAppx
        id: pack
        shell: powershell
        run: |
          foreach ($kind in 'base', 'upgrade') {
            $root = Join-Path $env:RUNNER_TEMP "package-$kind"
            $version = if ($kind -eq 'base') { $env:BASE_VERSION } else { $env:UPGRADE_VERSION }
            ./scripts/windows-package/pack-windows-package.ps1 -Layout (Join-Path $root 'layout') `
              -Output (Join-Path $root "JustSpeakToIt-Developer_${version}_x64_unsigned.msix") `
              -ToolCache (Join-Path $env:RUNNER_TEMP 'packaging-tools')
          }
      - name: Upload the unsigned developer package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-developer-msix-unsigned
          path: |
            ${{ runner.temp }}/package-upgrade/*.msix
            ${{ runner.temp }}/package-upgrade/*.json
            ${{ runner.temp }}/package-upgrade/*.log
          if-no-files-found: error
          retention-days: 14
      # The ephemeral test certificates are created, trusted and removed inside
      # these steps on this disposable runner; they are never exported or uploaded.
      - name: Install, launch, refuse failed upgrades, upgrade and uninstall
        shell: powershell
        run: |
          ./scripts/windows-package/test-lifecycle-ownership.ps1
          $base = Join-Path $env:RUNNER_TEMP 'package-base'
          $upgrade = Join-Path $env:RUNNER_TEMP 'package-upgrade'
          ./scripts/windows-package/test-windows-package-lifecycle.ps1 `
            -BaseLayout (Join-Path $base 'layout') `
            -BasePackage (Join-Path $base "JustSpeakToIt-Developer_$($env:BASE_VERSION)_x64_unsigned.msix") `
            -UpgradeLayout (Join-Path $upgrade 'layout') `
            -UpgradePackage (Join-Path $upgrade "JustSpeakToIt-Developer_$($env:UPGRADE_VERSION)_x64_unsigned.msix") `
            -ToolCache (Join-Path $env:RUNNER_TEMP 'packaging-tools') `
            -Workspace (Join-Path $env:RUNNER_TEMP 'package-lifecycle')
      # Negative control for the lifecycle test itself: with an existing
      # installation, running app and user data present, it must refuse
      # admission and change nothing.
      - name: Refuse a machine with an existing installation and change nothing
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        shell: powershell
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'package-base'
          $upgrade = Join-Path $env:RUNNER_TEMP 'package-upgrade'
          ./scripts/windows-package/test-windows-package-admission.ps1 `
            -BaseLayout (Join-Path $base 'layout') `
            -BasePackage (Join-Path $base "JustSpeakToIt-Developer_$($env:BASE_VERSION)_x64_unsigned.msix") `
            -UpgradeLayout (Join-Path $upgrade 'layout') `
            -UpgradePackage (Join-Path $upgrade "JustSpeakToIt-Developer_$($env:UPGRADE_VERSION)_x64_unsigned.msix") `
            -ToolCache (Join-Path $env:RUNNER_TEMP 'packaging-tools') `
            -Workspace (Join-Path $env:RUNNER_TEMP 'package-admission-control')
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-developer-msix-lifecycle-evidence
          path: |
            ${{ runner.temp }}/package-lifecycle/evidence/
            ${{ runner.temp }}/package-admission-control/evidence/
            ${{ runner.temp }}/package-admission-control/refused-lifecycle/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Report the signing route
        shell: pwsh
        env:
          SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
        run: |
          if ($env:SIGNING_ACCOUNT) {
            Write-Host 'Azure Artifact Signing variables are set: the sign job signs a copy of this package on pushes to main and manual runs.'
          } else {
            Write-Host 'Azure Artifact Signing is not configured; this run publishes only the unsigned developer MSIX (windows-developer-msix-unsigned).'
          }

  # Signs a separately built layout whose publisher is the certificate subject
  # from WINDOWS_MSIX_PUBLISHER. Runs only in the protected `windows-signing`
  # environment, never for pull requests, and does nothing but log when the
  # signing secrets and variables are absent. No key, certificate or client
  # secret exists in the repository or on the runner: GitHub OIDC signs in to
  # Entra ID and the key stays in Artifact Signing's HSMs.
  sign:
    name: Sign the developer MSIX with Azure Artifact Signing
    needs: compile
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-2022
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      SIGNED_VERSION: 0.0.${{ github.run_number }}.3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the signing configuration
        id: config
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_CLIENT_ID: ${{ secrets.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          AZURE_ARTIFACT_SIGNING_TENANT_ID: ${{ secrets.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID: ${{ secrets.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          WINDOWS_MSIX_PUBLISHER: ${{ vars.WINDOWS_MSIX_PUBLISHER }}
        run: |
          python -B scripts/windows-package/signing_configuration.py --github-output $env:GITHUB_OUTPUT `
            --metadata (Join-Path $env:RUNNER_TEMP 'artifact-signing-metadata.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign in to Azure with GitHub OIDC
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@v5
        if: ${{ steps.config.outputs.enabled == 'true' }}
        with:
          name: windows-runtime-bundle
          path: bundle
      - name: Build, pack and sign a layout for the certificate subject
        if: ${{ steps.config.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          WINDOWS_MSIX_PUBLISHER: ${{ steps.config.outputs.publisher }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'package-signed'
          python -B scripts/windows-package/build-windows-package-layout.py --bundle bundle `
            --expected-commit $env:GITHUB_SHA --version $env:SIGNED_VERSION --publisher $env:WINDOWS_MSIX_PUBLISHER `
            --output $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unsigned = Join-Path $root "JustSpeakToIt-Developer_$($env:SIGNED_VERSION)_x64_unsigned.msix"
          ./scripts/windows-package/pack-windows-package.ps1 -Layout (Join-Path $root 'layout') -Output $unsigned `
            -ToolCache (Join-Path $env:RUNNER_TEMP 'packaging-tools')
          ./scripts/windows-package/sign-windows-package-artifact-signing.ps1 -Package $unsigned `
            -Output (Join-Path $root "JustSpeakToIt-Developer_$($env:SIGNED_VERSION)_x64.msix") `
            -Layout (Join-Path $root 'layout') -Metadata (Join-Path $env:RUNNER_TEMP 'artifact-signing-metadata.json') `
            -ToolCache (Join-Path $env:RUNNER_TEMP 'packaging-tools')
      - name: Upload the signed developer package
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-developer-msix-signed
          path: |
            ${{ runner.temp }}/package-signed/*_x64.msix
            ${{ runner.temp }}/package-signed/*.json
            ${{ runner.temp }}/package-signed/*.log
          if-no-files-found: error
          retention-days: 14
