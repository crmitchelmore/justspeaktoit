      - id: "android-downloaded-whisper-download"
        issues:
          - 1658
        title: "Downloaded models: Wi-Fi only by default, resume after a cancel, remove"
        minutes: 8
        core: false
        build: "Just Speak to It for Android, the signed APK from the first Alpha that includes Android downloaded Whisper models (#1658)"
        steps:
          - "Open Settings \u203a Downloaded models (or search Settings for \"whisper\"). Note the models listed and their sizes."
          - "Turn Wi-Fi off so the phone is on mobile data, leave Download over mobile data off and tap Download on Whisper Base."
          - "Turn Wi-Fi back on and tap Download again. Part-way through tap Cancel, then tap Resume; part-way through again, turn on flight mode for a few seconds, turn it off and tap Resume."
          - "When Base shows Downloaded and verified, choose it, then tap Remove on it."
          - "With TalkBack on, move through the section and download Whisper Tiny."
