          - "In Just Speak choose a batch (record then upload) transcription model, swipe home and dictate \"batch\" in Notes."
          - "If any attempt shows a message, note its exact wording."
        expected: "All four dictations insert exactly once. The keyboard never asks for microphone or Speech permission and never shows a microphone error."
