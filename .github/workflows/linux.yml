name: Linux Desktop

on:
  push:
    branches: [main, claude/linux-port]
    paths:
      - Package.swift
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakDesktopHost/**
      - Sources/SpeakDesktopSync/**
      - Sources/SpeakSync/**
      - Sources/SpeakLinux/**
      - Sources/SpeakLinuxPlatform/**
      - Sources/CLinuxSupport/**
      - Sources/CLinuxSystem/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Tests/SpeakDesktopHostTests/**
      - Tests/SpeakDesktopSyncTests/**
      - Tests/SpeakSyncTests/**
      - Tests/SpeakTestSupport/**
      - Tests/SpeakLinuxPlatformTests/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakPortableTests/**
      - scripts/linux-*
      - scripts/typecheck-windows-swift.sh
      - scripts/verify-portable-core-boundary.py
      - packaging/linux/**
      - .github/workflows/linux.yml
  pull_request:
    branches: [main]
    paths:
      - Package.swift
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakDesktopHost/**
      - Sources/SpeakDesktopSync/**
      - Sources/SpeakSync/**
      - Sources/SpeakLinux/**
      - Sources/SpeakLinuxPlatform/**
      - Sources/CLinuxSupport/**
      - Sources/CLinuxSystem/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Tests/SpeakDesktopHostTests/**
      - Tests/SpeakDesktopSyncTests/**
      - Tests/SpeakSyncTests/**
      - Tests/SpeakTestSupport/**
      - Tests/SpeakLinuxPlatformTests/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakPortableTests/**
      - scripts/linux-*
      - scripts/typecheck-windows-swift.sh
      - scripts/verify-portable-core-boundary.py
      - packaging/linux/**
      - .github/workflows/linux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-desktop:
    name: Linux desktop (GTK 4, Swift 6.2.3)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.3-noble@sha256:6dd90eb2359663a2cde8f03e9951f488b23134b3b8fce20e9dcb6cada75dd803
    timeout-minutes: 30
    env:
      SPEAK_LINUX_TARGET: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install GTK 4, libadwaita, PipeWire, keyring and X11 test tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            libgtk-4-dev libadwaita-1-dev libpulse-dev libsecret-1-dev libx11-dev libxtst-dev pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            dbus dbus-x11 gnome-keyring pipewire pipewire-pulse wireplumber pulseaudio-utils \
            xvfb openbox zenity xdotool weston python3 python3-gi gir1.2-glib-2.0 \
            fonts-cantarell adwaita-icon-theme

      - name: Verify portable source boundary
        run: python3 scripts/verify-portable-core-boundary.py

      - name: Build the Linux app
        run: |
          swift --version
          swift build --configuration release --product SpeakLinux --jobs 4

      - name: Test shared core, desktop host and Linux adapters
        run: swift test --configuration release --jobs 4

      - name: Self-test and GTK window smoke test
        env:
          JSTI_UI_SNAPSHOT_PATH: ${{ runner.temp }}/linux-window.png
        run: scripts/linux-desktop-checks.sh "$(swift build --configuration release --show-bin-path)/SpeakLinux"

      - name: GTK window smoke test on headless Wayland (Weston)
        run: scripts/linux-wayland-smoke.sh "$(swift build --configuration release --show-bin-path)/SpeakLinux"

      - name: Keyring, PipeWire capture, portal and X11 paste integration
        run: scripts/linux-integration-checks.sh "$(swift build --configuration release --show-bin-path)/SpeakLinux"

      - name: Type-check the Windows Swift targets against the shared host
        env:
          SPEAK_LINUX_TARGET: ""
        run: scripts/typecheck-windows-swift.sh --jobs 4

      - name: Upload window snapshot
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-window-snapshot
          path: ${{ runner.temp }}/linux-window.png
          if-no-files-found: ignore
