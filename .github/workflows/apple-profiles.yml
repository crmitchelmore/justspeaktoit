name: Apple App IDs and profiles

# Regenerates the iOS App Store profiles through the App Store Connect API and
# checks their entitlements (#1119); release-ios.yml fetches them the same way
# at build time. Optionally enables Sign in with Apple on the direct-download
# Mac App ID, which the Paid Access web flow uses as its primary App ID.
on:
  # TEMPORARY pre-merge proof; removed before merge.
  push:
    branches: [crmitchelmore-ios-profiles-build-time-fetch]
  workflow_dispatch:
    inputs:
      enable_mac_sign_in_with_apple:
        description: Enable Sign in with Apple (primary App ID consent) on the direct-download Mac App ID
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-profiles
  cancel-in-progress: false

env:
  APP_STORE_CONNECT_KEY_ID: S747NJ9DZY

jobs:
  ios-profiles:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        train: [alpha, stable]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Load train identifiers
        env:
          TRAIN: ${{ matrix.train }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          config = json.load(open("Sources/SpeakCore/Resources/ReleaseTrains.json"))[os.environ["TRAIN"]]
          for env, key in [("BUNDLE_ID", "iosBundleIdentifier"), ("IOS_APP_GROUP", "iosAppGroup"),
                           ("IOS_CLOUD_CONTAINER", "iosCloudContainer"), ("MAC_CLOUD_CONTAINER", "macCloudContainer")]:
              print(f"{env}={config[key]}")
          PY

      - name: Ensure and check App Store profiles
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        run: |
          export APP_STORE_CONNECT_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$APP_STORE_CONNECT_KEY_PATH"
          # Only the public certificate's serial is read; the key is never extracted.
          echo -n "$IOS_DISTRIBUTION_P12" | base64 --decode -o "$RUNNER_TEMP/dist.p12"
          SERIAL=$(openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -clcerts -nokeys -passin "pass:$IOS_DISTRIBUTION_PASSWORD" \
            | openssl x509 -noout -serial | cut -d= -f2)
          rm -f "$RUNNER_TEMP/dist.p12"
          GROUP_KEY=com.apple.security.application-groups
          ICLOUD_KEY=com.apple.developer.icloud-container-identifiers
          echo "### ${{ matrix.train }} App Store profiles" >> "$GITHUB_STEP_SUMMARY"
          check() {
            local bundle="$1" expected_containers="$2"
            shift 2
            local output="$RUNNER_TEMP/$bundle.mobileprovision"
            ruby scripts/ensure-ios-app-store-profile.rb --bundle-id "$bundle" --certificate-serial "$SERIAL" \
              --output "$output" --require "$GROUP_KEY=$IOS_APP_GROUP" "$@"
            security cms -D -i "$output" | python3 -c '
          import plistlib, sys
          bundle, group, expected = sys.argv[1], sys.argv[2], [c for c in sys.argv[3].split(",") if c]
          profile = plistlib.load(sys.stdin.buffer)
          e = profile["Entitlements"]
          containers = e.get("com.apple.developer.icloud-container-identifiers", [])
          groups = e.get("com.apple.security.application-groups", [])
          print("- {} ({}): containers {}; groups {}; expires {:%Y-%m-%d}".format(bundle, profile["Name"],
              ", ".join(containers) or "none", ", ".join(groups) or "none", profile["ExpirationDate"]))
          assert e["application-identifier"].split(".", 1)[1] == bundle, "wrong App ID"
          assert groups == [group], "wrong App Group"
          assert sorted(containers) == sorted(expected), "wrong iCloud containers"
          ' "$bundle" "$IOS_APP_GROUP" "$expected_containers" | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f "$output"
          }
          check "$BUNDLE_ID" "$IOS_CLOUD_CONTAINER,$MAC_CLOUD_CONTAINER" \
            --require "$ICLOUD_KEY=$IOS_CLOUD_CONTAINER" --require "$ICLOUD_KEY=$MAC_CLOUD_CONTAINER"
          check "$BUNDLE_ID.JustSpeakToItWidgetExtension" ""
          check "$BUNDLE_ID.keyboard" ""
          rm -f "$APP_STORE_CONNECT_KEY_PATH"

  mac-sign-in-with-apple:
    if: inputs.enable_mac_sign_in_with_apple || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Enable Sign in with Apple on the Mac App ID
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export APP_STORE_CONNECT_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$APP_STORE_CONNECT_KEY_PATH"
          BUNDLE_ID=$(python3 -c 'import json; print(json.load(open("Sources/SpeakCore/Resources/ReleaseTrains.json"))["stable"]["directMacBundleIdentifier"])')
          export BUNDLE_ID
          ruby scripts/enable-sign-in-with-apple.rb | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$APP_STORE_CONNECT_KEY_PATH"
