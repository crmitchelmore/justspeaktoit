          - "With TalkBack on, move through the new region, endpoint and workspace fields and check each is read with its name."
          - "Choose Cloud, pick Azure Fast Transcription (or an Azure MAI model), an Alibaba model or StepFun StepAudio 3 ASR Max, record \"regional providers check one two three\" for about ten seconds and stop."
          - "For Azure, paste the HTTPS endpoint from the resource's Keys and Endpoint page, tap Save endpoint and record again; then clear it."
          - "Save a StepFun key under the other region, or an Alibaba key with Fun-ASR in a region other than Beijing or Singapore, and record once more."
        expected: "Each recording returns the spoken words and History names the chosen model. Azure works with the region alone and with the saved endpoint. A key saved under the wrong region, or Fun-ASR outside Beijing or Singapore, fails with a key error for that provider and never succeeds silently."
        final_gate: false
      - id: "android-send-to-mac"
        issues:
          - 1640
        title: "Send to Mac: pair the Android phone, send a History item, forget the Mac"
        minutes: 6
        core: false
        build: "Just Speak to It for Android, the signed APK from the first Alpha that includes the Android Send to Mac sender, and the Stable Mac app from justspeaktoit.com on the same Wi-Fi"
        steps:
          - "On the Mac open Settings \u203a General \u203a Send to Mac, turn it on and note the pairing code. Click into a scratch note on the Mac."
          - "On the phone open Settings \u203a Send to Mac. Wait for Pair with <your Mac>, tap it, enter the code and tap Pair."
          - "Open History and tap Send to Mac on an entry. Then close and reopen the app and send another entry."
          - "On the Mac tap Regenerate Code, then send another History item from the phone."
          - "In Settings tap Forget This Mac and confirm, then open History. Search Settings for \"send to mac\"."
          - "With TalkBack on, pair again and repeat one send, listening to the code field, the Pair button and the result."
        expected: "The Mac appears under Send to Mac within a few seconds and pairing shows Paired Mac with its name. Each send shows Sent to <your Mac> and the text is pasted once at the Mac's cursor, including after reopening the app. After regenerating the code the send fails with the Mac's message asking you to pair again, and the phone never re-pairs on its own. After forgetting, History no longer offers Send to Mac. Search finds Send to Mac and opens its section. TalkBack names the code field and buttons and announces pairing, sent and failed results."
        final_gate: false
      - id: "android-read-aloud-voices"
        issues:
          - 1631
        title: "Read aloud: phone and cloud voices, pause and resume, interruptions and failures"
        minutes: 10
        core: false
        build: "Just Speak to It for Android, the first Alpha APK that includes read-aloud voice choice for #1631"
        prerequisites:
          - "A saved key for one cloud voice provider, for example ElevenLabs, Deepgram or Groq, and no saved key for another such as Cartesia. Use made-up sentences only."
        steps:
          - "Dictate a few sentences and tap Read aloud on the finished transcript. Tap Pause reading, then Resume reading, then Stop reading."
          - "Settings: open Read aloud voice, pick a different phone voice and read the transcript again."
          - "Pick a cloud voice for the provider whose key is saved, read the transcript, and while it plays start a voice note or a call in another app, then end it."
          - "Pick a cloud voice for the provider with no saved key and tap Read aloud."
          - "Open History and tap Read aloud on an entry, then tap Play recording on another entry while it reads."
          - "With TalkBack on, open the voice picker and move through it, then read aloud once, listening to the buttons and the status line."
        expected: "Each voice reads the text in that voice, and pause, resume and stop act at once. The other app's audio pauses the reading, and it resumes when that audio ends; a call stops it. The missing key shows that provider's key message and nothing is read in another voice. History reads its entry, and playing a recording stops the reading. Search Settings for \"voice\" and it opens Read aloud voice. TalkBack names each voice with its provider, says when a key is needed and announces Reading aloud and Reading paused."
        final_gate: false
