name: CI

# Note: macOS runners require either:
# - Public repository (free)
# - GitHub Team/Enterprise plan (paid)
# - Self-hosted runners

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    # The aggregate required-macos job owns the required branch-protection name.
    name: Build & Test (macOS Debug)
    # Route only the explicitly reviewed revision to the native pool.
    # Both Macs must also admit this revision locally before the variable is set.
    runs-on: ${{ fromJSON(((github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.JSTI_NATIVE_APPROVED_SHA == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.JSTI_NATIVE_APPROVED_SHA == github.event.pull_request.head.sha)) && '["jsti-macos-build","macOS"]' || '["macos-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Swift build state embeds absolute paths. Scope both exact and fallback
      # keys to the architecture, stable host identity and checkout workspace.
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-

      - name: Build
        run: make build

      - name: Verify brand asset sizes and appearance variants
        run: node --test scripts/tests/brand-assets.test.mjs

      - name: Check Package.resolved drift
        # Resolving the app/test graph must reproduce the checked-in pins;
        # tooling pins live separately in Tooling/Package.resolved (issue #677).
        run: git diff --exit-code Package.resolved

      - name: Test (Debug)
        run: python3 scripts/with-test-keychain.py swift test --enable-code-coverage

      # Snapshot mismatches write the freshly rendered PNG to the process
      # temporary directory. Publishing it is the only way to inspect a CI-only
      # rendering difference, since the runner is discarded after the job.
      - name: Collect snapshot failures
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot-failures"
          find "${TMPDIR:-/tmp}" -maxdepth 3 -path '*SnapshotTests*' -name '*.png' \
            -exec cp {} "$RUNNER_TEMP/snapshot-failures/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/snapshot-failures" || true

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore

      # Release-configuration tests run pre-merge in the release-validation job
      # below (path-filtered to package-affecting changes to control cost on
      # 10x-billed macOS runners). They are NOT duplicated inside this job:
      # running both configurations serially in one job doubled its wall time.
      # release-mac.yml re-runs them post-tag as defence in depth.

      - name: Build SpeakCore (App Store flavour)
        # SpeakCore has no package dependencies, so this cheaply compiles the
        # `#if APP_STORE` branches that only the Mac App Store build exercises.
        # Runs after the test steps because the extra -Xswiftc flag invalidates
        # the shared debug build cache for the targets it rebuilds.
        run: swift build -Xswiftc -DAPP_STORE --target SpeakCore

      - name: Report Coverage
        if: always()
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST_PATH=$(find "$BIN_PATH" -name '*.xctest' -type d | head -1)
          if [ -n "$XCTEST_PATH" ]; then
            EXEC_PATH="$XCTEST_PATH/Contents/MacOS/$(basename "$XCTEST_PATH" .xctest)"
            COV_DIR=$(swift test --show-codecov-path 2>/dev/null || echo "")
            if [ -n "$COV_DIR" ] && [ -f "$COV_DIR" ]; then
              echo "### Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
              xcrun llvm-cov report "$EXEC_PATH" \
                --instr-profile="$(dirname "$COV_DIR")/default.profdata" \
                --ignore-filename-regex='\.build|Tests/' 2>/dev/null | head -30 >> "$GITHUB_STEP_SUMMARY" || true
            fi
          fi

  # Pre-merge Release-configuration gate (#694). A Release-only compile,
  # optimisation, or test failure must fail the PR that introduces it — the
  # post-tag run in release-mac.yml is defence in depth, not the first gate.
  # Cost controls for 10x-billed macOS runners:
  # - a cheap ubuntu job skips the macOS leg for docs-only changes (a skipped
  #   job still satisfies a required check, so the gate can be marked required)
  # - the workflow-level concurrency group cancels superseded runs
  # - a release-specific .build cache avoids cold dependency builds
  # - path filtering on pull_request skips the expensive legs for changes that
  #   cannot affect them.
  #
  # On push to main the filter is skipped and every output is 'true', so the
  # release, core-journey and fixture-UI gates actually run on main. They used
  # to be skipped there (the whole job was `if: pull_request`), which meant a
  # merge queue collision, a direct push, or a merge whose result differs from
  # the PR head reached the release tag ungated (the superseded-run cancellation
  # in the concurrency group above can also cancel a PR's last run).
  release-paths:
    name: Detect Release-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.select.outputs.package }}
      core-journey: ${{ steps.select.outputs.core-journey }}
    steps:
      - name: Filter changed paths
        # No checkout needed: on pull_request events the action lists changed
        # files via the GitHub API. It has no changed-file list to work from on
        # a push, so it only runs for pull requests.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            package:
              - 'Package.swift'
              - 'Package.resolved'
              - 'Sources/**'
              - 'Tests/**'
              - 'Config/**'
              - '.github/workflows/ci.yml'
            core-journey:
              - 'Project.swift'
              - 'Package.swift'
              - 'Package.resolved'
              - 'Sources/SpeakApp/**'
              - 'Sources/SpeakCore/**'
              - 'Sources/SpeakHotKeys/**'
              - 'Tests/Fixtures/CoreJourneyTargetApp/**'
              - 'Tests/SpeakAppUITests/**'
              - 'Tests/SpeakAppTests/**'
              - 'Tests/SpeakCoreTests/**'
              - 'Tests/SpeakHotKeysTests/**'
              - 'scripts/run-core-journey-e2e.sh'
              - 'scripts/run-core-journey-e2e.py'
              - 'scripts/verify-core-journey-ui.py'
              - 'scripts/tests/test_core_journey_gate.py'
              - '.github/workflows/ci.yml'

      - name: Select gate outputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE: ${{ steps.filter.outputs.package }}
          CORE_JOURNEY: ${{ steps.filter.outputs.core-journey }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
            echo "core-journey=$CORE_JOURNEY" >> "$GITHUB_OUTPUT"
          else
            # Push to main: no changed-file filtering, run every gate.
            echo "package=true" >> "$GITHUB_OUTPUT"
            echo "core-journey=true" >> "$GITHUB_OUTPUT"
          fi

  core-journey-e2e:
    name: Core Dictation Journey (≤10m)
    # Only the owner-approved Alpha rollout PR uses this Mac; other jobs stay hosted.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.number == 1038 && github.event.pull_request.head.repo.full_name == github.repository) && '["bravo-mini-local","macOS","ARM64"]' || '["macos-latest"]') }}
    timeout-minutes: 10
    needs: release-paths
    if: needs.release-paths.outputs.core-journey == 'true'
    steps:
      - uses: actions/checkout@v7

      # Debug CI populates the shared cache. This bounded gate only restores;
      # uploading gigabytes afterwards must not consume its ten-minute budget.
      - name: Restore Swift packages
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-

      - name: Run core journey gate
        run: scripts/run-core-journey-e2e.sh

      - name: Upload stage diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: core-journey-e2e-${{ github.run_attempt }}
          path: .artifacts/core-journey-e2e
          if-no-files-found: error

  core-journey-fixture-ui:
    name: Core Journey Fixture UI
    # Only the owner-approved Alpha rollout PR uses this Mac; other jobs stay hosted.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.number == 1038 && github.event.pull_request.head.repo.full_name == github.repository) && '["bravo-mini-local","macOS","ARM64"]' || '["macos-latest"]') }}
    timeout-minutes: 10
    needs: release-paths
    if: needs.release-paths.outputs.core-journey == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Tuist
        run: brew install tuist

      - name: Generate macOS project
        run: tuist generate --no-open

      - name: Test Speak bootstrap, global hotkey, and launched fixture
        run: |
          set -euo pipefail
          mkdir -p .artifacts/core-journey-fixture-ui
          xcodebuild test \
            -workspace "Just Speak to It.xcworkspace" \
            -scheme SpeakApp \
            -configuration Debug \
            -destination "platform=macOS" \
            -only-testing:SpeakAppUITests/LaunchUITests \
            -only-testing:SpeakAppUITests/CoreJourneyFixtureUITests \
            -only-testing:SpeakAppUITests/CoreJourneyHotKeyUITests \
            -only-testing:SpeakAppUITests/CoreJourneyBatchUITests \
            -resultBundlePath .artifacts/core-journey-fixture-ui/CoreJourneyFixture.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            | tee .artifacts/core-journey-fixture-ui/xcodebuild.log
          python3 scripts/verify-core-journey-ui.py .artifacts/core-journey-fixture-ui/xcodebuild.log

      - name: Upload launched-app diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: core-journey-fixture-ui-${{ github.run_attempt }}
          path: .artifacts/core-journey-fixture-ui
          include-hidden-files: true
          if-no-files-found: error

  release-validation:
    name: Build & Test (Release)
    # Only the owner-approved Alpha rollout PR uses this Mac; other jobs stay hosted.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.number == 1038 && github.event.pull_request.head.repo.full_name == github.repository) && '["bravo-mini-local","macOS","ARM64"]' || '["macos-latest"]') }}
    timeout-minutes: 45
    needs: release-paths
    if: needs.release-paths.outputs.package == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift packages (release)
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-release-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-release-

      - name: Test (Release)
        run: python3 scripts/with-test-keychain.py swift test -c release

  build-ios:
    name: Build iOS Library
    # Only the owner-approved Alpha rollout PR uses this Mac; other jobs stay hosted.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.number == 1038 && github.event.pull_request.head.repo.full_name == github.repository) && '["bravo-mini-local","macOS","ARM64"]' || '["macos-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tuist
        run: brew install tuist

      - name: Build iOS Library
        run: swift build --disable-dependency-cache --target SpeakiOSLib

      - name: Select iOS Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | jq -r \
            '([.devices[][] | select(.name == "iPhone 17 Pro")][0].udid) //
             ([.devices[][] | select(.name | startswith("iPhone"))][0].udid)')
          test -n "$SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Generate iOS App Project
        # CI includes the keyboard in its shipping handoff-only shape so the
        # extension and its flow tests compile without enabling direct capture.
        env:
          TUIST_IOS_KEYBOARD: "1"
        run: tuist generate --no-open

      - name: Test iOS App and Action Button Settings
        id: ios-tests
        # The full log is kept: `tail` only shows the closing summary, which
        # names a failed test without the assertion that failed (issue #793).
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "Just Speak to It.xcworkspace" \
            -scheme SpeakiOS \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:SpeakiOSTests \
            -only-testing:SpeakiOSUITests \
            -resultBundlePath "$RUNNER_TEMP/SpeakiOS.xcresult" \
            -skipPackagePluginValidation \
            2>&1 | tee "$RUNNER_TEMP/ios-tests.log" | tail -50

      - name: Label these results as simulator, not device
        if: ${{ always() }}
        # ActivityKit and AVAudioSession are not simulator-faithful (issue
        # #998), so a green run here is not evidence about Live Activity
        # behaviour, audio interruptions, or routing. Say so where the result
        # is read, not only in a test file's doc comment.
        run: |
          {
            echo "### iOS tests — Simulator"
            echo
            echo "Outcome: ${{ steps.ios-tests.outcome }}"
            echo
            echo "These ran on \`platform=iOS Simulator\`. ActivityKit and"
            echo "AVAudioSession do not behave as they do on a device, so this"
            echo "job proves the app's own logic and screen flow only. Live"
            echo "Activity content, audio interruptions, routing and the"
            echo "hardware Action Button are settled by the manual device"
            echo "matrix (\`.github/ISSUE_TEMPLATE/action_button_device_matrix.md\`)"
            echo "and the opt-in \`ios-device-matrix.yml\` workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify iOS XCTest execution evidence
        if: ${{ always() }}
        run: |
          python3 scripts/verify-ios-test-evidence.py "$RUNNER_TEMP/ios-tests.log" \
            --test-outcome "${{ steps.ios-tests.outcome }}" \
            --output "$RUNNER_TEMP/ios-test-summary.json"

      - name: Upload iOS test execution summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-test-summary.json
          retention-days: 7
          if-no-files-found: error

      # Both diagnostics also run when the job is cancelled (a superseded push
      # cancels in-progress runs): a partial log still names the assertion
      # that had already failed.
      - name: Show failing assertions
        if: ${{ failure() || cancelled() }}
        run: |
          echo "::group::Assertion failures and crashes from the iOS test log"
          grep -nE 'error: |Fatal error|Assertion Failure|Failed to (get|find|launch)|Restarting after|crashed' \
            "$RUNNER_TEMP/ios-tests.log" | head -200 || echo "(none matched)"
          echo "::endgroup::"

      - name: Upload iOS test results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/SpeakiOS.xcresult
            ${{ runner.temp }}/ios-tests.log
          if-no-files-found: ignore

      - name: Build watchOS App (feature-flagged)
        # The watch app target only exists when generated with
        # TUIST_WATCH_APP=1 (it needs its own provisioning profile for release
        # signing, so it is excluded from release builds). Build it unsigned
        # here so the flagged target cannot rot. Cheap: eight small source
        # files plus five shared core files. The watch-face complication
        # extension is embedded in the app, so this step covers it too.
        run: |
          set -o pipefail
          TUIST_WATCH_APP=1 TUIST_IOS_KEYBOARD=1 TUIST_IOS_KEYBOARD_DIRECT_CAPTURE=0 tuist generate --no-open
          xcodebuild build \
            -workspace "Just Speak to It.xcworkspace" \
            -scheme JustSpeakWatchApp \
            -destination generic/platform=watchOS \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -quiet \
            2>&1 | tail -30

          # Compile the containing iOS app with WATCH_APP_FEATURE enabled to
          # verify integration and embedding of the feature-flagged watch companion.
          xcodebuild build \
            -workspace "Just Speak to It.xcworkspace" \
            -scheme SpeakiOS \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -quiet \
            2>&1 | tail -30

  build-ios-keyboard:
    # Renamed from "Build iOS Keyboard (direct capture)" (issue #991). It is
    # not a required status check, so the rename costs nothing, and the old
    # name had become misleading: the job now builds the *shipping* hand-off
    # shape first and the flagged direct-capture shape second.
    #
    # The job is kept rather than removed. The `JustSpeakKeyboard` scheme is
    # the only place `APPLICATION_EXTENSION_API_ONLY=YES` is enforced against
    # this code, so it catches extension-unsafe API that the SpeakiOS app build
    # does not. Until this change the shipping shape was never built through
    # that scheme at all — only the direct-capture one was — so the shape users
    # actually receive had the weaker check. Both are built here now.
    name: Build iOS Keyboard
    # Only the owner-approved Alpha rollout PR uses this Mac; other jobs stay hosted.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.number == 1038 && github.event.pull_request.head.repo.full_name == github.repository) && '["bravo-mini-local","macOS","ARM64"]' || '["macos-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tuist
        run: brew install tuist

      - name: Build Keyboard Extension, hand-off shape (unsigned)
        # The shape every release ships: no in-extension capture engine, and
        # therefore no AVFoundation or Speech linked into the appex (#991).
        env:
          TUIST_IOS_KEYBOARD: "1"
          TUIST_IOS_KEYBOARD_DIRECT_CAPTURE: "0"
        run: |
          set -o pipefail
          tuist generate --no-open
          xcodebuild build \
            -workspace "Just Speak to It.xcworkspace" \
            -scheme JustSpeakKeyboard \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -quiet \
            2>&1 | tail -30

      - name: Build Keyboard Extension, direct-capture shape (unsigned)
        # The direct-capture shape only exists behind two flags, so its `#if
        # IOS_KEYBOARD_DIRECT_CAPTURE` branches and its file-based Info.plist
        # compile nowhere else. Build them here so the flagged code cannot rot.
        # Build only: the hand-off shape already runs the flow tests in the
        # Build iOS Library job, and this leg exists to catch compile rot.
        env:
          TUIST_IOS_KEYBOARD: "1"
          TUIST_IOS_KEYBOARD_DIRECT_CAPTURE: "1"
        run: |
          set -o pipefail
          tuist generate --no-open
          xcodebuild build \
            -workspace "Just Speak to It.xcworkspace" \
            -scheme JustSpeakKeyboard \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -quiet \
            2>&1 | tail -30

  lint:
    name: Lint
    # Only the owner-approved Alpha rollout PR uses this Mac; other jobs stay hosted.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.number == 1038 && github.event.pull_request.head.repo.full_name == github.repository) && '["bravo-mini-local","macOS","ARM64"]' || '["macos-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache lint tooling
        uses: actions/cache@v6
        with:
          path: Tooling/.build
          key: ${{ runner.os }}-tooling-${{ hashFiles('Tooling/Package.resolved') }}

      # SwiftLint resolves through the isolated Tooling/ graph so app/test
      # dependency changes cannot downgrade the linter (issue #677).
      - name: SwiftLint
        run: make lint

      - name: Check tooling Package.resolved drift
        run: git diff --exit-code Tooling/Package.resolved

      - name: Test CI and release gates
        run: make test-tooling

  api-compatibility:
    name: Public API compatibility
    # Route only the explicitly reviewed revision to the native pool.
    # Both Macs must also admit this revision locally before the variable is set.
    runs-on: ${{ fromJSON(((github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.JSTI_NATIVE_APPROVED_SHA == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.JSTI_NATIVE_APPROVED_SHA == github.event.pull_request.head.sha)) && '["jsti-macos-build","macOS"]' || '["macos-latest"]') }}
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline treeish must be resolvable locally.
          fetch-depth: 0

      # Exported library products must not lose or incompatibly change
      # public symbols in a non-major PR (issue #680). A PR title carrying
      # the conventional '!' breaking marker declares the major release and
      # is allowed through with the diff reported.
      - name: Diagnose breaking public API changes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-api-compatibility.sh "origin/${{ github.base_ref }}"

  # Branch protection already requires this exact name. Make it an aggregate
  # so release-mode and journey failures cannot merge behind a green debug job.
  required-macos:
    name: Build & Test (macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - build-macos
      - build-ios
      - build-ios-keyboard
      - lint
      - release-paths
      - release-validation
      - core-journey-e2e
      - core-journey-fixture-ui
      - api-compatibility
    # Evaluate GitHub's job results directly. This aggregate never checks out
    # or executes a PR-controlled helper; workflow edits still require review.
    permissions: {}
    steps:
      - name: Reject unsuccessful CI gates
        if: >-
          always() && (
            needs.build-macos.result != 'success' ||
            needs.build-ios.result != 'success' ||
            needs.build-ios-keyboard.result != 'success' ||
            needs.lint.result != 'success' ||
            needs.release-paths.result != 'success' ||
            (needs.release-paths.outputs.package != 'true' && needs.release-paths.outputs.package != 'false') ||
            (needs.release-paths.outputs.core-journey != 'true' && needs.release-paths.outputs.core-journey != 'false') ||
            (needs.release-validation.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.package == 'false' &&
              needs.release-validation.result == 'skipped')) ||
            (needs.core-journey-e2e.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.core-journey == 'false' &&
              needs.core-journey-e2e.result == 'skipped')) ||
            (needs.core-journey-fixture-ui.result != 'success' && !(
              github.event_name == 'pull_request' && needs.release-paths.outputs.core-journey == 'false' &&
              needs.core-journey-fixture-ui.result == 'skipped')) ||
            (needs.api-compatibility.result != 'success' && !(
              github.event_name != 'pull_request' && needs.api-compatibility.result == 'skipped'))
          )
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          echo '::error::A required CI gate failed, was cancelled, or did not run as expected.'
          printf '%s\n' "$CI_GATE_NEEDS"
          exit 1
      - name: Confirm successful CI gates
        run: echo 'All required CI gates passed; only explicitly excluded gates may skip.'
