name: Temporary JSTI 1821 qualification
on:
  push:
    branches: [qualification/1821-1134552-1128]
permissions:
  contents: write
  actions: read
jobs:
  qualify:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1134552a4c20259fb1fe0c0ec0b36c37d4b08932
          fetch-depth: 0
      - name: Qualify pinned source
        env:
          GH_TOKEN: ${{ github.token }}
          USER: runner-1821-1134552
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 1134552a4c20259fb1fe0c0ec0b36c37d4b08932
          test "$(git rev-parse HEAD^{tree})" = 31fb4df3931717a09bc4c9c20127f60d26820dd5
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          scripts/pre-pr --markdown
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-evidence
          path: |
            .build/pre-pr/summary.md
            .build/pre-pr/summary.json
