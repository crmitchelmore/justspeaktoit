name: Alpha Release
run-name: Alpha ${{ github.event.workflow_run.head_sha || inputs.source || (github.event_name == 'push' && github.sha) || 'reconciliation' }}
# Two phases per main commit. Alpha may be broken up to 10% of the time, but
# TestFlight, Windows installers and the Flatpak repository may not:
# - fast (push): as soon as a commit lands, build and publish the direct Mac
#   Alpha (with its CLI) and qualify the desktop bundles. Only the newest
#   push builds: one fast run at a time, and a newer push replaces a waiting
#   one. publish-alpha still refuses a source whose main CI already failed.
# - green (successful main CI, or a dispatch that release-train.mjs checks
#   against main CI): everything else ships, TestFlight included; the Mac
#   and desktop jobs are no-ops when the fast phase already delivered them.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Full main SHA with successful CI (blank reconciles missing builds)
        type: string
      rebuild:
        description: Allocate a new build attempt for this source (expired or invalid Apple upload)
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: alpha-${{ github.event_name == 'push' && 'fast' || github.run_id }}
  cancel-in-progress: false
jobs:
  allocate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-manifest-allocation
      queue: max
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.allocate.outputs.tag }}
      green: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # Dispatches with the workflow token: this workflow grants actions: write,
      # and workflow_dispatch events created with GITHUB_TOKEN do start runs.
      # The personal token used before lacked Actions write, so every hourly
      # pass failed with HTTP 403 and no missed merge was ever retried.
      - name: Reconcile missing successful merges
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.source == '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-train.mjs reconcile
      - name: Allocate immutable Alpha manifest
        id: allocate
        if: github.event_name == 'workflow_run' || github.event_name == 'push' || inputs.source != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ github.event.workflow_run.head_sha || inputs.source || github.sha }}
          REBUILD: ${{ inputs.rebuild || false }}
          OWNER_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! node -e 'process.exit(require("./Config/ReleasePipeline.json").enabled || process.env.OWNER_VALIDATION === "true" ? 0 : 1)'; then
            echo 'Alpha remains in validation mode.'
            exit 0
          fi
          # Fast phase: build only the newest main commit; a newer push
          # supersedes it. Green phase: main moves on while the full suite
          # runs, so build unless a newer main commit is already green.
          # Explicit dispatches still build any requested source.
          if [ "$EVENT_NAME" = "push" ] && [ "$(git rev-parse HEAD)" != "$SOURCE" ]; then
            echo "::notice::$SOURCE is no longer the newest main commit; skipping its Alpha."
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            for green in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" --jq '.workflow_runs[].head_sha'); do
              if [ "$green" != "$SOURCE" ] && git merge-base --is-ancestor "$SOURCE" "$green" 2>/dev/null; then
                echo "::notice::Newer main commit $green is already green; skipping $SOURCE."
                exit 0
              fi
            done
          fi
          # Only the fast phase may allocate before main CI has passed.
          REQUIRE_CI=true
          [ "$EVENT_NAME" = "push" ] && REQUIRE_CI=false
          node scripts/release-train.mjs allocate --source "$SOURCE" --rebuild "$REBUILD" --require-ci "$REQUIRE_CI"
  mac-direct:
    needs: allocate
    if: needs.allocate.outputs.tag != ''
    uses: ./.github/workflows/release-mac.yml
    with:
      manifest: ${{ needs.allocate.outputs.tag }}
    secrets: inherit
  # TestFlight ships only a source whose full main CI passed.
  ios:
    needs: allocate
    if: needs.allocate.outputs.tag != '' && needs.allocate.outputs.green == 'true'
    uses: ./.github/workflows/release-ios.yml
    with:
      manifest: ${{ needs.allocate.outputs.tag }}
    secrets: inherit
  desktop-qualification:
    needs: allocate
    if: needs.allocate.outputs.tag != ''
    uses: ./.github/workflows/qualify-desktop-release.yml
    with:
      manifest: ${{ needs.allocate.outputs.tag }}
  # Signs, stages, clean-installs and then publishes the Windows beta
  # installer for the qualified runtime bundles. Without the Artifact Signing
  # configuration it rehearses and publishes nothing.
  # The Alpha release stays a draft until mac-direct's publish-alpha step, and
  # this workflow's read-only fetch token cannot see draft releases, so it
  # waits for mac-direct (every Alpha from 8 Nov failed with "release not
  # found" while reading desktop-qualification.json from the draft).
  windows-installer:
    needs: [allocate, desktop-qualification, mac-direct]
    if: needs.allocate.outputs.tag != '' && needs.allocate.outputs.green == 'true'
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/windows-installer.yml
    with:
      manifest: ${{ needs.allocate.outputs.tag }}
    secrets: inherit
  # Publishes the qualified Linux bundle to the signed, self-hosted Flatpak
  # repository. Without the flatpak-repo signing key it rehearses only.
  # Like windows-installer, it reads release assets with a read-only token.
  linux-flatpak-repo:
    needs: [allocate, desktop-qualification, mac-direct]
    if: needs.allocate.outputs.tag != '' && needs.allocate.outputs.green == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/linux-flatpak-repo.yml
    with:
      manifest: ${{ needs.allocate.outputs.tag }}
    secrets: inherit
  # Sideloadable Android beta: an upload-key-signed release APK of the manifest
  # source, attached to the Alpha and advertised through android-pointer.json on
  # alpha-latest, which justspeaktoit.com/alpha/download/android resolves. It
  # waits for mac-direct so the Alpha is public before the pointer moves to it.
  android:
    needs: [allocate, mac-direct]
    if: needs.allocate.outputs.tag != '' && needs.allocate.outputs.green == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    concurrency:
      group: android-alpha-pointer
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ needs.allocate.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      APK: JustSpeakToIt-android.apk
    steps:
      - name: Resolve manifest source
        id: source
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern release-manifest.json --dir "$RUNNER_TEMP"
          echo "sha=$(jq -er .source "$RUNNER_TEMP/release-manifest.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      # No shared cache in a job that holds the signing key.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          JSTI_MAVEN_MIRROR: ${{ vars.JSTI_MAVEN_MIRROR }}
          JSTI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          JSTI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          JSTI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          # Public PostHog project key for opt-in analytics; builds without it send nothing.
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
        # Same version code scheme as android.yml, so sideloaded builds upgrade in place.
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No upload keystore in the android-release environment; no Android Alpha."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export JSTI_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          export JSTI_ANDROID_VERSION_CODE=$(( $(date -u +%s) - 1767225600 ))
          echo "::notice::versionCode $JSTI_ANDROID_VERSION_CODE"
          ./gradlew --stacktrace assembleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs "$apk")"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::$apk is signed with a debug certificate"
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/$APK"
          echo "$JSTI_ANDROID_VERSION_CODE" > "$RUNNER_TEMP/version-code"
      - name: Attach APK and advance the Android pointer
        run: |
          [ -f "$RUNNER_TEMP/$APK" ] || exit 0
          gh release upload "$TAG" "$RUNNER_TEMP/$APK" --repo "$REPO" --clobber
          mkdir -p "$RUNNER_TEMP/current"
          current=0
          if gh release download alpha-latest --repo "$REPO" --pattern android-pointer.json --dir "$RUNNER_TEMP/current" 2>/dev/null; then
            current=$(jq -r '.tag // ""' "$RUNNER_TEMP/current/android-pointer.json" | sed -n 's/^alpha-build-\([0-9]*\)$/\1/p')
          fi
          if [ "${TAG#alpha-build-}" -le "${current:-0}" ]; then
            echo "::notice::android-pointer.json already names alpha-build-$current; leaving it."
            exit 0
          fi
          jq -n --arg tag "$TAG" --arg sha256 "$(sha256sum "$RUNNER_TEMP/$APK" | cut -d' ' -f1)" \
            --argjson versionCode "$(cat "$RUNNER_TEMP/version-code")" \
            '{schemaVersion: 1, tag: $tag, asset: env.APK, versionCode: $versionCode, sha256: $sha256}' \
            > "$RUNNER_TEMP/android-pointer.json"
          gh release upload alpha-latest "$RUNNER_TEMP/android-pointer.json" --repo "$REPO" --clobber
  # Keeps owner-nominated testers in Public Alpha after each iOS upload. The
  # address list is read only here, behind the main-only environment.
  ios-testers:
    needs: [allocate, ios]
    if: needs.allocate.outputs.tag != '' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testflight-testers
    # Same lane as the reconciler and manual tester job: enrolment writes and
    # pending-invitation rollback must never interleave.
    concurrency:
      group: apple-release-observation
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      APP_STORE_CONNECT_KEY_ID: S747NJ9DZY
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TESTFLIGHT_TESTER_EMAILS: ${{ secrets.TESTFLIGHT_TESTER_EMAILS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Mask each configured tester address
        run: ./scripts/mask-tester-emails.sh
      - name: Install existing Apple API key
        env:
          KEY_DATA: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY_DATA" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_S747NJ9DZY.p8"
      - name: Ensure testers are in Public Alpha
        run: |
          if [ -z "$TESTFLIGHT_TESTER_EMAILS" ]; then echo 'No tester addresses configured.'; exit 0; fi
          ruby scripts/testflight-testers.rb ensure
