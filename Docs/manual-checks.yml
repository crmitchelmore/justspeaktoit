      - id: "owner-ios-upload-required-reason-apis"
        issues:
          - 1644
        title: "iOS upload processes without ITMS-91053"
        minutes: 3
        core: false
        build: "App Store Connect; the first Alpha iOS build that includes the active-keyboards privacy manifest fix"
        steps:
          - "In App Store Connect \u203a TestFlight, find the new iOS build and wait for processing to finish."
          - "Confirm the build shows as ready to test rather than invalid."
          - "Check the Apple email for the build, or the build upload's errors."
