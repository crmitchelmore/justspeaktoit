name: Release macOS App

on:
  workflow_call:
    inputs:
      manifest:
        required: true
        type: string

concurrency:
  group: release-mac-direct
  queue: max
  cancel-in-progress: false

env:
  SCHEME: SpeakApp
  PRODUCT_NAME: JustSpeakToIt
  WORKSPACE: "Just Speak to It.xcworkspace"
  GH_TOKEN: ${{ github.token }}
  APP_STORE_CONNECT_KEY_ID: S747NJ9DZY
  # Public PostHog ingestion key. The app remains a silent no-op when the
  # repository secret has not been configured.
  POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}

jobs:
  build-and-release:
    runs-on: macos-15
    # Two archives (arm64 primary + universal legacy), each with app
    # notarisation polling (up to 60 min) and DMG notarisation, then the
    # standalone CLI archives (two more notarisations) and publication.
    timeout-minutes: 240
    permissions:
      contents: write
    outputs:
      sentry-release: ${{ steps.sentry.outputs.release }}
      dsym-artifact: ${{ steps.dsyms.outcome == 'success' && steps.sentry.outputs.artifact || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.manifest }}

      - name: Check candidate delivery receipt
        id: receipt
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: node scripts/release-train.mjs status --tag "$MANIFEST" --surface mac-direct

      - name: Setup Xcode
        if: steps.receipt.outputs.status != 'verified'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.2"

      # Runs on the pristine tagged source, before the manifest stamps train
      # identity, version and release notes into the tree. Those stamps are
      # exactly what the plist-identity and release-notes tests pin, so testing
      # afterwards failed every Alpha build (alpha-build-1..3) and no build ever
      # reached the alpha-latest pointer that the Sparkle Alpha feed resolves.
      - name: Run Tests (Release Config)
        if: steps.receipt.outputs.status != 'verified'
        run: |
          # Defence in depth: the pre-merge gate is the release-validation job
          # in ci.yml; this re-run protects tags cut from any unvalidated state.
          echo "Re-running release-configuration tests as post-tag defence in depth..."
          python3 scripts/with-test-keychain.py swift test -c release
          # The build must use the frozen lock the manifest hashed, not one the
          # test toolchain may have rewritten while resolving.
          git checkout -- Package.resolved

      - name: Load frozen release manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: node scripts/release-train.mjs configure --tag "$MANIFEST" --surface mac-direct

      - name: Stamp immutable app metadata
        if: steps.receipt.outputs.status != 'verified'
        run: python3 scripts/stamp-release-train.py mac-direct

      - name: Install Tuist
        if: steps.receipt.outputs.status != 'verified'
        run: |
          brew install tuist

      - name: Generate Xcode Project
        if: steps.receipt.outputs.status != 'verified'
        run: |
          tuist generate --no-open
          mkdir -p "Just Speak to It.xcworkspace/xcshareddata/swiftpm"
          cp Package.resolved "Just Speak to It.xcworkspace/xcshareddata/swiftpm/Package.resolved"

      - name: Resolve Swift Package Dependencies
        if: steps.receipt.outputs.status != 'verified'
        run: |
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME"

      # Release tests exercise real Keychain migration. They ran above, before
      # the runner's Keychain search list is replaced with the signing Keychain.
      - name: Import Code Signing Certificate
        if: steps.receipt.outputs.status != 'verified'
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$APPLE_DEVELOPER_ID_APPLICATION" | base64 --decode -o "$CERTIFICATE_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_DEVELOPER_ID_APPLICATION_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Clean up
          rm -f "$CERTIFICATE_PATH"

      - name: Install App Store Connect API Key
        if: steps.receipt.outputs.status != 'verified'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${{ env.APP_STORE_CONNECT_KEY_ID }}.p8
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Verify Entitlements for Developer ID
        if: steps.receipt.outputs.status != 'verified'
        run: |
          # Entitlements file is pre-configured for Developer ID (non-sandboxed).
          # Sandbox and managed entitlements are commented out for future App Store builds.
          echo "Using Developer ID entitlements (non-sandboxed):"
          cat Config/SpeakMacOS.entitlements

      - name: Start artefact size summary
        if: steps.receipt.outputs.status != 'verified'
        run: |
          {
            echo "## Release artefacts (v${{ env.RELEASE_VERSION }}, build ${BUILD_NUMBER})"
            echo ""
            echo "| Variant | DMG | Installed app | Main executable | speak CLI | Archs |"
            echo "|---|---:|---:|---:|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      # Two downloads per release (issue #774): the arm64-only primary that
      # Apple Silicon Macs download and update to, and the universal legacy
      # build that Intel Macs — and every install that predates per-architecture
      # artefacts — keep receiving through the original appcast.xml feed.
      # The primary ships without the speak CLI, which is published as
      # standalone assets below (issue #775); the legacy build keeps embedding it.
      - name: Package arm64 primary
        if: steps.receipt.outputs.status != 'verified'
        id: arm64
        uses: ./.github/actions/package-mac-release
        with:
          variant: arm64
          embed-cli: "false"
          version: ${{ env.RELEASE_VERSION }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-id-password: ${{ secrets.APPLE_ID_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-key-id: ${{ env.APP_STORE_CONNECT_KEY_ID }}

      - name: Package universal legacy
        if: steps.receipt.outputs.status != 'verified'
        id: universal
        uses: ./.github/actions/package-mac-release
        with:
          variant: universal
          embed-cli: "true"
          version: ${{ env.RELEASE_VERSION }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-id-password: ${{ secrets.APPLE_ID_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-key-id: ${{ env.APP_STORE_CONNECT_KEY_ID }}

      - name: Preserve launch failure diagnostics
        if: ${{ always() && steps.receipt.outputs.status != 'verified' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mac-launch-diagnostics-${{ inputs.manifest }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launch-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish artefact paths
        if: steps.receipt.outputs.status != 'verified'
        run: |
          {
            echo "DMG_PATH=${{ steps.arm64.outputs.dmg-path }}"
            echo "APP_PATH=${{ steps.arm64.outputs.app-path }}"
            echo "ARCHIVE_PATH=${{ steps.arm64.outputs.archive-path }}"
            echo "LEGACY_DMG_PATH=${{ steps.universal.outputs.dmg-path }}"
            echo "LEGACY_APP_PATH=${{ steps.universal.outputs.app-path }}"
            echo "LEGACY_ARCHIVE_PATH=${{ steps.universal.outputs.archive-path }}"
          } >> "$GITHUB_ENV"

      # The candidate includes both standalone CLI architectures and its signed
      # installer manifest. All eight direct assets must verify before promotion.
      - name: Build, notarise and verify speak CLI assets
        if: steps.receipt.outputs.status != 'verified'
        id: cli
        uses: ./.github/actions/publish-speak-cli
        with:
          version: ${{ env.CLI_VERSION }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-id-password: ${{ secrets.APPLE_ID_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          sparkle-private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Publish speak CLI asset paths
        if: steps.receipt.outputs.status != 'verified' && (steps.cli.outcome == 'success')
        run: |
          {
            echo "CLI_ARM64_ZIP=${{ steps.cli.outputs.arm64-zip }}"
            echo "CLI_X86_64_ZIP=${{ steps.cli.outputs.x86_64-zip }}"
            echo "CLI_MANIFEST=${{ steps.cli.outputs.manifest }}"
            echo "CLI_MANIFEST_SIG=${{ steps.cli.outputs.signature }}"
          } >> "$GITHUB_ENV"

      # Preserve expensive signed packages even when a later verifier fails.
      # These are recovery artefacts, not a published or verified release.
      - name: Preserve packaged release candidates
        continue-on-error: true
        if: always() && steps.arm64.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mac-candidates-${{ env.RELEASE_TAG }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ steps.arm64.outputs.dmg-path }}
            ${{ steps.universal.outputs.dmg-path }}
            ${{ steps.cli.outputs.arm64-zip }}
            ${{ steps.cli.outputs.x86_64-zip }}
            ${{ steps.cli.outputs.manifest }}
            ${{ steps.cli.outputs.signature }}

      - name: Generate Appcasts for Sparkle Updates
        if: steps.receipt.outputs.status != 'verified'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ env.RELEASE_VERSION }}"
          # Use timestamp-based build number (set in Stamp Version step)
          # This ensures sparkle:version matches CFBundleVersion for proper update detection
          BUILD_NUMBER="${{ env.BUILD_NUMBER }}"

          chmod +x scripts/generate-appcast.sh
          ./scripts/generate-appcast.sh \
            "$VERSION" \
            "$BUILD_NUMBER" \
            "$LEGACY_DMG_PATH" \
            "$SPARKLE_PRIVATE_KEY" \
            "$RUNNER_TEMP/release-notes.html" \
            "$FEED_URL" > "$RUNNER_TEMP/appcast.xml"
          ./scripts/generate-appcast.sh \
            "$VERSION" \
            "$BUILD_NUMBER" \
            "$DMG_PATH" \
            "$SPARKLE_PRIVATE_KEY" \
            "$RUNNER_TEMP/release-notes.html" \
            "$ARM64_FEED_URL" > "$RUNNER_TEMP/appcast-arm64.xml"

          # Each feed must offer its own download: the legacy feed the universal
          # DMG, the Apple Silicon feed the arm64 DMG. A mix-up here would offer
          # an arm64-only build to an Intel Mac.
          grep -q "releases/download/${DOWNLOAD_TAG}/$(basename "$LEGACY_DMG_PATH")" "$RUNNER_TEMP/appcast.xml"
          grep -q "releases/download/${DOWNLOAD_TAG}/$(basename "$DMG_PATH")" "$RUNNER_TEMP/appcast-arm64.xml"
          if grep -q "$(basename "$DMG_PATH")" "$RUNNER_TEMP/appcast.xml"; then
            echo "::error::Architecture feed contains the wrong DMG"; exit 1
          fi
          if grep -q "$(basename "$LEGACY_DMG_PATH")" "$RUNNER_TEMP/appcast-arm64.xml"; then
            echo "::error::Architecture feed contains the wrong DMG"; exit 1
          fi

          echo "APPCAST_PATH=$RUNNER_TEMP/appcast.xml" >> "$GITHUB_ENV"
          echo "ARM64_APPCAST_PATH=$RUNNER_TEMP/appcast-arm64.xml" >> "$GITHUB_ENV"
          echo "Generated appcast.xml (legacy, universal):"
          cat "$RUNNER_TEMP/appcast.xml"
          echo "Generated appcast-arm64.xml (Apple Silicon):"
          cat "$RUNNER_TEMP/appcast-arm64.xml"

      # The signed bytes and installer must pass before GitHub Latest makes
      # either appcast visible. Post-publication smoke below also checks delivery.
      - name: Verify Sparkle installation before publication
        if: steps.receipt.outputs.status != 'verified'
        timeout-minutes: 20
        env:
          SPARKLE_SMOKE_LOCAL_ENCLOSURE: '1'
          SPARKLE_SMOKE_REQUIRE_SUPPORTED: '1'
        run: |
          scripts/sparkle-update-smoke.sh "$DMG_PATH" "$ARM64_APPCAST_PATH"
          scripts/sparkle-update-smoke.sh "$LEGACY_DMG_PATH" "$APPCAST_PATH"

      - name: Upload verified candidate artefacts
        if: steps.receipt.outputs.status != 'verified'
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            "$DMG_PATH" "$LEGACY_DMG_PATH" "$APPCAST_PATH" "$ARM64_APPCAST_PATH" \
            "$CLI_ARM64_ZIP" "$CLI_X86_64_ZIP" "$CLI_MANIFEST" "$CLI_MANIFEST_SIG"
          node scripts/release-train.mjs receipt --tag "$RELEASE_TAG" --surface mac-direct --status verified \
            --asset "$DMG_PATH" --asset "$LEGACY_DMG_PATH" --asset "$APPCAST_PATH" --asset "$ARM64_APPCAST_PATH" \
            --asset "$CLI_ARM64_ZIP" --asset "$CLI_X86_64_ZIP" --asset "$CLI_MANIFEST" --asset "$CLI_MANIFEST_SIG"

      - name: Advance verified Alpha pointer
        if: env.RELEASE_TRAIN == 'alpha'
        run: node scripts/release-train.mjs publish-alpha --tag "$RELEASE_TAG"

      # The Sentry token never enters this job, which also holds the signing,
      # notarisation and Sparkle secrets: the dSYMs are handed to the
      # `sentry-upload` job below, which alone can read the `sentry` environment.
      - name: Hand dSYMs to the Sentry upload job
        if: steps.receipt.outputs.status != 'verified'
        id: sentry
        run: |
          # The combined upload below succeeds if either variant has files, so
          # check each shipped variant on its own and name the missing one.
          for dsyms in "$ARCHIVE_PATH/dSYMs" "$LEGACY_ARCHIVE_PATH/dSYMs"; do
            if ! compgen -G "$dsyms/*.dSYM" > /dev/null; then
              echo "::warning::No dSYMs in $dsyms; crashes from that variant will not be symbolicated."
            fi
          done
          {
            echo "release=justspeaktoit-mac@${RELEASE_VERSION}+${BUILD_NUMBER}"
            echo "artifact=mac-dsyms-${RELEASE_TAG}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

      # Kept for a week so a failed sentry-upload job can be re-run on its own.
      - name: Upload dSYMs for Sentry
        if: steps.receipt.outputs.status != 'verified'
        id: dsyms
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.sentry.outputs.artifact }}
          retention-days: 7
          if-no-files-found: error
          # Both paths live under $RUNNER_TEMP/<variant>/, so the artefact keeps
          # them apart as arm64/… and universal/….
          path: |
            ${{ env.ARCHIVE_PATH }}/dSYMs
            ${{ env.LEGACY_ARCHIVE_PATH }}/dSYMs

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${{ env.APP_STORE_CONNECT_KEY_ID }}.p8 || true

  # Isolated so the Sentry token is never exposed to the build job's toolchain,
  # and readable only by `main` through the `sentry` environment's deployment
  # branch policy. Runs on the same image so the dSYMs' recorded source paths
  # resolve for --include-sources. A Sentry outage must never fail a release
  # that is already published, hence continue-on-error.
  sentry-upload:
    needs: build-and-release
    if: needs.build-and-release.outputs.dsym-artifact != '' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    environment: sentry
    permissions:
      contents: read
    steps:
      # Pinned to reviewed commits: these run alongside the Sentry token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.manifest }}
          persist-credentials: false

      - name: Download dSYMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-release.outputs.dsym-artifact }}
          path: ${{ runner.temp }}/dsyms

      # Step-level env is not visible to `if:`, so the token is checked inside
      # the script.
      - name: Create Sentry release and upload dSYMs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: tally-lz
          SENTRY_PROJECT: justspeaktoit
          SENTRY_URL: https://de.sentry.io/
          SENTRY_CLI_VERSION: 3.8.0
          SENTRY_CLI_SHA256: 2c26914636c47ab9bf9e710484ad7b44d371cbec8bd29cafb36b3cf877bf4285
          RELEASE: ${{ needs.build-and-release.outputs.sentry-release }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set in the sentry environment; crashes from this build will not be symbolicated."
            exit 0
          fi
          CLI="$RUNNER_TEMP/sentry-cli"
          curl -fsSL --retry 3 -o "$CLI" \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Darwin-universal"
          echo "${SENTRY_CLI_SHA256}  $CLI" | shasum -a 256 -c -
          chmod +x "$CLI"

          status=0
          "$CLI" releases new "$RELEASE" || status=1
          "$CLI" releases set-commits "$RELEASE" --auto --ignore-missing \
            || echo "::warning::Could not associate commits with $RELEASE"
          "$CLI" releases finalize "$RELEASE" || status=1
          # Both variants share the build number; each has its own binary UUIDs.
          for dsyms in "$RUNNER_TEMP"/dsyms/*/; do
            "$CLI" debug-files upload --include-sources --wait "$dsyms" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::warning::Sentry release or dSYM upload failed for $RELEASE"
            exit 1
          fi
