name: "CodeQL"

# Swift analysis compiles the whole Apple graph on a hosted macOS runner for
# about 40 minutes, so it no longer runs on every main push. A daily scan
# covers source changes (alerts may land up to a day later); main pushes that
# change workflows, the shared Apple toolchain or the package manifest are
# still analysed immediately.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'Package.swift'
      - 'Package.resolved'
  # No pull_request trigger: pull requests merge on their pre-pr record and
  # main verifies every change after the merge (ci.yml, auto-revert.yml).
  schedule:
    - cron: '30 5 * * *' # Daily at 5:30 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Newest-only on PRs and main: a newer main push analyses a superset.
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'merge-batch/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      swift: ${{ steps.paths.outputs.swift }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        with:
          filters: |
            # Pull requests analyse only changes to how the scan is built.
            # The daily schedule analyses all Swift sources, so a
            # source-only pull request no longer holds a
            # hosted macOS runner for ~40 minutes on the shared queue.
            swift:
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/codeql.yml'
              - '.github/actions/setup-apple-toolchain/**'
  analyze:
    name: Analyze
    needs: changes
    # A skipped job still reports a check; event-level path filters can leave
    # required checks pending. Unknown/failed path detection runs the scan.
    if: >-
      always() && !startsWith(github.head_ref, 'merge-batch/') && (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' || needs.changes.outputs.swift == 'true')
    runs-on: macos-15
    # CodeQL tracing slows the Swift build, so this gets more headroom than
    # the plain CI build jobs.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-apple-toolchain
        with:
          xcode-version: "26.2"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      # Cache dependency sources only. Compiled objects must remain uncached so
      # CodeQL observes every compiler invocation during the traced build.
      - name: Cache Swift dependency sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: codeql-${{ runner.os }}-${{ runner.arch }}-sources-${{ hashFiles('Package.resolved') }}
          restore-keys: codeql-${{ runner.os }}-${{ runner.arch }}-sources-

      # GitHub release-asset 5xx outages outlast short fixed retries.
      - name: Resolve pinned dependencies with bounded network retries
        run: scripts/retry-network.sh swift package resolve --force-resolved-versions

      - name: Build
        run: swift build --disable-automatic-resolution

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
