name: Desktop Icon Resources

on:
  pull_request:
    branches: [main]
    paths:
      - .gitattributes
      - Resources/AppIcon.iconset/**
      - Resources/Desktop/**
      - Sources/CWindowsSupport/**
      - Sources/CLinuxSupport/**
      - Sources/SpeakLinux/**
      - Package.swift
      - packaging/linux/**
      - scripts/generate-icon.swift
      - scripts/generate-desktop-icons.py
      - scripts/stage-linux-desktop.py
      - scripts/tests/test_desktop_icons.py
      - scripts/windows-package/**
      - scripts/windows-bundle/**
      - .github/workflows/desktop-icons.yml
  push:
    branches: [main]
    paths:
      - .gitattributes
      - Resources/AppIcon.iconset/**
      - Resources/Desktop/**
      - Sources/CWindowsSupport/**
      - Sources/CLinuxSupport/**
      - Sources/SpeakLinux/**
      - Package.swift
      - packaging/linux/**
      - scripts/generate-icon.swift
      - scripts/generate-desktop-icons.py
      - scripts/stage-linux-desktop.py
      - scripts/tests/test_desktop_icons.py
      - scripts/windows-package/**
      - scripts/windows-bundle/**
      - .github/workflows/desktop-icons.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resources:
    name: Canonical desktop icon and package invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact canonical exports and native resource wiring
        run: |
          python3 scripts/generate-desktop-icons.py --check
          python3 -B -m unittest discover -s scripts/tests -p test_desktop_icons.py -v
      - name: Verify MSIX logos and portable bundle packaging
        run: |
          python3 -B -m unittest discover -s scripts/windows-package -p test_windows_package.py -v
          python3 -B -m unittest discover -s scripts/windows-bundle -p test_windows_bundle.py -v
