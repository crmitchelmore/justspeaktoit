# Owner manual QA catalogue: the single source for https://justspeaktoit.com/qa
# and the Manual QA results workflow. See Docs/manual-qa.md for the format.
# Strict YAML subset: 2-space indents, double-quoted strings, integers, booleans.
version: 1
updated: "2026-11-07"
sessions:
  - id: "decisions"
    device: "Decision"
    title: "Decisions"
    items:
      - id: "decision-provider-spend-cap"
        issues:
          - 1210
          - 1051
          - 1052
          - 821
          - 1104
          - 1113
          - 1114
        title: "Spend cap for paid-provider live acceptance runs"
        minutes: 2
        core: true
        question: "How much may be spent on short synthetic-speech runs against paid speech providers?"
        context: "Seven issues are code-complete and only need real calls with a few seconds of synthetic speech per route: #1210 (Pulse Pro, Reson8, StepAudio, Alibaba, OpenRouter audio routes, AssemblyAI Universal-3.6 Pro live), #1104 (8 live providers), #1113 and #1114 (one OpenAI or Groq Mac batch run), #821 (OpenRouter playback), #1051 and #1052 (Azure Speech/MAI). Usage is likely under $10; minimum top-ups for new accounts are most of the cost. Runs need a person at a Mac with a microphone; receipts are posted to each issue without keys or billing details. Azure also needs you to create or name a Speech resource in a region that serves MAI models."
        options:
          - id: "cap-40"
            label: "Up to $40 total, at most $10 per provider, no auto top-ups"
            consequence: "Covers all seven issues; any provider needing a larger minimum top-up or a paid plan is skipped and noted. Alibaba uses the international (Singapore) workspace only."
            recommended: true
          - id: "cap-15-existing"
            label: "Up to $15, existing accounts only"
            consequence: "#1104, #1113, #1114 and #821 can close; #1210's new providers and Azure (#1051, #1052) stay open."
          - id: "defer"
            label: "Defer all paid runs"
            consequence: "No spend; all seven issues stay open."
      - id: "decision-paid-mac-signin"
        issues:
          - 648
        title: "Paid Access: how Mac users sign in"
        minutes: 2
        core: false
        question: "How should direct-download Mac users sign in to Paid Access?"
        context: "Stripe on direct-download Mac is the chosen rail. The paid-access server already verifies Apple identity tokens, but native Sign in with Apple does not work in Developer ID builds, so Paid Access cannot launch on Mac until a supported sign-in exists. Docs/paid-access.md lists the rest of the setup."
        options:
          - id: "apple-web-flow"
            label: "Sign in with Apple through its web flow"
            consequence: "You create a Services ID and return URL in the Apple Developer portal; an agent adds the browser sign-in to the Mac app and the Services ID to the accepted audiences. The same Apple account works if iOS is added later."
            recommended: true
          - id: "email-link"
            label: "Email sign-in link"
            consequence: "No Apple setup, but needs an email-sending provider and a second identity type on the server."
          - id: "defer"
            label: "Defer Paid Access"
            consequence: "Paid Access stays off and #648 is parked; no external setup."
  - id: "mac"
    device: "Mac"
    title: "Mac"
    setup:
      - "Unlocked Mac with Just Speak to It (mac-v3.2.0 or Alpha build 45 or later) and Accessibility granted."
      - "Settings \u203a General: Accessibility Insertion = Insert at Cursor; Stream text while dictating (experimental) = on; post-processing off."
      - "A Streaming model with a working key is selected. Use made-up sentences only."
    items:
      - id: "mac-notes-streaming"
        issues:
          - 664
        title: "Notes: live text, corrections and selection replacement are exact"
        minutes: 5
        core: true
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        steps:
          - "In a new Notes note type: caf\u00e9 \u2615 the quick fox, the quick fox \u2014 then on the next line: REPLACE_ME and REPLACE_ME"
          - "Put the cursor on a new third line, dictate slowly \"Testing Notes, one two three, actually four\" and stop."
          - "Double-click the first REPLACE_ME, dictate \"Selection works\" and stop."
          - "Open History in Just Speak to It and compare the two newest entries with the note."
        expected: "Words appear while you speak and revised words are replaced, not duplicated. Line 3 matches History exactly; only the first REPLACE_ME became \"Selection works\"; caf\u00e9 \u2615 and both \"the quick fox\" are unchanged."
        final_gate: true
      - id: "mac-notes-safety"
        issues:
          - 664
        title: "Notes: typing elsewhere or switching notes mid-dictation is safe"
        minutes: 4
        core: true
        build: "Just Speak to It for Mac, an Alpha build that includes the #664 note-switch fix"
        steps:
          - "At the end of the same note start dictating a long sentence."
          - "After the first words appear, click the first line, type XX, keep talking, then stop."
          - "Start dictating again at the end of the note; after the first words appear, click into a different, empty note, keep talking, then stop."
          - "Check both notes."
        expected: "XX is kept and nothing outside the dictated text changed or duplicated (streaming may pause). After the switch, streaming pauses: the second note stays empty, the first note keeps only the words dictated before you switched, and a notice says the full transcript is on the clipboard. This holds for every \u201cIf you switch apps\u201d setting, because both notes are in the same app."
        final_gate: true
      - id: "mac-one-shot-baselines"
        issues:
          - 664
        title: "Setting off and a non-allowlisted app both get one paste at the end"
        minutes: 4
        core: true
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        steps:
          - "Settings \u203a General: turn Stream text while dictating (experimental) off; in Notes dictate \"Baseline off\" and stop."
          - "Turn the setting back on."
          - "Open Stickies, click into a new sticky, dictate \"Stickies one paste\" and stop."
          - "Compare both with History."
        expected: "In both cases nothing appears while you speak and the text arrives exactly once after Stop, matching History."
        final_gate: true
      - id: "mac-notes-history-upgrade"
        issues:
          - 1118
        title: "Mac: existing History intact after updating"
        minutes: 3
        core: false
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        steps:
          - "Before updating the Mac app, note the text of your newest two History items."
          - "Update to the build under test and open History."
          - "Make one short recording, quit and reopen the app, then open History."
        expected: "Older items are unchanged and the new recording survives the relaunch."
        final_gate: false
      - id: "owner-flathub-submission"
        issues:
          - 1219
        title: "Submit Just Speak to It to Flathub yourself"
        minutes: 60
        core: false
        build: "Tagged main release; packaging/linux Flatpak manifest as a reference only"
        prerequisites:
          - "Flathub bars AI-written manifests, PRs and replies: do every step yourself, without an agent"
          - "Steps: https://github.com/crmitchelmore/justspeaktoit/blob/main/Docs/linux-packaging.md (Recommended next step: Flathub)"
        steps:
          - "Write your own Flathub manifest building from a tagged git source of this repository, with the same pinned SwiftPM sources."
          - "Add Linux screenshots at stable URLs and a release entry to the metainfo; run flatpak-builder-lint appstream and flatpak-builder-lint repo on a built repo."
          - "Signed in to GitHub as yourself (2FA on), open a pull request to flathub/flathub against the new-pr branch titled \"Add com.justspeaktoit.JustSpeakToIt\"."
          - "In the description, disclose which parts of the app were AI-generated and roughly how much, and justify each finish-args permission."
          - "Answer reviewers yourself, and accept the maintainer invitation within a week of approval."
        expected: "Your submission pull request is open on flathub/flathub with the disclosure. After acceptance, an agent can publish the domain verification token and point the website at the listing."
        final_gate: false
      - id: "mac-issue-report-preview"
        issues:
          - 1284
        title: "History: Review Issue Report shows only safe details"
        minutes: 4
        core: false
        build: "Just Speak to It for Mac, Alpha build 61 or later"
        steps:
          - "Open History and choose Review Issue Report\u2026 on any recording (a failed one if you have it)."
          - "Read the draft and the JSON attachment, then turn Include diagnostics off and on again."
          - "Click Save JSON\u2026 and save to the Desktop, then click Copy Draft and paste into a new TextEdit document."
          - "Click Open GitHub, check the issue page is prefilled with the draft, and close the tab without submitting."
          - "Delete the saved file and the TextEdit document."
        expected: "The draft and JSON name the model, mode and settings of that recording but contain no transcript text, prompt, file path, API key, device or app name. With Include diagnostics off, the JSON keeps only its version and removal notes, with no model or settings. The saved file, copied draft and GitHub page match the preview, and nothing was posted."
        final_gate: true
      - id: "mac-speechanalyzer-latency"
        issues:
          - 614
        title: "SpeechTranscriber shows first words no later than Apple Speech"
        minutes: 8
        core: false
        build: "Just Speak to It for Mac, Alpha build 61 or later, macOS 26 or later"
        steps:
          - "Settings \u203a Transcription \u203a Local \u203a Streaming: choose Apple SpeechTranscriber (On-device)."
          - "In TextEdit, read the same paragraph (about 30 seconds) three times, one recording each."
          - "Choose Apple Speech (On-device) and read the same paragraph three more times."
          - "Mark this Pass. An agent then compares first-words latency for the two models using only the numeric latency fields in History."
        expected: "Six recordings exist, three per model. The agent posts both first-words p50 values on #614 and closes it if SpeechTranscriber\u2019s is the same or lower and iphone-hands-free has passed."
        final_gate: false
      - id: "mac-start-latency-sample"
        issues:
          - 611
        title: "Enough everyday recordings to re-measure start latency"
        minutes: 1
        core: false
        build: "Just Speak to It for Mac, Alpha build 46 or later (6 Nov 2026 onwards)"
        steps:
          - "Keep the Alpha app updated and dictate with the hotkey as usual."
          - "Once the Alpha has about 50 hotkey recordings made on builds from 6 Nov 2026 or later, mark this Pass."
          - "An agent then reads only the numeric latency fields in History and posts the result on #611."
        expected: "About 50 or more recent hotkey recordings exist. The agent reports hotkey-to-capture p50 and p95; #611 closes if p50 is under 100 ms and the #664 streaming checks have passed."
        final_gate: false
      - id: "mac-paid-existing-providers"
        issues:
          - 1104
        title: "Every remote streaming provider with your keys"
        minutes: 12
        core: false
        build: "Just Speak to It for Mac, Alpha build 61 or later"
        prerequisites:
          - "Decision: a provider spend cap is approved (decision-provider-spend-cap)"
          - "Use made-up sentences only. If a listed model has no key or fails, mark Fail and name it in the note."
        steps:
          - "Settings \u203a Transcription \u203a Remote \u203a Streaming: choose each of OpenAI Realtime, ElevenLabs, Soniox, Modulate, Cartesia, Gladia, Deepgram Nova-3 and Deepgram Flux in turn."
          - "For each, dictate \u201cprovider check one two three\u201d into TextEdit and stop, then start again at once, say \u201csecond run\u201d and stop."
          - "Open History and check the newest items."
        expected: "All eight models show words while you speak and finish within a few seconds of Stop; each second run starts cleanly and the microphone indicator goes away after it. History shows every item with its model name and cost."
        final_gate: true
      - id: "mac-paid-batch-providers"
        issues:
          - 1114
        title: "OpenAI and Groq recorded transcription"
        minutes: 3
        core: false
        build: "Just Speak to It for Mac, Alpha build 61 or later"
        prerequisites:
          - "Decision: a provider spend cap is approved (decision-provider-spend-cap)"
          - "Use made-up sentences only. If a listed model has no key or fails, mark Fail and name it in the note."
        steps:
          - "Settings \u203a Transcription \u203a Remote \u203a Batch: choose an OpenAI model."
          - "Dictate \u201cbatch check\u201d into TextEdit and stop."
          - "Choose a Groq model and repeat, then open History."
        expected: "Each run inserts the phrase once and History shows both items with their model names and cost."
        final_gate: true
      - id: "mac-openrouter-audio"
        issues:
          - 821
        title: "OpenRouter speech and transcription models from the catalogue"
        minutes: 6
        core: false
        build: "Just Speak to It for Mac, Alpha build 61 or later"
        prerequisites:
          - "Decision: a provider spend cap is approved (decision-provider-spend-cap)"
          - "An OpenRouter key saved in Settings"
        steps:
          - "In Settings, open the OpenRouter speech model picker, search for a speech model, pick a voice and select it for voice output."
          - "Have the app speak a long paragraph, then start it again and stop it halfway."
          - "Open the OpenRouter transcription model picker, select a transcription model and dictate \u201copenrouter check\u201d."
          - "Open History."
        expected: "Speech starts before the whole clip has downloaded, uses the chosen voice and stops at once when stopped. The transcription inserts once and History shows the chosen model\u2019s name and cost."
        final_gate: true
      - id: "mac-paid-new-providers"
        issues:
          - 1210
          - 1051
        title: "New providers and Azure with newly opened accounts"
        minutes: 20
        core: false
        build: "Just Speak to It for Mac, Alpha build 61 or later"
        prerequisites:
          - "Decision: \u201cUp to $40\u201d spend cap (new accounts allowed)"
          - "An Azure Speech resource in a region that serves MAI models"
          - "Steps and route list: Docs/azure-speech.md and #1210"
        steps:
          - "Save keys for Pulse, Reson8, StepAudio, Alibaba (international workspace), AssemblyAI and Azure Speech."
          - "For each batch model of those providers, dictate \u201cnew provider batch\u201d into TextEdit and stop."
          - "For each streaming model (Reson8, Alibaba Fun-ASR realtime, AssemblyAI Universal-3.6 Pro, Azure Speech, Azure MAI), dictate \u201cnew provider live\u201d and stop."
          - "For Pulse, choose a non-English language and try once."
          - "Open History."
        expected: "Every route transcribes the phrase once, streaming routes show words while you speak (Azure MAI Transcribe (Turn-based) shows each turn when you pause), and History names the model with its cost. Pulse refuses the non-English run before sending audio. Note any route that is unavailable to your account."
        final_gate: true
      - id: "owner-cloudkit-shared-container"
        issues:
          - 1119
        title: "Assign the shared iCloud container to the iPhone app"
        minutes: 15
        core: false
        build: "Apple Developer portal and CloudKit Console; current main with PR #1369"
        prerequisites:
          - "Steps: https://github.com/crmitchelmore/justspeaktoit/blob/main/Docs/cloudkit-shared-container.md"
        steps:
          - "Identifiers \u203a com.justspeaktoit.ios \u203a iCloud \u203a Configure: also tick iCloud.com.justspeaktoit; do the same for com.justspeaktoit.ios.alpha with iCloud.com.justspeaktoit.alpha."
          - "Regenerate the iOS App Store profiles for both App IDs, and update the IOS_APPSTORE_PROFILE secret if it holds one."
          - "In CloudKit Console, deploy the Development schema of iCloud.com.justspeaktoit and .alpha to Production if any iPhone record type is missing."
          - "Set the repository variable IOS_SHARED_CLOUD_CONTAINER to 1."
        expected: "The next Alpha iOS build signs and uploads with both containers. Then run iphone-shared-icloud-container."
        final_gate: false
      - id: "owner-posthog-gates"
        issues:
          - 776
          - 814
        title: "PostHog: purge key, deletion and production evidence"
        minutes: 30
        core: false
        build: "PostHog EU Production and GitHub settings; current main with PR #1370"
        prerequisites:
          - "Steps: Docs/posthog-maintenance.md (12-month retention purge)"
        steps:
          - "Create a PostHog personal API key for the Production project with only Data deletion write access; add it as POSTHOG_PURGE_API_KEY, and the project id as POSTHOG_PROJECT_ID, in a new GitHub environment posthog-purge limited to main."
          - "Run the PostHog retention purge workflow with mode geoip-test-events, first as a dry run (expect 7), then for real; then run mode retention as a dry run."
          - "Screenshot PostHog Production settings showing EU hosting, GeoIP off and IP discarding, and add them to #776."
          - "Rotate the PostHog project API key once, let an agent ship the new key in an Alpha, and confirm opted-in events still arrive."
          - "Approve one Release-build network capture with analytics opted in, for an agent to inspect."
        expected: "Purge runs succeed, the 7 GeoIP-tagged events are gone, and the settings, rotation and capture evidence is on #776. One clean inspection week then unblocks #814."
        final_gate: false
      - id: "owner-stripe-setup"
        issues:
          - 648
        title: "Paid Access: Stripe and server setup"
        minutes: 45
        core: false
        build: "Stripe dashboard, Cloudflare and Apple Developer portal"
        prerequisites:
          - "Decision: decision-paid-mac-signin answered with a sign-in method (skip this check if you chose Defer)"
          - "Steps: Docs/paid-access.md (External product setup). Use Stripe test mode only; no live keys."
        steps:
          - "Create the D1 databases paid-access and paid-access-staging and put their ids in workers/paid-access/wrangler.toml."
          - "In Stripe test mode create the prices, enable the Customer Portal and add the webhook endpoint; put the price ids in wrangler.toml and the secrets in the Worker."
          - "Do the portal steps for the chosen Mac sign-in."
          - "Sign off the privacy and retention text in Docs/paid-access-privacy.md."
        expected: "Staging is configured so an agent can wire the Mac sign-in and run the staging purchase and refund drill. Paid Access stays switched off for users."
        final_gate: false
      - id: "owner-partner-center"
        issues:
          - 1157
        title: "Microsoft Store: open a Partner Center account"
        minutes: 30
        core: false
        build: "Microsoft Partner Center"
        prerequisites:
          - "Steps: Docs/windows-installer.md (Owner steps: Microsoft Store)"
        steps:
          - "Go to https://storedeveloper.microsoft.com and create a free individual developer account, completing the ID check."
          - "Reserve the app name Just Speak to It."
          - "Copy the Package/Identity Name and Publisher values from Product identity into a comment on #1157."
        expected: "The reserved identity is on #1157, so an agent can set the MSIX identity and add the Store submission job."
        final_gate: false
  - id: "iphone"
    device: "iPhone"
    title: "iPhone"
    setup:
      - "Install TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later on an iPhone with an Action Button (iOS 26+)."
      - "In the app: API keys for OpenRouter (polish), OpenAI and Deepgram saved; Settings \u203a Action Button & Shortcuts \u203a When Recording Stops = Copy & Polish (default is Auto)."
      - "Settings \u203a Transcription \u203a Where transcription runs = Local (Apple SpeechTranscriber)."
      - "iOS Settings \u203a Action Button \u203a Controls: choose Transcribe Voice (Just Speak to It Alpha)."
      - "Have Notes open on a scratch note, AirPods in their case, and your Mac (same Apple ID, Handoff on) nearby."
    items:
      - id: "iphone-clipboard-e2e"
        issues:
          - 934
          - 1117
        title: "Cold Action Button start: raw paste now, your later copy kept"
        minutes: 6
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026 (not device evidence): raw text on the clipboard at Stop and a later copy kept, via deep links and the simulator transcript hook. Still pending on a physical iPhone."
        steps:
          - "Force-quit Just Speak to It in the App Switcher."
          - "From the Home Screen, press and hold the Action Button, say \"raw clipboard, um, test\", then press and hold again to stop."
          - "Within 2 seconds paste into Notes."
          - "In Notes type MARKER, select it and tap Copy."
          - "Wait 20 seconds, paste again, then open History."
        expected: "First paste is the raw words (fillers included), never a placeholder. Second paste is MARKER (polish did not overwrite your copy). History has exactly one item, showing the polished text. Recording started from cold and no Live Activity lingers."
        final_gate: true
      - id: "iphone-clipboard-locked"
        issues:
          - 934
        title: "Stop while locked, then unlock and paste raw text"
        minutes: 3
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "Press and hold the Action Button, say \"locked stop\", then press the side button to lock."
          - "While locked, stop with the Action Button or the Lock Screen Stop button."
          - "Wait 20 seconds, unlock and paste into Notes."
        expected: "Paste is the raw \"locked stop\"; History has one polished item. No placeholder. Add your iOS version and whether Stop needed an unlock to any Fail note."
        final_gate: true
      - id: "iphone-siri-interruption"
        issues:
          - 1117
        title: "Siri interruption keeps the text and the next recording works"
        minutes: 3
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "Tap the mic in the app and say \"before interruption\"."
          - "Hold the side button to invoke Siri, then dismiss Siri."
          - "If still recording, tap Stop; then make and stop a new short recording."
        expected: "The recording continued or stopped with a clear message; History has one item with \"before interruption\" (no duplicate) and the new recording works."
        final_gate: true
      - id: "iphone-focus-filter"
        issues:
          - 1014
        title: "Focus filter forces History Only, and only for runs it started"
        minutes: 6
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026: the Focus Capture Overrides settings text matches. Filter behaviour still pending on a physical iPhone."
        steps:
          - "iOS Settings \u203a Focus \u203a Do Not Disturb \u203a Add Filter \u203a Just Speak to It Alpha \u203a Capture Overrides: Destination = History Only."
          - "Turn Do Not Disturb on, copy MARKER2 in Notes, then press and hold the Action Button and open the app."
          - "Check the line under the status, say \"focus one\", stop, and paste in Notes."
          - "Start another recording with the Action Button, say \"focus two\", turn Do Not Disturb off in Control Center, stop, and paste."
          - "Record \"focus three\" with the Action Button, stop, and paste."
          - "Clean up: delete the filter and tap Reset Stored Override in the app's Settings \u203a Focus Capture Overrides."
        expected: "The app shows \"Save to History Only \u00b7 Focus\". The first two pastes give MARKER2 (no clipboard write; History has \"focus one\" and \"focus two\"). The third paste gives \"focus three\"."
        final_gate: true
      - id: "iphone-bluetooth-local"
        issues:
          - 935
        title: "AirPods route changes: on-device capture and hands-free stay truthful"
        minutes: 5
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "With AirPods in the case, tap the mic and say \"alpha one two three\"; put the AirPods in and, once connected, say \"bravo four five six\", then stop if still recording."
          - "Settings \u203a Behavior: turn Hands-Free Dictation on, tap the mic to arm and wait for Armed."
          - "Say a long sentence starting \"utterance kept\" and, mid-sentence, put the AirPods back in the case."
          - "Read the indicator and any message, disarm, then open History."
        expected: "Each run either carried on or stopped with \"The microphone changed and recording stopped.\" Nothing shows Recording or Armed while deaf. History keeps \"alpha one two three\" and one item with \"utterance kept\". A new recording works afterwards."
        final_gate: true
      - id: "iphone-bluetooth-remote"
        issues:
          - 935
        title: "AirPods route changes: OpenAI Realtime and Deepgram streaming"
        minutes: 5
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "Set Where transcription runs = Remote, Remote Mode = Streaming, model = OpenAI GPT Live Transcribe (Streaming)."
          - "With AirPods connected, tap the mic, say \"charlie one two three\", put the AirPods in the case, say \"delta four\", then stop if still recording."
          - "Switch the Remote Streaming Model to Deepgram Nova-3 (Streaming)."
          - "With AirPods in the case, tap the mic, say \"echo one two three\", put the AirPods in, say \"foxtrot four\", then stop if still recording."
          - "Open History, then set Where transcription runs back to Local."
        expected: "For both providers: recording carried on or stopped with \"The microphone changed and recording stopped.\"; History keeps the first phrase; nothing shows Recording without new text; the next recording works."
        final_gate: true
      - id: "iphone-shortcuts-last-transcript"
        issues:
          - 1016
        title: "Shortcuts: Get Last Transcript works and needs unlock when locked"
        minutes: 5
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "In Shortcuts create \"JS Last\": Just Speak to It Alpha \u203a Get Last Transcript, then Show Result of its Raw Text and Polished Text."
          - "Run it, force-quit Shortcuts, reopen and run it again."
          - "Lock the iPhone and say \"Hey Siri, JS Last\"; unlock when asked."
        expected: "Both runs show the newest recording's raw and polished text, matching History. When locked, nothing is shown or spoken until you authenticate."
        final_gate: true
      - id: "iphone-clipboard-privacy-mac"
        issues:
          - 994
        title: "Clipboard: expires on iPhone, reaches the Mac only when opted in"
        minutes: 7
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026 (not device evidence): 1-minute expiry cleared the clipboard. Universal Clipboard and all device behaviour still pending."
        steps:
          - "App Settings \u203a Privacy Information \u203a Clipboard: Transcript expiry = 1 minute, Allow Universal Clipboard off."
          - "On the Mac copy MACMARK; on the iPhone record \"local only\" with the Action Button and stop."
          - "Within 30 seconds press Cmd+V on the Mac, then paste in iPhone Notes."
          - "Wait 90 seconds and paste on the iPhone again."
          - "Turn Allow Universal Clipboard on, record \"universal check\" and stop; within 30 seconds paste on the Mac."
          - "Set Allow Universal Clipboard off and expiry back to 5 minutes."
        expected: "Mac pastes MACMARK and the iPhone pastes \"local only\"; after 90 seconds the iPhone pastes nothing. With the opt-in, the Mac pastes \"universal check\". The settings text says Mac copies may not expire."
        final_gate: true
      - id: "iphone-controls-and-hints"
        issues:
          - 954
        title: "Control Center, Action Button hints and Lock Screen control"
        minutes: 6
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026: setup screen copy renders, including at the largest text size. Pickers, hints and recording still pending."
        steps:
          - "Read the app's Settings \u203a Action Button & Shortcuts \u203a Set Up Transcribe Voice and follow it to add Transcribe Voice to Control Center."
          - "Tap the control to record \"control test\", tap again to stop, and paste."
          - "Press the Action Button briefly and read the hint; press and hold to start, press briefly and read the hint, press and hold to stop."
          - "Add Transcribe Voice to a Lock Screen bottom slot, then start and stop from the Lock Screen."
        expected: "Written steps match the real pickers. Hints read \"Start dictation\" when idle and \"Stop dictation\" while recording. Each route records once and pastes; note any unlock prompt. Needs iOS 18 and 26 evidence to close #954."
        final_gate: false
      - id: "iphone-transcript-alerts"
        issues:
          - 1017
        title: "Transcript Ready alerts: delivery, privacy and denied state"
        minutes: 6
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026, inconclusive: no banner appeared while a result Live Activity was showing, even with Live Activities off. Still pending on a physical iPhone."
        steps:
          - "Settings \u203a Behavior: Live Activities off; Settings \u203a Saved Results: Transcript Ready Alerts on, Allow."
          - "Start a recording, say \"alert one\", go Home, stop with Transcribe Voice in Control Center, then tap the banner."
          - "Start a recording, say \"alert two\", lock, stop with the Action Button, then use the alert's Open History."
          - "Record once with the app in the foreground."
          - "Turn Live Activities back on."
        expected: "One banner with no transcript text each time; tapping opens the exact History item (unlock first when locked). No alert for the foreground recording."
        final_gate: false
      - id: "iphone-keyboard-v2"
        issues:
          - 661
        title: "Keyboard: setup, insert once in Notes and WhatsApp, cancel"
        minutes: 7
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "iOS Settings \u203a General \u203a Keyboard \u203a Keyboards \u203a Add: Just Speak; turn Allow Full Access on."
          - "In Notes switch to the Just Speak keyboard, tap the mic, say \"keyboard notes\" and stop."
          - "Do the same in a WhatsApp chat with \"keyboard whatsapp\"."
          - "Start once more and tap Cancel."
        expected: "Each dictation inserts exactly once with a leading space where needed; Cancel inserts nothing; no microphone prompt appears inside the keyboard. Still needs an iOS 17 iPhone and iPad to close #661."
        final_gate: false
      - id: "iphone-hands-free"
        issues:
          - 614
        title: "Hands-free: fast start on speech, no capture in silence"
        minutes: 4
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "Settings \u203a Behavior: Hands-Free Dictation on; arm with the mic button."
          - "Say \"Go quick start\", then stay silent until it finishes."
          - "Stay silent for 60 more seconds, then disarm and open History."
        expected: "Armed \u2192 Recording as you start speaking, then back to Armed after silence without tapping Stop. History has one item starting \"Go\"; nothing is recorded during the silent minute."
        final_gate: false
      - id: "iphone-history-upgrade"
        issues:
          - 1118
        title: "iPhone: existing History survives the update"
        minutes: 3
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "Before updating, note the text of your newest two History items."
          - "Update in TestFlight and open History."
          - "Record once, force-quit, reopen and check History."
        expected: "Older items are unchanged and the new recording survives the relaunch."
        final_gate: false
      - id: "iphone-shared-icloud-container"
        issues:
          - 1119
        title: "iPhone History moves into the shared iCloud container"
        minutes: 8
        core: false
        build: "TestFlight Just Speak to It Alpha built after IOS_SHARED_CLOUD_CONTAINER=1"
        prerequisites:
          - "owner-cloudkit-shared-container done"
        steps:
          - "Before updating, check iCloud sync is on and note the date and time of your oldest iPhone History item."
          - "Update in TestFlight, open the app and wait a minute on the History screen."
          - "In CloudKit Console open iCloud.com.justspeaktoit.alpha \u203a Production \u203a Private Database, act as your iCloud account and query the History zone."
          - "Record \u201cshared container\u201d and query again after a minute."
          - "Settings: turn API key sync on again with your passphrase."
        expected: "History on the iPhone is unchanged. The shared container has a History record created at the same date and time as your oldest iPhone item, and the new recording appears there within a minute. Key sync turns on without errors."
        final_gate: true
      - id: "iphone-marketing-footage"
        issues:
          - 1368
        title: "Website footage: Action Button start, Live Activity and Control Centre stop"
        minutes: 8
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Turn on Do Not Disturb, set the time to 9:41 if you can, and use only fictional words; nothing personal may appear on screen."
        steps:
          - "Start a screen recording from Control Centre, then go to the Home Screen."
          - "Press and hold the Action Button and say \"Pick up oat milk and lemons on the way home\"."
          - "While talking, show the Dynamic Island, then tap Stop in the Live Activity."
          - "Start again from the Transcribe control in Control Centre, say \"Move the team lunch to Thursday\", and stop it the same way."
          - "Stop the screen recording and attach it to #1368 (or share it with the agent)."
        expected: "A recording under one minute showing both starts and stops, the Live Activity with the fictional words, and no notifications, names or personal data on screen."
        final_gate: false
  - id: "watch"
    device: "Watch"
    title: "Apple Watch + iPhone"
    setup:
      - "Double Tap-capable Watch (Series 9+, Ultra 2) on watchOS 11+, paired with the iPhone; Watch Settings \u203a Gestures \u203a Double Tap on."
      - "iPhone Watch app \u203a Smart Stack \u203a Live Activities on; Transcribe Voice in iPhone Control Center."
      - "Optional watch-app checks only (decided: dev build now): register the watch ids and App Group (Docs/watch-provisioning.md steps 1-3), then build with TUIST_WATCH_APP=1 tuist generate and run the SpeakiOS scheme on your iPhone."
    items:
      - id: "watch-smart-stack-stop"
        issues:
          - 963
        title: "Smart Stack card: tap and Double Tap stop a locked iPhone"
        minutes: 7
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later; no watch app needed"
        steps:
          - "On the iPhone tap Transcribe Voice in Control Center, wait for Recording, then lock the iPhone."
          - "Raise the Watch, open the Smart Stack, say \"watch tap\" and tap Stop on the small Just Speak to It card."
          - "Start again the same way, say \"watch double tap\" and Double Tap (pinch twice) without touching the screen."
          - "On the finished card, Double Tap again."
          - "Start once more, wake the iPhone without unlocking and tap Stop on the full-size Lock Screen card."
          - "Unlock and open History."
        expected: "Both Watch stops end recording within a few seconds (iPhone mic indicator gone). The finished card has no Stop and Double Tap starts nothing. The Lock Screen card looks as before and its Stop works. History has exactly three new items."
        final_gate: true
      - id: "watch-app-e2e"
        issues:
          - 657
          - 659
        title: "Watch app: complication start, 60 s wrist-down, delivered to iPhone"
        minutes: 8
        core: false
        build: "Xcode dev build from current main with TUIST_WATCH_APP=1 (see Watch setup)"
        prerequisites:
          - "Watch provisioning done (Docs/watch-provisioning.md steps 1-3)"
        steps:
          - "Add the Just Speak to It \"Record\" complication to a watch face; note the Watch battery %."
          - "Tap the complication, say \"marker alpha\" and lower your wrist so the screen sleeps."
          - "Say \"marker bravo\" at about 30 s and \"marker charlie\" at about 60 s."
          - "Raise the wrist and tap the complication to stop."
          - "Watch the complication until it shows In history, then open iPhone History and note the battery % again."
        expected: "Recording starts without opening the app screen and the timer reads about 1:05 when you raise the wrist. The complication goes Sending \u2192 In history. iPhone History has one entry with alpha, bravo and charlie. Add both battery readings to a Fail note or the issue."
        final_gate: true
      - id: "watch-app-offline"
        issues:
          - 657
          - 659
        title: "Watch app: offline and force-quit captures still deliver once"
        minutes: 7
        core: false
        build: "Xcode dev build from current main with TUIST_WATCH_APP=1 (see Watch setup)"
        prerequisites:
          - "Watch provisioning done (Docs/watch-provisioning.md steps 1-3)"
        steps:
          - "Turn on iPhone Airplane Mode (Bluetooth and Wi-Fi off)."
          - "Tap the complication, say \"offline seven\", tap to stop."
          - "Tap the complication, say \"force quit eight\" for 5 s, then force-quit the watch app (side button, swipe, X)."
          - "Reopen the watch app, then turn Airplane Mode off and wait 2 minutes."
          - "Open iPhone History."
        expected: "While offline the captures wait (never Failed or stuck Recording). After reconnecting both show In history, and iPhone History has exactly one entry each for \"offline seven\" and \"force quit eight\"."
        final_gate: true
      - id: "watch-marketing-footage"
        issues:
          - 1368
        title: "Website footage: stop a locked iPhone from the Watch Smart Stack"
        minutes: 6
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later; no watch app needed"
        prerequisites:
          - "Do Not Disturb on both devices; a second phone or camera to film the Watch and iPhone together; fictional words only."
        steps:
          - "Start filming the Watch and the iPhone together."
          - "On the iPhone tap Transcribe Voice in Control Center, say \"Book the team lunch for Thursday\" and lock the iPhone."
          - "Raise the Watch, open the Smart Stack and tap Stop on the Just Speak to It card."
          - "Unlock the iPhone and open History so the new item is visible, then stop filming."
          - "Attach the video to #1368 (or share it with the agent)."
        expected: "A clip under 30 seconds showing the Watch stop ending the iPhone recording and the new item in History, with no notifications or personal data visible."
        final_gate: false
