  - id: "windows"
    device: "Windows"
    title: "Windows"
    setup:
      - "A Windows 11 PC with the Just Speak to It Alpha for Windows installed and Narrator available, and at least two recordings in History."
      - "Use made-up sentences only. Keep a second computer or phone handy to export settings from."
    items:
      - id: "windows-command-palette"
        issues:
          - 1619
        title: "Search for anything: actions, History and settings from the keyboard"
        minutes: 4
        core: false
        build: "Just Speak to It for Windows, an Alpha build that includes #1619"
        steps:
          - "With the main window focused, press Ctrl+K and check focus lands in the Search for anything box, and that Narrator reads it as Search for anything."
          - "Without typing, press Down and check the list starts with actions such as Start or Stop Transcribing, then recent History, then suggested settings."
          - "Type history and press Enter on Show History; check the History page opens."
          - "Press Ctrl+K again, type a word from an older recording and choose its History result; check that recording is selected on the History page."
          - "Press Ctrl+K, type silence, choose the setting and check its page opens with that preference highlighted. Press Ctrl+K, type zzqx and check No results is shown and announced, then press Escape."
        expected: "Ctrl+K always focuses the search box. Results list actions first, then History, then settings, each read as its title then its kind (Action, History or the settings page). Choosing an action runs it, a History result selects that recording, and a setting opens and highlights its field. Escape restores the sidebar pages."
        final_gate: true
      - id: "windows-telemetry-consent"
        issues:
          - 1624
        title: "Analytics and crash-report switches start off and only Settings changes them"
        minutes: 6
        core: true
        build: "Just Speak to It for Windows, an Alpha build that includes the #1624 desktop telemetry change"
        steps:
          - "On a fresh install, open Settings \u203a General and find Share anonymous usage analytics and Send crash reports and diagnostics."
          - "Import a settings file exported from a Mac or another desktop on which both are on, then reopen Settings."
          - "Turn on only Send crash reports and diagnostics, apply, quit and reopen the app; then turn it off again."
          - "With Narrator on, move focus to each switch and listen to what it announces."
        expected: "Both switches are off on a fresh install and stay off after the import. Each switch changes only its own choice and keeps it after a restart. A screen reader reads each switch's name and on or off state."
        final_gate: false
      - id: "windows-crash-report-unclean-exit"
        issues:
          - 1624
        title: "An unclean exit sends one crash report on the next launch"
        minutes: 5
        core: false
        build: "Just Speak to It for Windows, a release Alpha build that includes the #1624 desktop telemetry change"
        steps:
          - "Turn on Send crash reports and diagnostics in Settings \u203a General and apply."
          - "Dictate a made-up sentence, then end the app's process from the system's process manager instead of quitting."
          - "Open the app, wait a minute, then quit normally and open it again."
          - "Ask the owner to look in Sentry for a desktop.unclean_exit event from this build."
        expected: "Exactly one unclean-exit report arrives, with the app version and OS but no transcript text, file path, user name or installation ID. A normal quit and relaunch sends nothing more."
        final_gate: false
      - id: "windows-config-transfer"
        issues:
          - 1635
        title: "Back up and restore every setting, with a preview and API keys only on request"
        minutes: 10
        core: false
        build: "Just Speak to It for Windows, an Alpha build that includes the #1635 desktop configuration backup"
        steps:
          - "Open Settings \u203a General \u203a Audio, output and backup, tick Saved audio, choose Save ZIP backup and answer No when asked to include API keys."
          - "Change a setting (for example Voice commands), add a pronunciation and delete a History entry with audio, then choose Restore backup and pick the first ZIP."
          - "Answer No when asked to restore API keys, read the preview, then cancel and confirm nothing changed."
          - "Restore the ZIP again, choose Merge and check the setting, pronunciation and History entry (with its audio) are back."
          - "Save a second backup with API keys included, change one key, then restore it with API keys included and choose Replace."
          - "Restore a Mac export (Settings \u203a Data & Migration on the Mac) and read the preview's skipped items. With Narrator on, listen to each prompt and switch."
        expected: "Nothing changes until Merge or Replace. The preview lists counts and conflicts for settings, connections, vocabulary, History and recordings, and says the backup's API keys were left out unless you chose them. Restoring brings everything back in one step; API keys move only when chosen on both save and restore. Model files are never copied: the preview names models to download from Local models. A Mac export restores what this device supports and lists what it skipped, without changing anything else."
        final_gate: false
      - id: "windows-openrouter-model-browser"
        issues:
          - 1618
        title: "Browse OpenRouter models for transcription and cleanup, check details, then choose one"
        minutes: 8
        core: false
        build: "Just Speak to It for Windows, an Alpha build that includes the #1618 desktop OpenRouter browser"
        steps:
          - "Settings \u203a Transcription: choose Remote and Batch. Check Browse OpenRouter models\u2026 appears beside Refresh models, then switch to Live or Local and check it disappears."
          - "Back on Remote Batch, open Browse OpenRouter models\u2026. Search for a made-up name, then clear it; choose a provider and turn on Zero listed prices, then turn it off and choose All providers."
          - "Select a model and read its pricing in the details pane, then choose it. Check the model picker now shows OpenRouter \u203a the model name."
          - "Settings \u203a Post-processing, Clean-up: choose the Remote source, open Browse OpenRouter models\u2026, choose a cleanup model and press Apply. Reopen the browser and check that model is marked as selected."
          - "With Narrator on, repeat the search and filters using only the keyboard, then press Escape to close the browser."
        expected: "The browser lists only OpenRouter models the picker offers, narrows as you search and filter, and shows a clear message when nothing matches. The details pane shows pricing (or says it is not listed) before choosing. A chosen transcription model shows as OpenRouter \u203a name; a chosen cleanup model is kept after Apply. Narrator reads every control's name and the result count, and Escape closes the browser without changing the model."
        final_gate: false
      - id: "windows-send-from-phone"
        issues:
          - 1640
        title: "Send from phone: pair an iPhone, receive a transcript, forget the phone"
        minutes: 6
        core: false
        build: "Just Speak to It Alpha for Windows that includes the #1640 phone receiver, and a TestFlight Just Speak to It Alpha on an iPhone on the same Wi-Fi"
        steps:
          - "On the PC open Settings \u203a iCloud Sync, choose Send from phone, tick Receive transcripts from a phone and allow private networks if Windows Firewall asks. Note the pairing code."
          - "On the phone open Settings \u203a Sync & Transfer \u203a Send to Mac, allow Local Network access, tap Pair with <this computer's name>, enter the code and tap Pair."
          - "On the computer click into a scratch text editor, then on the phone long-press a History entry and choose Send to Mac."
          - "On the computer choose New pairing code, then send another History item from the phone. Then on the phone forget the computer, pair again with the new code and send once more."
          - "In Paired phones select the phone and choose Forget phone, then send again from the phone."
          - "Turn receiving off and send once more. Then search Settings for \"send from phone\" and, with Narrator on, move through the receiver controls."
        expected: "The phone shows the computer as paired and it appears under Paired phones. Each send shows Sent to <this computer> and types the text once at the cursor. A new pairing code empties Paired phones and the next send asks you to pair again; re-pairing works. After Forget the send asks you to pair again and never re-pairs on its own. With receiving off the send fails within ten seconds. Search finds Send from phone. Narrator reads each control's name and state and the code."
        final_gate: false
  - id: "linux"
    device: "Linux"
    title: "Linux"
    setup:
      - "A Linux desktop (GNOME on Wayland or X11) with the Just Speak to It Alpha for Linux installed and Orca available, and at least two recordings in History."
      - "Use made-up sentences only. Keep a second computer or phone handy to export settings from."
    items:
      - id: "linux-command-palette"
        issues:
          - 1619
        title: "Search for anything: actions, History and settings from the keyboard"
        minutes: 4
        core: false
        build: "Just Speak to It for Linux, an Alpha build that includes #1619"
        steps:
          - "With the main window focused, press Ctrl+K and check focus lands in the Search for anything box, and that Orca reads it as Search for anything."
          - "Without typing, press Down and check the list starts with actions such as Start or Stop Transcribing, then recent History, then suggested settings."
          - "Type history and press Enter on Show History; check the History page opens."
          - "Press Ctrl+K again, type a word from an older recording and choose its History result; check that recording is selected on the History page."
          - "Press Ctrl+K, type silence, choose the setting and check its page opens with that preference highlighted. Press Ctrl+K, type zzqx and check No results is shown and announced, then press Escape."
        expected: "Ctrl+K always focuses the search box. Results list actions first, then History, then settings, each read as its title then its kind (Action, History or the settings page). Choosing an action runs it, a History result selects that recording, and a setting opens and highlights its field. Escape restores the sidebar pages."
        final_gate: true
      - id: "linux-telemetry-consent"
        issues:
          - 1624
        title: "Analytics and crash-report switches start off and only Settings changes them"
        minutes: 6
        core: true
        build: "Just Speak to It for Linux, an Alpha build that includes the #1624 desktop telemetry change"
        steps:
          - "On a fresh install, open Settings \u203a General and find Share anonymous usage analytics and Send crash reports and diagnostics."
          - "Import a settings file exported from a Mac or another desktop on which both are on, then reopen Settings."
          - "Turn on only Send crash reports and diagnostics, apply, quit and reopen the app; then turn it off again."
          - "With Orca on, move focus to each switch and listen to what it announces."
        expected: "Both switches are off on a fresh install and stay off after the import. Each switch changes only its own choice and keeps it after a restart. A screen reader reads each switch's name and on or off state."
        final_gate: false
      - id: "linux-crash-report-unclean-exit"
        issues:
          - 1624
        title: "An unclean exit sends one crash report on the next launch"
        minutes: 5
        core: false
        build: "Just Speak to It for Linux, a release Alpha build that includes the #1624 desktop telemetry change"
        steps:
          - "Turn on Send crash reports and diagnostics in Settings \u203a General and apply."
          - "Dictate a made-up sentence, then end the app's process from the system's process manager instead of quitting."
          - "Open the app, wait a minute, then quit normally and open it again."
          - "Ask the owner to look in Sentry for a desktop.unclean_exit event from this build."
        expected: "Exactly one unclean-exit report arrives, with the app version and OS but no transcript text, file path, user name or installation ID. A normal quit and relaunch sends nothing more."
        final_gate: false
      - id: "linux-voice-edit-selection"
        issues:
          - 1620
        title: "Edit Selection by Voice rewrites only the captured selection"
        minutes: 8
        core: false
        build: "Just Speak to It for Linux, an Alpha build that includes the #1620 Linux voice edit change, with a cleanup model and its key set up"
        steps:
          - "Bind justspeaktoit --edit-selection-by-voice to a key in your desktop's keyboard settings (on X11 you can instead turn on Global for Edit Selection by Voice in Keyboard › Action shortcuts)."
          - "Open Voice Output › Selection access, choose Allow and accept. In gedit or GNOME Text Editor, type a made-up sentence and select one word of it."
          - "Press the binding, say make this uppercase, then press the binding again. Check only the selected word changes and the rest of the line is untouched."
          - "Select another word and press the binding, then click elsewhere in the same document before pressing the binding again."
          - "Press the binding with nothing selected, and once more after choosing Stop access in Voice Output."
        expected: "The first edit replaces exactly the selected word once and the app reports the captured selection was replaced. Moving the caret or focus during dictation leaves the document unchanged and says the rewrite was copied instead; pasting shows the rewrite. With nothing selected or access stopped the app explains that it needs selected text it can read, then stops without listening or typing anywhere."
        final_gate: false
      - id: "linux-config-transfer"
        issues:
          - 1635
        title: "Back up and restore every setting, with a preview and API keys only on request"
        minutes: 10
        core: false
        build: "Just Speak to It for Linux, an Alpha build that includes the #1635 desktop configuration backup"
        steps:
          - "Open Settings \u203a General \u203a Data backup, turn on Include saved recording audio, leave Include API keys off and choose Save backup."
          - "Change a setting (for example Voice commands), add a pronunciation and delete a History entry with audio, then choose Restore backup and pick the first ZIP."
          - "Read the preview, then cancel and confirm nothing changed."
          - "Restore the ZIP again, choose Merge and check the setting, pronunciation and History entry (with its audio) are back."
          - "Save a second backup with API keys included, change one key, then restore it with API keys included and choose Replace."
          - "Restore a Mac export (Settings \u203a Data & Migration on the Mac) and read the preview's skipped items. With Orca on, listen to each prompt and switch."
        expected: "Nothing changes until Merge or Replace. The preview lists counts and conflicts for settings, connections, vocabulary, History and recordings, and says the backup's API keys were left out unless you chose them. Restoring brings everything back in one step; API keys move only when chosen on both save and restore. Model files are never copied: the preview names models to download from Local models. A Mac export restores what this device supports and lists what it skipped, without changing anything else."
        final_gate: false
