name: Desktop Icon Resources

on:
  # No pull_request trigger: pull requests merge on their pre-pr record and
  # main verifies every change after the merge (ci.yml, auto-revert.yml).
  push:
    branches: [main]
    paths:
      - .gitattributes
      - Resources/AppIcon.iconset/**
      - Resources/Desktop/**
      - Sources/CWindowsSupport/**
      - Sources/CLinuxSupport/**
      - Sources/SpeakLinux/**
      - Package.swift
      - packaging/linux/**
      - scripts/assets/generate-icon.swift
      - scripts/assets/generate-desktop-icons.py
      - scripts/linux/stage-linux-desktop.py
      - scripts/tests/test_desktop_icons.py
      - scripts/windows-package/**
      - scripts/windows-bundle/**
      - .github/workflows/desktop-icons.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resources:
    if: ${{ !startsWith(github.head_ref, 'merge-batch/') }}
    name: Canonical desktop icon and package invariants
    runs-on: ${{ fromJSON(((github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.JSTI_NATIVE_APPROVED_SHA == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.JSTI_NATIVE_APPROVED_SHA == github.event.pull_request.head.sha)) && (vars.JSTI_LINUX_RUNNER_LABELS || '["self-hosted","Linux","X64","omarchy-local"]') || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify exact canonical exports and native resource wiring
        run: |
          python3 scripts/assets/generate-desktop-icons.py --check
          python3 -B -m unittest discover -s scripts/tests -p test_desktop_icons.py -v
      - name: Verify MSIX logos and portable bundle packaging
        run: |
          python3 -B -m unittest discover -s scripts/windows-package -p test_windows_package.py -v
          python3 -B -m unittest discover -s scripts/windows-bundle -p test_windows_bundle.py -v
