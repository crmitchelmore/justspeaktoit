name: Linux Flatpak repository
# Self-hosted, GPG-signed Flatpak repository for the Linux beta, so installs
# update through `flatpak update` and the software centres. It replaces the
# Flathub route (#1219), whose policy bars agent-written submissions.
#
# Every run imports the qualified Alpha bundle into a fresh OSTree repository,
# signs it, writes the .flatpakref/.flatpakrepo descriptors and checks that
# the signed remote lists the app. A manifest run (from alpha-release.yml or a
# manual dispatch on main) then deploys it to the Cloudflare Pages project
# FLATPAK_PAGES_PROJECT, but only when the `flatpak-repo` environment holds
# FLATPAK_GPG_PRIVATE_KEY; otherwise it rehearses with a throwaway key and
# publishes nothing. See Docs/linux-packaging.md.
on:
  workflow_call:
    inputs:
      manifest:
        description: Immutable Alpha manifest tag whose Linux bundle to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      manifest:
        description: Alpha tag to publish (blank rehearses the newest Alpha with a Linux bundle)
        type: string
  pull_request:
    paths:
      - scripts/linux-flatpak-repo.py
      - scripts/tests/test_linux_flatpak_repo.py
      - .github/workflows/linux-flatpak-repo.yml
permissions:
  contents: read
concurrency:
  group: linux-flatpak-repo-${{ inputs.manifest && 'publish' || github.ref }}
  cancel-in-progress: false
env:
  APP_ID: com.justspeaktoit.JustSpeakToIt
  PAGES_PROJECT: ${{ vars.FLATPAK_PAGES_PROJECT || 'justspeaktoit-flatpak' }}
  REPO_URL: ${{ vars.FLATPAK_REPO_URL || 'https://justspeaktoit-flatpak.pages.dev/repo/' }}
  CHANNEL_URL: ${{ vars.FLATPAK_CHANNEL_URL || 'https://justspeaktoit-flatpak.pages.dev/channel.json' }}

jobs:
  repository:
    name: Build, sign and publish the Flatpak repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Holds the signing key; its deployment branch policy admits only main.
    environment: ${{ inputs.manifest && 'flatpak-repo' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit-test the repository helper
        run: python3 -B -m unittest discover -s scripts/tests -p test_linux_flatpak_repo.py -v
      - name: Resolve the Alpha bundle
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ inputs.manifest }}
          SIGNING_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          asset=JustSpeakToIt-linux-x86_64.flatpak
          if [ -n "$MANIFEST" ]; then
            tags="$MANIFEST"
          else
            tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 40 --json tagName \
              --jq '.[].tagName | select(test("^alpha-build-[1-9][0-9]*$"))')
          fi
          tag=""
          for candidate in $tags; do
            if gh release download "$candidate" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP" 2>/dev/null; then
              tag="$candidate"; break
            fi
          done
          if [ -z "$tag" ]; then
            echo "::notice::No qualified Linux bundle on ${MANIFEST:-recent Alphas}; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mode=rehearse
          if [ -n "$MANIFEST" ] && [ -n "$SIGNING_KEY" ] && [ "$GITHUB_REF" = refs/heads/main ]; then mode=publish; fi
          { echo "skip=false"; echo "tag=$tag"; echo "mode=$mode"; echo "bundle=$RUNNER_TEMP/$asset"; } >> "$GITHUB_OUTPUT"
          echo "Using $asset from $tag ($mode)"
      - name: Install Flatpak tooling
        if: steps.source.outputs.skip == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak ostree gnupg
      - name: Import the signing key
        if: steps.source.outputs.skip == 'false'
        id: key
        env:
          SIGNING_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          MODE: ${{ steps.source.outputs.mode }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          if [ "$MODE" = publish ]; then
            printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          else
            gpg --batch --passphrase '' --quick-gen-key "Just Speak to It rehearsal <rehearsal@invalid>" ed25519 sign 1d
          fi
          fingerprint=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          test -n "$fingerprint"
          gpg --batch --export "$fingerprint" > "$RUNNER_TEMP/public.gpg"
          { echo "fingerprint=$fingerprint"; echo "home=$GNUPGHOME"; } >> "$GITHUB_OUTPUT"
          echo "Signing with $fingerprint"
      - name: Build the signed repository
        if: steps.source.outputs.skip == 'false'
        env:
          BUNDLE: ${{ steps.source.outputs.bundle }}
          TAG: ${{ steps.source.outputs.tag }}
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
          GPG_HOME: ${{ steps.key.outputs.home }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          ostree init --mode=archive-z2 --repo="$site/repo"
          flatpak build-import-bundle --gpg-sign="$FINGERPRINT" --gpg-homedir="$GPG_HOME" \
            "$site/repo" "$BUNDLE"
          ostree refs --repo="$site/repo" | grep -qx "app/$APP_ID/x86_64/master"
          flatpak build-update-repo --gpg-sign="$FINGERPRINT" --gpg-homedir="$GPG_HOME" \
            --title="Just Speak to It" --default-branch=master --prune "$site/repo"
          python3 scripts/linux-flatpak-repo.py descriptors --site "$site" --repo-url "$REPO_URL" \
            --public-key "$RUNNER_TEMP/public.gpg" --tag "$TAG"
          python3 scripts/linux-flatpak-repo.py check-site "$site"
          echo "Files: $(find "$site" -type f | wc -l); size: $(du -sh "$site" | cut -f1)"
      - name: Verify the signed remote lists the app
        if: steps.source.outputs.skip == 'false'
        run: |
          set -euo pipefail
          flatpak remote-add --user --gpg-import="$RUNNER_TEMP/public.gpg" jsti-check "file://$RUNNER_TEMP/site/repo"
          flatpak remote-ls --user --app jsti-check | tee "$RUNNER_TEMP/remote-ls.txt"
          grep -q "$APP_ID" "$RUNNER_TEMP/remote-ls.txt"
          # A remote added with a different key must refuse the summary.
          wrong_home=$(mktemp -d)
          gpg --homedir "$wrong_home" --batch --passphrase '' --quick-gen-key "Wrong <wrong@invalid>" ed25519 sign 1d 2>/dev/null
          gpg --homedir "$wrong_home" --batch --export > "$RUNNER_TEMP/wrong.gpg"
          flatpak remote-add --user --gpg-import="$RUNNER_TEMP/wrong.gpg" jsti-wrong "file://$RUNNER_TEMP/site/repo"
          if flatpak remote-ls --user jsti-wrong >/dev/null 2>&1; then
            echo "::error::the repository verified with an unrelated key"; exit 1
          fi
      - name: Skip an Alpha older than the published one
        if: steps.source.outputs.mode == 'publish'
        id: order
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "$CHANNEL_URL" -o "$RUNNER_TEMP/published.json" || rm -f "$RUNNER_TEMP/published.json"
          publish=$(python3 scripts/linux-flatpak-repo.py should-publish --tag "$TAG" \
            --published-channel "$RUNNER_TEMP/published.json")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          [ "$publish" = true ] || echo "::notice::$TAG is not newer than the published Alpha; nothing deployed."
      - name: Create the Pages project on first publication
        if: steps.source.outputs.mode == 'publish' && steps.order.outputs.publish == 'true'
        # Fails harmlessly when the project already exists.
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PAGES_PROJECT }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: steps.source.outputs.mode == 'publish' && steps.order.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/site --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
      - name: Confirm the published channel
        if: steps.source.outputs.mode == 'publish' && steps.order.outputs.publish == 'true'
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "$CHANNEL_URL" | grep -q "\"$TAG\""; then echo "Published $TAG"; exit 0; fi
            sleep 10
          done
          echo "::error::$CHANNEL_URL does not report $TAG after deployment"; exit 1
