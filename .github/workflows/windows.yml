name: Windows and Portable Swift

# Nightly and on demand only. Every test here also runs natively on ARM64
# (windows-arm64.yml) and in the Mac-built x64 proof (windows-cross-proof.yml),
# which own pull request and main coverage. This keeps the only Windows-hosted
# x64 compile and the Apple URLSession loopback probes as a daily check, and
# Alpha qualification still dispatches it on the release tag.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      owned_capture_diagnostics:
        description: >-
          Manual opt-in only: capture isolated DesktopHostOwnedRecordingTests
          direct-executable exit/PID/WER evidence (read-only). Leaving this at
          its default runs the job exactly as an ordinary push/pull_request/
          manual dispatch always has.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  local-runtime:
    uses: ./.github/workflows/windows-local-runtime.yml

  windows:
    name: Native Windows x64 (Swift 6.2.3)
    needs: local-runtime
    runs-on: windows-2022
    # Setup plus the release test build and suite take ~30 min, leaving the
    # screenshot, on-device and staging steps their own headroom.
    timeout-minutes: 45
    env:
      # The pinned whisper.cpp runtime, its JFK sample and a cached model
      # folder, so the on-device tests run the real runtime instead of skipping.
      JSTI_WHISPER_RUNTIME_DIRECTORY: ${{ github.workspace }}\local-runtime\runtime
      JSTI_WHISPER_TEST_AUDIO: ${{ github.workspace }}\local-runtime\fixtures\jfk.wav
      JSTI_LOCAL_MODEL_DIRECTORY: ${{ github.workspace }}\local-models
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Swift toolchain
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          source: swift.org
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
          build_arch: amd64
          update-sdk-modules: false

      - name: Verify portable source boundary
        run: python scripts/verify-portable-core-boundary.py

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-local-runtime
          path: local-runtime

      # The pinned tiny model is downloaded by the app's own installer on a
      # miss and verified against its SHA-256 on every run.
      - name: Restore pinned local models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local-models
          key: local-models-${{ hashFiles('Sources/SpeakCore/WhisperCppModels.swift') }}

      - name: Build native Windows executable
        id: native-build
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build --configuration release --product SpeakWindows --jobs 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test shared core, desktop workflow and native adapters
        id: native-tests
        # Runs exactly as before on every push/pull_request/default dispatch,
        # INCLUDING the original implicit `success()` gate (this step must
        # NOT run if an earlier step, e.g. the toolchain install or native
        # build, already failed -- restoring default Actions behavior rather
        # than the previously-introduced `!cancelled()`, which incorrectly
        # let this step run after an earlier failure on every trigger, not
        # just the opt-in one). Narrowly skipped ONLY for the explicit opt-in
        # diagnostics dispatch below, so cold full-suite execution does not
        # precede (and does not consume budget/time ahead of) the isolated
        # single-class capture; every other trigger is completely unaffected.
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.owned_capture_diagnostics == true) }}
        run: |
          swift test --configuration release --jobs 4 --xunit-output windows-tests.xml 2>&1 |
            Tee-Object -FilePath windows-native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build tests for owned-recording diagnostics (opt-in)
        id: owned-capture-build
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.owned_capture_diagnostics == true && steps.native-build.outcome == 'success' }}
        # Separate, more generous budget for cold test compilation, kept out
        # of the fault-observation step below so compile time can never
        # consume the bounded process-execution window.
        timeout-minutes: 15
        run: |
          swift test list --configuration release --jobs 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture owned-recording crash diagnostics (opt-in, read-only)
        id: owned-capture-diagnostics
        if: ${{ !cancelled() && steps.owned-capture-build.outcome == 'success' }}
        timeout-minutes: 8
        run: . ./scripts/ci/windows/owned-capture-diagnostics.ps1

      - name: Upload owned-recording crash diagnostics
        # Runs whenever the diagnostics step actually executed (opted in),
        # regardless of whether it ultimately succeeded or failed, so partial
        # logs/reports are never lost to a validation failure; "skipped"
        # (the ordinary, non-opted-in case) is excluded. Required evidence
        # missing errors the upload (rather than warning) because this
        # artifact is the mandatory record of an opt-in diagnostic run.
        if: ${{ !cancelled() && steps.owned-capture-diagnostics.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-owned-capture-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/owned-capture-evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Probe Windows NSConditionLock reuse-after-unlock hypothesis (opt-in, read-only)
        id: condition-lock-probe
        # Gated on the SAME opt-in build step as the diagnostics capture
        # above, but intentionally NOT on that diagnostics step's own
        # outcome: this is a wholly separate SDK-observation probe for the
        # Round29 hypothesis (pinned swift-6.2.3-RELEASE
        # Sources/Foundation/NSLock.swift) and must run (or fail) on its own
        # regardless of whether the real native class run above passed,
        # failed, or crashed -- and the real native class run above always
        # executes regardless of this probe's own outcome. This step's own
        # budget is a separate, small <=2-minute cap (compile<=60s, each
        # mode<=10s, each kill/join<=10s, leaving headroom for version/
        # source/report bookkeeping) that sits ALONGSIDE the existing
        # unchanged 8-minute diagnostics-capture step and unchanged
        # 30-minute job budget -- neither of which this step enlarges.
        if: ${{ !cancelled() && steps.owned-capture-build.outcome == 'success' }}
        timeout-minutes: 2
        run: . ./scripts/ci/windows/condition-lock-probe.ps1

      - name: Upload Windows NSConditionLock reuse-after-unlock probe evidence
        # Mirrors the owned-recording upload above: runs whenever the probe
        # step actually executed (opted in), regardless of its own outcome,
        # so a broken-capability failure's partial logs are never lost.
        if: ${{ !cancelled() && steps.condition-lock-probe.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-condition-lock-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/condition-lock-probe-evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Verify native WinHTTP WebSocket transport against loopback peer
        id: websocket-probe
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $readyPath = Join-Path $env:RUNNER_TEMP 'jsti-websocket-ready.json'
          Remove-Item $readyPath -ErrorAction SilentlyContinue
          $server = $null
          $probe = $null
          try {
            $server = Start-Process -FilePath (Get-Command python).Source -PassThru -NoNewWindow `
              -ArgumentList @('-u', 'scripts/websocket-loopback-probe.py', '--ready-file', $readyPath, '--max-seconds', '120') `
              -RedirectStandardOutput windows-websocket-server.log -RedirectStandardError windows-websocket-server-errors.log
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            while (-not (Test-Path $readyPath)) {
              if ($server.HasExited) { throw 'Loopback WebSocket server exited before readiness.' }
              if ([DateTime]::UtcNow -gt $deadline) { throw 'Loopback WebSocket server readiness timed out.' }
              Start-Sleep -Milliseconds 100
            }
            $ready = Get-Content $readyPath -Raw | ConvertFrom-Json
            if ($ready.host -ne '127.0.0.1' -or $ready.port -lt 1 -or $ready.port -gt 65535) {
              throw 'Unexpected loopback peer address.'
            }
            $env:JSTI_WEBSOCKET_PROBE_PORT = [string]$ready.port
            $probe = Start-Process -FilePath (Get-Command swift).Source -PassThru -NoNewWindow `
              -ArgumentList @('test', '--configuration', 'release', '--skip-build', '--filter', 'WinHTTPRuntimeProbeTests', `
                '--filter', 'GladiaWinHTTPRuntimeTests', '--filter', 'CartesiaWinHTTPRuntimeTests', `
                '--filter', 'RevAIWinHTTPRuntimeTests', '--filter', 'AzureWinHTTPRuntimeTests', `
                '--xunit-output', 'windows-websocket-tests.xml') `
              -RedirectStandardOutput windows-websocket-probe.log -RedirectStandardError windows-websocket-probe-errors.log
            if (-not $probe.WaitForExit(90000)) {
              $probe.Kill($true)
              throw 'WebSocket runtime probe exceeded its 90-second process deadline.'
            }
            if ($probe.ExitCode -ne 0) { throw "WebSocket runtime probe failed: $($probe.ExitCode)" }
          } finally {
            Remove-Item Env:JSTI_WEBSOCKET_PROBE_PORT -ErrorAction SilentlyContinue
            if ($probe -and -not $probe.HasExited) { $probe.Kill($true) }
            if ($server -and -not $server.HasExited) { $server.Kill($true) }
            Get-ChildItem windows-websocket-*.log | ForEach-Object { Get-Content $_.FullName }
          }

      - name: Run executable self-test and native window smoke test
        id: native-smoke
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $bin.Trim() 'SpeakWindows.exe'
          $native = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -NoNewWindow `
            -RedirectStandardOutput windows-self-test.log -RedirectStandardError windows-self-test-errors.log
          $nativeFailure = $null
          if (-not $native.WaitForExit(90000)) {
            $native.Kill()
            $nativeFailure = 'Native adapter self-test exceeded 90 seconds.'
          } elseif ($native.ExitCode -ne 0) {
            $nativeFailure = "Native adapter self-test failed: $($native.ExitCode)"
          }
          Get-Content windows-self-test.log
          Get-Content windows-self-test-errors.log
          # Window checks are independent of adapter assertions. Run both while
          # retaining a failing job if either result fails.
          $env:JSTI_UI_SNAPSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE 'windows-ui-smoke.bmp'
          $process = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -PassThru -NoNewWindow `
            -RedirectStandardOutput windows-ui-smoke.log -RedirectStandardError windows-ui-smoke-errors.log
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Native window did not create and shut down within 30 seconds.'
          }
          Get-Content windows-ui-smoke.log
          Get-Content windows-ui-smoke-errors.log
          if ($process.ExitCode -ne 0) { throw "Native window smoke test failed: $($process.ExitCode); $nativeFailure" }
          if ($nativeFailure) { throw $nativeFailure }

      - name: Save every window page with sample History
        id: page-screenshots
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = Join-Path $env:GITHUB_WORKSPACE 'windows-ui-screenshots'
          $process = Start-Process -FilePath (Join-Path $bin.Trim() 'SpeakWindows.exe') `
            -ArgumentList '--ui-screenshots', $folder -PassThru -NoNewWindow `
            -RedirectStandardOutput windows-ui-screenshots.log -RedirectStandardError windows-ui-screenshots-errors.log
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw 'The screenshot tour did not finish within 90 seconds.'
          }
          Get-Content windows-ui-screenshots.log
          Get-Content windows-ui-screenshots-errors.log
          if ($process.ExitCode -ne 0) { throw "The screenshot tour failed: $($process.ExitCode)" }
          $expected = 'dashboard', 'history', 'voice-output', 'general', 'transcription', 'post-processing',
            'corrections', 'pronunciation', 'profiles', 'keyboard', 'icloud-sync', 'about', 'dashboard-dark',
            'history-dark', 'dashboard-recording', 'hud-recording', 'hud-completed', 'history-filters',
            'history-filters-dark', 'hud-expanded-recording', 'hud-compact-recording', 'hud-compact-completed'
          for ($index = 0; $index -lt $expected.Count; $index++) {
            $file = Join-Path $folder ('{0:D2}-{1}.bmp' -f ($index + 1), $expected[$index])
            if (-not (Test-Path $file)) { throw "Missing screenshot $file" }
          }
          foreach ($name in @('comparison-blind-light', 'comparison-revealed-dark')) {
            $file = Join-Path $folder ($name + '.bmp')
            if (-not (Test-Path $file)) { throw "Missing screenshot $file" }
          }

      - name: Upload page screenshots
        if: ${{ !cancelled() && steps.page-screenshots.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui-screenshots-${{ github.sha }}
          path: windows-ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Transcribe the JFK sample on-device with the pinned tiny model
        id: local-transcription
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bin.Trim() 'SpeakWindows.exe') --local-transcription-self-test $env:JSTI_WHISPER_TEST_AUDIO `
            --expect 'ask not what your country can do for you' 2>&1 | Tee-Object -FilePath windows-local-transcription.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage developer executable with provenance
        id: developer-stage
        if: ${{ !cancelled() && steps.native-tests.outcome == 'success' && steps.websocket-probe.outcome == 'success' && steps.native-smoke.outcome == 'success' }}
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $destination = New-Item -ItemType Directory -Path windows-developer-build
          Copy-Item (Join-Path $bin.Trim() 'SpeakWindows.exe') $destination
          Get-ChildItem -Path $bin.Trim() -Directory -Filter '*.resources' |
            Copy-Item -Destination $destination -Recurse
          [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            architecture = 'x86_64'
            compiler = (swift --version) -join "`n"
            distribution = 'developer executable; not an installer'
            runtime = 'Requires the Swift 6.2.3 Windows runtime and Visual C++ runtime'
            webSocketRuntimeProbe = '${{ steps.websocket-probe.outcome }}'
          } | ConvertTo-Json | Set-Content (Join-Path $destination 'build-metadata.json') -Encoding utf8
          @"
          Just Speak to It — Windows developer build

          This is an unsigned developer executable, not an installer or a feature-complete release.
          Install the Swift 6.2.3 Windows toolchain/runtime and its Windows prerequisites:
          https://www.swift.org/install/windows/

          Development instructions and current parity limitations:
          https://github.com/crmitchelmore/justspeaktoit/blob/${env:GITHUB_SHA}/Docs/windows-development.md

          Run SpeakWindows.exe normally, or pass --self-test / --ui-smoke-test.
          The smoke tests do not use a microphone or a real provider API key.
          See build-metadata.json for the exact source revision and compiler.
          "@ | Set-Content (Join-Path $destination 'README.txt') -Encoding utf8
          Get-FileHash (Join-Path $destination 'SpeakWindows.exe') -Algorithm SHA256 |
            Format-List | Out-String | Set-Content (Join-Path $destination 'SHA256.txt') -Encoding utf8

      - name: Upload developer executable
        if: ${{ !cancelled() && steps.developer-stage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: justspeaktoit-windows-x64-developer-${{ github.sha }}
          path: windows-developer-build/
          if-no-files-found: error
          retention-days: 14

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-evidence-${{ github.sha }}
          path: |
            windows-tests.xml
            windows-native-tests.log
            windows-self-test*.log
            windows-ui-smoke*.log
            windows-ui-smoke.bmp
            windows-ui-smoke.bmp.voice-sources.bmp
            windows-ui-smoke.bmp.file-source.bmp
            windows-ui-smoke.bmp.voice-controls.bmp
            windows-ui-smoke.bmp.voice-usage.bmp
            windows-ui-smoke.bmp.voice-discovery.bmp
            windows-websocket-tests.xml
            windows-websocket-*.log
            windows-local-transcription.log
          if-no-files-found: ignore
          retention-days: 14

  portable-macos:
    name: Portable Swift on macOS
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SPEAK_PORTABLE_CORE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify portable source boundary
        run: python3 scripts/verify-portable-core-boundary.py
      - name: Verify additional provider loopback peer contracts
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_additional_provider_loopback.py
          python3 -B -m unittest discover -s scripts/tests -p test_modulate_opening_audio_probe.py
          python3 -B -m unittest discover -s scripts/tests -p test_qualification_source_state.py
      - name: Record source state before portable compilation and tests
        continue-on-error: true # Advisory evidence only; existing native gates are unchanged.
        run: |
          python3 -B scripts/qualification_source_state.py --phase before-portable-build-tests \
            --output "$RUNNER_TEMP/portable-macos-source-state/before.json"
      - name: Test portable graph with Xcode Apple Swift
        id: portable_graph_tests
        run: |
          xcrun swift --version
          xcrun swift test --configuration release --jobs 4
      - name: Record source state after portable compilation and tests
        if: always()
        continue-on-error: true # Missing/partial evidence is never clean-source proof.
        run: |
          python3 -B scripts/qualification_source_state.py --phase after-portable-build-tests \
            --command-outcome "${{ steps.portable_graph_tests.outcome }}" \
            --output "$RUNNER_TEMP/portable-macos-source-state/after.json"
      - name: Probe additional shared providers over native Apple WebSockets
        shell: bash
        run: |
          set -euo pipefail
          ready="$RUNNER_TEMP/additional-provider-peer.json"
          python3 scripts/websocket-loopback-probe.py --ready-file "$ready" --max-seconds 60 \
            > "$RUNNER_TEMP/additional-provider-peer.log" 2>&1 &
          peer=$!
          trap 'kill "$peer" 2>/dev/null || true; cat "$RUNNER_TEMP/additional-provider-peer.log"' EXIT
          for attempt in $(seq 1 100); do
            if [ -s "$ready" ]; then break; fi
            kill -0 "$peer"
            sleep 0.05
          done
          export JSTI_WEBSOCKET_PROBE_PORT
          JSTI_WEBSOCKET_PROBE_PORT=$(python3 -c \
            'import json,sys; p=json.load(open(sys.argv[1])); assert p["host"]=="127.0.0.1"; print(p["port"])' "$ready")
          xcrun swift test --configuration release --skip-build --filter AdditionalProviderLoopbackTests
          xcrun swift test --configuration release --skip-build --filter GladiaLoopbackRuntimeTests
      - name: Qualify Modulate opening PCM across an explicitly held HTTP101
        run: |
          python3 -B scripts/qualify-modulate-opening-audio.py \
            --output-dir "$RUNNER_TEMP/modulate-opening-qualification" -- \
            xcrun swift test --configuration release --jobs 2 --skip-build --filter ModulateOpeningAudioQualificationTests
      - name: Preserve Modulate synthetic transport receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modulate-opening-apple-receipt
          path: ${{ runner.temp }}/modulate-opening-qualification
          if-no-files-found: warn
      - name: Preserve Apple dependency lockfile
        if: always()
        # The dependency-free graph removes pins it does not need. It must not
        # change the Apple graph's checked-in dependencies.
        run: git restore --source=HEAD -- Package.resolved
      - name: Preserve advisory portable Mac source observations
        if: always()
        continue-on-error: true # Upload/collection failure is visible, never clean-source proof.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-macos-source-state
          path: ${{ runner.temp }}/portable-macos-source-state
          if-no-files-found: warn
