          - "Say a long sentence starting \"utterance kept\" and, mid-sentence, put the AirPods back in the case."
          - "Read the indicator and any message, then open History."
        expected: "After connecting, the indicator either stays Armed and \"armed route check\" records normally, or it disarms with a clear message (never Armed but deaf). The interrupted utterance is saved as one History item containing \"utterance kept\", and the indicator shows Armed or Off truthfully."
