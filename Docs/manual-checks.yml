      - id: "mac-settings-search"
        issues:
          - 1410
        title: "Settings search: find, open and highlight a setting"
        minutes: 4
        core: false
        build: "Just Speak to It for Mac, the first Alpha build that includes #1410"
        steps:
          - "From the Dashboard press \u2318F. Check Recent and Suggested appear before you type."
          - "Type \"laun\", press Tab to accept the first suggestion, then press Return."
          - "Press \u2318F again, type \"discard\", move with the arrow keys and press Return on Activation."
          - "Press \u2318F, type \"openai\" and choose the OpenAI API key result."
          - "Turn on VoiceOver, press \u2318F, type \"mic\" and move through the results."
        expected: "Each choice opens the right Settings page, scrolls to the card and briefly outlines it (App Behaviour, Keyboard \u203a Activation, then the OpenAI key card). VoiceOver reads each result as its title and page with a hint, and the outline is not announced."
        final_gate: true
      - id: "mac-keep-audio-on-cancel"
        issues:
          - 1406
        title: "Cancelled recording: kept in History when on, gone when off"
        minutes: 4
        core: false
        build: "Just Speak to It for Mac, an Alpha build that includes #1406"
        steps:
          - "Settings \u203a Keyboard: check Keep audio when a recording is cancelled is on and Cancel recording with Escape is on."
          - "Start dictating \"Keep this cancelled audio\" for about 3 seconds, then press Escape."
          - "Open History, right-click the new cancelled entry and choose Reprocess with Current Model."
          - "Turn Keep audio when a recording is cancelled off, dictate \"Delete this one\" for 3 seconds and press Escape."
          - "Open History again."
        expected: "The first cancel adds one History entry with Play Audio; reprocessing it produces \"Keep this cancelled audio\". The second cancel adds nothing to History."
        final_gate: true
      - id: "mac-website-voiceover"
        issues:
          - 1400
        title: "Website: VoiceOver and keyboard reach everything"
        minutes: 6
        core: false
        build: "justspeaktoit.com after the accessibility guards PR is deployed"
        steps:
          - "In Safari open justspeaktoit.com, press Tab once and check that Skip to content appears; press Return."
          - "Keep pressing Tab through the page and check that every focused link or button has a visible outline."
          - "Turn on VoiceOver (Command-F5), open the rotor (Control-Option-U) and browse Links and Headings."
          - "Repeat the Tab and rotor checks on /privacy, /support and /qa; on /qa mark one check Pass."
          - "Switch macOS to the other appearance (light or dark) and glance over each page."
        expected: "Every link, button and form control has a spoken name that says what it does, focus is always visible, the /qa progress and status changes are read aloud, and text stays readable in both appearances."
        final_gate: false
      - id: "mac-voiceover-pass"
        issues:
          - 1399
        title: "Mac: VoiceOver and keyboard reach every control"
        minutes: 8
        core: false
        build: "Just Speak to It for Mac, the first Alpha build that includes the recording-start announcement fix for #1399"
        steps:
          - "Turn on VoiceOver (Command-F5). Open the menu bar item with VoiceOver and listen to its name and state."
          - "Open the main window and move through the sidebar and Settings with VoiceOver; listen for any button read only as \"button\" or an image name."
          - "In Settings \u203a Voice Output open the SSML helper, and in Profiles open New Profile; press Escape in each."
          - "From another app, start and stop a dictation with the hot key and listen to the announcements."
          - "Turn VoiceOver off."
        expected: "The menu bar item reads \"Just Speak to It\" with the current state. Every control has a meaningful name and both sheets close on Escape. Starting a dictation says \"Recording started\", and transcribing and errors are announced."
        final_gate: true
      - id: "mac-record-button-follows-hotkey"
        issues:
          - 1407
        title: "Main window record button follows a recording started elsewhere"
        minutes: 3
        core: false
        build: "Just Speak to It for Mac, the first Alpha build that includes the fix for #1407"
        steps:
          - "Close the main window, start a recording with your recording shortcut and say a made-up sentence."
          - "Open the main window from the menu bar icon and look at the top-right toolbar button and the Dashboard record button."
          - "Click the toolbar Stop button."
          - "Start another recording from the menu bar's Start Recording item while the window is open, then stop it with the Dashboard button."
        expected: "Both buttons show Stop (red) as soon as the window opens mid-recording and switch the moment a recording starts or ends from anywhere. Each Stop ends the recording, which is transcribed and appears in History; the buttons then return to Record."
        final_gate: true
      - id: "mac-search-for-anything"
        issues:
          - 1551
        title: "Sidebar \u201cSearch for anything\u201d and \u2318K run actions and find settings"
        minutes: 4
        core: false
        build: "Just Speak to It for Mac, the first Alpha build that includes #1551"
        steps:
          - "Open the main window. Check the top of the sidebar, above Speak, then click Search for anything."
          - "Type transcribe, press Return, say a made-up sentence, then press \u2318K, type transcribe and press Return again."
          - "Copy a sentence in another app, return, press \u2318K, type say and choose Say Clipboard Aloud."
          - "Press \u2318K, type api key and choose any result."
          - "Open Settings \u203a Keyboard and check App Shortcuts for Search for Anything and Open Corrections."
        expected: "The sidebar shows a field reading \u201cSearch for anything\u201d with \u2318K. Transcribe starts and then stops a recording that appears in History; Say reads the clipboard aloud; api key opens and highlights an API-key card. Keyboard lists Search for Anything as \u2318K and Open Corrections as \u21e7\u2318K."
