name: Site Media Capture

# Capture of website screenshots and marketing clips from the real apps on
# GitHub-hosted runners only: the Mac Debug app (screen recording), the iPhone
# app in the Simulator, and the Windows/Linux page tours from windows.yml and
# linux.yml. Fictional History and fixed test text only: no secrets, providers
# or signing. See landing-page/images/README.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/site-media.yml
      - scripts/site-media/**
      - Sources/SpeakApp/CoreJourneySiteMediaFixture.swift
      - Tests/SpeakAppUITests/SiteMediaCaptureUITests.swift
      - Tests/SpeakiOSUITests/SiteMediaCaptureUITests.swift

permissions:
  contents: read
  actions: read

concurrency:
  group: site-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture Mac app (${{ matrix.appearance }})
    strategy:
      fail-fast: false
      matrix:
        appearance: [light, dark]
    # Hosted ARM has the UI automation entitlement used by the core journey suites.
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      CAPTURE: ${{ github.workspace }}/.artifacts/site-media
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Prepare Tuist and macOS project
        timeout-minutes: 8
        run: |
          brew install tuist ffmpeg
          tuist generate --no-open

      - name: Build app, fixture and capture suite
        timeout-minutes: 20
        run: |
          xcodebuild build-for-testing -workspace "Just Speak to It.xcworkspace" -scheme SpeakApp \
            -configuration Debug -destination platform=macOS -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:SpeakAppUITests/SiteMediaCaptureUITests -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual -quiet

      - name: Select a HiDPI display mode
        timeout-minutes: 3
        run: |
          mkdir -p "$CAPTURE"
          swift scripts/site-media/select-display-mode.swift | tee "$CAPTURE/display-modes.txt"
          defaults write com.apple.dock autohide -bool true
          if [ "${{ matrix.appearance }}" = dark ]; then defaults write -g AppleInterfaceStyle Dark; fi
          killall Dock || true
          sleep 3
          system_profiler SPDisplaysDataType | tee -a "$CAPTURE/display-modes.txt"

      - name: Start screen recording
        timeout-minutes: 1
        run: |
          python3 -c 'import time; print(time.time())' > "$CAPTURE/recording-start.txt"
          screencapture -v -k "$CAPTURE/screen.mov" > "$CAPTURE/screencapture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/screencapture.pid"
          sleep 3
          kill -0 "$(cat "$RUNNER_TEMP/screencapture.pid")"

      - name: Run capture suite
        timeout-minutes: 10
        run: |
          xctestrun=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name '*.xctestrun' | head -1)
          TEST_RUNNER_SITE_MEDIA_CAPTURE=1 TEST_RUNNER_SITE_MEDIA_APPEARANCE=${{ matrix.appearance }} \
            xcodebuild test-without-building -xctestrun "$xctestrun" \
            -destination platform=macOS -only-testing:SpeakAppUITests/SiteMediaCaptureUITests \
            -resultBundlePath "$CAPTURE/SiteMedia.xcresult"

      - name: Stop screen recording
        if: always()
        timeout-minutes: 2
        run: |
          pid=$(cat "$RUNNER_TEMP/screencapture.pid" 2>/dev/null || true)
          if [ -n "$pid" ]; then
            python3 -c 'import time; print(time.time())' > "$CAPTURE/recording-stop.txt"
            kill -INT "$pid" || true
            for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          fi
          ls -la "$CAPTURE"

      - name: Export captures from result bundle
        if: always()
        timeout-minutes: 3
        run: |
          xcrun xcresulttool export attachments --path "$CAPTURE/SiteMedia.xcresult" \
            --output-path "$CAPTURE/attachments"
          python3 scripts/site-media/collect-attachments.py "$CAPTURE/attachments" "$CAPTURE"
          ls -la "$CAPTURE"

      - name: Upload Mac captures
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-media-mac-${{ matrix.appearance }}-${{ github.run_attempt }}
          path: |
            .artifacts/site-media
            !.artifacts/site-media/SiteMedia.xcresult
            !.artifacts/site-media/attachments
          if-no-files-found: error

  capture-ios:
    name: Capture iPhone app (Simulator, ${{ matrix.appearance }})
    strategy:
      fail-fast: false
      matrix:
        appearance: [light, dark]
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      CAPTURE: ${{ github.workspace }}/.artifacts/site-media-ios
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Set up Apple toolchain
        uses: ./.github/actions/setup-apple-toolchain
        with:
          install-tuist: "true"

      - name: Build app and capture suite for the Simulator
        timeout-minutes: 25
        run: |
          set -o pipefail
          tuist generate --no-open
          xcodebuild build-for-testing -workspace "Just Speak to It.xcworkspace" -scheme SpeakiOS \
            -destination "generic/platform=iOS Simulator" -only-testing:SpeakiOSUITests/SiteMediaCaptureUITests \
            -testProductsPath "$RUNNER_TEMP/SpeakiOS.xctestproducts" -skipPackagePluginValidation -quiet

      - name: Create an owned Simulator
        timeout-minutes: 3
        run: |
          python3 scripts/owned-ios-ci-simulator.py create \
            --receipt "$RUNNER_TEMP/owned-ios-simulator.json" --github-env "$GITHUB_ENV" \
            --owner "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"

      - name: Prepare the Simulator
        timeout-minutes: 12
        run: |
          python3 scripts/prepare-ios-ci.py "$SIMULATOR_ID"
          xcrun simctl ui "$SIMULATOR_ID" appearance ${{ matrix.appearance }}
          xcrun simctl status_bar "$SIMULATOR_ID" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Run capture suite
        timeout-minutes: 12
        run: |
          mkdir -p "$CAPTURE"
          TEST_RUNNER_SITE_MEDIA_CAPTURE=1 xcodebuild test-without-building \
            -testProductsPath "$RUNNER_TEMP/SpeakiOS.xctestproducts" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:SpeakiOSUITests/SiteMediaCaptureUITests \
            -resultBundlePath "$CAPTURE/SiteMedia.xcresult"

      - name: Export captures from result bundle
        if: always()
        timeout-minutes: 3
        run: |
          xcrun xcresulttool export attachments --path "$CAPTURE/SiteMedia.xcresult" \
            --output-path "$CAPTURE/attachments"
          python3 scripts/site-media/collect-attachments.py "$CAPTURE/attachments" "$CAPTURE"

      - name: Remove owned Simulator
        if: always()
        timeout-minutes: 2
        run: |
          if [ -f "$RUNNER_TEMP/owned-ios-simulator.json" ]; then
            python3 scripts/owned-ios-ci-simulator.py cleanup --receipt "$RUNNER_TEMP/owned-ios-simulator.json" \
              --owner "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$GITHUB_JOB"
          fi

      - name: Upload iPhone captures
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-media-ios-${{ matrix.appearance }}-${{ github.run_attempt }}
          path: |
            .artifacts/site-media-ios
            !.artifacts/site-media-ios/SiteMedia.xcresult
            !.artifacts/site-media-ios/attachments
          if-no-files-found: error

  render:
    name: Render marketing clips
    needs: [capture, capture-ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Install ffmpeg, Inter, Pillow and Piper
        timeout-minutes: 8
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-inter python3-venv
          ffmpeg -hide_banner -encoders | grep -E 'libx264|libsvtav1|libaom|libopus' || true
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r scripts/site-media/requirements.txt

      - name: Cache the narration voice
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/voices
          key: piper-en_GB-cori-high-470b4dd634c9

      - name: Download Mac and iPhone captures
        uses: actions/download-artifact@v8
        with:
          pattern: site-media-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloads

      - name: Fetch Windows and Linux page tours from hosted runs
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/captures"
          for source in mac ios; do
            for appearance in light dark; do
              mv "$RUNNER_TEMP/downloads/site-media-$source-$appearance-${{ github.run_attempt }}" \
                "$RUNNER_TEMP/captures/$source-$appearance" || true
            done
          done
          python3 scripts/site-media/fetch-desktop-tours.py "$RUNNER_TEMP/captures"
          ls -R "$RUNNER_TEMP/captures" | head -80

      - name: Render clips
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/site-media/render-clips.py "$RUNNER_TEMP/captures" \
            .artifacts/site-clips --voices "$RUNNER_TEMP/voices"
          cp "$RUNNER_TEMP/captures/source.json" .artifacts/site-clips/desktop-source.json
          for clip in .artifacts/site-clips/*.mp4 .artifacts/site-clips/*.webm; do
            ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_name -of compact "$clip"
          done
          python3 - <<'PY'
          import json
          clips = {clip["name"] for clip in json.load(open(".artifacts/site-clips/manifest.json"))}
          missing = {"hero", "corrections", "history", "models", "iphone", "windows", "linux"} - clips
          if missing:
              raise SystemExit(f"Clips not rendered: {sorted(missing)}")
          PY

      - name: Upload clips
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-clips-${{ github.run_attempt }}
          path: .artifacts/site-clips
          if-no-files-found: error
