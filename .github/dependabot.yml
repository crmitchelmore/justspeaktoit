version: 2
updates:
  # Swift Package Manager
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Swift Package Manager (isolated lint tooling graph, issue #677)
  - package-ecosystem: "swift"
    directory: "/Tooling"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(tooling)"
    open-pull-requests-limit: 2

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

  # npm (landing page)
  - package-ecosystem: "npm"
    directory: "/landing-page"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
