name: Local Transcription Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-transcription-benchmark.yml"
      - "Benchmarks/LocalTranscription/**"
      - "Docs/TRANSCRIBE_CPP_ASSESSMENT.md"
      - "Makefile"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/SpeakCore/**"
      - "scripts/verify-checksums.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/local-transcription-benchmark.yml"
      - "Benchmarks/LocalTranscription/**"
      - "Docs/TRANSCRIBE_CPP_ASSESSMENT.md"
      - "Makefile"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/SpeakCore/**"
      - "scripts/verify-checksums.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark-package:
    name: Build & Test Benchmark Package
    runs-on: ${{ fromJSON((vars.JSTI_LOCAL_RUNNERS != 'off' && (github.actor == 'crmitchelmore' || github.actor == 'bravostation') && (github.triggering_actor == 'crmitchelmore' || github.triggering_actor == 'bravostation') && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.login == 'crmitchelmore' || github.event.pull_request.user.login == 'bravostation')))) && (vars.JSTI_NATIVE_RUNNER_LABELS || '["jsti-reviewed-local","macOS"]') || '["macos-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Self-hosted only: keep the benchmark package build warm. The root
      # shipping-graph build below stays cold on purpose (isolation check).
      - uses: ./.github/actions/warm-build-cache
        with:
          key: benchmark-package
          paths: $RUNNER_TEMP/benchmark-build

      # Source caches speed repeated resolution without restoring compiled
      # objects into the clean shipping-graph isolation check below.
      # Hosted only: on reviewed native Macs this home-directory cache is the
      # owner's shared SwiftPM cache and must not be overwritten by CI.
      - name: Cache Swift dependency sources
        if: runner.environment != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: benchmark-${{ runner.os }}-${{ runner.arch }}-sources-${{ hashFiles('Package.resolved', 'Benchmarks/LocalTranscription/Package.resolved') }}
          restore-keys: benchmark-${{ runner.os }}-${{ runner.arch }}-sources-

      - name: Verify package resolution and CTranscribe checksum
        run: make verify-checksums

      # verify-checksums resolves both graphs, so neither lockfile may change.
      - name: Check root and benchmark Package.resolved drift
        run: git diff --exit-code Package.resolved Benchmarks/LocalTranscription/Package.resolved

      - name: Build clean shipping core graph without CTranscribe
        run: |
          swift build --scratch-path "$RUNNER_TEMP/root-build" --target SpeakCore
          if find "$RUNNER_TEMP/root-build" -iname '*ctranscribe*' -o -iname '*transcribecpp*' | grep -q .; then
            echo "CTranscribe unexpectedly appeared in the root build graph" >&2
            exit 1
          fi

      - name: Build benchmark executable
        run: >-
          swift build --package-path Benchmarks/LocalTranscription
          --scratch-path "$RUNNER_TEMP/benchmark-build"
          --product local-transcription-benchmark

      - name: Test benchmark qualification gates
        run: >-
          swift test --package-path Benchmarks/LocalTranscription
          --scratch-path "$RUNNER_TEMP/benchmark-build"
