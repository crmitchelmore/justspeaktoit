        expected: "The entry is listed and the transcript is read as \"just speak to it\" while the text on screen stays JSTI; after removing it, JSTI is spelled out. Adding \"jsti\" updates the existing entry in place (one entry, now saying \"just speak to it\") rather than adding a second one. The invalid expression shows its message and adds nothing. The other app imports the entry and the phone gets it back unchanged, with no duplicate. TalkBack reads each field and toggle with its name and each Remove button with its word."
