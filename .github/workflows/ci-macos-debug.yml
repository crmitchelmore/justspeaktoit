name: CI macOS Debug lane

# Called by ci.yml (job macos-debug): the Debug build and unit tests, then, on
# full runs, the core dictation journey, which restores the build state Debug
# just saved. ci.yml owns the conditions, the needs and CI Gate.
on:
  workflow_call:
    inputs:
      full:
        description: "'true' on merge batches, main and ci:full pull requests: run every gate."
        required: true
        type: string
      ios:
        description: "'true' when shared or iOS sources changed: compile the iOS library on a pull request."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    # The aggregate required-macos job owns the required branch-protection name.
    name: Build & Test (macOS Debug)
    # The only macOS job on a pull request: an incremental build (restored
    # from main's cache) plus the unit tests the change can affect. Merge
    # batches and main run the whole suite and the macOS-only tooling tests.
    # Route only the explicitly reviewed revision to the native pool.
    # Every selected native runner must also admit this revision locally.
    runs-on: ${{ fromJSON(((github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.JSTI_NATIVE_APPROVED_SHA == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.JSTI_NATIVE_APPROVED_SHA == github.event.pull_request.head.sha)) && (vars.JSTI_NATIVE_RUNNER_LABELS || '["jsti-reviewed-local","macOS"]') || '["macos-latest"]') }}
    timeout-minutes: 45
    # Compiles the native-CI Keychain redirect into these test builds only;
    # distribution builds never set it (#1360).
    env:
      JSTI_TEST_KEYCHAIN_REDIRECT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify process-scoped Keychain isolation
        run: python3 -B -m unittest scripts.tests.test_private_test_keychain -v

      - name: Test installed sample contract collector
        continue-on-error: true
        run: python3 -B -m unittest discover -s scripts/tests -p test_macos_sample_contract.py -v

      - name: Collect installed sample manual contract evidence (no sampling)
        id: sample_contract
        continue-on-error: true
        run: |
          status=0
          python3 scripts/collect-macos-sample-contract.py || status=$?
          if [ "$status" -eq 0 ] || [ "$status" -eq 3 ]; then
            echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload installed sample contract evidence (not runtime qualification)
        if: always() && steps.sample_contract.outputs.artifact_ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-installed-sample-contract
          path: ${{ runner.temp }}/jsti-installed-sample-contract-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7

      - name: Test XCTest crash-report collector
        run: python3 -B -m unittest discover -s scripts/tests -p test_macos_xctest_crashes.py -v

      - name: Test CLI debug-symbol packaging contracts
        run: python3 -B -m unittest discover -s scripts/tests -p test_mac_cli_symbols.py -v

      # Swift build state embeds absolute paths. Scope both exact and fallback
      # keys to the architecture, stable host identity and checkout workspace.
      # Only main saves (one entry per commit, so the newest build state is
      # always restored instead of the first one saved for a Package.resolved
      # hash); pull requests restore without uploading gigabytes that would
      # evict main's entries from the 10 GB repository cache.
      - name: Restore Swift packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-${{ hashFiles('Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-

      # Keep dependency fetches in this workspace: the shared SwiftPM repository
      # cache can reference a missing directory. Retain the compiled .build cache.
      # Binary targets (Sentry, Sparkle, NemoTextProcessing) download from GitHub
      # release assets, which intermittently return 5xx; resolve with retries first.
      - name: Resolve Swift packages
        run: scripts/retry-network.sh swift package resolve --disable-dependency-cache

      - name: Build
        id: build
        # Match the Test (Debug) step flag. A plain debug build here produces a
        # cached .build that the coverage-enabled swift test below cannot reuse
        # (coverage instrumentation changes compiler flags for every target),
        # forcing a second full rebuild of the whole module graph inside the
        # 45-minute job budget.
        run: SWIFT_FLAGS="--enable-code-coverage --disable-dependency-cache" make build

      - name: Save Swift packages (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

      # Swift PRs otherwise never compile `#if os(iOS)` code before the merge
      # batch. Build only (no tests) the iOS library graph for the simulator
      # when shared or iOS sources change; batches and main run the full iOS
      # jobs instead.
      - name: Compile iOS library for the simulator
        if: inputs.full != 'true' && inputs.ios == 'true'
        run: |
          set -o pipefail
          xcodebuild build -scheme SpeakiOSLib -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-compile" -skipPackagePluginValidation -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40

      - name: Verify brand asset sizes and appearance variants
        run: node --test scripts/tests/brand-assets.test.mjs

      - name: Check Package.resolved drift
        # Resolving the app/test graph must reproduce the checked-in pins;
        # tooling pins live separately in Tooling/Package.resolved (issue #677).
        run: git diff --exit-code Package.resolved

      - name: Record Debug XCTest crash-report boundary
        id: debug_crash_boundary
        # Diagnostics must not prevent the original test from running.
        continue-on-error: true
        run: python3 scripts/collect-macos-xctest-crashes.py boundary

      # Pull requests run only the test targets whose sources (or
      # dependencies) changed, minus targets the Linux portable job runs;
      # manifest and shared-support changes select every target.
      - name: Select affected unit tests
        id: affected
        if: inputs.full != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # The checkout is the shallow PR merge commit; fetching only the base
          # commit lets the script diff BASE..HEAD, which is exactly the PR.
          git fetch --no-tags --depth=1 origin "$BASE" || true
          python3 scripts/ci/affected-swift-tests.py "$BASE" \
            --skip-target SpeakDesktopTests --skip-target SpeakAutomationKitTests >> "$GITHUB_OUTPUT"

      # One segfaulting test kills the whole xctest process; a crash with no
      # reported test failure is re-run once and annotated (crash twice fails).
      - name: Test (Debug)
        id: debug_tests
        if: steps.affected.outputs.mode != 'none'
        env:
          TEST_FILTER: ${{ steps.affected.outputs.filter }}
          TEST_SKIP: ${{ steps.affected.outputs.skip }}
        run: |
          args=()
          if [ -n "$TEST_FILTER" ]; then args+=(--filter "$TEST_FILTER"); fi
          if [ -n "$TEST_SKIP" ]; then args+=(--skip "$TEST_SKIP"); fi
          python3 scripts/with-test-keychain.py python3 scripts/retry-xctest-crash.py swift test --enable-code-coverage --disable-dependency-cache "${args[@]}"

      # Tooling tests that need Apple tools (Keychain, xcrun, Apple Swift)
      # skip on the Ubuntu Lint job; batches and main run them here.
      - name: Test macOS-only tooling
        if: inputs.full == 'true'
        run: make test-tooling

      - name: Collect existing Debug XCTest crash reports
        id: debug_crash_collection
        if: failure() && steps.debug_tests.outcome == 'failure'
        env:
          JSTI_XCTEST_BOUNDARY_OUTCOME: ${{ steps.debug_crash_boundary.outcome }}
        run: |
          status=0
          python3 scripts/collect-macos-xctest-crashes.py collect || status=$?
          if [ "$status" -eq 0 ] || [ "$status" -eq 3 ]; then
            echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload Debug XCTest crash diagnostics
        if: failure() && steps.debug_tests.outcome == 'failure' && steps.debug_crash_collection.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-debug-xctest-crash-diagnostics
          path: ${{ runner.temp }}/jsti-xctest-debug-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7

      - name: Isolate History fixture after full-suite failure (diagnostic only)
        id: history_isolated
        if: failure() && steps.debug_tests.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          directory="$RUNNER_TEMP/jsti-history-isolated-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$directory"
          printf '%s\n' \
            '{"purpose":"isolated_history_fixture_diagnostic","status":"not_completed",' \
            '"command":["python3","scripts/with-test-keychain.py","swift","test","--skip-build","--enable-code-coverage","--disable-dependency-cache","--filter","DesktopLivePolishHistoryTests"],' \
            '"expected_cases":["SpeakDesktopTests.DesktopLivePolishHistoryTests.testControlRecordWithoutSession_RoundTripsRawAndPolishedValues",' \
            '"SpeakDesktopTests.DesktopLivePolishHistoryTests.testControlResultAfterFinish_RoundTripsSuccessfulPolish",' \
            '"SpeakDesktopTests.DesktopLivePolishHistoryTests.testNativeAndPortableHistory_RoundTripRawAndSuccessfulPolishWithoutRerunningClient"],' \
            '"command_exit_code":null,"expected_case_count":3,"observed_case_event_counts":null,' \
            '"selection_verified":false,"parity_qualification":false}' > "$directory/result.json"
          echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
          set +e
          python3 scripts/with-test-keychain.py swift test --skip-build --enable-code-coverage --disable-dependency-cache --filter DesktopLivePolishHistoryTests 2>&1 |
            python3 scripts/ci/isolated-history-diagnostic.py capture "$directory"
          statuses=("${PIPESTATUS[@]}")
          set -e
          python3 scripts/ci/isolated-history-diagnostic.py summarise "$directory" "${statuses[0]}" "${statuses[1]}"

      - name: Upload isolated History fixture diagnostic
        if: always() && steps.debug_tests.outcome == 'failure' && steps.history_isolated.outputs.artifact_ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-history-isolated-${{ steps.history_isolated.outcome }}
          path: ${{ runner.temp }}/jsti-history-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7

      # Snapshot mismatches write the freshly rendered PNG to the process
      # temporary directory. Publishing it is the only way to inspect a CI-only
      # rendering difference, since the runner is discarded after the job.
      - name: Collect snapshot failures
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot-failures"
          find "${TMPDIR:-/tmp}" -maxdepth 3 -path '*SnapshotTests*' -name '*.png' \
            -exec cp {} "$RUNNER_TEMP/snapshot-failures/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/snapshot-failures" || true

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore

      # Release-configuration tests run pre-merge in the release-validation job
      # below (path-filtered to package-affecting changes to control cost on
      # 10x-billed macOS runners). They are NOT duplicated inside this job:
      # running both configurations serially in one job doubled its wall time.
      # release-mac.yml re-runs them post-tag as defence in depth.

      - name: Report Coverage
        if: always()
        run: |
          BIN_PATH=$(swift build --disable-dependency-cache --show-bin-path)
          XCTEST_PATH=$(find "$BIN_PATH" -name '*.xctest' -type d | head -1)
          if [ -n "$XCTEST_PATH" ]; then
            EXEC_PATH="$XCTEST_PATH/Contents/MacOS/$(basename "$XCTEST_PATH" .xctest)"
            COV_DIR=$(swift test --disable-dependency-cache --show-codecov-path 2>/dev/null || echo "")
            if [ -n "$COV_DIR" ] && [ -f "$COV_DIR" ]; then
              echo "### Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
              xcrun llvm-cov report "$EXEC_PATH" \
                --instr-profile="$(dirname "$COV_DIR")/default.profdata" \
                --ignore-filename-regex='\.build|Tests/' 2>/dev/null | head -30 >> "$GITHUB_STEP_SUMMARY" || true
            fi
          fi

  core-journey-e2e:
    name: Core Dictation Journey (≤8m tests)
    # This non-UI contract gate may use an explicitly approved native runner.
    runs-on: ${{ fromJSON(((github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.JSTI_NATIVE_APPROVED_SHA == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.JSTI_NATIVE_APPROVED_SHA == github.event.pull_request.head.sha)) && (vars.JSTI_NATIVE_RUNNER_LABELS || '["jsti-reviewed-local","macOS"]') || '["macos-latest"]') }}
    timeout-minutes: 40
    # Compiles the native-CI Keychain redirect into these test builds only;
    # distribution builds never set it (#1360).
    env:
      JSTI_TEST_KEYCHAIN_REDIRECT: "1"
    # Follows Debug so it restores the exact build state Debug just saved;
    # it is skipped (and CI Gate fails) when Debug fails.
    needs: build-macos
    if: inputs.full == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2

      # Debug CI populates the shared cache. This gate only restores; uploading
      # gigabytes afterwards would only lengthen it. The hosted runner matches
      # build-macos's (macos-latest) because the key is architecture-scoped.
      # Both Swift stage commands retain Debug's coverage instrumentation;
      # plain build flags would invalidate the restored compilation graph.
      # Hosted restores of the multi-gigabyte cache have exceeded 3 minutes.
      - name: Restore Swift packages
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-${{ hashFiles('Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }}-${{ github.workspace }}-swift-

      # Cold compile has its own finite 900s command budget so the journey
      # runtime keeps its original 480s budget, independent of build time.
      - name: Build core journey test products
        timeout-minutes: 17
        run: scripts/run-core-journey-e2e.sh --phase build

      - name: Run prepared core journey gate
        timeout-minutes: 10
        run: python3 scripts/with-test-keychain.py bash scripts/run-core-journey-e2e.sh --phase test

      - name: Upload stage diagnostics
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-journey-e2e-${{ github.run_attempt }}
          path: .artifacts/core-journey-e2e
          if-no-files-found: error
