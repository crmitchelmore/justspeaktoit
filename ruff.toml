# Ruff lints every Python script (scripts/quality runs it; CI's Lint job enforces zero).
# The rules catch real bugs and keep imports tidy; formatting rules that would
# rewrite the existing house style (single quotes, 120 columns) stay off.
target-version = "py39"  # scripts/linux/stage-linux-desktop.py must run on Python 3.9 (#1520)
line-length = 120

[lint]
select = [
    "F",    # pyflakes: undefined names, unused imports and variables
    "E4", "E7", "E9",  # pycodestyle errors that are not layout
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear: likely bugs
    "I",    # import sorting (autofixed)
    "UP",   # pyupgrade (autofixed)
]
ignore = [
    "E402",          # scripts put their own directory on sys.path before importing siblings
    "E701", "E702",  # compact one-line statements are house style in the CI scripts
    "E731",          # small named lambdas are clearer than defs in table-driven code
    "B023",          # closures over loop variables are called within the iteration
    "B905",          # zip() over equal-length sequences; strict= would be noise
    "UP031",         # %-formatting is used deliberately in logs and templates
]

[lint.flake8-bugbear]
# Path(__file__)-style defaults are immutable.
extend-immutable-calls = ["pathlib.Path"]
