          - "In Sentry (de.sentry.io, org tally-lz) confirm the event data retention for the justspeaktoit projects is 90 days or less, matching Docs/PRIVACY.md."
          - "Answer the App Store Connect privacy label as in Docs/ios-app-store-submission.md (installation-linked Crash Data, Performance Data, Other Diagnostic Data and Device ID for App Functionality)."
        expected: "No request reaches Sentry and no Sentry files exist before consent; after withdrawal no further request is made and the on-device Sentry data is deleted. Sentry retention is 90 days or less and the published policy, in-app text and nutrition label agree."
        final_gate: false
      - id: "iphone-openrouter-cleanup-discover-configure"
        issues:
          - 1575
        title: "Cleanup and transcription have a separate Browse OpenRouter models link, like voice"
        minutes: 4
        core: false
        build: "TestFlight Just Speak to It, the first Alpha build that includes the Browse OpenRouter models link"
        steps:
          - "Open Settings \u203a Post-Processing: check the native models are listed with Browse OpenRouter models\u2026 below them and no OpenRouter row."
          - "Tap Browse OpenRouter models\u2026, turn on Discover OpenAI cleanup models via OpenRouter, search for gpt, tap a model, check its Pricing, then tap Use for cleanup."
          - "Open Settings \u203a Transcription, choose Remote and Batch, tap Browse OpenRouter models\u2026 under Remote Batch Model, tap any model and tap Use for transcription."
        expected: "Each link opens a searchable list with provider and price filters, and each model opens a page with its pricing. After choosing, Post-Processing lists OpenRouter \u203a the chosen model with a tick, and Remote Batch Model shows the chosen OpenRouter model."
        final_gate: true
      - id: "iphone-history-session-details"
        issues:
          - 1596
        title: "History shows session details and a timed issue report"
        minutes: 3
        core: false
        build: "TestFlight Just Speak to It, the first Alpha build that includes the iOS History session details change"
        steps:
          - "Make a short recording from the in-app mic with polish on, then one from the Action Button."
          - "In History tap Session details on each new entry."
          - "Long-press one entry, choose Create Issue with Details\u2026 and read the preview."
          - "With VoiceOver on, swipe through the Session details rows."
        expected: "Each entry lists its trigger (Button or Automation), friendly model names per phase, recording length, transcript and post-processing times and a total. The issue preview has relative timings but no transcript text or dates. VoiceOver reads each row's title and value."
        final_gate: true
      - id: "iphone-history-filters"
        issues:
          - 1628
        title: "History: search with model, errors-only and date filters"
        minutes: 4
        core: false
        build: "TestFlight Just Speak to It Alpha, a build that includes the #1628 History filters change"
        steps:
          - "Make History entries over at least two days with two different models, including one that failed (for example with flight mode on)."
          - "In History search for a word from one transcript, then for part of a model name."
          - "Tap the filter button: turn on Errors only, then choose one model, then turn on Limit by date and set From and To to yesterday."
          - "Choose filters that match nothing and tap Clear Search and Filters. Then close the app and reopen History."
          - "With VoiceOver on, swipe through the filter sheet."
        expected: "Search matches transcript text and model names. Errors only shows only failed entries, the model filter shows only that model, and the date range includes entries from the whole of each chosen day, early morning and late evening alike. No matches offers Clear Search and Filters, which restores every entry. Every entry is still there after reopening. VoiceOver reads each toggle, picker and date with its name and state."
        final_gate: false
      - id: "iphone-send-to-mac"
        issues:
          - 1640
        title: "Send to Mac: pair the phone, send a History item, forget the Mac"
        minutes: 5
        core: false
        build: "TestFlight Just Speak to It Alpha, the first build that includes the iOS Send to Mac sender, and a direct-download Mac Alpha"
        steps:
          - "On the Mac open Settings \u203a General \u203a Send to Mac, turn it on and note the pairing code. Click into a scratch note on the Mac."
          - "On the phone open Settings \u203a Sync & Transfer \u203a Send to Mac, allow Local Network access, tap Pair with <your Mac>, enter the code and tap Pair."
          - "In History long-press an entry and choose Send to Mac."
          - "On the Mac tap Regenerate Code, then send another History item from the phone."
          - "Tap Forget This Mac and confirm, then long-press a History item. Search Settings for \"send to mac\"."
          - "With VoiceOver on, repeat one send and listen to the result."
        expected: "Pairing shows the Mac as paired. The first send shows Sent to <your Mac> and the text is pasted once at the Mac's cursor. After regenerating the code the send fails with a message asking you to pair again, and the phone never re-pairs on its own. After forgetting, History no longer offers Send to Mac. Search finds Send to Mac and opens Sync & Transfer. VoiceOver announces sent and failed results."
        final_gate: false
      - id: "owner-ios-upload-required-reason-apis"
        issues:
          - 1644
        title: "iOS upload processes without ITMS-91053"
        minutes: 3
        core: false
        build: "App Store Connect; the first Alpha iOS build that includes the active-keyboards privacy manifest fix"
        steps:
          - "In App Store Connect \u203a TestFlight, find the new iOS build and wait for processing to finish."
          - "Confirm the build shows as ready to test rather than invalid."
          - "Check the Apple email for the build, or the build upload's errors."
        expected: "The build finishes processing and no ITMS-91053 (missing required-reason API declaration) is reported for the app, keyboard, widget or Share extension."
        final_gate: false
      - id: "iphone-learned-corrections"
        issues:
          - 1651
        title: "The Just Speak Keyboard learns a correction you make twice"
        minutes: 8
        core: false
        build: "TestFlight Just Speak to It, the first Alpha build that includes iOS learned corrections"
        steps:
          - "Settings \u203a Post-Processing \u203a Auto-Corrections: check Learn Corrections Automatically is on and the threshold reads 2 edits. The Just Speak Keyboard needs Full Access."
          - "In Notes, dictate with the Just Speak Keyboard a made-up sentence containing a name it gets wrong, for example Suzy for Susie."
          - "Switch to the system keyboard with the globe key, fix the wrong word, then switch back to the Just Speak Keyboard."
          - "Open Just Speak to It, then Settings \u203a Post-Processing \u203a Auto-Corrections \u203a Learned Corrections."
          - "Repeat the dictation and the same fix once more, open the app, then dictate the sentence a third time in the app and with the keyboard."
          - "In Learned Corrections remove the new correction with its trash button, then dictate the sentence again."
          - "Repeat the first dictation and fix in a password field, and once with Learn Corrections Automatically off."
        expected: "After the first fix, Candidates shows the wrong word \u2192 the right one, seen once, with Add and Dismiss buttons. After the second it moves to Applied to Transcripts and the third dictation is spelt correctly in the app and the keyboard. Once removed, the wrong spelling comes back. Nothing is learned from the password field or with learning off. VoiceOver reads every button's label."
        final_gate: false
      - id: "ios-downloaded-local-models"
        issues:
          - 1650
        title: "Downloaded Whisper models transcribe recordings on the device"
        minutes: 10
        core: false
        build: "TestFlight Just Speak to It Alpha, the first build that includes #1650 iOS downloaded local transcription models, on an iPhone and an iPad"
        steps:
          - "Open Settings \u203a Transcription \u203a Downloaded Models. Check each model shows its size and whether it is recommended for this device, then tap Download on the smallest one."
          - "Watch the progress bar, then tap Cancel on a second model part-way through: it returns to Download and its partial files are gone."
          - "When the first finishes, set Where transcription runs = Local and Local Engine = Downloaded Model, and pick the downloaded model."
          - "Turn on Airplane Mode, record a sentence and stop. Then record about five seconds of silence and stop."
          - "Open History and the sentence's detail. Then pick a model you have not downloaded, record again, and remove the downloaded model with its Remove button."
          - "Expand Import from Hugging Face, enter argmaxinc/whisperkit-coreml and openai_whisper-base.en, tap Add Model, then download it."
          - "Turn VoiceOver on and move through a model row while it downloads."
        expected: "The sentence is transcribed with Airplane Mode on and History names the model (for example WhisperKit Base), never a generic label or a cloud provider. The silent recording produces no text and no placeholder. The not-downloaded model fails with a message to download it rather than uploading. Removed models show Download again. The import appears in the list and downloads. VoiceOver reads each model's name, size, state and progress, and announces when a download finishes."
        final_gate: false
      - id: "ios-downloaded-cleanup-models"
        issues:
          - 1650
        title: "Downloaded cleanup models polish transcripts on the device"
        minutes: 12
        core: false
        build: "TestFlight Just Speak to It Alpha, the first build that includes #1650 iOS downloaded local cleanup models, on an iPhone and an iPad"
        steps:
          - "Open Settings \u203a Post-Processing \u203a Model & Prompt \u203a On-Device Cleanup Models. Check each model shows its size; Qwen3 1.7B Q4 appears only on a device with 6 GB of memory or more."
          - "Tap Download on SmolLM2 360M Q4, then tap Download on Qwen3 0.6B Q4 and Cancel part-way: it returns to Download."
          - "When SmolLM2 finishes, tap Use, and confirm it is ticked in the Model list above."
          - "Turn on Airplane Mode and Auto-Polish After Recording, record \"um so I think we should uh meet on Tuesday\" and stop, and time how long the polish takes."
          - "Add a line to the cleanup prompt asking for every word in capitals, polish the same transcript again, then record five seconds of silence."
          - "Remove SmolLM2 with its Remove button and polish the transcript again."
          - "Turn VoiceOver on and move through a model row while it downloads."
        expected: "With Airplane Mode on, the filler words are removed and the prompt's capitals rule is followed, so the prompt reached the model. The silent recording stays empty with no placeholder. After removal, polishing keeps the original transcript and says to download the model; nothing goes to a cloud model. The app does not quit during or after cleanup. VoiceOver reads each model's name, size, state and progress, and announces when a download finishes. Note the device and polish time in the result."
        final_gate: false
      - id: "iphone-usage-insights-dashboard"
        issues:
          - 1623
        title: "Usage insights dashboard matches History"
        minutes: 5
        core: false
        build: "TestFlight Just Speak to It Alpha, the first build that includes the #1623 iOS usage insights dashboard, on an iPhone and an iPad"
        steps:
          - "Dictate three made-up sentences of at least 15 seconds each, saying \"um\" and \"you know\" a few times."
          - "Open History and note Sessions, Average, Total Time, Words and Errors in the header."
          - "Tap the chart button in the History toolbar to open Usage insights."
          - "Compare the Usage section with the History header, then read Top words, Top phrases, Filler words, Speaking pace and Speech records."
          - "Delete one History entry, go back to Usage insights, then turn VoiceOver on and move through the sections."
        expected: "Sessions, Errors, Recording time (Total Time), Average length and Words equal the History header, before and after the deletion. Filler words lists um and you know, Speaking pace counts the three sessions and Speech records shows the words all-time. VoiceOver reads each row's name and value together, and the chart button is named Usage insights."
        final_gate: false
  - id: "watch"
    device: "Watch"
    title: "Apple Watch + iPhone"
    setup:
      - "Double Tap-capable Watch (Series 9+, Ultra 2) on watchOS 11+, paired with the iPhone; Watch Settings \u203a Gestures \u203a Double Tap on."
      - "iPhone Watch app \u203a Smart Stack \u203a Live Activities on; Transcribe Voice in iPhone Control Center."
      - "Optional watch-app checks only (decided: dev build now): the watch ids and App Groups are registered for development signing, and an Alpha dev build with the watch app was installed on the iPhone on 12 Nov 2026 (Stable untouched). If Just Speak to It Alpha is not on the Watch, install it from the iPhone Watch app \u203a Available Apps. To rebuild, see Docs/watch-provisioning.md \u203a Development build."
    items:
      - id: "watch-smart-stack-stop"
        issues:
          - 963
        title: "Smart Stack card: tap and Double Tap stop a locked iPhone"
        minutes: 7
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later; no watch app needed"
        steps:
          - "On the iPhone tap Transcribe Voice in Control Center, wait for Recording, then lock the iPhone."
          - "Raise the Watch, open the Smart Stack, say \"watch tap\" and tap Stop on the small Just Speak to It card."
          - "Start again the same way, say \"watch double tap\" and Double Tap (pinch twice) without touching the screen."
          - "On the finished card, Double Tap again."
          - "Start once more, wake the iPhone without unlocking and tap Stop on the full-size Lock Screen card."
          - "Unlock and open History."
        expected: "Both Watch stops end recording within a few seconds (iPhone mic indicator gone). The finished card has no Stop and Double Tap starts nothing. The Lock Screen card looks as before and its Stop works. History has exactly three new items."
        final_gate: true
      - id: "watch-app-e2e"
        issues:
          - 657
          - 659
        title: "Watch app: complication start, 60 s wrist-down, delivered to iPhone"
        minutes: 8
        core: false
        build: "Just Speak to It Alpha dev build with the watch app (see Watch setup)"
        prerequisites:
          - "Just Speak to It Alpha installed on the Watch (see Watch setup)"
        steps:
          - "Add the Just Speak to It \"Record\" complication to a watch face; note the Watch battery %."
          - "Tap the complication, say \"marker alpha\" and lower your wrist so the screen sleeps."
          - "Say \"marker bravo\" at about 30 s and \"marker charlie\" at about 60 s."
          - "Raise the wrist and tap the complication to stop."
          - "Watch the complication until it shows In history, then open iPhone History and note the battery % again."
        expected: "Recording starts without opening the app screen and the timer reads about 1:05 when you raise the wrist. The complication goes Sending \u2192 In history. iPhone History has one entry with alpha, bravo and charlie. Add both battery readings to a Fail note or the issue."
        final_gate: true
      - id: "watch-app-offline"
        issues:
          - 657
          - 659
        title: "Watch app: offline and force-quit captures still deliver once"
        minutes: 7
        core: false
        build: "Just Speak to It Alpha dev build with the watch app (see Watch setup)"
        prerequisites:
          - "Just Speak to It Alpha installed on the Watch (see Watch setup)"
        steps:
          - "Turn on iPhone Airplane Mode (Bluetooth and Wi-Fi off)."
          - "Tap the complication, say \"offline seven\", tap to stop."
          - "Tap the complication, say \"force quit eight\" for 5 s, then force-quit the watch app (side button, swipe, X)."
          - "Reopen the watch app, then turn Airplane Mode off and wait 2 minutes."
          - "Open iPhone History."
        expected: "While offline the captures wait (never Failed or stuck Recording). After reconnecting both show In history, and iPhone History has exactly one entry each for \"offline seven\" and \"force quit eight\"."
        final_gate: true
      - id: "watch-marketing-footage"
        issues:
          - 1368
        title: "Website footage: stop a locked iPhone from the Watch Smart Stack"
        minutes: 6
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later; no watch app needed"
        prerequisites:
          - "Do Not Disturb on both devices; a second phone or camera to film the Watch and iPhone together; fictional words only."
        steps:
          - "Start filming the Watch and the iPhone together."
          - "On the iPhone tap Transcribe Voice in Control Center, say \"Book the team lunch for Thursday\" and lock the iPhone."
          - "Raise the Watch, open the Smart Stack and tap Stop on the Just Speak to It card."
          - "Unlock the iPhone and open History so the new item is visible, then stop filming."
          - "Attach the video to #1368 (or share it with the agent)."
        expected: "A clip under 30 seconds showing the Watch stop ending the iPhone recording and the new item in History, with no notifications or personal data visible."
        final_gate: false
      - id: "watch-voiceover-pass"
        issues:
          - 1399
        title: "Watch: VoiceOver reads the record button and captures"
        minutes: 3
        core: false
        build: "TestFlight Just Speak to It, the first Alpha build that includes the fix for #1399, with the watch app installed"
        steps:
          - "Turn on VoiceOver on the Watch."
          - "Open Just Speak to It, double-tap Start recording, say a fictional sentence, then double-tap Stop recording."
          - "Swipe to the new capture row."
        expected: "The button reads Start recording, then Stop recording, and the row reads its time, length and status as one item."
        final_gate: true
  - id: "android"
    device: "Android"
    title: "Android"
    setup:
      - "A Pixel on Android 13 or later and, for the OEM check, a non-Google phone, each with the Alpha APK installed."
      - "An OpenAI and a Groq key saved in Settings for the Cloud checks, and an OpenRouter key for cleanup. Use made-up sentences only."
    items:
      - id: "android-on-device-offline"
        issues:
          - 1328
        title: "On-device dictation works offline, and a missing model can be downloaded"
        minutes: 8
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the language and corrections change"
        steps:
          - "On the Pixel, choose On-device and dictate a sentence; repeat in flight mode."
          - "Settings: choose a Dictation language whose on-device model is not installed, tap Download language and wait for it to install, then dictate."
          - "Repeat the first step on the non-Google phone; if it has no recognition service, or it is disabled, note what the app says."
          - "In flight mode, try Speech service and Cloud modes."
        expected: "Each session returns the spoken words, offline included. After the download, Start becomes available and dictation works. A phone without a recogniser shows the reason and no Start. Offline Speech service and Cloud either return a genuine transcript or fail visibly; never a false success."
        final_gate: true
      - id: "android-permission-interruptions"
        issues:
          - 1328
        title: "Microphone permission and interruptions fail honestly"
        minutes: 8
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the language and corrections change"
        steps:
          - "Clear the app's permissions. Start dictation and deny the microphone, then deny it permanently, then recover through the Settings link."
          - "During a dictation, receive a call; during another, connect and then disconnect a Bluetooth headset."
          - "During a Cloud dictation, say a first phrase, leave the app, say a second, different phrase, then come back and stop."
        expected: "Denial shows a rationale, then a Settings link, and dictation works once granted. A call or route change ends the session with a clear reason or carries on with correct text; leaving the app does not stop dictation: it carries on with the recording notification showing, and stopping after you come back keeps both phrases."
        final_gate: true
      - id: "android-silence-auto-stop"
        issues:
          - 1632
        title: "Cloud recordings stop after the set silence"
        minutes: 4
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the #1632 silence auto-stop change"
        steps:
          - "Settings: turn on Stop recording after silence, set Silence duration to 2 seconds and leave the threshold at 0.05."
          - "Choose Cloud mode, start dictating, say a sentence and then stay quiet."
          - "Start again and say nothing at all; then start once more, pause for 1 second mid-sentence and carry on."
          - "Set the duration to 5 seconds and repeat the first dictation; then turn the setting off and stay quiet for 10 seconds."
        expected: "With the setting on, the recording stops about the set time after you go quiet and the sentence is transcribed. Saying nothing stops after the set time with no invented text. A pause shorter than the duration does not stop it. With the setting off, the recording keeps going until you stop it."
        final_gate: false
      - id: "android-hands-free-dictation"
        issues:
          - 1632
        title: "Hands-free starts a Cloud recording when you speak, including your first word"
        minutes: 6
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the #1632 hands-free dictation change"
        steps:
          - "Settings: turn on Hands-free dictation and leave Silence duration at 2 seconds. Choose Cloud mode."
          - "Tap the record button. Check the screen says it is listening, the microphone indicator is on and a Listening notification appears; stay quiet for 10 seconds."
          - "Say a sentence that starts with a short word, such as \"So, the meeting is at three\", then stay quiet."
          - "Say a second sentence. Then lock the screen, wait 5 seconds, say a third sentence, wait for it to finish and unlock."
          - "Tap Turn off hands-free; then choose an on-device or speech-service mode and open Settings."
        expected: "Nothing is recorded or sent while you stay quiet. Each sentence starts a recording on its own, keeps its first word, stops about 2 seconds after you go quiet, is transcribed and then listening resumes, including with the screen locked. TalkBack announces the listening and recording states. Turning hands-free off ends the notification and the microphone indicator. In other modes the button records at once and Settings says hands-free needs Cloud mode."
        final_gate: false
      - id: "android-learned-corrections"
        issues:
          - 1651
        title: "The dictation keyboard learns a correction you make twice"
        minutes: 6
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes learned corrections"
        steps:
          - "Settings > Learned corrections: check Learn corrections from your edits is on and Add automatically after 2 edits is shown."
          - "In a notes app, dictate with the Just Speak to It keyboard a made-up sentence containing a name it gets wrong, for example Suzy for Susie."
          - "Within ten seconds, without switching keyboards, delete the wrong word with the keyboard's delete key and dictate or paste the right spelling."
          - "Wait fifteen seconds, open Settings > Learned corrections and check the suggestion; tap Dismiss on another suggestion if there is one."
          - "Repeat the dictation and the same correction once more, then dictate the sentence a third time."
          - "Repeat the first dictation and edit in a password field."
        expected: "After the first edit, Learned corrections shows the wrong word → the right one, seen once, with Add and Dismiss. After the second, it leaves the suggestions and appears in Personal corrections, and the third dictation is spelt correctly. A dismissed suggestion does not come back. Nothing is learned from the password field."
        final_gate: false
      - id: "android-history-playback"
        issues:
          - 1629
        title: "Android: play kept recordings from History"
        minutes: 8
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes History playback"
        steps:
          - "In Settings turn on Keep recordings in History, then make two Cloud dictations of a few seconds each."
          - "Open History, tap Play on the newest entry, then Stop before it ends. Play it again and start a dictation while it plays."
          - "Tap Transcribe on one entry and check it keeps its Play button."
          - "Turn the setting off, dictate once more, then tap Clear and choose Keep recordings."
          - "Tap Clear again and choose Delete all."
        expected: "Each recording plays your own voice and Stop ends it at once; starting a dictation stops playback. The entry made with the setting off has no Play button and Clear with Keep recordings removes only it. Delete all empties History."
        final_gate: false
      - id: "android-history-filters"
        issues:
          - 1628
        title: "Android: search History and filter by model, errors and date"
        minutes: 5
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the #1628 History filters change"
        steps:
          - "Make History entries over at least two days in Cloud mode with two models and in On-device mode, including one that fails (for example Cloud in flight mode)."
          - "Open History and search for a word from one transcript, then for part of a model name such as \"Whisper\"."
          - "Clear the search. Choose a model from the Model button, then tap Errors only, then set From and To to the same earlier day."
          - "Open From again and tap Any day; then tap Clear filters."
          - "Rotate the phone with a filter set, then close the app and reopen History."
          - "With TalkBack on, move through the search field, filter buttons and the summary line."
        expected: "Search matches transcript text and model names, ignoring case. Each filter narrows the list, and the summary reads \"Showing N of M dictations\" or that nothing matches. A one-day range includes entries from early morning to late evening of that day only. Any day removes that end of the range and Clear filters shows every entry again. Rotating keeps the filters, and every entry is still there after reopening. TalkBack names every control and announces the summary as it changes."
        final_gate: false
      - id: "android-microphone-selection"
        issues:
          - 1637
        title: "Android: Cloud recordings use the chosen microphone and fall back visibly"
        minutes: 6
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes microphone selection"
        steps:
          - "Connect a wired, USB or Bluetooth headset (Bluetooth needs Android 12 or later) and pick Cloud mode."
          - "Settings > Microphone: choose the headset, then make a Cloud dictation speaking only into the headset with the phone held away."
          - "Choose Built-in microphone and dictate again speaking only into the phone."
          - "Choose the headset again, disconnect it, and open the dictation screen; dictate once."
          - "Reconnect the headset and reopen Settings > Microphone."
        expected: "Each dictation transcribes the voice from the chosen microphone. While the headset is disconnected, Settings and the dictation screen say the chosen microphone isn't connected and the dictation still records from the phone. After reconnecting, the headset is selected again with no warning. Ending a Bluetooth dictation returns call and media audio to normal."
        final_gate: false
      - id: "android-foreground-long-dictation"
        issues:
          - 1592
        title: "Long dictation keeps going in the background, and Stop works from the notification"
        minutes: 15
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the foreground dictation change"
        steps:
          - "On Android 13 or later, start the first dictation after installing and allow notifications when asked."
          - "Choose Cloud and dictate for about five minutes: after a minute open another app, then turn the screen off for a minute, then come back and keep talking."
          - "Check the notification while recording, then tap Stop in the notification."
          - "Repeat in Speech service mode with another app in front for 30 seconds, and note whether words spoken there arrive."
          - "Start a Cloud dictation, talk for 20 seconds, then swipe the app away from Recents. Open the app again and go to History."
        expected: "A silent \"Just Speak to It is dictating\" notification with Stop shows for the whole session. Cloud returns every word, including those spoken with another app in front and with the screen off. Stop in the notification finishes the session like the Stop button and the notification goes once the transcript is in. Speech service either keeps listening in the background or ends with a clear reason and keeps its unfinished words. After swiping the app away, History has a failed entry saying the recording ended before it could be transcribed, whose Transcribe returns the 20 seconds of speech."
        final_gate: true
      - id: "android-interruptions-focus-route"
        issues:
          - 1592
        title: "Calls, other apps' audio and headset changes never lose a recording"
        minutes: 12
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the foreground dictation change"
        steps:
          - "During a Cloud dictation, receive a phone call (answer it or let it ring), then go to History."
          - "During a Cloud dictation, start a voice note or the Google Assistant for a few seconds, then return."
          - "During a Cloud dictation, start music or a video in another app."
          - "During a Cloud dictation, connect a Bluetooth headset; during another, unplug or disconnect a headset that was connected before you started."
          - "Repeat the call and headset steps in Speech service mode after saying a few words."
        expected: "A call ends the session with \"Dictation stopped for a call\"; a headset change ends it saying a headset or Bluetooth microphone was connected or disconnected. Each keeps everything said before: Cloud saves the recording with the failed History entry and Transcribe returns its words; Speech service keeps the unfinished words. A short assistant or voice note pauses the Cloud recording (the screen and notification say Paused) and it resumes by itself afterwards. Music taking over for good stops the session with a clear reason and keeps the audio."
        final_gate: true
      - id: "android-cloud-keys-cleanup"
        issues:
