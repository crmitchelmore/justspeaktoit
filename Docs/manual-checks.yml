        core: true
        build: "TestFlight Just Speak to It Alpha that includes the App Review iPad fix (labelled Transcribe button)"
        prerequisites:
          - "An iPad on iPadOS 26 or later that is backed up or a spare test device, with a fresh installation (delete the app first so its local History goes too); no API keys entered."
        steps:
          - "Open the app in portrait and look at the bottom of the main screen, then rotate to landscape."
          - "Open Safari beside it in Split View (or Stage Manager), then resize the app to one-third and to half width."
          - "Tap Transcribe and allow the Microphone and Speech Recognition prompts; if Prepare Apple Model appears, tap it, wait until it is ready and tap Transcribe again. Say a fictional sentence and tap Stop."
          - "Open Settings \u203a Recording & Shortcuts with Live Activities on, and Settings \u203a Transcription; read the footnotes."
          - "In iOS Settings turn the app's Microphone access off, return and tap Transcribe."
        expected: "A button labelled Transcribe with a microphone icon is visible at the bottom in portrait, landscape and every Split View width. With no API key the first recording uses on-device Apple Speech and produces text with no error (if Apple's speech assets are still downloading, the alert offers Prepare Apple Model, not a generic Error). No copy mentions this iPhone or the Dynamic Island. With access off, the alert is titled Can't Start Recording and offers Open Settings."
        final_gate: true
      - id: "owner-iphone-store-privacy-and-review-metadata"
        issues:
          - 1468
        title: "Store candidate: privacy report, consent and private review information"
        minutes: 12
        core: false
        build: "The exact signed iOS candidate selected for resubmission, plus App Store Connect"
        prerequisites:
          - "Read Docs/ios-app-store-submission.md; static archive checks do not prove consent, retention, support-site deployment or App Store Connect answers."
          - "Sentry diagnostics are opt-in (Send crash reports and diagnostics, off until agreed) and separate from product-analytics consent; run owner-diagnostics-consent-signed-candidate first."
        steps:
          - "Generate the exact archive's Privacy Report in Xcode Organizer and compare it with the app, all SDKs and enabled extension data flows."
          - "In App Store Connect declare Audio Data and Other User Content for App Functionality, and installation-linked Crash Data, Performance Data, Other Diagnostic Data and Device ID for App Functionality; reconcile any additional SDK types in the report rather than answering No automatically."
          - "Verify the app and published privacy policy disclose Sentry EU diagnostics, installation linkage, retention and the actual consent/withdrawal behavior; verify third-party AI sharing is disclosed and permission is obtained before content is sent."
          - "Verify https://justspeaktoit.com/support and /privacy are live, and put those URLs in the listing's Support URL and Privacy Policy fields."
          - "Add dedicated provider credentials and reproducible device steps only to private App Review information; confirm screenshots and export-compliance answers match the candidate."
          - "Re-read Resolution Center, resolve every remaining review finding and approve the frozen candidate through the normal Stable process."
        expected: "The exact candidate's device evidence, SDK privacy report, nutrition labels, published policy, consent/withdrawal behavior, support URLs and private review information agree. No credentials enter public issues or screenshots, and no submission is approved solely because the archive builds."
        final_gate: false
      - id: "iphone-app-shortcuts-phrases"
        issues:
          - 1595
        title: "Siri and Spotlight offer the app's built-in shortcut phrases"
        minutes: 3
        core: false
        build: "TestFlight Just Speak to It, the first Alpha build that includes #1595"
        steps:
          - "Open the Shortcuts app and find Just Speak to It under App Shortcuts; count the shortcuts listed."
          - "Search Spotlight for Just Speak and look for its Toggle Recording and Dictate actions."
          - "Say \"Hey Siri, toggle recording with Just Speak to It\", speak a short made-up sentence, then say \"Hey Siri, stop recording with Just Speak to It\"."
        expected: "Shortcuts lists the app's eight built-in shortcuts without any setup, Spotlight shows its actions, and the Siri phrases start and stop a recording that appears in History."
        final_gate: false
      - id: "iphone-diagnostics-consent"
        issues:
          - 1468
        title: "Crash reports are asked once, off until agreed, and can be turned off"
        minutes: 3
        core: false
        build: "TestFlight Just Speak to It, the first Alpha build that includes diagnostics consent"
        steps:
          - "Open the app after updating; read the Send crash reports and diagnostics prompt and choose Don't Send."
          - "Close and reopen the app."
          - "Open Settings \u203a Privacy & Diagnostics \u203a Privacy Information, then turn Send crash reports and diagnostics on and off again; check the Network Activity row each time."
        expected: "The prompt appears once and explains what is sent; it does not return. The switch reflects your choice, and the Crash and Performance Diagnostics row reads Off whenever the switch is off."
        final_gate: false
      - id: "owner-diagnostics-consent-signed-candidate"
        issues:
          - 1468
        title: "Store candidate: no Sentry traffic before consent; withdrawal deletes unsent reports"
        minutes: 15
        core: false
        build: "The exact signed iOS and Mac App Store candidates selected for resubmission"
        prerequisites:
          - "A test installation and a proxy or network log (for example Charles or the iOS Network privacy report) that shows requests to ingest.de.sentry.io."
        steps:
          - "Fresh-install each candidate and complete onboarding without agreeing to crash reports; use the app for a minute and check the network log and the app container's Caches folder."
          - "Turn Send crash reports and diagnostics on, use the app, then turn it off; check the network log and that Caches/<bundle id>/Sentry, io.sentry and the INSTALLATION file are gone."
          - "In Sentry (de.sentry.io, org tally-lz) confirm the event data retention for the justspeaktoit projects is 90 days or less, matching Docs/PRIVACY.md."
          - "Answer the App Store Connect privacy label as in Docs/ios-app-store-submission.md (installation-linked Crash Data, Performance Data, Other Diagnostic Data and Device ID for App Functionality)."
        expected: "No request reaches Sentry and no Sentry files exist before consent; after withdrawal no further request is made and the on-device Sentry data is deleted. Sentry retention is 90 days or less and the published policy, in-app text and nutrition label agree."
        final_gate: false
