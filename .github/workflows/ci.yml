name: CI

# Note: macOS runners require either:
# - Public repository (free)
# - GitHub Team/Enterprise plan (paid)
# - Self-hosted runners

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build
        run: make build

      - name: Test (Debug)
        run: swift test --enable-code-coverage

      # Snapshot mismatches write the freshly rendered PNG to the process
      # temporary directory. Publishing it is the only way to inspect a CI-only
      # rendering difference, since the runner is discarded after the job.
      - name: Collect snapshot failures
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot-failures"
          find "${TMPDIR:-/tmp}" -maxdepth 3 -path '*SnapshotTests*' -name '*.png' \
            -exec cp {} "$RUNNER_TEMP/snapshot-failures/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/snapshot-failures" || true

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore

      # Release-configuration tests run as the release gate in release-mac.yml;
      # running them here too effectively doubled test time on 10x-billed macOS runners.

      - name: Build SpeakCore (App Store flavour)
        # SpeakCore has no package dependencies, so this cheaply compiles the
        # `#if APP_STORE` branches that only the Mac App Store build exercises.
        # Runs after the test steps because the extra -Xswiftc flag invalidates
        # the shared debug build cache for the targets it rebuilds.
        run: swift build -Xswiftc -DAPP_STORE --target SpeakCore

      - name: Report Coverage
        if: always()
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST_PATH=$(find "$BIN_PATH" -name '*.xctest' -type d | head -1)
          if [ -n "$XCTEST_PATH" ]; then
            EXEC_PATH="$XCTEST_PATH/Contents/MacOS/$(basename "$XCTEST_PATH" .xctest)"
            COV_DIR=$(swift test --show-codecov-path 2>/dev/null || echo "")
            if [ -n "$COV_DIR" ] && [ -f "$COV_DIR" ]; then
              echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
              xcrun llvm-cov report "$EXEC_PATH" \
                --instr-profile="$(dirname "$COV_DIR")/default.profdata" \
                --ignore-filename-regex='\.build|Tests/' 2>/dev/null | head -30 >> $GITHUB_STEP_SUMMARY || true
            fi
          fi

  build-ios:
    name: Build iOS Library
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tuist
        run: brew install tuist

      - name: Build iOS Library
        run: swift build --disable-dependency-cache --target SpeakiOSLib

      - name: Select iOS Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | jq -r \
            '([.devices[][] | select(.name == "iPhone 17 Pro")][0].udid) //
             ([.devices[][] | select(.name | startswith("iPhone"))][0].udid)')
          test -n "$SIMULATOR_ID"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Generate iOS App Project
        # Internal CI builds include the flagged-off keyboard extension so it
        # keeps compiling and its flag-gated tests run. Release and TestFlight
        # builds stay gated behind the manual `include_keyboard` input.
        env:
          TUIST_IOS_KEYBOARD: "1"
        run: tuist generate --no-open

      - name: Test iOS App and Action Button Settings
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "Just Speak to It.xcworkspace" \
            -scheme SpeakiOS \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:SpeakiOSTests \
            -only-testing:SpeakiOSUITests \
            -skipPackagePluginValidation \
            -quiet \
            2>&1 | tail -50

      - name: Build watchOS App (feature-flagged)
        # The watch app target only exists when generated with
        # TUIST_WATCH_APP=1 (it needs its own provisioning profile for release
        # signing, so it is excluded from release builds). Build it unsigned
        # here so the flagged target cannot rot. Cheap: five small source
        # files plus two shared core files.
        run: |
          set -o pipefail
          TUIST_WATCH_APP=1 tuist generate --no-open
          xcodebuild build \
            -workspace "Just Speak to It.xcworkspace" \
            -scheme JustSpeakWatchApp \
            -destination generic/platform=watchOS \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -quiet \
            2>&1 | tail -30

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: SwiftLint
        run: |
          swift package --disable-dependency-cache plugin --allow-writing-to-package-directory swiftlint --strict --baseline .swiftlint-baseline.json

      - name: Test release-notes generator
        run: node --test Tests/ReleaseNotesTests/*.test.mjs
