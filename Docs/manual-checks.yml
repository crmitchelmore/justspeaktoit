      - id: "owner-desktop-raw-configuration-editor"
        issues:
          - 1670
        title: "Windows and Linux: Edit raw configuration validates, applies all or none, round-trips"
        minutes: 6
        core: false
        build: "Just Speak to It for Windows or Linux, the first Alpha build that includes the #1670 raw configuration editor"
        steps:
          - "Open Preferences \u203a General and choose Edit raw configuration\u2026 (Windows: in App behaviour; Linux: the Edit\u2026 button). Check no API key value appears; \"apiKeys\" lists only true or false."
          - "With Narrator (Windows) or Orca (Linux) running, Tab through the window: it reads Raw configuration JSON, then each button by name."
          - "Change \"holdThreshold\" to 9 and \"showHUD\" to \"yes\", choose Validate, then Apply: the screen reader announces the result and first error, Issues names settings.holdThreshold and settings.showHUD, your text stays, and nothing is saved."
          - "Set \"holdThreshold\" back to its earlier value, \"showHUD\" to false and the automation write switch to true, choose Apply: it saves 1 change, warns the switch is read-only, and Preferences shows Show recording HUD off with the switch unchanged."
          - "Export\u2026 to a file, Reset to Defaults, Apply, then Import\u2026 the file and Apply: your values come back."
          - "Start dictating and choose Apply on a changed document: it says to finish dictation first and changes nothing."
          - "Search Preferences for \"raw\" or \"json\": Edit raw configuration is a result and opens General."
        expected: "Errors name each bad key and nothing changes until every value is valid; read-only keys are kept with a warning; applied values show in Preferences at once; export, reset and import round-trip; Apply waits for dictation; results are announced to the screen reader."
        final_gate: false
  - id: "iphone"
    device: "iPhone"
    title: "iPhone"
    setup:
      - "Install TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later on an iPhone with an Action Button (iOS 26+)."
      - "In the app: API keys for OpenRouter (polish), OpenAI and Deepgram saved; Settings \u203a Action Button & Shortcuts \u203a When Recording Stops = Copy & Polish (default is Auto)."
      - "Settings \u203a Transcription \u203a Where transcription runs = Local (Apple SpeechTranscriber)."
      - "iOS Settings \u203a Action Button \u203a Controls: choose Transcribe Voice (Just Speak to It Alpha)."
      - "Have Notes open on a scratch note, AirPods in their case, and your Mac (same Apple ID, Handoff on) nearby."
    items:
      - id: "iphone-raw-configuration-editor"
        issues:
          - 1608
          - 1671
        title: "iPhone raw configuration editor validates, applies all or none, imports and exports"
        minutes: 5
        core: false
        build: "TestFlight Just Speak to It Alpha, a build that includes the #1608 iPhone raw configuration editor"
        steps:
          - "Open Settings \u203a General \u203a Edit raw configuration \u203a Raw configuration. Check no API key value appears; \"apiKeys\" lists only true or false."
          - "Change \"autoStopSilenceSeconds\" to 30 and tap Validate, then Apply: an error names settings.autoStopSilenceSeconds and nothing is saved."
          - "Set it to 5 and \"hardwareTriggerDestination\" to \"historyOnly\", tap Apply, go back to Recording & Shortcuts: both show the new values."
          - "Check the document lists the Read aloud settings (\"ttsProvider\", \"ttsModel\", \"ttsVoice\", \"ttsSpeed\", \"ttsLanguageIdentifier\", \"sonioxTTSRegion\"). With \"ttsProvider\" \"deepgram\", set \"ttsSpeed\" to 3 and tap Validate: an error names settings.ttsSpeed. Set it to 1.5 and \"ttsLanguageIdentifier\" to \"en_GB\" and tap Apply: no error."
          - "Tap Export, save to Files, tap Reset to Defaults and confirm, Apply, then Import the saved file and Apply: your values come back, including \"ttsSpeed\" 1.5 and \"ttsLanguageIdentifier\" \"en_GB\"."
          - "With VoiceOver on, tap Validate on an invalid document: VoiceOver reads the result and the first error."
          - "Search Settings for \"raw\" or \"json\": Edit raw configuration is a result and opens General."
        expected: "Errors name each bad key and nothing changes until every value is valid; applied values show on their Settings pages at once; export, reset and import round-trip; results are announced to VoiceOver."
        final_gate: false
      - id: "iphone-ipad-device-copy"
        issues:
          - 1598
        title: "iPad Settings never says \"this iPhone\" or mentions the Dynamic Island"
        minutes: 3
        core: false
        build: "TestFlight Just Speak to It Alpha, a build that includes the #1598 device-copy fix, on an iPad and an iPhone"
        steps:
          - "On an iPad, open Settings and read the Recommended setup card."
          - "Open Transcription, Recording & Shortcuts (with Live Activities on), Sync and Privacy & Diagnostics and read their footnotes."
          - "Start a recording, open Settings \u203a System resources in use and read the Live Activity row."
          - "Repeat the Recommended setup and Live Activity checks on an iPhone."
        expected: "On iPad, copy says \"this iPad\" or \"your iPad\", the setup card suggests Control Center rather than the Action Button, and nothing mentions the Dynamic Island. On iPhone, copy says \"this iPhone\" and the Live Activity text says \"on supported iPhones, in the Dynamic Island\"."
        final_gate: false
      - id: "iphone-batch-provider-catalogue"
        issues:
          - 1636
        title: "Recorded transcription: Deepgram, AssemblyAI, ElevenLabs, Groq and other providers"
        minutes: 6
        core: false
        build: "TestFlight Just Speak to It Alpha, a build that includes the #1636 batch provider catalogue"
        prerequisites:
          - "A working API key for at least two of Deepgram, AssemblyAI, ElevenLabs, Groq, Mistral, Modulate, Rev.ai, Soniox or Speechmatics. Use made-up sentences only."
        steps:
          - "Open Settings, API Keys and save the keys. Groq now has its own card."
          - "Open Settings, Transcription, choose Batch and open the model list."
          - "Choose one of the providers you have a key for, record \"batch provider check one two three\" and stop."
          - "Repeat with a second provider, then open History."
        expected: "The batch list shows Deepgram, AssemblyAI, ElevenLabs, Groq, Mistral, Modulate, Rev.ai, Soniox and Speechmatics sections. Each recording returns the spoken words, History names the chosen provider and model, and no recording needs or uses the OpenRouter key."
        final_gate: false
      - id: "iphone-troubleshooting-page"
        issues:
          - 1634
        title: "Troubleshooting lists what stops dictation and each fix works"
        minutes: 4
        core: false
        build: "TestFlight Just Speak to It Alpha, a build that includes the #1634 Troubleshooting page"
        steps:
          - "Open Settings \u203a Privacy & Diagnostics \u203a Troubleshooting with a cloud model selected and its key saved."
          - "In the system Settings app turn the microphone off for Just Speak, return to the app and read the page."
          - "Tap Open Settings on the Microphone row, turn it back on and return."
          - "Choose a cloud model whose key is not saved, then open Troubleshooting again and tap API keys."
          - "With a saved Deepgram or ElevenLabs key selected, tap Check key."
        expected: "With the microphone off, a red Microphone row is listed first and the summary says something is stopping dictation; after turning it back on and returning, the row turns green without reopening the page. The missing key row names the provider and opens API Keys. Check key reports whether the provider accepted the saved key, and a rejected key turns the row red."
        final_gate: false
      - id: "iphone-microphone-selection"
        issues:
          - 1637
        title: "Recording uses the chosen microphone and falls back visibly"
        minutes: 4
        core: false
        build: "TestFlight Just Speak to It Alpha, a build that includes #1637"
        steps:
          - "Connect a wired or Bluetooth headset (or a USB microphone)."
          - "Settings \u203a Recording & Shortcuts \u203a Microphone: choose the built-in microphone, then dictate a sentence while speaking into the phone, not the headset."
          - "Choose the headset microphone and dictate again into the headset."
          - "Disconnect the headset, then dictate once more and look at the recording screen and the Microphone picker."
          - "Choose System Default."
        expected: "Each recording uses the chosen microphone. With the headset gone, recording still works on the built-in microphone, the recording screen says the chosen microphone isn't connected, and the picker shows Saved Microphone (Not Connected). Choosing System Default clears the notice."
        final_gate: false
      - id: "iphone-clipboard-e2e"
        issues:
          - 934
          - 1117
        title: "Cold Action Button start: raw paste now, your later copy kept"
        minutes: 6
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        prerequisites:
          - "Simulator-only pre-check, 4 Nov 2026 (not device evidence): raw text on the clipboard at Stop and a later copy kept, via deep links and the simulator transcript hook. Still pending on a physical iPhone."
        steps:
          - "Force-quit Just Speak to It in the App Switcher."
          - "From the Home Screen, press and hold the Action Button, say \"raw clipboard, um, test\", then press and hold again to stop."
          - "Within 2 seconds paste into Notes."
          - "In Notes type MARKER, select it and tap Copy."
          - "Wait 20 seconds, paste again, then open History."
        expected: "First paste is the raw words (fillers included), never a placeholder. Second paste is MARKER (polish did not overwrite your copy). History has exactly one item, showing the polished text. Recording started from cold and no Live Activity lingers."
        final_gate: true
      - id: "iphone-clipboard-locked"
        issues:
          - 934
        title: "Stop while locked, then unlock and paste raw text"
        minutes: 3
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later"
        steps:
          - "Press and hold the Action Button, say \"locked stop\", then press the side button to lock."
          - "While locked, stop with the Action Button or the Lock Screen Stop button."
          - "Wait 20 seconds, unlock and paste into Notes."
        expected: "Paste is the raw \"locked stop\"; History has one polished item. No placeholder. Add your iOS version and whether Stop needed an unlock to any Fail note."
        final_gate: true
      - id: "iphone-interrupted-recording-prompt"
        issues:
          - 1617
        title: "Recording interrupted prompt: only after a real interruption, and every answer sticks"
        minutes: 6
        core: false
