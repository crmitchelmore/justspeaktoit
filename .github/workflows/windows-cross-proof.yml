name: macOS to Windows Swift Proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Package.swift
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Sources/CWindowsSupport/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakPortableTests/**
      - Tests/SpeakWindowsPlatformTests/**
      - Tests/SpeakTestSupport/**
      - scripts/windows-cross/**
      - scripts/windows-bundle/**
      - .github/workflows/windows-cross-proof.yml
  push:
    branches: [main]
    paths:
      - Package.swift
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Sources/CWindowsSupport/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakPortableTests/**
      - Tests/SpeakWindowsPlatformTests/**
      - Tests/SpeakTestSupport/**
      - scripts/windows-cross/**
      - scripts/windows-bundle/**
      - .github/workflows/windows-cross-proof.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compile:
    name: Cross-compile Swift app and tests on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Windows PE with private pinned prerequisites
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/foundation-proof"
          python3 scripts/windows-cross/build-foundation-proof.py \
            --cache "$RUNNER_TEMP/private-windows-cross-sdk" \
            --output "$RUNNER_TEMP/foundation-proof" 2>&1 |
            tee "$RUNNER_TEMP/foundation-proof/bootstrap.log"
      - name: Cross-build the Windows app and test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/windows-app-cross"
          python3 -B -m unittest discover -s scripts/windows-cross -p test_build_windows_app.py
          python3 scripts/windows-cross/build-windows-app.py \
            --configuration release \
            --cache "$RUNNER_TEMP/private-windows-cross-sdk" \
            --output "$RUNNER_TEMP/windows-app-cross" 2>&1 |
            tee "$RUNNER_TEMP/windows-app-cross/bootstrap.log"
      - name: Assemble the self-contained runtime bundle
        shell: bash
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s scripts/windows-bundle -p 'test_*.py'
          mkdir -p "$RUNNER_TEMP/windows-runtime-bundle"
          python3 scripts/windows-bundle/build-windows-bundle.py \
            --app "$RUNNER_TEMP/windows-app-cross" \
            --cache "$RUNNER_TEMP/private-windows-cross-sdk" \
            --downloads "$RUNNER_TEMP/private-windows-cross-sdk/bundle-downloads" \
            --output "$RUNNER_TEMP/windows-runtime-bundle" \
            --llvm-readobj "$RUNNER_TEMP/private-windows-cross-sdk/llvm-20/LLVM-20.1.8-macOS-ARM64/bin/llvm-readobj" 2>&1 |
            tee "$RUNNER_TEMP/windows-runtime-bundle/bootstrap.log"
      - name: Upload self-contained runtime bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-runtime-bundle
          path: ${{ runner.temp }}/windows-runtime-bundle/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Mac-built Windows app and tests
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-built-windows-app
          path: ${{ runner.temp }}/windows-app-cross/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload proof and build evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: foundation-windows-cross-proof
          path: ${{ runner.temp }}/foundation-proof/
          if-no-files-found: error
          retention-days: 14

  execute:
    name: Execute Mac-built app and tests on Windows
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Install pinned Windows Swift runtime
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          source: swift.org
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
          build_arch: amd64
          update-sdk-modules: false
      - uses: actions/download-artifact@v5
        with:
          name: foundation-windows-cross-proof
          path: proof
      - uses: actions/download-artifact@v5
        with:
          name: macos-built-windows-app
          path: app
      - name: Verify artifact identity and run Foundation assertions
        shell: pwsh
        run: |
          $metadata = Get-Content proof/build-metadata.json -Raw | ConvertFrom-Json
          if ($metadata.host -ne 'Darwin' -or $metadata.target -ne 'x86_64-unknown-windows-msvc') {
            throw 'Unexpected build provenance.'
          }
          if ($metadata.sourceCommit -ne $env:GITHUB_SHA) { throw 'Foundation source commit mismatch.' }
          $actual = (Get-FileHash proof/FoundationWindowsProof.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $metadata.executableSHA256) { throw 'Mac-built artifact hash mismatch.' }
          swift --version | Set-Content proof/windows-runtime.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath (Resolve-Path proof/FoundationWindowsProof.exe).Path `
            -PassThru -NoNewWindow -RedirectStandardOutput proof/windows-proof.log `
            -RedirectStandardError proof/windows-proof-errors.log
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Foundation runtime proof exceeded 30 seconds.'
          }
          Get-Content proof/windows-proof.log
          Get-Content proof/windows-proof-errors.log
          if ($process.ExitCode -ne 0) { throw "Foundation proof failed: $($process.ExitCode)" }
          if (-not (Select-String -Path proof/windows-proof.log `
            -Pattern '^JSTI_FOUNDATION_WINDOWS_CROSS_PROOF_OK:' -Quiet)) {
            throw 'Foundation assertion success marker missing.'
          }
      - name: Verify Mac-built app, portable tests and native UI
        shell: pwsh
        run: |
          $metadata = Get-Content app/app-build-metadata.json -Raw | ConvertFrom-Json
          if ($metadata.host -ne 'Darwin' -or $metadata.target -ne 'x86_64-unknown-windows-msvc') {
            throw 'Unexpected app build provenance.'
          }
          if ($metadata.sourceCommit -ne $env:GITHUB_SHA) { throw 'App source commit mismatch.' }
          if ($metadata.configuration -ne 'release' -or $metadata.appBuiltForTesting -ne $false) {
            throw 'Expected an optimised production app and separate test executable.'
          }
          foreach ($entry in $metadata.executables.PSObject.Properties) {
            $actual = (Get-FileHash (Join-Path app $entry.Name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "Mac-built artifact hash mismatch: $($entry.Name)" }
          }
          # SwiftPM normally supplies these when launching tests. These tests
          # were built on the Mac, so add the installed Windows test DLL paths.
          $developer = Split-Path (Split-Path $env:SDKROOT -Parent) -Parent
          foreach ($library in @('XCTest', 'Testing')) {
            $directory = Join-Path $developer "Library/$library-6.2.3/usr/bin64"
            if (-not (Test-Path $directory)) { throw "Missing installed test runtime: $library" }
            $env:Path = "$directory;$env:Path"
          }
          function Invoke-CrossBuilt([string] $name, [string] $arguments, [string] $label, [int] $seconds) {
            $parameters = @{
              FilePath = (Resolve-Path "app/$name").Path
              PassThru = $true
              NoNewWindow = $true
              RedirectStandardOutput = "app/windows-$label.log"
              RedirectStandardError = "app/windows-$label-errors.log"
            }
            if ($arguments) { $parameters.ArgumentList = $arguments }
            $process = Start-Process @parameters
            if (-not $process.WaitForExit($seconds * 1000)) {
              $process.Kill()
              throw "$label exceeded $seconds seconds."
            }
            Get-Content "app/windows-$label.log"
            Get-Content "app/windows-$label-errors.log"
            if ($process.ExitCode -ne 0) { throw "$label failed: $($process.ExitCode)" }
          }
          # Independent checks all produce evidence; any failure still fails
          # this gate, after source/hash validation above has succeeded.
          $failures = [System.Collections.Generic.List[string]]::new()
          try {
            Invoke-CrossBuilt 'SpeakAppPackageTests.exe' '' 'tests' 180
            if (-not (Select-String -Path app/windows-tests.log -Pattern 'Executed [1-9][0-9]* tests' -Quiet)) {
              throw 'No XCTest execution evidence found.'
            }
          } catch { $failures.Add($_.Exception.Message) }
          try {
            Invoke-CrossBuilt 'SpeakWindows.exe' '--self-test' 'native' 90
            if (-not (Select-String -Path app/windows-native.log -Pattern 'self-test passed' -Quiet)) {
              throw 'Native self-test success marker missing.'
            }
          } catch { $failures.Add($_.Exception.Message) }
          try {
            $env:JSTI_UI_SNAPSHOT_PATH = Join-Path (Resolve-Path app).Path 'windows-ui-smoke.bmp'
            Invoke-CrossBuilt 'SpeakWindows.exe' '--ui-smoke-test' 'ui' 30
            if (-not (Select-String -Path app/windows-ui.log -Pattern 'Native window creation and shutdown passed' -Quiet)) {
              throw 'Native UI success marker missing.'
            }
            if (-not (Test-Path $env:JSTI_UI_SNAPSHOT_PATH)) { throw 'Native client snapshot missing.' }
          } catch { $failures.Add($_.Exception.Message) }
          if ($failures.Count) { throw ($failures -join '; ') }
      - name: Upload Mac-built app execution evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-built-windows-runtime-evidence
          path: |
            app/windows-*.log
            app/windows-ui-smoke.bmp
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows execution evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: foundation-windows-runtime-evidence
          path: proof/windows-*.log
          if-no-files-found: warn
          retention-days: 14

  bundle-execute:
    name: Run the self-contained bundle on Windows without Swift
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: windows-runtime-bundle
          path: bundle
      # No Swift setup action runs in this job. The script additionally isolates
      # PATH to the Windows system directories, proves the executable cannot
      # start without the bundled DLLs, and records sampled loaded modules's path.
      - name: Verify hashes, isolate PATH and run the bundled production app
        shell: pwsh
        run: |
          ./scripts/windows-bundle/test-bundle-environment.ps1
          ./scripts/windows-bundle/verify-windows-bundle.ps1 -BundleDirectory bundle `
            -Workspace (Join-Path $env:RUNNER_TEMP 'bundle-run') -ExpectedCommit $env:GITHUB_SHA
      - name: Upload bundle execution evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-runtime-bundle-execution-evidence
          path: ${{ runner.temp }}/bundle-run/evidence/
          if-no-files-found: warn
          retention-days: 14
