name: Windows and Portable Swift

on:
  push:
    branches: [main]
    paths:
      - Package.swift
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakDesktopHost/**
      - Sources/SpeakDesktopSync/**
      - Sources/SpeakSync/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Sources/CWindowsSupport/**
      - Sources/CWindowsAutomation/**
      - Sources/SpeakAutomationKit/**
      - Sources/SpeakCLI/**
      - Tests/SpeakPortableTests/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakDesktopHostTests/**
      - Tests/SpeakDesktopSyncTests/**
      - Tests/SpeakSyncTests/**
      - Tests/SpeakWindowsPlatformTests/**
      - Tests/SpeakAutomationKitTests/**
      - Tests/SpeakTestSupport/**
      - scripts/verify-portable-core-boundary.py
      - scripts/windows-cloudkit/**
      - scripts/websocket-loopback-probe.py
      - scripts/windows-local-runtime/**
      - scripts/windows-bundle/runtime-policy.json
      - Docs/windows-development.md
      - .github/workflows/windows.yml
      - .github/workflows/windows-local-runtime.yml
  pull_request:
    branches: [main]
    paths:
      - Package.swift
      - Sources/SpeakCore/**
      - Sources/SpeakDesktop/**
      - Sources/SpeakDesktopHost/**
      - Sources/SpeakDesktopSync/**
      - Sources/SpeakSync/**
      - Sources/SpeakWindows/**
      - Sources/SpeakWindowsPlatform/**
      - Sources/CWindowsSupport/**
      - Sources/CWindowsAutomation/**
      - Sources/SpeakAutomationKit/**
      - Sources/SpeakCLI/**
      - Tests/SpeakPortableTests/**
      - Tests/SpeakDesktopTests/**
      - Tests/SpeakDesktopHostTests/**
      - Tests/SpeakDesktopSyncTests/**
      - Tests/SpeakSyncTests/**
      - Tests/SpeakWindowsPlatformTests/**
      - Tests/SpeakAutomationKitTests/**
      - Tests/SpeakTestSupport/**
      - scripts/verify-portable-core-boundary.py
      - scripts/windows-cloudkit/**
      - scripts/websocket-loopback-probe.py
      - scripts/windows-local-runtime/**
      - scripts/windows-bundle/runtime-policy.json
      - Docs/windows-development.md
      - .github/workflows/windows.yml
      - .github/workflows/windows-local-runtime.yml
  workflow_dispatch:
    inputs:
      registry_diagnostics:
        description: Observe Linux anonymous-file capability without repairing or skipping tests
        type: boolean
        default: false
      registry_supported_filesystem:
        description: Qualify a fresh managed filesystem on an exclusive disposable hosted Ubuntu VM
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  local-runtime:
    uses: ./.github/workflows/windows-local-runtime.yml

  windows:
    name: Native Windows x64 (Swift 6.2.3)
    needs: local-runtime
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # The pinned whisper.cpp runtime, its JFK sample and a cached model
      # folder, so the on-device tests run the real runtime instead of skipping.
      JSTI_WHISPER_RUNTIME_DIRECTORY: ${{ github.workspace }}\local-runtime\runtime
      JSTI_WHISPER_TEST_AUDIO: ${{ github.workspace }}\local-runtime\fixtures\jfk.wav
      JSTI_LOCAL_MODEL_DIRECTORY: ${{ github.workspace }}\local-models
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Swift toolchain
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          source: swift.org
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
          build_arch: amd64
          update-sdk-modules: false

      - name: Verify portable source boundary
        run: python scripts/verify-portable-core-boundary.py

      - uses: actions/download-artifact@v8
        with:
          name: windows-local-runtime
          path: local-runtime

      # The pinned tiny model is downloaded by the app's own installer on a
      # miss and verified against its SHA-256 on every run.
      - name: Restore pinned local models
        uses: actions/cache@v6
        with:
          path: local-models
          key: local-models-${{ hashFiles('Sources/SpeakCore/WhisperCppModels.swift') }}

      - name: Build native Windows executable
        id: native-build
        run: |
          swift --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build --configuration release --product SpeakWindows --jobs 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Observe synthetic held-root registry boundaries
        id: registry-diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = New-Item -ItemType Directory -Path registry-diagnostic
          $compiler = (Get-Command clang-cl -ErrorAction Stop).Source
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'Existing VC toolchain not found.' }
          $vcvars = Join-Path $visualStudio 'VC\Auxiliary\Build\vcvarsall.bat'
          $source = Join-Path $env:GITHUB_WORKSPACE 'scripts\registry-native-boundary-diagnostic.cpp'
          $exe = Join-Path $folder.FullName 'registry-native-boundary-diagnostic.exe'
          $object = Join-Path $folder.FullName 'registry-native-boundary-diagnostic.obj'
          $setup = Join-Path $folder.FullName 'vcvars-setup.log'
          $environment = Join-Path $folder.FullName 'sdk-environment.log'
          $command = 'call "{0}" amd64 10.0.26100.0 > "{1}" 2>&1 && (set INCLUDE & set LIB & set WindowsSdkVersion & set VCToolsVersion) > "{2}" && "{3}" /nologo /std:c++17 /EHsc /MD /W4 /WX /I"{4}" "{5}" /Fe:"{6}" /Fo:"{7}" /link ntdll.lib advapi32.lib ole32.lib' -f `
            $vcvars, $setup, $environment, $compiler, (Join-Path $env:GITHUB_WORKSPACE 'Sources\CWindowsSupport\include'), $source, $exe, $object
          $records = [Collections.Generic.List[object]]::new()
          $inputs = @(
            $source, 'Sources\CWindowsSupport\WindowsFileSecurity.cpp',
            'Sources\CWindowsSupport\WindowsSupportInternal.hpp', 'Sources\CWindowsSupport\include\CWindowsSupport.h',
            $compiler, $vcvars
          ) | ForEach-Object { [ordered]@{ path = $_; sha256 = (Get-FileHash -LiteralPath $_).Hash } }
          function Invoke-DiagnosticProcess($name, $file, $arguments, $seconds) {
            $info = [Diagnostics.ProcessStartInfo]::new($file)
            $info.Arguments = $arguments
            $info.UseShellExecute = $false
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $begin = [DateTimeOffset]::UtcNow.ToString('o')
            $process = [Diagnostics.Process]::Start($info)
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            $finished = $process.WaitForExit($seconds * 1000)
            if (-not $finished) { $process.Kill($true); $process.WaitForExit() }
            $output = $stdout.GetAwaiter().GetResult()
            $errors = $stderr.GetAwaiter().GetResult()
            [IO.File]::WriteAllText((Join-Path $folder.FullName "$name.stdout.log"), $output)
            [IO.File]::WriteAllText((Join-Path $folder.FullName "$name.stderr.log"), $errors)
            $records.Add([ordered]@{
              name = $name; executable = $file; arguments = $arguments; pid = $process.Id
              startedUTC = $begin; endedUTC = [DateTimeOffset]::UtcNow.ToString('o')
              exit = $process.ExitCode; timedOut = -not $finished; budgetSeconds = $seconds
            })
            $output
            $errors
            if (-not $finished -or $process.ExitCode -ne 0) { throw "$name failed; no retry." }
          }
          try {
            & $compiler --version
            if ($LASTEXITCODE -ne 0) { throw 'Compiler version read failed.' }
            Invoke-DiagnosticProcess 'compile-link' $env:ComSpec ('/d /s /c "' + $command + '"') 120
            Get-FileHash -LiteralPath $exe, $object | Format-List
            Invoke-DiagnosticProcess 'native-once' $exe '' 15
          } finally {
            [ordered]@{
              diagnosticOnly = $true; checkoutHEAD = (git rev-parse HEAD); checkoutTree = (git rev-parse 'HEAD^{tree}')
              inputs = $inputs; commands = $records
              outputs = @(Get-ChildItem $folder -File | ForEach-Object {
                [ordered]@{path = $_.FullName; sha256 = (Get-FileHash $_.FullName).Hash}
              })
            } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $folder.FullName 'process-binding.json') -Encoding utf8
          }

      - name: Test shared core, desktop workflow and native adapters
        id: native-tests
        env:
          JSTI_REGISTRY_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          swift test --configuration release --jobs 4 --xunit-output windows-tests.xml 2>&1 |
            Tee-Object -FilePath windows-native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve failed diagnostic status without suppressing Swift assertions
        if: ${{ always() && steps.registry-diagnostics.outcome == 'failure' }}
        run: throw 'Synthetic registry diagnostics failed; inspect retained evidence. No retry or qualification.'

      - name: Verify native WinHTTP WebSocket transport against loopback peer
        id: websocket-probe
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $readyPath = Join-Path $env:RUNNER_TEMP 'jsti-websocket-ready.json'
          Remove-Item $readyPath -ErrorAction SilentlyContinue
          $server = $null
          $probe = $null
          try {
            $server = Start-Process -FilePath (Get-Command python).Source -PassThru -NoNewWindow `
              -ArgumentList @('-u', 'scripts/websocket-loopback-probe.py', '--ready-file', $readyPath, '--max-seconds', '120') `
              -RedirectStandardOutput windows-websocket-server.log -RedirectStandardError windows-websocket-server-errors.log
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            while (-not (Test-Path $readyPath)) {
              if ($server.HasExited) { throw 'Loopback WebSocket server exited before readiness.' }
              if ([DateTime]::UtcNow -gt $deadline) { throw 'Loopback WebSocket server readiness timed out.' }
              Start-Sleep -Milliseconds 100
            }
            $ready = Get-Content $readyPath -Raw | ConvertFrom-Json
            if ($ready.host -ne '127.0.0.1' -or $ready.port -lt 1 -or $ready.port -gt 65535) {
              throw 'Unexpected loopback peer address.'
            }
            $env:JSTI_WEBSOCKET_PROBE_PORT = [string]$ready.port
            $probe = Start-Process -FilePath (Get-Command swift).Source -PassThru -NoNewWindow `
              -ArgumentList @('test', '--configuration', 'release', '--skip-build', '--filter', 'WinHTTPRuntimeProbeTests', `
                '--filter', 'GladiaWinHTTPRuntimeTests', '--filter', 'CartesiaWinHTTPRuntimeTests', `
                '--filter', 'RevAIWinHTTPRuntimeTests', '--filter', 'AzureWinHTTPRuntimeTests', `
                '--xunit-output', 'windows-websocket-tests.xml') `
              -RedirectStandardOutput windows-websocket-probe.log -RedirectStandardError windows-websocket-probe-errors.log
            if (-not $probe.WaitForExit(90000)) {
              $probe.Kill($true)
              throw 'WebSocket runtime probe exceeded its 90-second process deadline.'
            }
            if ($probe.ExitCode -ne 0) { throw "WebSocket runtime probe failed: $($probe.ExitCode)" }
          } finally {
            Remove-Item Env:JSTI_WEBSOCKET_PROBE_PORT -ErrorAction SilentlyContinue
            if ($probe -and -not $probe.HasExited) { $probe.Kill($true) }
            if ($server -and -not $server.HasExited) { $server.Kill($true) }
            Get-ChildItem windows-websocket-*.log | ForEach-Object { Get-Content $_.FullName }
          }

      - name: Run executable self-test and native window smoke test
        id: native-smoke
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $bin.Trim() 'SpeakWindows.exe'
          $native = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -NoNewWindow `
            -RedirectStandardOutput windows-self-test.log -RedirectStandardError windows-self-test-errors.log
          $nativeFailure = $null
          if (-not $native.WaitForExit(90000)) {
            $native.Kill()
            $nativeFailure = 'Native adapter self-test exceeded 90 seconds.'
          } elseif ($native.ExitCode -ne 0) {
            $nativeFailure = "Native adapter self-test failed: $($native.ExitCode)"
          }
          Get-Content windows-self-test.log
          Get-Content windows-self-test-errors.log
          # Window checks are independent of adapter assertions. Run both while
          # retaining a failing job if either result fails.
          $env:JSTI_UI_SNAPSHOT_PATH = Join-Path $env:GITHUB_WORKSPACE 'windows-ui-smoke.bmp'
          $process = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -PassThru -NoNewWindow `
            -RedirectStandardOutput windows-ui-smoke.log -RedirectStandardError windows-ui-smoke-errors.log
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Native window did not create and shut down within 30 seconds.'
          }
          Get-Content windows-ui-smoke.log
          Get-Content windows-ui-smoke-errors.log
          if ($process.ExitCode -ne 0) { throw "Native window smoke test failed: $($process.ExitCode); $nativeFailure" }
          if ($nativeFailure) { throw $nativeFailure }

      - name: Save every window page with sample History
        id: page-screenshots
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = Join-Path $env:GITHUB_WORKSPACE 'windows-ui-screenshots'
          $process = Start-Process -FilePath (Join-Path $bin.Trim() 'SpeakWindows.exe') `
            -ArgumentList '--ui-screenshots', $folder -PassThru -NoNewWindow `
            -RedirectStandardOutput windows-ui-screenshots.log -RedirectStandardError windows-ui-screenshots-errors.log
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw 'The screenshot tour did not finish within 90 seconds.'
          }
          Get-Content windows-ui-screenshots.log
          Get-Content windows-ui-screenshots-errors.log
          if ($process.ExitCode -ne 0) { throw "The screenshot tour failed: $($process.ExitCode)" }
          $expected = 'dashboard', 'history', 'voice-output', 'general', 'transcription', 'post-processing',
            'profiles', 'keyboard', 'icloud-sync', 'about', 'dashboard-dark', 'history-dark', 'dashboard-recording',
            'hud-recording', 'hud-completed', 'history-filters', 'history-filters-dark'
          for ($index = 0; $index -lt $expected.Count; $index++) {
            $file = Join-Path $folder ('{0:D2}-{1}.bmp' -f ($index + 1), $expected[$index])
            if (-not (Test-Path $file)) { throw "Missing screenshot $file" }
          }

      - name: Upload page screenshots
        if: ${{ !cancelled() && steps.page-screenshots.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-ui-screenshots-${{ github.sha }}
          path: windows-ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Transcribe the JFK sample on-device with the pinned tiny model
        id: local-transcription
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bin.Trim() 'SpeakWindows.exe') --local-transcription-self-test $env:JSTI_WHISPER_TEST_AUDIO `
            --expect 'ask not what your country can do for you' 2>&1 | Tee-Object -FilePath windows-local-transcription.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage developer executable with provenance
        id: developer-stage
        if: ${{ !cancelled() && steps.native-tests.outcome == 'success' && steps.websocket-probe.outcome == 'success' && steps.native-smoke.outcome == 'success' }}
        run: |
          $bin = swift build --configuration release --show-bin-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $destination = New-Item -ItemType Directory -Path windows-developer-build
          Copy-Item (Join-Path $bin.Trim() 'SpeakWindows.exe') $destination
          Get-ChildItem -Path $bin.Trim() -Directory -Filter '*.resources' |
            Copy-Item -Destination $destination -Recurse
          [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            architecture = 'x86_64'
            compiler = (swift --version) -join "`n"
            distribution = 'developer executable; not an installer'
            runtime = 'Requires the Swift 6.2.3 Windows runtime and Visual C++ runtime'
            webSocketRuntimeProbe = '${{ steps.websocket-probe.outcome }}'
          } | ConvertTo-Json | Set-Content (Join-Path $destination 'build-metadata.json') -Encoding utf8
          @"
          Just Speak to It — Windows developer build

          This is an unsigned developer executable, not an installer or a feature-complete release.
          Install the Swift 6.2.3 Windows toolchain/runtime and its Windows prerequisites:
          https://www.swift.org/install/windows/

          Development instructions and current parity limitations:
          https://github.com/crmitchelmore/justspeaktoit/blob/${env:GITHUB_SHA}/Docs/windows-development.md

          Run SpeakWindows.exe normally, or pass --self-test / --ui-smoke-test.
          The smoke tests do not use a microphone or a real provider API key.
          See build-metadata.json for the exact source revision and compiler.
          "@ | Set-Content (Join-Path $destination 'README.txt') -Encoding utf8
          Get-FileHash (Join-Path $destination 'SpeakWindows.exe') -Algorithm SHA256 |
            Format-List | Out-String | Set-Content (Join-Path $destination 'SHA256.txt') -Encoding utf8

      - name: Upload developer executable
        if: ${{ !cancelled() && steps.developer-stage.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: justspeaktoit-windows-x64-developer-${{ github.sha }}
          path: windows-developer-build/
          if-no-files-found: error
          retention-days: 14

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-test-evidence-${{ github.sha }}
          path: |
            windows-tests.xml
            windows-native-tests.log
            windows-self-test*.log
            windows-ui-smoke*.log
            windows-ui-smoke.bmp
            windows-websocket-tests.xml
            windows-websocket-*.log
            windows-local-transcription.log
            registry-diagnostic/
          if-no-files-found: ignore
          retention-days: 14

  portable-macos:
    name: Portable Swift on macOS
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SPEAK_PORTABLE_CORE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify portable source boundary
        run: python3 scripts/verify-portable-core-boundary.py
      - name: Test portable graph with Xcode Apple Swift
        run: |
          xcrun swift --version
          xcrun swift test --configuration release --jobs 4
      - name: Preserve Apple dependency lockfile
        if: always()
        # The dependency-free graph removes pins it does not need. It must not
        # change the Apple graph's checked-in dependencies.
        run: git restore --source=HEAD -- Package.resolved

  portable-linux:
    name: Portable Swift on Linux (Swift 6.2.3)
    runs-on: ubuntu-22.04
    container:
      image: swift:6.2.3-jammy@sha256:33c73fc133767cdaafde26f0f9967c96ab25ff77618b7df1eabf46140bf2b6e6
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify portable source boundary
        run: python3 scripts/verify-portable-core-boundary.py
      - name: Observe old-Git trust on isolated foreign-owned fixture
        id: registry-git-diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/registry-git-trust-diagnostic.py --output "$RUNNER_TEMP/registry-git-diagnostic.json"
          cat "$RUNNER_TEMP/registry-git-diagnostic.json"
      - name: Test portable graph with native Linux Swift
        shell: bash
        env:
          JSTI_REGISTRY_CAPABILITY_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.registry_diagnostics && '1' || '0' }}
        run: |
          set -euo pipefail
          # The host-mounted checkout can have foreign/writable ancestry.
          # Keep ownership guards intact and test an identical private copy.
          test_user=nobody
          test "$(id -u "$test_user")" -ne 0
          command -v runuser
          umask 077
          work="$(mktemp -d /jsti-portable.XXXXXX)"
          paths="$(mktemp /jsti-portable-paths.XXXXXX)"
          git --git-dir="$PWD/.git" --work-tree="$PWD" ls-files -z | tee "$paths" | tar --null -T - -cf - | tar --no-same-owner --no-same-permissions -xf - -C "$work"
          verified=0
          while IFS= read -r -d '' path; do
            for file in "$PWD/$path" "$work/$path"; do
              if [ -L "$file" ] || [ ! -f "$file" ]; then
                printf 'Tracked source is not a regular non-link file: %s\n' "$file" >&2
                exit 1
              fi
            done
            cmp -- "$PWD/$path" "$work/$path"
            verified=$((verified + 1))
          done < "$paths"
          if [ "$verified" -eq 0 ]; then
            echo "No tracked source bytes were verified." >&2
            exit 1
          fi
          printf 'Tracked source-byte equivalence: %s regular files; NUL-list SHA256: ' "$verified"
          sha256sum < "$paths"
          git --git-dir="$PWD/.git" --work-tree="$PWD" rev-parse HEAD 'HEAD^{tree}'
          chown -R "$test_user:$(id -gn "$test_user")" "$work"
          checkout_head="$(git --git-dir="$PWD/.git" --work-tree="$PWD" rev-parse HEAD)"
          checkout_tree="$(git --git-dir="$PWD/.git" --work-tree="$PWD" rev-parse 'HEAD^{tree}')"
          test_status=0
          runuser -u "$test_user" -- env HOME="$work/.home" TMPDIR="$work/.runtime" \
            bash -s -- "$work" "$JSTI_REGISTRY_CAPABILITY_DIAGNOSTICS" "$checkout_head" "$checkout_tree" <<'TEST_SCRIPT' || test_status=$?
            set -euo pipefail
            cd "$1"
            mkdir -m 700 "$HOME" "$TMPDIR"
            test "$(id -u)" -ne 0
            grep -qx "CapEff:[[:space:]]*0000000000000000" "/proc/$$/status"
            id
            grep "^CapEff:" "/proc/$$/status"
            stat -c "%n owner=%u mode=%a" / "$1" "$HOME" "$TMPDIR"
            swift --version
            if [ "$2" != 1 ]; then
              swift test --configuration release --jobs 4
              exit 0
            fi
            export evidence="$TMPDIR/registry-capability-evidence"
            mkdir -m 700 "$evidence"
            printf 'checkoutHEAD=%s\ncheckoutTree=%s\n' "$3" "$4" > "$evidence/source-binding.log"
            build_diagnostic() {
              set -euo pipefail
              compiler_command() {
                printf 'commandStartedUTC=%s argv:' "$(date -u +%FT%T.%NZ)"
                printf ' %q' "$@"
                printf '\n'
                "$@" &
                command_pid=$!
                command_status=0
                wait "$command_pid" || command_status=$?
                printf 'commandPID=%s commandEndedUTC=%s commandExit=%s\n' \
                  "$command_pid" "$(date -u +%FT%T.%NZ)" "$command_status"
                return "$command_status"
              }
              compiler="$(command -v clang)"
              printf 'compiler=%s\nresolvedCompiler=%s\n' "$compiler" "$(readlink -f "$compiler")"
              "$compiler" --version
              sha256sum "$(readlink -f "$compiler")" \
                scripts/registry-linux-capability-diagnostic.c \
                Sources/CRecordingFileSupport/RecordingFileSupport.c \
                Sources/CRecordingFileSupport/include/CRecordingFileSupport.h
              set -x
              compiler_command "$compiler" -std=c11 -Wall -Wextra -Werror -pedantic -MD -MF "$evidence/cli.d" \
                -c scripts/registry-linux-capability-diagnostic.c -o "$evidence/cli.o"
              compiler_command "$compiler" -std=c11 -Wall -Wextra -Werror -pedantic -MD -MF "$evidence/production.d" \
                -I Sources/CRecordingFileSupport/include \
                -c Sources/CRecordingFileSupport/RecordingFileSupport.c -o "$evidence/production.o"
              compiler_command "$compiler" "$evidence/cli.o" "$evidence/production.o" \
                -Wl,-Map,"$evidence/link.map" -o "$evidence/registry-linux-capability-diagnostic"
              set +x
              sha256sum "$evidence/cli.o" "$evidence/production.o" "$evidence/registry-linux-capability-diagnostic"
            }
            export -f build_diagnostic
            diagnostic_status=0
            if timeout --kill-after=2s 120s bash -c build_diagnostic \
                > "$evidence/compile.stdout.log" 2> "$evidence/compile.stderr.log"; then
              printf 'argv: timeout --kill-after=2s 15s %q %q %q 65534\n' \
                "$evidence/registry-linux-capability-diagnostic" "$PWD" "$TMPDIR" > "$evidence/native-command.log"
              printf 'nativeStartedUTC=%s\n' "$(date -u +%FT%T.%NZ)" >> "$evidence/native-command.log"
              timeout --kill-after=2s 15s "$evidence/registry-linux-capability-diagnostic" \
                "$PWD" "$TMPDIR" 65534 > "$evidence/native.stdout.log" 2> "$evidence/native.stderr.log" \
                || diagnostic_status=$?
              printf 'nativeEndedUTC=%s nativeExit=%s\n' "$(date -u +%FT%T.%NZ)" \
                "$diagnostic_status" >> "$evidence/native-command.log"
            else
              diagnostic_status=$?
            fi
            printf 'diagnosticExit=%s\n' "$diagnostic_status" > "$evidence/status.log"
            for log in "$evidence"/*.log; do
              printf '\nEvidence: %s\n' "$log"
              cat "$log"
            done
            set +e
            swift test --configuration release --jobs 4 2>&1 | tee "$evidence/swift-test.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            printf 'swiftTestExit=%s\nteeExit=%s\n' "${statuses[0]}" "${statuses[1]}" >> "$evidence/status.log"
            if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
            if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
            exit "$diagnostic_status"
          TEST_SCRIPT
          if [ "$JSTI_REGISTRY_CAPABILITY_DIAGNOSTICS" = 1 ]; then
            cp -R -- "$work/.runtime/registry-capability-evidence" "$RUNNER_TEMP/registry-capability-evidence"
          fi
          exit "$test_status"
      - name: Upload manual Linux capability evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.registry_diagnostics }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: registry-linux-capability-${{ github.sha }}
          path: ${{ runner.temp }}/registry-capability-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Upload isolated Git diagnostic evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: registry-git-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/registry-git-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed isolated diagnostic status
        if: ${{ always() && steps.registry-git-diagnostics.outcome == 'failure' }}
        shell: bash
        run: |
          echo "Isolated Git diagnostic failed; no retry or checkout trust repair." >&2
          exit 1

  registry-supported-filesystem:
    name: Opt-in Linux managed-filesystem qualification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.registry_supported_filesystem }}
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Observe supported-filesystem prerequisites and run unchanged tests
        timeout-minutes: 45
        shell: bash
        env:
          JSTI_SUPPORTED_FS_EVIDENCE: ${{ runner.temp }}/jsti-registry-supported-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/registry-linux-supported-fs-host.sh
      - name: Upload early failures and qualification evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7.0.1
        with:
          name: registry-linux-supported-filesystem-${{ github.sha }}
          path: ${{ runner.temp }}/jsti-registry-supported-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
