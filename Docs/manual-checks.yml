# Owner manual QA catalogue: the single source for https://justspeaktoit.com/qa
# and the Manual QA results workflow. See Docs/manual-qa.md for the format.
# Strict YAML subset: 2-space indents, double-quoted strings, integers, booleans.
version: 1
updated: "2026-11-04"
sessions:
  - id: "decisions"
    device: "Decision"
    title: "Decisions (do these first; two unblock checks below)"
    items:
      - id: "decision-watch-provisioning"
        issue: 657
        title: "Apple Watch app: provision a dev build now or defer"
        minutes: 2
        question: "Do you want to do the watch provisioning needed to test the watch app (#657, #659) now?"
        context: "The watch app and complication are built and tested in CI but feature-flagged out of TestFlight until the watch bundle ids and App Group exist in the Apple Developer portal. #963 (Stop from the iPhone Live Activity in the Smart Stack) works without the watch app and is not affected by this choice."
        options:
          - id: "dev-build-now"
            label: "Dev build now: portal steps 1 to 3, then an Xcode build"
            consequence: "About 10 minutes in the portal plus a 10-minute Xcode build; then run the 6 watch-app checks in the same session. TestFlight stays watch-free."
            recommended: true
          - id: "full-provisioning"
            label: "Full provisioning: also App Store profiles and release workflow"
            consequence: "You create two App Store profiles and secrets; an agent wires TUIST_WATCH_APP=1 into release-ios.yml, so the watch app ships in the next TestFlight build and checks run from TestFlight."
          - id: "defer-watch"
            label: "Defer the watch app"
            consequence: "Run only the 3 #963 checks; #657 and #659 stay open with no further work."
      - id: "decision-billing-rail"
        issue: 648
        title: "Paid Access billing rail"
        minutes: 3
        question: "Which billing rail should Paid Access launch with?"
        context: "Paid Access (a monthly fee instead of your own API keys) is merged but switched off. The Mac App Store is retired, so Mac can only sell through Stripe; iOS would need StoreKit, and iOS does not yet route work through the paid proxy. Whichever rail you pick, you still need to choose a Mac sign-in method (native Sign in with Apple does not work in Developer ID builds) and sign off privacy and retention."
        options:
          - id: "stripe-mac-first"
            label: "Stripe on direct-download Mac only, iOS later"
            consequence: "Smallest launch: one rail and a simple entitlement model. Next: Mac sign-in choice, Stripe prices, D1 database and staging purchase/refund drills."
            recommended: true
          - id: "stripe-and-storekit"
            label: "Stripe on Mac and StoreKit on iOS together"
            consequence: "One subscription on both platforms, but needs iOS paid routing, App Store Connect products and the two-rail entitlement model before launch."
          - id: "storekit-ios-only"
            label: "StoreKit on iOS only"
            consequence: "No Mac purchases. iOS paid routing must be built first and Stripe code stays unused."
          - id: "defer"
            label: "Defer Paid Access"
            consequence: "Stays off; #648 is parked and no external setup is needed."
      - id: "decision-analytics-go"
        issue: 776
        title: "Opt-in analytics: continue the go/no-go or pause"
        minutes: 3
        question: "Should the opt-in PostHog analytics rollout (direct-download Mac only) continue through its remaining gates?"
        context: "All client engineering is merged; nothing is sent unless a user opts in. Remaining gates need you: authorise a Release network capture and an ingestion-key rotation drill, confirm PostHog Production settings and EU residency, and decide what to do with 7 earlier test events that carry city/postcode GeoIP data (IP is discarded; new events disable GeoIP). #814 (detailed telemetry) stays blocked until this passes plus one clean inspection week."
        options:
          - id: "continue-delete-history"
            label: "Continue, and delete the 7 GeoIP-tagged test events"
            consequence: "An agent prepares the network capture and rotation drill for you to run; the historical location data is removed before the inspection week starts."
            recommended: true
          - id: "continue-keep-history"
            label: "Continue, keep the old test events"
            consequence: "Same gates, but the existing city/postcode data stays in PostHog and must be disclosed or aged out under retention."
          - id: "pause"
            label: "Pause analytics"
            consequence: "Stays off for all users; #776 and #814 are parked."
      - id: "decision-analytics-retention"
        issue: 776
        title: "How to enforce the 12-month analytics retention promise"
        minutes: 2
        question: "How should the published \"raw events kept no more than 12 months\" promise be enforced?"
        context: "The privacy page promises raw events are kept no more than 12 months. PostHog's plan retention is a query window, not proven deletion, and the read-only project settings show no retention control, so the go/no-go needs a deletion mechanism or a changed promise. No events are near 12 months old yet."
        options:
          - id: "scheduled-purge"
            label: "Scheduled purge job before rollout"
            consequence: "An agent builds a monthly job that deletes or aggregates events over 12 months, using a write-scoped PostHog key you add as an environment secret."
            recommended: true
          - id: "manual-purge"
            label: "Manual purge with a yearly reminder"
            consequence: "No new secret or code; you run a documented deletion each year, and the gate relies on that runbook."
          - id: "change-promise"
            label: "Change the promise to PostHog's plan retention"
            consequence: "An agent updates the privacy page and docs; weaker promise, no deletion work."
      - id: "decision-cloudkit-container"
        issue: 1119
        title: "Shared CloudKit container for Mac and iPhone sync"
        minutes: 2
        question: "Which iCloud container should both macOS and iOS use for history and key sync?"
        context: "Mac and iPhone currently write to different iCloud containers, so history and key sync between them cannot work. After the choice, an agent writes a one-time migration for the moving platform; you then update entitlements/profiles in the Apple Developer portal and run a two-device test. Alpha uses the matching .alpha container."
        options:
          - id: "mac-container"
            label: "iCloud.com.justspeaktoit (current Mac container)"
            consequence: "Mac data stays put; iPhone history and keys migrate once. You add this container to the iOS app id and profile."
            recommended: true
          - id: "ios-container"
            label: "iCloud.com.justspeaktoit.ios (current iPhone container)"
            consequence: "iPhone data stays put; Mac history and keys migrate once. You add the container to the Developer ID Mac profile."
          - id: "new-container"
            label: "A new shared container"
            consequence: "Both platforms migrate and both profiles change; most work and most risk."
          - id: "defer"
            label: "Defer"
            consequence: "Mac and iPhone keep syncing only within their own platform."
      - id: "decision-provider-spend-cap"
        issue: 1210
        title: "Spend cap for paid-provider live acceptance runs"
        minutes: 3
        question: "How much may be spent on short synthetic-speech runs against paid speech providers?"
        context: "Seven issues are code-complete and only need real calls with a few seconds of synthetic speech per route: #1210 (Pulse Pro, Reson8, StepAudio, Alibaba, OpenRouter audio routes, AssemblyAI Universal-3.6 Pro live), #1104 (8 live providers), #1113 and #1114 (one OpenAI or Groq Mac batch run), #821 (OpenRouter playback), #1051 and #1052 (Azure Speech/MAI). Usage is likely under $10; minimum top-ups for new accounts are most of the cost. Runs need a person at a Mac with a microphone; receipts are posted to each issue without keys or billing details. Azure also needs you to create or name a Speech resource in a region that serves MAI models."
        options:
          - id: "cap-40"
            label: "Up to $40 total, at most $10 per provider, no auto top-ups"
            consequence: "Covers all seven issues; any provider needing a larger minimum top-up or a paid plan is skipped and noted. Alibaba uses the international (Singapore) workspace only."
            recommended: true
          - id: "cap-15-existing"
            label: "Up to $15, existing accounts only"
            consequence: "#1104, #1113, #1114 and #821 can close; #1210's new providers and Azure (#1051, #1052) stay open."
          - id: "defer"
            label: "Defer all paid runs"
            consequence: "No spend; all seven issues stay open."
      - id: "decision-azure-voice-ios"
        issue: 1052
        title: "Azure voice output on iOS or macOS only"
        minutes: 1
        question: "Should Azure neural and MAI-Voice speech output also be added to iOS?"
        context: "Azure voice output, including MAI-Voice-2.1 and Flash, exists on macOS only. iOS voice output supports Deepgram, Soniox and OpenRouter, and the docs say macOS-only without a test enforcing it."
        options:
          - id: "macos-only"
            label: "macOS only for now"
            consequence: "An agent adds a test and doc note pinning the restriction; #1052 can close after the Azure live check."
            recommended: true
          - id: "add-ios"
            label: "Add Azure voice output to iOS"
            consequence: "New iOS provider case, router path and settings; adds an iPhone playback check before #1052 can close."
  - id: "mac"
    device: "Mac"
    title: "Mac session: streaming insertion (#664)"
    setup:
      - "Unlocked Mac, current Just Speak to It (mac-v3.2.0 or Alpha build 45 or later) with Accessibility granted."
      - "Settings › General: Accessibility Insertion = Insert at Cursor; Stream text while dictating (experimental) = on; post-processing off."
      - "Pick a Streaming model with a working key (Remote or Local Streaming). Use only made-up, non-sensitive sentences."
      - "Note the app version, build and macOS version for the results."
    items:
      - id: "mac-notes-stream-append"
        issue: 664
        title: "Notes: words stream in and corrections replace, not append"
        minutes: 4
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        prerequisites:
          - "A new Notes note containing the line: café ☕ the quick fox, the quick fox"
        steps:
          - "Put the cursor on a new line under that text."
          - "Start dictation and say slowly: \"Testing streaming in Notes, one two three, actually make that four.\""
          - "Watch the note while you speak, then stop."
          - "Open History in Just Speak to It and compare the latest entry with the new line in Notes."
        expected: "Words appear in Notes while you speak; any word the model revises is replaced in place, not duplicated. The final new line matches the History text exactly, and the first line (café ☕ and both \"the quick fox\") is unchanged."
        final_gate: true
      - id: "mac-notes-selection-replace"
        issue: 664
        title: "Notes: dictating over a selection replaces only that selection"
        minutes: 3
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        steps:
          - "In the same note add a line: REPLACE_ME and REPLACE_ME again"
          - "Double-click the first REPLACE_ME to select it."
          - "Dictate: \"Selection replacement works.\" and stop."
        expected: "Only the first REPLACE_ME becomes \"Selection replacement works.\" (matching History); the second REPLACE_ME and every other line are unchanged."
        final_gate: true
      - id: "mac-notes-edit-and-focus"
        issue: 664
        title: "Notes: edits during dictation and a focus change stay safe"
        minutes: 5
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        steps:
          - "Put the cursor at the end of the note and start dictating a long sentence."
          - "After the first words appear, click on the first line and type XX there, then keep talking and stop."
          - "Start a second dictation at the end of the note; after the first words appear, click into a different, empty note."
          - "Keep talking for a few seconds, then stop."
          - "Check both notes and History."
        expected: "Your typed XX is kept and nothing outside the dictated text is changed or duplicated (streaming may pause instead of finishing). In the focus test, the second note stays empty and the original note holds the dictated text with no duplicate paste."
        final_gate: true
      - id: "mac-setting-off-baseline"
        issue: 664
        title: "Setting off: Notes gets one paste at the end, no live text"
        minutes: 3
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        steps:
          - "Settings › General: turn Stream text while dictating (experimental) off."
          - "In Notes, dictate: \"Baseline with streaming off.\" and stop."
          - "Check the note and History, then turn the setting back on."
        expected: "Nothing appears while you speak; the text arrives once after Stop, exactly once, matching History."
        final_gate: true
      - id: "mac-stickies-not-allowlisted"
        issue: 664
        title: "Stickies (not allowlisted): one paste at the end, no live text"
        minutes: 3
        build: "Just Speak to It for Mac, mac-v3.2.0 or Alpha build 45 or later"
        prerequisites:
          - "Stream text while dictating (experimental) back on"
        steps:
          - "Open Stickies and click into a new sticky note."
          - "Dictate: \"Stickies gets one final paste.\" and stop."
          - "Check the sticky and History."
        expected: "Nothing appears while you speak; the text arrives once after Stop, exactly once, matching History."
        final_gate: true
  - id: "iphone"
    device: "iPhone"
    title: "iPhone session"
    setup:
      - "Install TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later; if updating now, do the History upgrade check first."
      - "iPhone with an Action Button on iOS 26 or later (iOS 27 for the notification automation). Note model and iOS version with every result."
      - "Settings › API Keys › Manage Keys: OpenRouter (polish), OpenAI and Deepgram (streaming checks) saved."
      - "Settings › Action Button & Shortcuts: Destination = Copy & Polish; Finish after a pause = off."
      - "Settings › Transcription › Where transcription runs = Local (Apple SpeechTranscriber); Live Activities on."
      - "Notes open on a blank scratch note; WhatsApp installed."
      - "AirPods (or another Bluetooth headset) charged and in their case."
      - "For the last two checks: a Mac on the same Apple ID with Handoff on, unlocked and nearby."
      - "Afterwards: Live Activities on, Larger Text and VoiceOver restored, test Focus filter, shortcuts and automation deleted."
    items:
      - id: "iphone-history-upgrade-preserved"
        issue: 1118
        title: "Existing History survives the TestFlight update"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "Ideally run while updating from the previous TestFlight build"
        steps:
          - "Before updating (if not yet done), open History and note the Sessions count and the text of the newest two items."
          - "Update to the build under test in TestFlight and open the app."
          - "Open History and compare with your notes (if already updated: check items dated before 3 Nov 2026 are still listed)."
          - "Make a short recording in the app saying \"history upgrade check\"."
          - "Force-quit the app, reopen it and open History again."
        expected: "Every pre-update item is still listed with the same text and the Sessions count only grew by the new recording. \"history upgrade check\" is at the top and survives the relaunch. The iCloud icon in History looks the same as before the update."
        final_gate: false
      - id: "iphone-control-center-transcribe-voice"
        issue: 954
        title: "Control Center: setup copy matches and Transcribe Voice works"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "iOS 18 or later"
        steps:
          - "In the app open Settings › Action Button & Shortcuts and read the \"Set Up Transcribe Voice\" section."
          - "Follow its Control Center steps: open Control Center, tap + (top left), Add a Control, find Just Speak to It Alpha, choose Transcribe Voice."
          - "Tap the new control, say \"control centre test\", then tap it again to stop."
          - "Paste into Notes and open the app's History."
        expected: "The written steps match the real picker names and order. The control reads \"Recording...\" while recording and \"Transcribe\" when idle. Notes receives \"control centre test\" and History has exactly one new item."
        final_gate: false
      - id: "iphone-action-button-hints"
        issue: 954
        title: "Action Button: Start/Stop dictation hints and press-and-hold"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "iPhone with an Action Button"
        steps:
          - "Follow the app's Action Button steps: iOS Settings › Action Button › Controls, tap the control picker, choose Transcribe Voice."
          - "On the Home Screen, press the Action Button briefly (don't hold) and read the hint in the Dynamic Island."
          - "Press and hold the Action Button to start and say \"action button test\"."
          - "While recording, press the Action Button briefly and read the hint."
          - "Press and hold again to stop, then paste into Notes."
        expected: "Idle hint reads \"Start dictation\"; while recording it reads \"Stop dictation\". Press-and-hold starts and stops recording; Notes receives \"action button test\" and History has one new item. Note any unlock or open-app prompt."
        final_gate: false
      - id: "iphone-lock-screen-control"
        issue: 954
        title: "Lock Screen bottom control starts and stops dictation"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        steps:
          - "Follow the app's Lock Screen Control steps: touch and hold the Lock Screen, Customise › Lock Screen, remove a bottom control, tap + in that slot, choose Transcribe Voice, Done."
          - "Lock the iPhone, wake the screen without unlocking, tap Transcribe Voice and say \"lock screen test\"."
          - "Tap the control again (or the Live Activity Stop) to stop."
          - "Unlock, paste into Notes and open History."
        expected: "The written steps match the real Customise flow and the control sits in a bottom slot, not as a widget under the clock. Recording starts, or iOS asks you to unlock first (note which). After stop, Notes pastes \"lock screen test\", History has one item and nothing still shows as recording."
        final_gate: false
      - id: "iphone-trigger-settings-accessibility"
        issue: 954
        title: "Action Button & Shortcuts screen at max text size and VoiceOver"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        steps:
          - "Set iOS Settings › Accessibility › Display & Text Size › Larger Text to the largest size."
          - "Open the app's Settings › Action Button & Shortcuts and scroll the whole screen."
          - "Turn on VoiceOver and swipe through \"Set Up Transcribe Voice\" and \"Set Up a Shortcut\"."
          - "Turn VoiceOver off and restore the text size."
        expected: "No text is clipped or overlapping at the largest size. VoiceOver reads each step as one sensible element, in order. The copy does not promise clipboard-only results or recording without unlocking."
        final_gate: false
      - id: "iphone-shortcut-toggle-and-state"
        issue: 954
        title: "Toggle Recording shortcut still works; control state stays in sync"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        steps:
          - "In Shortcuts create a shortcut with only Just Speak to It Alpha › Toggle Recording; name it \"JS Toggle\"."
          - "Run it, say \"shortcut test\", run it again to stop, then paste into Notes."
          - "Press and hold the Action Button to start, open the app and tap its Stop button."
          - "Open Control Center and look at Transcribe Voice; then press the Action Button briefly to read its hint."
        expected: "The shortcut starts and stops recording and Notes receives \"shortcut test\". After the in-app Stop, Transcribe Voice shows \"Transcribe\" and the Action Button hint reads \"Start dictation\" within a few seconds; no second recording starts."
        final_gate: false
      - id: "iphone-clipboard-raw-immediate"
        issue: 934
        title: "Copy & Polish: immediate and delayed paste both give raw text"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "Destination = Copy & Polish with a working OpenRouter key"
        steps:
          - "Press and hold the Action Button to start, say \"raw clipboard one, um, test\", press and hold again to stop."
          - "Within 2 seconds, switch to Notes and paste."
          - "Open Just Speak, then return to Notes."
          - "Wait 20 seconds and paste again."
          - "Open History and open the newest item."
        expected: "Both pastes contain the raw words (fillers included); never \"Polishing… please wait\" or any placeholder. The History item shows the polished version."
        final_gate: true
      - id: "iphone-clipboard-intervening-copy"
        issue: 934
        title: "A copy made while polishing is not overwritten"
        minutes: 3
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "Destination = Copy & Polish with a working OpenRouter key"
        steps:
          - "Press and hold the Action Button to start, say \"raw clipboard two\", press and hold to stop."
          - "Immediately in Notes, type MARKER2, select it and tap Copy."
          - "Wait 20 seconds, then paste."
          - "Open History."
        expected: "Paste gives MARKER2. History shows the polished \"raw clipboard two\"."
        final_gate: true
      - id: "iphone-clipboard-locked-stop"
        issue: 934
        title: "Stop while locked, then unlock and paste the raw transcript"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "Destination = Copy & Polish with a working OpenRouter key"
        steps:
          - "Press and hold the Action Button to start, say \"locked stop three\", then press the side button to lock."
          - "While locked, stop with the Action Button (or the Live Activity Stop on the Lock Screen)."
          - "Wait 20 seconds, unlock, open Notes and paste."
          - "Open History."
        expected: "Paste gives the raw \"locked stop three\" and History has one item with polished text. No placeholder. Note your iOS version and whether stopping needed an unlock."
        final_gate: true
      - id: "iphone-cold-launch-hardware-recording"
        issue: 1117
        title: "Cold launch Action Button recording with delayed polish"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "Destination = Copy & Polish with a working OpenRouter key"
        steps:
          - "Force-quit Just Speak in the App Switcher."
          - "From the Home Screen, press and hold the Action Button to start, say \"cold launch check\", press and hold again to stop."
          - "Paste into Notes within 5 seconds, then wait 20 seconds."
          - "Check the Lock Screen and Dynamic Island, then open History."
        expected: "Recording starts from cold (note any unlock or open-app prompt). Paste gives the raw text. History has exactly one \"cold launch check\" item with polished text. No Live Activity remains or reappears after stop."
        final_gate: true
      - id: "iphone-interruption-stop"
        issue: 1117
        title: "Siri interruption keeps the recording's text and recovers"
        minutes: 3
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        steps:
          - "Tap the mic in the app and say \"before interruption\"."
          - "Hold the side button to invoke Siri, then dismiss Siri."
          - "If still recording, say \"after interruption\" and tap Stop; otherwise read the message shown."
          - "Open History, then make and stop a new short recording."
        expected: "The recording either continues or stops with a clear message. History has one item containing \"before interruption\" (no duplicate). The app never shows Recording while no words arrive, and the new recording works."
        final_gate: true
      - id: "iphone-focus-history-only"
        issue: 1014
        title: "Focus filter forces History Only and shows it"
        minutes: 5
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "A Focus you can toggle (Do Not Disturb works)"
        steps:
          - "In iOS Settings › Focus › Do Not Disturb › Add Filter, choose Just Speak to It Alpha › Capture Overrides, set Destination to History Only, tap Add."
          - "Turn Do Not Disturb on in Control Center, then in Notes copy the word MARKER4."
          - "Press and hold the Action Button to start, open the app and read the line under the status."
          - "Say \"focus history only\", stop with the Action Button, then paste in Notes."
          - "In the app open Settings › Focus Capture Overrides."
        expected: "While recording the app shows \"Save to History Only · Focus\". Paste gives MARKER4 (no clipboard write). History has \"focus history only\" with no polish. Settings shows \"Last received: Save to History Only\"."
        final_gate: true
      - id: "iphone-focus-change-mid-recording"
        issue: 1014
        title: "Turning Focus off mid-recording doesn't redirect that run"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        steps:
          - "With Do Not Disturb still on, copy MARKER5 in Notes."
          - "Press and hold the Action Button to start and say \"focus switch one\"."
          - "Turn Do Not Disturb off in Control Center, stop with the Action Button, then paste in Notes."
          - "Record \"focus switch two\" with the Action Button, stop, and paste."
          - "Clean up: delete the filter in iOS Settings › Focus › Do Not Disturb, then tap Reset Stored Override in the app."
        expected: "First paste gives MARKER5 and History has \"focus switch one\" (the active run kept History Only). Second paste gives \"focus switch two\" (normal Copy & Polish once Focus is off)."
        final_gate: true
      - id: "iphone-bt-apple-live"
        issue: 935
        title: "Apple on-device capture: AirPods connect mid-recording"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "AirPods (or another Bluetooth headset) paired, in their case"
        steps:
          - "Set Settings › Transcription › Where transcription runs = Local (Apple SpeechTranscriber)."
          - "Tap the mic, say \"alpha one two three\" and keep talking."
          - "Take the AirPods out and put them in; once connected, say \"bravo four five six\"."
          - "If still recording, tap Stop. Read any message, then open History."
          - "Make and stop a new short recording."
        expected: "Either recording carried on (both phrases in History) or it stopped with \"The microphone changed and recording stopped.\" and History still has \"alpha one two three\". The app never shows Recording while no words appear. The new recording works. Note which outcome."
        final_gate: true
      - id: "iphone-hands-free-onset"
        issue: 614
        title: "Hands-free: speech starts capture fast, silence ends it"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "iOS 26 or later"
        steps:
          - "In Settings › Behavior turn on Hands-Free Dictation (Local Apple SpeechTranscriber still selected)."
          - "Tap the mic button (Arm hands-free dictation) and wait for the indicator to read Armed."
          - "Say \"Go, quick start check\", then stay silent."
          - "Watch the indicator until it finishes by itself, then open History."
        expected: "Indicator goes Armed → Recording as you start speaking (well under half a second), then Finalising → Armed after you go quiet, without tapping Stop. History has one item starting with \"Go\" (first word not clipped)."
        final_gate: false
      - id: "iphone-hands-free-silence"
        issue: 614
        title: "Hands-free: nothing is captured while silent"
        minutes: 3
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "iOS 26 or later"
        steps:
          - "Arm hands-free and leave the iPhone in a quiet room for 60 seconds without speaking."
          - "Watch the indicator during that minute."
          - "Tap the mic button to disarm and open History."
        expected: "The indicator stays Armed for the whole minute and never shows Recording. No new History item is created."
        final_gate: false
      - id: "iphone-bt-hands-free"
