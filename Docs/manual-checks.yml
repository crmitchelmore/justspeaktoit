      - id: "iphone-clipboard-local-only-mac"
        issue: 994
        title: "Default: transcript does not reach the Mac clipboard"
        minutes: 3
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "Mac on the same Apple ID, Handoff on, unlocked and nearby"
        steps:
          - "On the Mac copy the word MACMARK."
          - "On the iPhone (Allow Universal Clipboard off), record \"local only check\" with the Action Button and stop."
          - "Within 30 seconds press Cmd+V in a Mac text editor."
          - "Paste on the iPhone in Notes."
        expected: "The Mac pastes MACMARK (the transcript did not cross). The iPhone pastes \"local only check\"."
        final_gate: true
      - id: "iphone-clipboard-universal-optin-mac"
        issue: 994
        title: "Universal Clipboard opt-in reaches the Mac; iPhone copy expires"
        minutes: 4
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later (alpha-build-45, main 9146079e, 3 Nov 2026)"
        prerequisites:
          - "Mac on the same Apple ID, Handoff on, unlocked and nearby"
        steps:
          - "On the iPhone turn on Allow Universal Clipboard (expiry still 1 minute) and read the summary text."
          - "Record \"universal check\" with the Action Button and stop."
          - "Within 30 seconds paste on the Mac."
          - "Wait 2 minutes, then paste on the iPhone and on the Mac."
          - "Turn Allow Universal Clipboard off and set Transcript expiry back to 5 minutes."
        expected: "The summary says Universal Clipboard is on and expiry on another device is not guaranteed. The Mac pastes \"universal check\". After 2 minutes the iPhone pastes nothing; note whether the Mac still pastes it (allowed)."
        final_gate: true
  - id: "watch"
    device: "Watch"
    title: "Apple Watch + iPhone session"
    setup:
      - "Hardware: Double Tap-capable Apple Watch (Series 9 or later, or Ultra 2) on watchOS 11+, paired with an iPhone on iOS 18+. Both unlocked, above 50% battery, Bluetooth and Wi-Fi on."
      - "Part 1 (#963) uses the current iOS TestFlight app (Just Speak to It Alpha 3.2.0, build 1000.0.45 or later). No watch app is needed. Do Part 1 before installing anything from Xcode."
      - "iPhone: Settings > Just Speak to It Alpha > Live Activities on. iPhone Watch app > Smart Stack > Live Activities on. Watch: Settings > Gestures > Double Tap on."
      - "iPhone: open Control Center, tap +, Add a Control, search \"Just Speak\" and add \"Transcribe Voice\" (it shows as \"Transcribe\"). Make sure a transcription model with a working key is selected in the app."
      - "Part 2 (#657, #659) needs the feature-flagged watch app, which is not in TestFlight. Only run it if the watch provisioning decision is \"Dev build now\". One-time, in developer.apple.com > Identifiers: register com.justspeaktoit.ios.watchkitapp and com.justspeaktoit.ios.watchkitapp.complication, register App Group group.com.justspeaktoit.watch, and enable App Groups with that group on both ids (Docs/watch-provisioning.md steps 1 to 3, about 10 minutes)."
      - "Watch: Settings > Privacy & Security > Developer Mode on (restart when asked). iPhone Watch app > General > Automatic App Install on."
      - "Mac, on current main: run TUIST_WATCH_APP=1 tuist generate, open \"Just Speak to It.xcworkspace\", pick the SpeakiOS scheme and your iPhone, then Run with automatic signing. If the watch app is not on the Watch after 3 minutes, run the JustSpeakWatchApp scheme with the Watch as the destination."
      - "The Xcode build installs the Stable app \"Just Speak to It\", next to the Alpha app. Open it on the iPhone, allow the microphone and choose a transcription model with a working key. On the Watch, open Just Speak to It, tap Record, allow the microphone, then tap again to stop."
      - "For the issue comments, write down the Watch model, watchOS version, iPhone build and the main SHA (git rev-parse --short HEAD)."
    items:
      - id: "watch-liveactivity-tap-stop"
        issue: 963
        title: "Tap Stop on the Smart Stack Live Activity stops a locked iPhone"
        minutes: 5
        build: "Current iOS TestFlight build (Just Speak to It Alpha 3.2.0, build 1000.0.45 or later); no watch app"
        prerequisites:
          - "Live Activities on for the app and in the Watch app's Smart Stack settings"
          - "\"Transcribe\" control added to iPhone Control Center"
        steps:
          - "On the iPhone, open Control Center and tap \"Transcribe\". Wait until the Lock Screen card shows Recording, then lock the iPhone and put it face down."
          - "Raise the Watch and turn the Digital Crown up to open the Smart Stack. Find the small Just Speak to It card showing \"Recording\" with a red \"Stop\" button."
          - "Say \"watch tap test one\", then tap \"Stop\" on the Watch card."
          - "Unlock the iPhone and open History in Just Speak to It Alpha."
        expected: "The Watch card leaves Recording within a few seconds (Finishing… or Processing…, then a completion message) and never shows Stop again. The iPhone's orange microphone indicator is gone. History has one new entry containing \"watch tap test one\", and the text also reached your configured destination (for example the clipboard)."
        final_gate: true
      - id: "watch-liveactivity-double-tap-stop"
        issue: 963
        title: "Double Tap stops a locked iPhone recording from the Smart Stack"
        minutes: 4
        build: "Current iOS TestFlight build (Just Speak to It Alpha 3.2.0, build 1000.0.45 or later); no watch app"
        prerequisites:
          - "Watch: Settings > Gestures > Double Tap on"
        steps:
          - "On the iPhone, tap \"Transcribe\" in Control Center, wait for Recording, then lock the iPhone."
          - "Raise the Watch, open the Smart Stack and stop on the small card showing \"Recording\" and \"Stop\"."
          - "Say \"watch double tap two\", then Double Tap (pinch index finger and thumb twice) without touching the screen."
          - "Unlock the iPhone and open History."
        expected: "The \"Stop\" button highlights, the card leaves Recording within a few seconds, the iPhone microphone indicator disappears, and History has exactly one new entry containing \"watch double tap two\"."
        final_gate: true
      - id: "watch-liveactivity-idle-no-start"
        issue: 963
        title: "Finished card cannot start recording; Lock Screen Stop still works"
        minutes: 5
        build: "Current iOS TestFlight build (Just Speak to It Alpha 3.2.0, build 1000.0.45 or later); no watch app"
        prerequisites:
          - "Run straight after the Double Tap check, while the finished card is still in the Smart Stack"
        steps:
          - "On the Watch Smart Stack, look at the finished Just Speak to It card and Double Tap twice, a few seconds apart."
          - "Tap the card body once, then return to the watch face."
          - "On the iPhone, check that no new recording started, then start one with \"Transcribe\" in Control Center and lock the phone."
          - "Wake the iPhone (do not unlock), say \"lock screen three\" and tap \"Stop\" on the full-size Lock Screen Live Activity."
        expected: "The finished Watch card has no Stop button and Double Tap does nothing: no recording starts and the iPhone shows no microphone indicator. The full-size iPhone Lock Screen card looks as before (timer and Stop button) and its Stop ends the recording; History has one entry containing \"lock screen three\"."
        final_gate: true
      - id: "watch-complication-start-stop"
        issue: 657
        title: "Complication and Smart Stack widget start, stop and show state"
        minutes: 8
        build: "Xcode dev build from current main with TUIST_WATCH_APP=1 (Stable app on iPhone and Watch)"
        prerequisites:
          - "Watch provisioning done and both apps installed (see session setup)"
          - "Watch microphone already allowed for Just Speak to It"
        steps:
          - "Touch and hold the watch face, tap Edit, swipe to Complications. Put \"Record\" (under Just Speak to It) in one circular slot and one corner slot, then press the Digital Crown."
          - "Open the Smart Stack, touch and hold, tap +, add the \"Just Speak to It\" widget, then tap Done."
          - "Force-quit the watch app: press the side button, swipe left on Just Speak to It, tap X. Return to the face."
          - "Tap the circular complication, say \"complication test four\" for about 5 seconds, then tap it again."
          - "Open the Smart Stack and watch the Just Speak to It widget, then check iPhone History."
        expected: "The first tap starts recording without opening the watch app's screen; the system microphone indicator shows and the glyph changes from mic to stop. The corner complication's curved label shows the short state. After the second tap the widget shows \"Sending to iPhone…\" then \"In history\" (glyph: arrow, then check). The widget sits near the top of the Smart Stack while sending. iPhone History has exactly one new entry containing \"complication test four\"."
        final_gate: true
      - id: "watch-complication-rapid-taps"
        issue: 657
        title: "Rapid complication taps create exactly one capture"
        minutes: 4
        build: "Xcode dev build from current main with TUIST_WATCH_APP=1 (Stable app on iPhone and Watch)"
        prerequisites:
          - "Complication on the face from the previous check"
        steps:
          - "Triple-tap the circular complication quickly. Wait 3 seconds and note whether it shows recording (stop glyph) or idle (mic glyph)."
          - "If recording, say \"rapid five\" and tap once to stop. If idle, tap once, say \"rapid five\" and tap again to stop."
          - "Open the watch app, tap Record, then tap the complication from the face to stop; say \"rapid six\" in between."
          - "Wait for both captures to show \"In history\", then open iPhone History."
        expected: "The complication never gets stuck or out of sync with the app. iPhone History has exactly one entry with \"rapid five\" and exactly one with \"rapid six\": no duplicates and no empty entries."
        final_gate: true
      - id: "watch-complication-phone-offline"
        issue: 657
        title: "Complication capture waits while the iPhone is offline, then delivers"
        minutes: 5
        build: "Xcode dev build from current main with TUIST_WATCH_APP=1 (Stable app on iPhone and Watch)"
        prerequisites:
          - "Complication on the face"
        steps:
          - "On the iPhone, turn on Airplane Mode and make sure Bluetooth and Wi-Fi are off."
          - "On the Watch, tap the complication, say \"offline seven\", tap again to stop."
          - "Wait 1 minute and check the complication and the Smart Stack widget."
          - "Turn Airplane Mode off on the iPhone (Bluetooth and Wi-Fi back on), wait up to 2 minutes, then open iPhone History."
        expected: "While offline the widget stays on \"Sending to iPhone…\" (arrow glyph) and never shows Failed or Recording. After reconnecting it changes to \"In history\", and iPhone History has exactly one entry containing \"offline seven\"."
