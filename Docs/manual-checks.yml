  - id: "watch"
    device: "Watch"
    title: "Apple Watch + iPhone"
    setup:
      - "Double Tap-capable Watch (Series 9+, Ultra 2) on watchOS 11+, paired with the iPhone; Watch Settings \u203a Gestures \u203a Double Tap on."
      - "iPhone Watch app \u203a Smart Stack \u203a Live Activities on; Transcribe Voice in iPhone Control Center."
      - "Optional watch-app checks only (decided: dev build now): the watch ids and App Groups are registered for development signing, and an Alpha dev build with the watch app was installed on the iPhone on 12 Nov 2026 (Stable untouched). If Just Speak to It Alpha is not on the Watch, install it from the iPhone Watch app \u203a Available Apps. To rebuild, see Docs/watch-provisioning.md \u203a Development build."
    items:
      - id: "watch-smart-stack-stop"
        issues:
          - 963
        title: "Smart Stack card: tap and Double Tap stop a locked iPhone"
        minutes: 7
        core: true
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later; no watch app needed"
        steps:
          - "On the iPhone tap Transcribe Voice in Control Center, wait for Recording, then lock the iPhone."
          - "Raise the Watch, open the Smart Stack, say \"watch tap\" and tap Stop on the small Just Speak to It card."
          - "Start again the same way, say \"watch double tap\" and Double Tap (pinch twice) without touching the screen."
          - "On the finished card, Double Tap again."
          - "Start once more, wake the iPhone without unlocking and tap Stop on the full-size Lock Screen card."
          - "Unlock and open History."
        expected: "Both Watch stops end recording within a few seconds (iPhone mic indicator gone). The finished card has no Stop and Double Tap starts nothing. The Lock Screen card looks as before and its Stop works. History has exactly three new items."
        final_gate: true
      - id: "watch-app-e2e"
        issues:
          - 657
          - 659
        title: "Watch app: complication start, 60 s wrist-down, delivered to iPhone"
        minutes: 8
        core: false
        build: "Just Speak to It Alpha dev build with the watch app (see Watch setup)"
        prerequisites:
          - "Just Speak to It Alpha installed on the Watch (see Watch setup)"
        steps:
          - "Add the Just Speak to It \"Record\" complication to a watch face; note the Watch battery %."
          - "Tap the complication, say \"marker alpha\" and lower your wrist so the screen sleeps."
          - "Say \"marker bravo\" at about 30 s and \"marker charlie\" at about 60 s."
          - "Raise the wrist and tap the complication to stop."
          - "Watch the complication until it shows In history, then open iPhone History and note the battery % again."
        expected: "Recording starts without opening the app screen and the timer reads about 1:05 when you raise the wrist. The complication goes Sending \u2192 In history. iPhone History has one entry with alpha, bravo and charlie. Add both battery readings to a Fail note or the issue."
        final_gate: true
      - id: "watch-app-offline"
        issues:
          - 657
          - 659
        title: "Watch app: offline and force-quit captures still deliver once"
        minutes: 7
        core: false
        build: "Just Speak to It Alpha dev build with the watch app (see Watch setup)"
        prerequisites:
          - "Just Speak to It Alpha installed on the Watch (see Watch setup)"
        steps:
          - "Turn on iPhone Airplane Mode (Bluetooth and Wi-Fi off)."
          - "Tap the complication, say \"offline seven\", tap to stop."
          - "Tap the complication, say \"force quit eight\" for 5 s, then force-quit the watch app (side button, swipe, X)."
          - "Reopen the watch app, then turn Airplane Mode off and wait 2 minutes."
          - "Open iPhone History."
        expected: "While offline the captures wait (never Failed or stuck Recording). After reconnecting both show In history, and iPhone History has exactly one entry each for \"offline seven\" and \"force quit eight\"."
        final_gate: true
      - id: "watch-marketing-footage"
        issues:
          - 1368
        title: "Website footage: stop a locked iPhone from the Watch Smart Stack"
        minutes: 6
        core: false
        build: "TestFlight Just Speak to It Alpha 3.2.0 (1000.0.45) or later; no watch app needed"
        prerequisites:
          - "Do Not Disturb on both devices; a second phone or camera to film the Watch and iPhone together; fictional words only."
        steps:
          - "Start filming the Watch and the iPhone together."
          - "On the iPhone tap Transcribe Voice in Control Center, say \"Book the team lunch for Thursday\" and lock the iPhone."
          - "Raise the Watch, open the Smart Stack and tap Stop on the Just Speak to It card."
          - "Unlock the iPhone and open History so the new item is visible, then stop filming."
          - "Attach the video to #1368 (or share it with the agent)."
        expected: "A clip under 30 seconds showing the Watch stop ending the iPhone recording and the new item in History, with no notifications or personal data visible."
        final_gate: false
      - id: "watch-voiceover-pass"
        issues:
          - 1399
        title: "Watch: VoiceOver reads the record button and captures"
        minutes: 3
        core: false
        build: "TestFlight Just Speak to It, the first Alpha build that includes the fix for #1399, with the watch app installed"
        steps:
          - "Turn on VoiceOver on the Watch."
          - "Open Just Speak to It, double-tap Start recording, say a fictional sentence, then double-tap Stop recording."
          - "Swipe to the new capture row."
        expected: "The button reads Start recording, then Stop recording, and the row reads its time, length and status as one item."
        final_gate: true
  - id: "android"
    device: "Android"
    title: "Android"
    setup:
      - "A Pixel on Android 13 or later and, for the OEM check, a non-Google phone, each with the Alpha APK installed."
      - "An OpenAI and a Groq key saved in Settings for the Cloud checks, and an OpenRouter key for cleanup. Use made-up sentences only."
    items:
      - id: "android-on-device-offline"
        issues:
          - 1328
        title: "On-device dictation works offline, and a missing model can be downloaded"
        minutes: 8
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the language and corrections change"
        steps:
          - "On the Pixel, choose On-device and dictate a sentence; repeat in flight mode."
          - "Settings: choose a Dictation language whose on-device model is not installed, tap Download language and wait for it to install, then dictate."
          - "Repeat the first step on the non-Google phone; if it has no recognition service, or it is disabled, note what the app says."
          - "In flight mode, try Speech service and Cloud modes."
        expected: "Each session returns the spoken words, offline included. After the download, Start becomes available and dictation works. A phone without a recogniser shows the reason and no Start. Offline Speech service and Cloud either return a genuine transcript or fail visibly; never a false success."
        final_gate: true
      - id: "android-permission-interruptions"
        issues:
          - 1328
        title: "Microphone permission and interruptions fail honestly"
        minutes: 8
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the language and corrections change"
        steps:
          - "Clear the app's permissions. Start dictation and deny the microphone, then deny it permanently, then recover through the Settings link."
          - "During a dictation, receive a call; during another, connect and then disconnect a Bluetooth headset."
          - "During a Cloud dictation, say a first phrase, leave the app, say a second, different phrase, then come back and stop."
        expected: "Denial shows a rationale, then a Settings link, and dictation works once granted. A call or route change ends the session with a clear reason or carries on with correct text; leaving the app does not stop dictation: it carries on with the recording notification showing, and stopping after you come back keeps both phrases."
        final_gate: true
      - id: "android-silence-auto-stop"
        issues:
          - 1632
        title: "Cloud recordings stop after the set silence"
        minutes: 4
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the #1632 silence auto-stop change"
        steps:
          - "Settings: turn on Stop recording after silence, set Silence duration to 2 seconds and leave the threshold at 0.05."
          - "Choose Cloud mode, start dictating, say a sentence and then stay quiet."
          - "Start again and say nothing at all; then start once more, pause for 1 second mid-sentence and carry on."
          - "Set the duration to 5 seconds and repeat the first dictation; then turn the setting off and stay quiet for 10 seconds."
        expected: "With the setting on, the recording stops about the set time after you go quiet and the sentence is transcribed. Saying nothing stops after the set time with no invented text. A pause shorter than the duration does not stop it. With the setting off, the recording keeps going until you stop it."
        final_gate: false
      - id: "android-foreground-long-dictation"
        issues:
          - 1592
        title: "Long dictation keeps going in the background, and Stop works from the notification"
        minutes: 15
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the foreground dictation change"
        steps:
          - "On Android 13 or later, start the first dictation after installing and allow notifications when asked."
          - "Choose Cloud and dictate for about five minutes: after a minute open another app, then turn the screen off for a minute, then come back and keep talking."
          - "Check the notification while recording, then tap Stop in the notification."
          - "Repeat in Speech service mode with another app in front for 30 seconds, and note whether words spoken there arrive."
          - "Start a Cloud dictation, talk for 20 seconds, then swipe the app away from Recents. Open the app again and go to History."
        expected: "A silent \"Just Speak to It is dictating\" notification with Stop shows for the whole session. Cloud returns every word, including those spoken with another app in front and with the screen off. Stop in the notification finishes the session like the Stop button and the notification goes once the transcript is in. Speech service either keeps listening in the background or ends with a clear reason and keeps its unfinished words. After swiping the app away, History has a failed entry saying the recording ended before it could be transcribed, whose Transcribe returns the 20 seconds of speech."
        final_gate: true
      - id: "android-interruptions-focus-route"
        issues:
          - 1592
        title: "Calls, other apps' audio and headset changes never lose a recording"
        minutes: 12
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the foreground dictation change"
        steps:
          - "During a Cloud dictation, receive a phone call (answer it or let it ring), then go to History."
          - "During a Cloud dictation, start a voice note or the Google Assistant for a few seconds, then return."
          - "During a Cloud dictation, start music or a video in another app."
          - "During a Cloud dictation, connect a Bluetooth headset; during another, unplug or disconnect a headset that was connected before you started."
          - "Repeat the call and headset steps in Speech service mode after saying a few words."
        expected: "A call ends the session with \"Dictation stopped for a call\"; a headset change ends it saying a headset or Bluetooth microphone was connected or disconnected. Each keeps everything said before: Cloud saves the recording with the failed History entry and Transcribe returns its words; Speech service keeps the unfinished words. A short assistant or voice note pauses the Cloud recording (the screen and notification say Paused) and it resumes by itself afterwards. Music taking over for good stops the session with a clear reason and keeps the audio."
        final_gate: true
      - id: "android-cloud-keys-cleanup"
        issues:
          - 1328
        title: "Cloud transcription, a rejected key and cleanup with real keys"
        minutes: 6
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the language and corrections change"
        steps:
          - "Choose Cloud with GPT Transcribe and dictate; repeat with Whisper Large v3 Turbo."
          - "Save an invalid OpenAI key and dictate in Cloud."
          - "Restore the key, turn on cleanup with an OpenRouter model and dictate."
        expected: "Both models return the words. The invalid key fails with \"rejected the API key\". Cleanup returns tidied text and Show original restores the raw transcript."
        final_gate: true
      - id: "android-entry-surfaces"
        issues:
          - 1328
        title: "Tile, shortcut, shared audio and the dictation keyboard"
        minutes: 10
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the language and corrections change"
        steps:
          - "Start dictation from the Quick Settings tile and from the launcher shortcut, on a locked and an unlocked phone."
          - "Share a WhatsApp voice note (OGG/Opus) and an M4A recording into the app and confirm the upload."
          - "Enable the Just Speak to It keyboard and dictate into a messaging app and a browser field; switch keyboards mid-dictation."
          - "Open a password field and check the keyboard's microphone; then deny the microphone permission and try the keyboard."
        expected: "The tile and shortcut open the app and start dictating (after unlocking when locked). Both shared files are transcribed into History. The keyboard inserts the final text, is disabled in the password field, and explains a denied permission. Switching keyboards stops dictation without inserting stray text."
        final_gate: true
      - id: "android-raw-configuration-editor"
        issues:
          - 1608
        title: "Android raw configuration editor validates, applies all or none, imports and exports"
        minutes: 5
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the #1608 raw configuration editor"
        steps:
          - "Open Settings \u203a Edit raw configuration and tap Show current. Check no API key value appears; \"apiKeys\" lists only true or false."
          - "Change \"history_retention\" to \"Year\" and tap Validate, then Apply: an error names settings.history_retention and nothing is saved."
          - "Set it to \"Week\" and \"cleanup_enabled\" to true, tap Apply: Settings shows History kept for 7 days and Clean up transcripts on at once."
          - "Tap Export and save the file, tap Reset to defaults and confirm, then Import the saved file and Apply: your values come back."
          - "Start dictating and tap Apply: it says to stop dictating first and changes nothing."
          - "With TalkBack on, tap Validate on an invalid document: TalkBack reads the result and the first error."
          - "Search Settings for \"raw\" or \"json\": Edit raw configuration is a result and scrolls to the editor."
        expected: "Errors name each bad key and nothing changes until every value is valid; applied values show on their settings at once; export, reset and import round-trip; Apply is refused while dictating; results are announced to TalkBack."
        final_gate: false
      - id: "android-language-corrections-read-aloud"
        issues:
          - 1328
        title: "Dictation language, personal corrections and Read aloud"
        minutes: 6
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the language and corrections change"
        steps:
          - "Settings: set Dictation language to French and dictate a French sentence in On-device, Speech service and the keyboard; then set it back to Automatic."
          - "Settings: add a personal correction, write as \"Kubernetes\", heard as \"cooper netties\"."
          - "Say \"I deploy to cooper netties\" in On-device mode and in Cloud with GPT Transcribe."
          - "Tap Read aloud on the finished transcript, then Stop reading."
        expected: "French is recognised in each mode and Automatic follows the phone language again. Both transcripts read \"I deploy to Kubernetes\". Read aloud speaks the transcript and Stop reading silences it."
        final_gate: true
      - id: "android-profiles-cleanup-prompt"
        issues:
          - 1591
        title: "Dictation profiles and the custom cleanup prompt"
        minutes: 8
        core: true
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes dictation profiles"
        steps:
          - "With an OpenAI and an OpenRouter key saved and Clean up transcripts on, set Settings \u203a Cleanup prompt to \"Rewrite the transcript in capital letters.\" and dictate one sentence in Cloud mode."
          - "Tap Use the built-in prompt and dictate again."
          - "Settings \u203a Dictation profiles: add a profile named Spanish with Cloud model Whisper Large v3 Turbo (Groq key saved), Language Spanish (Spain) and Cleanup prompt \"End every sentence with an exclamation mark.\""
          - "On the dictation screen choose Profile: Spanish, check the privacy line names Groq, and dictate a Spanish sentence in Cloud mode; then switch to On-device and dictate again."
          - "Open the keyboard in a messaging app, tap the Profile key until it shows No profile and then Spanish, and dictate a Spanish sentence; repeat with TalkBack on."
          - "Delete the Spanish profile in Settings."
        expected: "The first transcript is in capitals and the second is normal cleanup. With the profile, Cloud uses Groq, recognises Spanish and ends sentences with exclamation marks, and On-device stays on the phone in Spanish. The keyboard key cycles profiles, TalkBack announces the profile name, and the key is disabled while listening. Deleting the profile hides the chooser and restores your own settings."
        final_gate: true
      - id: "android-report-issue"
        issues:
          - 1633
        title: "Report an issue with privacy-safe diagnostics"
        minutes: 4
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes Report an issue"
        steps:
          - "Turn on airplane mode, dictate one made-up sentence in Cloud mode so it fails, then open History and tap Report on that entry."
          - "Read the draft: check it names the model, mode and failure but not your sentence, then turn off Include diagnostics and read it again."
          - "Tap Copy draft and paste it into a note; then turn airplane mode off and tap Open in GitHub, and close the browser without submitting."
          - "Settings \u203a Report an issue: open the draft and repeat Copy draft with TalkBack on."
        expected: "The draft never contains the transcript, audio or keys. Turning off diagnostics leaves only the description and a userRemoved state. Copy puts the title and body on the clipboard, Open shows a prefilled GitHub draft labelled bug without submitting, and TalkBack announces the switch state and each status message."
        final_gate: true
      - id: "android-battery-latency"
        issues:
          - 1328
        title: "Battery and latency over a five-minute dictation series"
        minutes: 10
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes the language and corrections change"
        steps:
          - "Note the battery percentage, then dictate for five minutes in short sessions in On-device mode."
          - "Note how long each final transcript takes to appear after Stop."
          - "Note the battery percentage again and any heat."
        expected: "Battery use and latency are comparable to the phone's own voice typing; note the numbers in the result."
        final_gate: true
      - id: "android-recording-sounds"
        issues:
          - 1638
        title: "Recording start and stop sounds"
        minutes: 4
        core: false
        build: "Just Speak to It for Android, the signed APK from an Alpha that includes recording sounds"
        steps:
          - "Settings › Recording sounds: check Play start and stop sounds is on, pick each profile and tap Play sample; drag Volume down and up."
          - "In Cloud mode, record a sentence and stop. Then record again and tap Cancel."
          - "In On-device mode, record a sentence and stop."
          - "Turn Play start and stop sounds off and record once more."
        expected: "Each profile sounds different and follows the volume. Start plays when recording begins and Stop when it ends; Cancel plays no stop sound. The Cloud transcript has no stray words from the start sound. With sounds off, nothing plays."
        final_gate: false
  - id: "decisions"
    device: "Decision"
    title: "Decisions"
    items:
      - id: "decision-non-apple-screen-readers"
        issues:
          - 1400
        title: "Where should Windows, Linux and Android screen-reader checks run?"
        minutes: 2
        core: false
        question: "CI now audits names, IDs and announcements on Windows, Linux and Android. How should a real Narrator, Orca or TalkBack pass happen?"
        context: "The /qa checklist only has Mac, iPhone and Watch sessions. Real screen-reader passes need a Windows PC, a Linux desktop and an Android phone."
        options:
          - id: "ci-and-reports"
            label: "Rely on the CI audits and fix reported problems"
            consequence: "No new owner sessions; spoken wording is checked only when a user reports a problem."
            recommended: true
          - id: "owner-devices"
            label: "Add Windows, Linux and Android sessions to /qa"
            consequence: "Adds device sessions and about 15 minutes per platform for each release that changes their UI."
          - id: "external-tester"
            label: "Ask an external tester who uses a screen reader"
            consequence: "Best evidence of real use, but needs a tester and a way to share builds."
