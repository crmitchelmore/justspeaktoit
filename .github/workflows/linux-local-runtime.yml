name: Linux on-device runtime

# Builds the pinned whisper.cpp runtime libraries (x86-64, every CPU variant,
# no Vulkan) once per pin change, in the same pinned Swift image the Linux app
# is tested in, and hands them to linux.yml as the `linux-local-runtime`
# artifact with the pinned JFK sample.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime:
    name: Build pinned whisper.cpp runtime (Linux x86-64 CPU)
    runs-on: ${{ fromJSON(((github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.JSTI_NATIVE_APPROVED_SHA == github.sha) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.JSTI_NATIVE_APPROVED_SHA == github.event.pull_request.head.sha)) && (vars.JSTI_LINUX_RUNNER_LABELS || '["self-hosted","Linux","X64","omarchy-local"]') || '["ubuntu-24.04"]') }}
    container:
      image: swift:6.2.3-noble@sha256:6dd90eb2359663a2cde8f03e9951f488b23134b3b8fce20e9dcb6cada75dd803
    timeout-minutes: 60
    steps:
      # Self-hosted Linux runs this root container against the runner's
      # persistent /__w bind mount; record its owner so it can be restored.
      - name: Record host work-tree owner
        if: runner.environment == 'self-hosted'
        run: stat -c '%u:%g' /__w > "$RUNNER_TEMP/jsti-host-owner"
      # Runs before checkout, so it cannot use scripts/ci/retry-network.sh. Ubuntu
      # mirrors have been unreachable for minutes at a time (run 42551184010).
      - name: Install the build tools
        run: |
          for delay in 10 30 60 0; do
            if apt-get -o Acquire::Retries=5 update -q &&
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y -q \
                cmake ninja-build g++ git python3; then
              exit 0
            fi
            [ "$delay" -eq 0 ] && exit 1
            echo "::warning::apt failed; retrying in ${delay}s"
            sleep "$delay"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the runtime pins
        run: |
          python3 -B -m unittest discover -s scripts/linux-local-runtime -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/windows-local-runtime -p 'test_*.py'

      # The libraries depend only on these inputs (the Linux builder reuses the
      # Windows builder's checkout helpers and pin); a change rebuilds them.
      - name: Restore a runtime built from the same pins
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local-runtime-output
          key: whisper-runtime-linux-x86_64-${{ hashFiles('scripts/linux-local-runtime/dependencies.json', 'scripts/linux-local-runtime/build-whisper-runtime.py', 'scripts/windows-local-runtime/dependencies.json', 'scripts/windows-local-runtime/build-whisper-runtime.py') }}

      - name: Build whisper.cpp from the pinned commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -B scripts/linux-local-runtime/build-whisper-runtime.py \
            --output local-runtime-output --work "$RUNNER_TEMP/whisper-runtime-work" --jobs 4

      - name: Show the runtime manifest
        run: cat local-runtime-output/runtime-manifest.json

      - name: Upload the runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-local-runtime
          path: local-runtime-output/
          if-no-files-found: error
          retention-days: 14

      # Return the persistent work tree to the runner user so later host jobs
      # (checkout, cache) can clean it; hosted runners are discarded instead.
      - name: Restore host work-tree ownership
        if: always() && runner.environment == 'self-hosted'
        run: |
          owner="$(cat "$RUNNER_TEMP/jsti-host-owner")"
          case "$owner" in [0-9]*:[0-9]*) ;; *) echo "::error::Unknown host owner"; exit 1 ;; esac
          chown -R "$owner" /__w
