name: Paid Access Worker secrets
# Copies the Sign in with Apple key (repository secrets APPLE_SIGNIN_KEY_ID and
# APPLE_SIGNIN_PRIVATE_KEY) into the chosen paid-access Worker environment with
# `wrangler secret bulk`. Values travel on stdin only and are never printed.
# Run it after creating the Worker and whenever the key is rotated. See
# Docs/paid-access.md (Mac sign-in).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Worker environment
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: paid-access-secrets-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/paid-access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Upload the Sign in with Apple key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLE_SIGNIN_KEY_ID: ${{ secrets.APPLE_SIGNIN_KEY_ID }}
          APPLE_SIGNIN_PRIVATE_KEY: ${{ secrets.APPLE_SIGNIN_PRIVATE_KEY }}
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_SIGNIN_KEY_ID" ] || [ -z "$APPLE_SIGNIN_PRIVATE_KEY" ]; then
            echo "::error::APPLE_SIGNIN_KEY_ID and APPLE_SIGNIN_PRIVATE_KEY must both be set"; exit 1
          fi
          case "$APPLE_SIGNIN_PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "::error::APPLE_SIGNIN_PRIVATE_KEY is not a PEM .p8 key"; exit 1 ;;
          esac
          node -e 'process.stdout.write(JSON.stringify({
            APPLE_SIGNIN_KEY_ID: process.env.APPLE_SIGNIN_KEY_ID,
            APPLE_SIGNIN_PRIVATE_KEY: process.env.APPLE_SIGNIN_PRIVATE_KEY,
          }))' | npx wrangler secret bulk --env "$TARGET" > /dev/null
          # shellcheck disable=SC2016 # the node script is single-quoted on purpose
          npx wrangler secret list --env "$TARGET" --format json | node -e '
            const names = JSON.parse(require("fs").readFileSync(0, "utf8")).map(s => s.name);
            for (const name of ["APPLE_SIGNIN_KEY_ID", "APPLE_SIGNIN_PRIVATE_KEY"]) {
              if (!names.includes(name)) { console.error(`::error::${name} missing after upload`); process.exit(1); }
            }
            console.log("Sign in with Apple key present in the Worker environment.");'
