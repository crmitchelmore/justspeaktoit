name: Set up Apple toolchain
description: Select Xcode when requested and optionally install Tuist without handling release identity or signing.

inputs:
  xcode-version:
    description: Xcode version to select; empty preserves the runner's selected Xcode.
    required: false
    default: ""
  install-tuist:
    description: Require preinstalled Tuist on native runners or Homebrew installation on hosted runners (true or false).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate toolchain options
      shell: bash
      env:
        INSTALL_TUIST: ${{ inputs.install-tuist }}
      run: |
        case "$INSTALL_TUIST" in
          true|false) ;;
          *) echo "::error::install-tuist must be true or false"; exit 1 ;;
        esac

    - name: Setup Xcode
      if: inputs.xcode-version != ''
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Install Tuist
      if: inputs.install-tuist == 'true'
      shell: bash
      # Hosted runners install the pinned, checksum-verified release through the
      # GitHub asset API: the release download URL behind `brew install tuist`
      # returned 504 on every request. The token is read-only and only reaches
      # api.github.com, to avoid the shared hosted-runner rate limit.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
          command -v tuist >/dev/null || { echo "::error::Preinstall Tuist on the reviewed native runner"; exit 1; }
          tuist version
        else
          scripts/install-tuist.sh >/dev/null
        fi
